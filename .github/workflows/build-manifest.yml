name: Build vibe-coding manifest

# (어느 경로든) 20XX/vibe-coding 폴더에 파일이 올라올 때마다 아래 두 파일을 자동으로 만듭니다.
#   · files.json — 갤러리 페이지가 읽는 작품 목록
#   · meta.json  — 파일별 마지막 업로드(커밋) 시각. admin 페이지의 '최근 업로드'가 읽음
# 위치: 저장소 루트의 .github/workflows/build-manifest.yml

on:
  push:
    branches: [main]
    paths:
      - "**/vibe-coding/**"
      - ".github/workflows/build-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # meta.json 에 파일별 커밋 시각을 넣으려면 전체 기록이 필요

      - name: Generate files.json
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess

          def html_files(d):
              if not os.path.isdir(d):
                  return []
              return sorted(f for f in os.listdir(d)
                            if f.lower().endswith((".html", ".htm")))

          # 예시 작품: examples/ 아래 폴더마다 열 파일을 고름
          # (index.html 이 있으면 그것, 없으면 이름순 첫 번째 .html)
          def example_entries(d):
              out = []
              if not os.path.isdir(d):
                  return out
              for name in sorted(os.listdir(d)):
                  sub = os.path.join(d, name)
                  if not os.path.isdir(sub):
                      continue
                  htmls = html_files(sub)
                  if not htmls:
                      continue
                  entry = "index.html" if "index.html" in htmls else htmls[0]
                  out.append({"dir": name, "entry": entry})
              return out

          # 파일별 마지막 커밋 시각 (최신 커밋부터 읽어 처음 나온 값을 사용)
          def commit_times(root):
              out = subprocess.run(
                  ["git", "-c", "core.quotepath=off", "log", "--format=@%cI", "--name-only", "--", root],
                  capture_output=True, text=True, encoding="utf-8").stdout
              times, cur = {}, None
              for line in out.splitlines():
                  if line.startswith("@"):
                      cur = line[1:]
                  elif line.strip() and cur and line not in times:
                      times[line] = cur
              return times

          for root in sorted(glob.glob("**/20??/vibe-coding", recursive=True)):
              schools = {}
              for d in sorted(glob.glob(os.path.join(root, "school-*/"))):
                  code = os.path.basename(d.rstrip("/"))
                  schools[code] = html_files(os.path.join(d, "student"))
              data = {
                  "examples": example_entries(os.path.join(root, "examples")),
                  "schools": schools,
              }
              with open(os.path.join(root, "files.json"), "w", encoding="utf-8") as fp:
                  json.dump(data, fp, ensure_ascii=False, indent=2)
                  fp.write("\n")

              # meta.json: root 기준 상대 경로 → 마지막 커밋 시각
              prefix = root.rstrip("/") + "/"
              files = {}
              for path, t in commit_times(root).items():
                  if path.startswith(prefix) and path.lower().endswith((".html", ".htm")):
                      files[path[len(prefix):]] = t
              with open(os.path.join(root, "meta.json"), "w", encoding="utf-8") as fp:
                  json.dump({"files": dict(sorted(files.items()))}, fp, ensure_ascii=False, indent=2)
                  fp.write("\n")
              print("generated", root)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -path ./.git -prune -o -type f \( -name files.json -o -name meta.json \) -path "*/20??/vibe-coding/*" -print0 | xargs -0 -r git add -A --
          if ! git diff --cached --quiet; then
            git commit -m "chore: update files.json, meta.json"
            git pull --rebase
            git push
          fi
