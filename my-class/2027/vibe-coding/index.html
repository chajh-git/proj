<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI를 활용한 나만의 프로그램 만들기</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0d0f14;
      --surface:   #151820;
      --card:      #1c2030;
      --border:    #252a3a;
      --accent:    #4f8ef7;
      --accent2:   #7c5cfc;
      --text:      #e8ecf5;
      --muted:     #6b7490;
      --gold:      #f5c842;
      --silver:    #b0bec5;
      --bronze:    #cd7c3a;
      --glow-gold: #f5c84255;
      --glow-sil:  #b0bec540;
      --glow-bro:  #cd7c3a40;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: .35;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 60px 24px 40px;
    }
    header::after {
      content: '';
      display: block;
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      margin: 20px auto 0;
      border-radius: 2px;
    }
    .title-main {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      letter-spacing: -.02em;
      background: linear-gradient(135deg, #fff 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.15;
    }
    .title-sub {
      margin-top: 10px;
      font-size: clamp(.9rem, 2vw, 1.1rem);
      color: var(--muted);
      letter-spacing: .06em;
      font-weight: 300;
    }
    .back-link {
      display: inline-block; margin-top: 14px;
      font-size: .8rem; color: var(--accent); text-decoration: none;
      border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px;
      transition: border-color .2s;
    }
    .back-link:hover { border-color: var(--accent); }

    main {
      position: relative;
      z-index: 5;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: .75rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 40px 0 16px;
      font-weight: 500;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── 메달 카드 ── */
    .medal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 8px;
    }
    .medal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 20px 18px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform .25s, box-shadow .25s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .medal-card:hover { transform: translateY(-4px); }
    .medal-card.gold   { border-color: var(--gold);   box-shadow: 0 0 28px var(--glow-gold); }
    .medal-card.silver { border-color: var(--silver);  box-shadow: 0 0 20px var(--glow-sil); }
    .medal-card.bronze { border-color: var(--bronze);  box-shadow: 0 0 20px var(--glow-bro); }
    .medal-card.gold::before   { content:''; position:absolute; inset:0; background: radial-gradient(circle at 80% 20%, #f5c84215 0%, transparent 60%); }
    .medal-card.silver::before { content:''; position:absolute; inset:0; background: radial-gradient(circle at 80% 20%, #b0bec510 0%, transparent 60%); }
    .medal-card.bronze::before { content:''; position:absolute; inset:0; background: radial-gradient(circle at 80% 20%, #cd7c3a12 0%, transparent 60%); }

    .medal-badge { font-size: 2rem; line-height: 1; margin-bottom: 10px; }
    .medal-rank {
      position: absolute; top: 18px; right: 18px;
      font-size: .7rem; letter-spacing: .1em; font-weight: 700;
      padding: 3px 10px; border-radius: 20px;
    }
    .gold   .medal-rank { background: #f5c84222; color: var(--gold); }
    .silver .medal-rank { background: #b0bec520; color: var(--silver); }
    .bronze .medal-rank { background: #cd7c3a20; color: var(--bronze); }

    .card-name  { font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
    .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 26px; line-height: 1.3; word-break: break-all; }
    .card-views {
      position: absolute; bottom: 16px; right: 18px;
      font-size: .78rem; color: var(--muted);
      display: flex; align-items: center; gap: 5px;
    }
    .card-views svg { opacity: .6; }

    /* ── 테이블 ── */
    .table-wrap {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);
    }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    thead tr { background: #ffffff06; border-bottom: 1px solid var(--border); }
    th {
      padding: 14px 16px; text-align: left;
      font-size: .72rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); font-weight: 600; white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #ffffff05; }
    td { padding: 13px 16px; vertical-align: middle; }
    td.rank-cell  { font-size: 1.1rem; text-align: center; width: 56px; }
    td.views-cell { color: var(--accent); font-weight: 600; white-space: nowrap; }
    td a { color: var(--text); text-decoration: none; font-weight: 500; transition: color .2s; }
    td a:hover { color: var(--accent); }
    .name-cell   { font-size: .85rem; color: var(--muted); }
    .school-cell { font-size: .8rem; color: var(--accent2); font-weight: 700; white-space: nowrap; }
    .id-cell     { font-size: .85rem; color: var(--accent2); font-weight: 700; white-space: nowrap; }

    /* ── 별점 ── */
    td.star-cell { white-space: nowrap; min-width: 140px; }
    .star-widget { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 5px; user-select: none; }
    .star-row { display: flex; gap: 3px; cursor: pointer; position: relative; }
    .star-row svg { width: 22px; height: 22px; flex-shrink: 0; pointer-events: none; transition: transform .1s; }
    .star-row:hover svg { transform: scale(1.12); }
    .star-avg { font-size: .74rem; color: var(--muted); letter-spacing: .02em; padding-left: 2px; }
    .star-avg span { color: var(--gold); font-weight: 700; }

    .rating-soon-banner {
      display: flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #1c2030, #252a3a);
      border: 1px solid var(--border); border-left: 3px solid var(--accent2);
      border-radius: 10px; padding: 14px 20px; margin: 20px 0 0;
      font-size: .85rem; color: var(--muted);
    }
    .rating-soon-banner .banner-icon { font-size: 1.3rem; }
    .rating-soon-banner strong { color: var(--text); font-weight: 600; }
    .rating-soon-banner .banner-date { color: var(--accent); font-weight: 700; margin-left: 4px; }

    /* ── 학반 선택 ── */
    .class-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
    .grade-label { font-size: .85rem; font-weight: 700; color: var(--muted); min-width: 110px; }
    .class-chip {
      font-family: inherit; font-size: .9rem; font-weight: 700;
      padding: 8px 20px; border-radius: 24px; cursor: pointer;
      background: var(--card); color: var(--muted);
      border: 1px solid var(--border); transition: all .2s;
    }
    .class-chip:hover { color: var(--text); border-color: var(--accent); }
    .class-chip.active {
      color: #fff; border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 16px #4f8ef744;
    }
    .empty-note { font-size: .82rem; color: var(--muted); opacity: .7; }
    .class-hint {
      text-align: center; padding: 28px 20px; font-size: .85rem; color: var(--muted);
      border: 1px dashed var(--border); border-radius: 14px; background: var(--card);
    }

    /* ── 예시 작품 ── */
    .example-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
    .example-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px;
      color: var(--text); text-decoration: none; font-size: .88rem; font-weight: 500;
      transition: all .2s; word-break: break-all;
    }
    .example-item:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
    .example-item .ex-icon { font-size: 1.1rem; flex-shrink: 0; }

    /* 로딩 / 에러 */
    .state-msg { text-align: center; padding: 60px 20px; color: var(--muted); font-size: .9rem; }
    .spinner {
      display: inline-block; width: 28px; height: 28px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 640px) { th, td { padding: 10px 10px; } }
  </style>
</head>
<body>

<header>
  <div class="title-main">AI를 활용한 나만의 프로그램 만들기</div>
  <div class="title-sub" id="title-sub"></div>
  <a class="back-link" id="back-link" style="display:none">← 전체 학교 보기</a>
</header>

<main>
  <div id="app">
    <div class="state-msg">
      <div class="spinner"></div><br>학생 작품을 불러오는 중…
    </div>
  </div>
</main>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════
   ★ 설정 (보통 여기만 수정하면 됩니다)
═══════════════════════════════════════════════════════ */

/* 별점 오픈 날짜 — 이 날짜 00:00 이후부터 별점 기능 활성화 ("YYYY-MM-DD") */
const RATING_OPEN_DATE = "2027-09-01";

/* 학교 코드(폴더명) → 화면에 표시할 이름. 목록에 없는 코드는 폴더명 그대로 표시 */
const SCHOOL_LABELS = {
  "school-a": "A학교",
  "school-b": "B학교",
  "school-c": "C학교",
};

const SUBJECT = "정보";

/* GitHub 저장소 정보 — 비워 두면 GitHub Pages 주소에서 자동 인식합니다.
   (예: https://계정.github.io/저장소/2027/vibe-coding/) */
const GITHUB_USER   = "";
const GITHUB_REPO   = "";
const GITHUB_BRANCH = "main";

/* 폴더 이름 규칙 */
const STUDENT_DIR  = "student";    // 학교 폴더 안의 학생 작품 폴더
const EXAMPLES_DIR = "examples";   // vibe-coding 폴더 안의 예시 폴더

/* Supabase (조회수 · 별점) */
const SUPABASE_URL  = "https://sdhpzypjqmowhrhxvvsj.supabase.co/rest/v1/";
const SUPABASE_KEY  = "sb_publishable_RRyqMtpm4qI0BZ9gdIjTvw_XOnJiaHc";
const TABLE         = "views";
const RATINGS_TABLE = "ratings";

/* ═══════════════════════════════════════════════════════
   위치 자동 인식
   - vibe-coding/index.html            → 통합 버전
   - vibe-coding/school-x/index.html   → 분리 버전 (같은 파일을 복사해 사용)
   - vibe-coding/?school=school-x      → 주소로 학교만 지정
═══════════════════════════════════════════════════════ */
const DIR_SEGS = location.pathname.split("/").filter(Boolean).map(decodeURIComponent);
if (DIR_SEGS.length && /\.html?$/i.test(DIR_SEGS[DIR_SEGS.length - 1])) DIR_SEGS.pop();

const IN_SCHOOL_DIR = /^school-/i.test(DIR_SEGS[DIR_SEGS.length - 1] || "");
const FIXED_SCHOOL  = IN_SCHOOL_DIR
  ? DIR_SEGS[DIR_SEGS.length - 1]
  : (new URLSearchParams(location.search).get("school") || null);

const ROOT_REL  = IN_SCHOOL_DIR ? "../" : "./";                 // vibe-coding 폴더까지의 상대 경로
const ROOT_SEGS = IN_SCHOOL_DIR ? DIR_SEGS.slice(0, -1) : DIR_SEGS;

/* GitHub 저장소 이름과 저장소 안에서의 경로 (예: "2027/vibe-coding") */
let GH_REPO = GITHUB_REPO;
const repoSegs = ROOT_SEGS.slice();
if (GH_REPO && repoSegs[0] === GH_REPO) {
  repoSegs.shift();
} else if (!GH_REPO && location.hostname.endsWith(".github.io")) {
  if (/^\d{4}$/.test(repoSegs[0] || "")) GH_REPO = location.hostname.split(".")[0] + ".github.io"; // 사용자 사이트
  else GH_REPO = repoSegs.shift() || "";                                                            // 프로젝트 사이트
}
const GH_USER   = GITHUB_USER || (location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "");
const REPO_PATH = repoSegs.join("/");
const YEAR      = (REPO_PATH.match(/(?:^|\/)(20\d{2})(?:\/|$)/) || [])[1] || new Date().getFullYear();

const RATING_ENABLED = Date.now() >= new Date(RATING_OPEN_DATE + "T00:00:00").getTime();

/* ═══════════════════════════════════════════════════════
   공통 유틸
═══════════════════════════════════════════════════════ */
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
const schoolLabel = code => SCHOOL_LABELS[code] || code;
const classLabel  = c => `${c[0]}-${c[1]}`;           // "21" → "2-1"
const cmp = (a, b) => String(a).localeCompare(String(b), "ko", { numeric: true });

/* ═══════════════════════════════════════════════════════
   파일 목록 불러오기
   ① files.json (GitHub Actions가 자동 생성)  ② GitHub API
   형식: { "examples": [...], "schools": { "school-a": [...], ... } }
═══════════════════════════════════════════════════════ */
const TREE_CACHE_KEY = "vc_tree_cache:" + REPO_PATH;
const TREE_CACHE_MS  = 3 * 60 * 1000;
let LOAD_INFO = { source: "" };

async function loadManifest() {
  try {
    const r = await fetch(ROOT_REL + "files.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return null;
    const j = await r.json();
    return (j && j.schools && typeof j.schools === "object" && Array.isArray(j.examples)) ? j : null;
  } catch { return null; }
}

async function ghList(path) {
  const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`;
  const res = await fetch(url, { headers: { "Accept": "application/vnd.github+json" } });
  if (res.status === 404) return [];
  if (!res.ok) throw new Error(`GitHub API 오류: ${res.status}`);
  return res.json();
}

async function fetchTreeFromGitHub() {
  if (!GH_USER || !GH_REPO) throw new Error("저장소 정보를 알 수 없습니다 (files.json 도 없음)");
  const base  = REPO_PATH ? REPO_PATH + "/" : "";
  const top   = await ghList(REPO_PATH);
  let codes   = top.filter(i => i.type === "dir" && /^school-/i.test(i.name)).map(i => i.name);
  if (FIXED_SCHOOL && !codes.includes(FIXED_SCHOOL)) codes.push(FIXED_SCHOOL);
  if (FIXED_SCHOOL) codes = [FIXED_SCHOOL];
  const names = items => items.filter(i => i.type === "file").map(i => i.name);
  const dirs  = items => items.filter(i => i.type === "dir").map(i => i.name);
  const [ex, ...lists] = await Promise.all([
    ghList(base + EXAMPLES_DIR),
    ...codes.map(c => ghList(`${base}${c}/${STUDENT_DIR}`)),
  ]);
  const schools = {};
  codes.forEach((c, i) => { schools[c] = names(lists[i]); });
  return { examples: dirs(ex), schools };   // 예시는 작품별 폴더 이름 목록
}

async function loadTree() {
  const m = await loadManifest();
  if (m) return { tree: m, source: "files.json (자동 생성 목록)" };

  try {
    const c = JSON.parse(localStorage.getItem(TREE_CACHE_KEY) || "null");
    if (c && Date.now() - c.t < TREE_CACHE_MS)
      return { tree: c.tree, source: `브라우저에 저장된 목록 (${Math.round((Date.now() - c.t) / 1000)}초 전)` };
  } catch {}

  const tree = await fetchTreeFromGitHub();
  try { localStorage.setItem(TREE_CACHE_KEY, JSON.stringify({ t: Date.now(), tree })); } catch {}
  return { tree, source: "GitHub API (최신)" };
}

/* ═══════════════════════════════════════════════════════
   파일명 → 학생 객체
   규칙: "학번4자리 이름 - 작품명.html"   예) 2101 홍길동 - 할일앱.html
        (학교는 폴더로 구분하므로 파일명에 학교 표시가 필요 없음)
═══════════════════════════════════════════════════════ */
function parseStudent(file, school) {
  const base = file.replace(/\.html?$/i, "");
  const m    = base.match(/^(\d{2})(\d{2})/);
  const cls  = m ? m[1] : null;              // "21" → 2학년 1반
  const id   = m ? m[1] + m[2] : "";         // "2101"
  const rest = m ? base.slice(4) : base;
  const dash = rest.indexOf(" - ");
  const trim = s => s.replace(/^[\s_\-]+/, "").trim();
  const name  = dash !== -1 ? trim(rest.slice(0, dash)) : "";
  const title = dash !== -1 ? rest.slice(dash + 3).trim() : (trim(rest) || base);

  return {
    file, school, cls, id, name, title,
    key:  [REPO_PATH, school, STUDENT_DIR, file].filter(Boolean).join("/"),   // 조회수·별점 저장용 고유 키
    href: `${ROOT_REL}${school}/${STUDENT_DIR}/${encodeURIComponent(file)}`,
    views: 0, avgRating: null,
  };
}

/* ═══════════════════════════════════════════════════════
   Supabase
═══════════════════════════════════════════════════════ */
async function sbFetch(path, opts = {}) {
  const res = await fetch(SUPABASE_URL + path, {
    ...opts,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "",
      ...opts.headers,
    },
  });
  if (!res.ok && res.status !== 404) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}

/* 1000행 제한을 넘어도 모두 가져오기 */
async function sbAll(path) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const rows = await sbFetch(path, { headers: { "Range": `${from}-${from + 999}` } });
    out.push(...(rows || []));
    if (!rows || rows.length < 1000) break;
  }
  return out;
}

const keyFilter = () => REPO_PATH ? `&file=like.${encodeURIComponent(REPO_PATH)}/*` : "";

async function incrementViews(key) {
  await sbFetch("rpc/increment_views", { method: "POST", body: JSON.stringify({ p_file: key }) });
}

async function loadAllViews() {
  try {
    const rows = await sbAll(`${TABLE}?select=file,views${keyFilter()}`);
    const map = {};
    rows.forEach(r => { map[r.file] = r.views; });
    return map;
  } catch { return {}; }
}

async function submitRating(key, score) {
  await sbFetch(RATINGS_TABLE, {
    method: "POST", prefer: "return=minimal",
    body: JSON.stringify({ file: key, score }),
  });
}

async function loadAllRatings() {
  if (!RATING_ENABLED) return {};
  try {
    const rows = await sbAll(`${RATINGS_TABLE}?select=file,score${keyFilter()}`);
    const acc = {};
    rows.forEach(r => {
      if (!acc[r.file]) acc[r.file] = { sum: 0, cnt: 0 };
      acc[r.file].sum += r.score;
      acc[r.file].cnt += 1;
    });
    const avg = {};
    Object.keys(acc).forEach(k => { avg[k] = acc[k].sum / acc[k].cnt; });
    return avg;
  } catch { return {}; }
}

/* ═══════════════════════════════════════════════════════
   24시간 조회수 중복 방지 / 내가 준 별점 기억
═══════════════════════════════════════════════════════ */
const COOLDOWN_MS   = 24 * 60 * 60 * 1000;
const LS_KEY        = "viewed_works";
const LS_RATING_KEY = "my_ratings";

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || "{}"); } catch { return {}; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

function canCount(key)  { const r = lsGet(LS_KEY); return !r[key] || Date.now() - r[key] > COOLDOWN_MS; }
function markViewed(key){ const r = lsGet(LS_KEY); r[key] = Date.now(); lsSet(LS_KEY, r); }
function getMyRating(key)       { return lsGet(LS_RATING_KEY)[key] ?? null; }
function saveMyRating(key, sc)  { const r = lsGet(LS_RATING_KEY); r[key] = sc; lsSet(LS_RATING_KEY, r); }

/* ═══════════════════════════════════════════════════════
   별점 위젯
═══════════════════════════════════════════════════════ */
function starSVG(filled) {
  return `<svg viewBox="0 0 24 24" fill="${filled ? "var(--gold)" : "none"}"
    stroke="var(--gold)" stroke-width="1.8" stroke-linejoin="round">
    <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
  </svg>`;
}

function paintStars(row, n) {
  row.querySelectorAll("svg").forEach((svg, i) => svg.setAttribute("fill", i < n ? "var(--gold)" : "none"));
}

function buildStarWidget(key, avg) {
  const avgText = avg !== null
    ? `<div class="star-avg">평균 <span>${avg.toFixed(1)}</span>점</div>`
    : `<div class="star-avg" style="opacity:.45">아직 평점 없음</div>`;
  return `<div class="star-widget">
    <div class="star-row" data-key="${esc(key)}">${[1,2,3,4,5].map(() => starSVG(false)).join("")}</div>
    ${avgText}
  </div>`;
}

function attachStarEvents(root = document) {
  if (!RATING_ENABLED) return;

  root.querySelectorAll(".star-row").forEach(row => {
    const key = row.dataset.key;
    const mine = getMyRating(key);
    if (mine) paintStars(row, mine);

    row.addEventListener("mousemove", e => {
      const rect  = row.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      paintStars(row, Math.ceil(ratio * 5));
    });
    row.addEventListener("mouseleave", () => paintStars(row, getMyRating(key) ?? 0));

    row.addEventListener("click", async e => {
      e.preventDefault();
      e.stopPropagation();
      const score = [...row.querySelectorAll("svg")].filter(s => s.getAttribute("fill") !== "none").length;
      if (score === 0) return;

      saveMyRating(key, score);
      paintStars(row, score);

      try {
        await submitRating(key, score);
        const newAvg = (await loadAllRatings())[key] ?? null;
        const avgEl  = row.closest(".star-widget")?.querySelector(".star-avg");
        if (avgEl) {
          avgEl.style.opacity = "1";
          avgEl.innerHTML = newAvg !== null ? `평균 <span>${newAvg.toFixed(1)}</span>점` : `아직 평점 없음`;
        }
      } catch (err) { console.warn("별점 저장 실패", err); }
    });
  });
}

/* ═══════════════════════════════════════════════════════
   상수 / 상태
═══════════════════════════════════════════════════════ */
const MEDALS      = ["🥇", "🥈", "🥈", "🥉", "🥉", "🥉"];
const MEDAL_CLASS = ["gold", "silver", "silver", "bronze", "bronze", "bronze"];
const MEDAL_LABEL = ["1위", "2위", "2위", "3위", "3위", "3위"];
const eyeIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="2">
  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;

let TREE         = { examples: [], schools: {} };
let VISIBLE      = [];      // 이 페이지에 표시할 학교 코드들
let ALL_STUDENTS = [];      // 표시 대상 학생 작품
let selectedKey  = null;    // 예: "school-a|21"

function formatOpenDate() {
  const d = new Date(RATING_OPEN_DATE + "T00:00:00");
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
}

/* ═══════════════════════════════════════════════════════
   학반별 보기 — 학교·학년·반은 파일에서 자동으로 만들어짐
═══════════════════════════════════════════════════════ */
function classSectionHTML() {
  const rows = VISIBLE.map(code => {
    const mine    = ALL_STUDENTS.filter(s => s.school === code);
    const classes = [...new Set(mine.filter(s => s.cls).map(s => s.cls))].sort(cmp);
    const hasEtc  = mine.some(s => !s.cls);
    const chip = (cls, text) => {
      const key = `${code}|${cls}`;
      return `<button class="class-chip ${key === selectedKey ? "active" : ""}" data-key="${esc(key)}">${text}</button>`;
    };
    const chips = classes.map(c => chip(c, classLabel(c))).join("") + (hasEtc ? chip("etc", "기타") : "");
    return `<div class="class-chips">
      <span class="grade-label">${esc(schoolLabel(code))}</span>
      ${chips || `<span class="empty-note">아직 제출된 작품이 없습니다</span>`}
    </div>`;
  }).join("");

  return `
    <div class="section-label">🏫 학반별 작품 보기</div>
    ${rows || `<div class="class-hint">표시할 학교가 없습니다.</div>`}
    <div id="class-list"></div>`;
}

function renderClassList() {
  const box = document.getElementById("class-list");
  if (!box) return;

  if (!selectedKey) {
    box.innerHTML = `<div class="class-hint">학반을 선택하면 해당 반 학생들의 작품이 학번 순서대로 표시됩니다.</div>`;
    return;
  }

  const [school, cls] = selectedKey.split("|");
  const list = ALL_STUDENTS
    .filter(s => s.school === school && (cls === "etc" ? !s.cls : s.cls === cls))
    .sort((a, b) => cmp(a.id, b.id) || cmp(a.title, b.title));

  if (!list.length) {
    box.innerHTML = `<div class="class-hint">작품이 아직 없습니다.</div>`;
    return;
  }

  box.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>학번</th><th>이름</th><th>작품명</th><th>조회수</th>
            ${RATING_ENABLED ? "<th>별점</th>" : ""}
          </tr>
        </thead>
        <tbody>
          ${list.map(s => `
            <tr>
              <td class="id-cell">${esc(s.id || "-")}</td>
              <td class="name-cell">${esc(s.name || "-")}</td>
              <td><a href="${s.href}" target="_blank" rel="noopener" data-key="${esc(s.key)}">${esc(s.title)}</a></td>
              <td class="views-cell">${eyeIcon}&nbsp;${s.views.toLocaleString()}</td>
              ${RATING_ENABLED ? `<td class="star-cell">${buildStarWidget(s.key, s.avgRating)}</td>` : ""}
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;

  attachStarEvents(box);
}

function bindClassChips() {
  document.querySelectorAll(".class-chip[data-key]").forEach(btn => {
    btn.addEventListener("click", () => {
      const k = btn.dataset.key;
      selectedKey = (selectedKey === k) ? null : k;
      document.querySelectorAll(".class-chip[data-key]").forEach(b =>
        b.classList.toggle("active", b.dataset.key === selectedKey));
      renderClassList();
    });
  });
}

/* ═══════════════════════════════════════════════════════
   예시 작품 (vibe-coding/examples/ — 모든 학교 공통)
   작품 하나 = 폴더 하나 (폴더 안의 index.html 이 열림)
   예) examples/flexbox-demo/index.html
═══════════════════════════════════════════════════════ */
function exampleSectionHTML() {
  const names = TREE.examples.slice().sort(cmp);
  const body = names.length
    ? `<div class="example-list">${names.map(n => `
        <a class="example-item" href="${ROOT_REL}${EXAMPLES_DIR}/${encodeURIComponent(n)}/" target="_blank" rel="noopener">
          <span class="ex-icon">▶</span><span>${esc(n)}</span>
        </a>`).join("")}</div>`
    : `<div class="class-hint">${EXAMPLES_DIR}/ 폴더에 예시 작품 폴더가 없습니다.</div>`;
  return `<div class="section-label">💡 예시 작품</div>${body}`;
}

/* ═══════════════════════════════════════════════════════
   전체 렌더링
═══════════════════════════════════════════════════════ */
function render() {
  const app      = document.getElementById("app");
  const multi    = VISIBLE.length > 1;
  const sorted   = [...ALL_STUDENTS].sort((a, b) => b.views - a.views);
  const top6     = sorted.slice(0, 6);

  const soonBanner = !RATING_ENABLED ? `
    <div class="rating-soon-banner">
      <span class="banner-icon">⭐</span>
      <div>
        <strong>별점 기능 오픈 예정</strong>
        <span class="banner-date">${formatOpenDate()}</span>부터
        친구들의 작품에 별점을 줄 수 있어요!
      </div>
    </div>` : "";

  const medalHTML = !sorted.length ? "" : `
    <div class="section-label">🏆 명예의 전당 — TOP 6</div>
    <div class="medal-grid">
      ${top6.map((s, i) => `
        <a class="medal-card ${MEDAL_CLASS[i]}" href="${s.href}" target="_blank" rel="noopener" data-key="${esc(s.key)}">
          <div class="medal-badge">${MEDALS[i]}</div>
          <div class="medal-rank">${MEDAL_LABEL[i]}</div>
          <div class="card-name">${multi ? esc(schoolLabel(s.school)) + " · " : ""}${esc(s.name || s.id || "")}</div>
          <div class="card-title">${esc(s.title)}</div>
          <div class="card-views">${eyeIcon} ${s.views.toLocaleString()}</div>
        </a>`).join("")}
    </div>
    ${soonBanner}`;

  const tableHTML = !sorted.length ? "" : `
    <div class="section-label">📋 전체 작품 목록</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="text-align:center">순위</th>
            ${multi ? "<th>학교</th>" : ""}
            <th>이름</th><th>작품명</th><th>조회수</th>
            ${RATING_ENABLED ? "<th>별점</th>" : ""}
          </tr>
        </thead>
        <tbody>
          ${sorted.map((s, i) => `
            <tr>
              <td class="rank-cell">${i < 6 ? MEDALS[i] : `<span style="color:var(--muted);font-size:.85rem">${i + 1}</span>`}</td>
              ${multi ? `<td class="school-cell">${esc(schoolLabel(s.school))}</td>` : ""}
              <td class="name-cell">${esc(s.name || "-")}</td>
              <td><a href="${s.href}" target="_blank" rel="noopener" data-key="${esc(s.key)}">${esc(s.title)}</a></td>
              <td class="views-cell">${eyeIcon}&nbsp;${s.views.toLocaleString()}</td>
              ${RATING_ENABLED ? `<td class="star-cell">${buildStarWidget(s.key, s.avgRating)}</td>` : ""}
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;

  const emptyNote = sorted.length ? "" :
    `<div class="state-msg">📂 아직 제출된 학생 작품이 없습니다.</div>`;

  app.innerHTML = medalHTML + emptyNote + classSectionHTML() + exampleSectionHTML() + tableHTML;

  bindClassChips();
  renderClassList();
  attachStarEvents(app);

  /* 진단 패널: 주소 끝에 ?debug=1 */
  if (new URLSearchParams(location.search).has("debug")) {
    const rows = ALL_STUDENTS.map(s => {
      const where = `${schoolLabel(s.school)} ${s.cls ? classLabel(s.cls) : "⚠ 학번 인식 안 됨"}`;
      return `<tr><td>${esc(s.file)}</td><td>${esc(where)}</td></tr>`;
    }).join("");
    app.insertAdjacentHTML("beforeend", `
      <div class="section-label">🛠 진단 정보</div>
      <div class="class-hint" style="text-align:left;line-height:1.8">
        목록 출처: <b>${esc(LOAD_INFO.source)}</b><br>
        저장소: <b>${esc(GH_USER)}/${esc(GH_REPO)}</b> · 경로: <b>${esc(REPO_PATH)}</b> · 학교 필터: <b>${esc(FIXED_SCHOOL || "없음(통합)")}</b><br>
        인식한 학교: <b>${esc(VISIBLE.join(", "))}</b> · 학생 .html 파일: <b>${ALL_STUDENTS.length}</b><br>
        <button class="class-chip" onclick="localStorage.removeItem('${TREE_CACHE_KEY}');location.reload()">저장된 목록 지우고 새로고침</button>
      </div>
      <div class="table-wrap" style="margin-top:12px"><table>
        <thead><tr><th>파일명</th><th>인식 결과</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`);
  }
}

/* ── 작품 클릭 → 조회수 증가 (이벤트 위임) ── */
document.addEventListener("click", async e => {
  const a = e.target.closest("a[data-key]");
  if (!a) return;
  const key = a.dataset.key;
  if (!canCount(key)) return;
  markViewed(key);
  try { await incrementViews(key); } catch (err) { console.warn(err); }
});

/* ═══════════════════════════════════════════════════════
   초기 로드
═══════════════════════════════════════════════════════ */
(async () => {
  /* 머리말 */
  const subEl = document.getElementById("title-sub");
  subEl.textContent = `${YEAR}학년도 ${SUBJECT}` + (FIXED_SCHOOL ? ` · ${schoolLabel(FIXED_SCHOOL)}` : "");
  document.title = `AI를 활용한 나만의 프로그램 만들기 · ${YEAR}` + (FIXED_SCHOOL ? ` · ${schoolLabel(FIXED_SCHOOL)}` : "");
  if (FIXED_SCHOOL) {
    const back = document.getElementById("back-link");
    back.href = IN_SCHOOL_DIR ? "../" : location.pathname;
    back.style.display = "inline-block";
  }

  try {
    const { tree, source } = await loadTree();
    TREE = tree;
    LOAD_INFO = { source };

    const codes = Object.keys(tree.schools).sort(cmp);
    VISIBLE = FIXED_SCHOOL ? [FIXED_SCHOOL] : codes;

    const students = [];
    VISIBLE.forEach(code => {
      (tree.schools[code] || [])
        .filter(n => /\.html?$/i.test(n))
        .forEach(n => students.push(parseStudent(n, code)));
    });

    const [viewMap, ratingMap] = await Promise.all([loadAllViews(), loadAllRatings()]);
    students.forEach(s => {
      s.views     = viewMap[s.key]   ?? 0;
      s.avgRating = ratingMap[s.key] ?? null;
    });

    ALL_STUDENTS = students;
    render();
  } catch (err) {
    document.getElementById("app").innerHTML = `
      <div class="state-msg">
        ⚠️ 데이터를 불러오지 못했습니다.<br>
        <small style="margin-top:8px;display:block">${esc(err.message)}</small>
        <small style="margin-top:6px;display:block;color:#4f8ef7">
          files.json 이 생성되어 있는지, 또는 GITHUB_USER / GITHUB_REPO 설정을 확인해주세요.
        </small>
      </div>`;
  }
})();
</script>
