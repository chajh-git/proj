<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FPS 마인크래프트</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;font-family:system-ui,sans-serif;color:#fff;user-select:none}
canvas{display:block}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.65);text-align:center;cursor:pointer;line-height:1.7}
#cross{position:fixed;left:50%;top:50%;width:20px;height:20px;margin:-10px;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
#cross:before{left:9px;top:0;width:2px;height:20px}#cross:after{top:9px;left:0;height:2px;width:20px}
#hm{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px;pointer-events:none;opacity:0;border:3px solid #ff2a4a;transform:rotate(45deg)}
#scope{position:fixed;inset:0;pointer-events:none;display:none;background:radial-gradient(circle at center,transparent 26%,#000 31%)}
#hit{position:fixed;inset:0;background:rgba(255,0,0,.35);opacity:0;pointer-events:none}
.hud{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:rgba(15,23,42,.8);border:2px solid #475569;padding:8px 14px;border-radius:6px;font-weight:700;font-size:15px}
#hp{left:14px;line-height:1.6}#am{right:14px;text-align:right}
.bar{height:9px;width:170px;background:#fff2;margin:2px 0}.bar i{display:block;height:100%}
#msg{position:fixed;top:14%;left:50%;transform:translateX(-50%);font-weight:700;text-shadow:0 0 4px #000;opacity:0;transition:opacity .3s;pointer-events:none}
#info{position:fixed;top:10px;left:12px;font-weight:600;text-shadow:0 0 4px #000;font-size:14px}
#slots{position:fixed;top:10px;right:12px;display:flex;gap:6px}
.sl{background:rgba(15,23,42,.8);border:2px solid #475569;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:700}.sl.on{border-color:#f59e0b;color:#f59e0b}
#menu{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,94vw);max-height:84%;overflow:auto;box-sizing:border-box;background:rgba(15,23,42,.96);border:1px solid #38bdf8;border-radius:10px;padding:14px}
#menu h2{margin:0 0 6px;font-size:17px}#menu h3{margin:10px 0 4px;font-size:13px;color:#7dd3fc}
.g{display:flex;flex-wrap:wrap;gap:5px}
.b{background:#1e293b;border:1.5px solid #475569;color:#fff;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
.b:hover{border-color:#38bdf8}.b.on{border-color:#f59e0b;color:#f59e0b}
</style></head><body>
<div id="ov"><h1 style="margin:0 0 6px">⛏️🔫 FPS 마인크래프트</h1><div>클릭해서 시작</div>
<div style="font-size:14px;opacity:.85">WASD 이동 · 스페이스 점프 · Shift 달리기 · 마우스 시점<br>좌클릭 발사 · 우클릭 조준 · R 재장전 · 1/2/3·휠 슬롯 교체<br><b>Q 또는 Tab: 무기·방어구 선택창</b> · ESC 일시정지</div></div>
<div id="cross"></div><div id="hm"></div><div id="scope"></div><div id="hit"></div><div id="msg"></div>
<div id="info"></div><div id="slots"></div>
<div class="hud" id="hp"></div><div class="hud" id="am"></div>
<div id="menu"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),R=Math.random;
// ===== 무기 데이터 (fps2.0): 이름,분류,탄창,연사ms,펠릿,퍼짐,최소딜,최대딜,사거리,자동,재장전ms,조준FOV =====
const WD=`AK-47,R,30,100,1,.008,20,36,55,1,1700,45|Phantom,R,30,108,1,.0065,20,32,52,1,1700,44|Bulldog,R,24,140,1,.007,22,35,48,1,1700,46|SCAR-H,R,24,118,1,.0075,23,38,58,1,1900,42|FAMAS,R,30,100,1,.006,21,36,60,1,1700,48|Guardian,R,12,420,1,.018,34,55,72,0,1900,36|Vector,S,30,62,1,.021,10,15,25,1,1500,50|Spectre,S,30,78,1,.02,11,17,25,1,1500,50|MP-9K,S,20,65,1,.026,10,16,20,1,1300,56|M249,X,100,85,1,.024,12,22,42,1,3200,50|Pump Shotgun,G,8,600,10,.046,6,21,20,0,2000,60|Judge,G,7,260,10,.065,3,12,14,1,2000,58|Shorty,G,2,350,12,.082,4,15,12,0,1200,65|Sawed-Off,G,2,750,1,.03,46,78,12,0,1300,60|M24,N,5,1400,1,.002,68,90,110,0,2200,15|Operator,N,5,1600,1,.002,82,108,115,0,2400,12|Railgun,N,1,2300,1,.0003,88,105,160,0,2500,20|RPG,X,1,3000,1,.004,88,115,80,0,2800,55|Classic,P,12,165,1,.012,16,28,38,0,1100,55|USP,P,12,200,1,.0055,20,34,50,0,1100,50|Glock-18,P,17,280,1,.014,14,26,34,0,1100,55|Frenzy,P,13,62,1,.022,11,17,22,1,1100,58|Auto-Pistol,P,18,80,1,.022,10,16,21,1,1100,55|Deagle,P,7,340,1,.011,36,58,50,0,1200,50|Revolver,P,6,440,1,.009,40,68,68,0,1700,48|M1911,P,8,290,1,.006,28,46,44,0,1100,50|Magnum .44,P,6,560,1,.012,45,72,52,0,1700,48|Crossbow,P,1,1200,1,.005,58,82,48,0,1200,52|Knife,M,0,380,1,0,60,95,5,0,0,70|Bat,M,0,620,1,0,48,80,5.6,0,0,70|Taser,M,0,900,1,0,20,30,4.5,0,0,70`
.split('|').map((s,i)=>{const a=s.split(',');return{id:i,n:a[0],c:a[1],mag:+a[2],rate:+a[3],pel:+a[4],sp:+a[5],d0:+a[6],d1:+a[7],rg:+a[8],au:+a[9],rl:+a[10],zf:+a[11]}});
const CAT={R:'돌격소총',S:'기관단총',G:'샷건',N:'저격',X:'중화기',P:'권총',M:'근접'};
const ARM={none:['노아머',0,0,1.12],scout:['스카우트 40',40,.5,1.08],light:['경형 50',50,.6,1.04],heavy:['중형 100',100,.6,.95],assault:['돌격 120',120,.65,.9],plate:['방탄판 150',150,.75,.84],bulky:['대형 200',200,.8,.78]};
// ===== 월드 (미니 마인크래프트) =====
const W=96,H=24,world=new Uint8Array(W*H*W),I=(x,y,z)=>(y*W+z)*W+x;
const inb=(x,y,z)=>x>=0&&y>=0&&z>=0&&x<W&&y<H&&z<W,get=(x,y,z)=>inb(x,y,z)?world[I(x,y,z)]:0;
const solid=(x,y,z)=>{if(y<0||x<0||z<0||x>=W||z>=W)return true;const b=get(x,y,z);return b>0&&b!=9};
const COLS=['','#5fa83a','#8b5a2b','#8a8a8a','#6b4423','#2f7d32','','#e3d49b','#f4f8ff','#2f6fdd'],SEA=7;
const nz=(x,z)=>Math.sin(x*.13)+Math.cos(z*.11)+.5*Math.sin((x+z)*.21)+.5*Math.cos((x-z)*.17)+.25*Math.sin(x*.4+z*.3)+1.2*Math.sin(x*.045)*Math.cos(z*.05+2);
const hAt=(x,z)=>Math.min(H-3,Math.max(2,Math.floor(10+nz(x,z)*3+11*Math.exp(-((x-36)**2+(z-12)**2)/110)+13*Math.exp(-((x-72)**2+(z-70)**2)/150))));
for(let x=0;x<W;x++)for(let z=0;z<W;z++){const h=hAt(x,z),top=h<=SEA+1?7:h>=18?8:h>=15?3:1,un=top==7?7:top==1?2:3;
 for(let y=0;y<=h;y++)world[I(x,y,z)]=y==h?top:y>h-3?un:3;for(let y=h+1;y<=SEA;y++)world[I(x,y,z)]=9;}
for(let a=0,pl=0;a<1000&&pl<70;a++){const x=3+Math.floor(R()*(W-6)),z=3+Math.floor(R()*(W-6)),h=hAt(x,z);if(world[I(x,h,z)]!=1)continue;pl++;
 for(let y=1;y<=4;y++)world[I(x,h+y,z)]=4;
 for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=3;dy<=5;dy++){if(Math.abs(dx)+Math.abs(dz)+(dy-3)>3||(!dx&&!dz&&dy<5))continue;if(!get(x+dx,h+dy,z+dz))world[I(x+dx,h+dy,z+dz)]=5;}}
// ===== three =====
const scene=new THREE.Scene();scene.background=new THREE.Color('#87ceeb');scene.fog=new THREE.Fog('#87ceeb',30,70);
const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,120);scene.add(cam);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x556655,.95));const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(30,50,20);scene.add(sun);
function tex(c){const cv=document.createElement('canvas');cv.width=cv.height=16;const g=cv.getContext('2d');g.fillStyle=c;g.fillRect(0,0,16,16);
 for(let i=0;i<50;i++){g.fillStyle=R()<.5?'rgba(0,0,0,.14)':'rgba(255,255,255,.12)';g.fillRect(R()*16|0,R()*16|0,2,2);}
 const t=new THREE.CanvasTexture(cv);t.magFilter=THREE.NearestFilter;return t;}
const mats=COLS.map((c,i)=>c?new THREE.MeshLambertMaterial({map:tex(c)}):null);
mats[9]=new THREE.MeshLambertMaterial({map:tex(COLS[9]),transparent:true,opacity:.75,depthWrite:false});
const geo=new THREE.BoxGeometry(1,1,1);
(function(){const lists=Array.from({length:10},()=>[]);
 for(let y=0;y<H;y++)for(let z=0;z<W;z++)for(let x=0;x<W;x++){const b=world[I(x,y,z)];if(!b)continue;
  const c=b==9?get:(x,y,z)=>{const q=get(x,y,z);return q>0&&q!=9};
  if(c(x+1,y,z)&&c(x-1,y,z)&&c(x,y+1,z)&&c(x,y-1,z)&&c(x,y,z+1)&&c(x,y,z-1)&&inb(x+1,y,z)&&inb(x-1,y,z)&&inb(x,y,z+1)&&inb(x,y,z-1))continue;lists[b].push(x,y,z);}
 const m4=new THREE.Matrix4();
 lists.forEach((l,b)=>{if(!l.length)return;const im=new THREE.InstancedMesh(geo,mats[b],l.length/3);
  for(let i=0;i<l.length;i+=3){m4.makeScale(1,b==9?.88:1,1).setPosition(l[i]+.5,l[i+1]+(b==9?.44:.5),l[i+2]+.5);im.setMatrixAt(i/3,m4);}
  im.frustumCulled=false;scene.add(im);});})();
// ===== 플레이어 (fps2.0) =====
const P={x:0,y:0,z:0,vy:0,yaw:0,pitch:0,ground:false,hp:100,ar:100,armor:'heavy',lastHit:0};
function spawn(){let b=[W/2,W/2],d=1e9;for(let x=2;x<W-2;x++)for(let z=2;z<W-2;z++){const h=hAt(x,z),k=(x-W/2)**2+(z-W/2)**2;if(h>SEA+1&&h<14&&!get(x,h+1,z)&&get(x,h,z)==1&&k<d){d=k;b=[x,z];}}
 P.x=b[0]+.5;P.z=b[1]+.5;P.y=hAt(b[0],b[1])+1;P.vy=0;}
spawn();
const PR=.3,PH=1.8;
const hit=(x,y,z)=>{for(let ix=Math.floor(x-PR);ix<=Math.floor(x+PR);ix++)for(let iy=Math.floor(y);iy<=Math.floor(y+PH);iy++)for(let iz=Math.floor(z-PR);iz<=Math.floor(z+PR);iz++)if(solid(ix,iy,iz))return true;return false};
// 무기 슬롯 / 탄약
let slots=[0,18,28],cur=0,cw=WD[0],rl=0,rlT=0,lt=0,mdown=false,ads=false,kick=0,kickY=0,locked=false,menuOpen=false,kills=0;
const am={};WD.forEach(w=>am[w.id]={m:w.mag,r:w.mag*4});
const slotOf=c=>c=='M'?2:c=='P'?1:0;
function msg(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.opacity=0,1200);}
function updHud(){const a=ARM[P.armor];
 $('hp').innerHTML='HP '+Math.ceil(P.hp)+'<div class="bar"><i style="width:'+P.hp+'%;background:#4ade80"></i></div>방어구 '+Math.ceil(P.ar)+'<div class="bar"><i style="width:'+(a[1]?P.ar/a[1]*100:0)+'%;background:#38bdf8"></i></div>';
 const q=am[cw.id];$('am').innerHTML=cw.n+'<br><span style="font-size:22px">'+(cw.c=='M'?'MELEE':rl?'재장전...':q.m+' / '+q.r)+'</span>';
 $('slots').innerHTML=slots.map((id,i)=>'<div class="sl'+(i==cur?' on':'')+'">['+(i+1)+'] '+WD[id].n+'</div>').join('');
 $('info').textContent='처치 '+kills;}
function hurt(n){const a=ARM[P.armor];if(P.ar>0){const t=Math.min(P.ar,n*a[2]);P.ar-=t;n-=t;}P.hp-=n;
 const e=$('hit');e.style.transition='none';e.style.opacity=.9;requestAnimationFrame(()=>{e.style.transition='opacity .5s';e.style.opacity=0;});
 if(P.hp<=0){P.hp=100;P.ar=a[1];msg('쓰러졌어요! 다시 시작');spawn();peak=P.y;}updHud();}
// ===== 총 뷰모델 =====
const VM=new THREE.Group();cam.add(VM);
const mk=(w,h,d,x,y,z,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);VM.add(m);return m;};
let flashM=null;
function buildVM(){VM.clear();const c=cw.c,L={R:.7,S:.45,P:.28,G:.8,N:1.05,X:.85,M:.35}[c],d='#222a33',sk='#c4a574';
 if(c=='M'){mk(.04,.04,.14,0,0,0,'#3a2a1a');mk(.025,.05,cw.n=='Bat'?.6:.3,0,0,-.3,cw.n=='Taser'?'#facc15':cw.n=='Bat'?'#8b5a2b':'#d1d5db');mk(.08,.08,.1,.01,-.03,.03,sk);}
 else{mk(.06,.09,L*.55,0,0,-L*.28,d);mk(.03,.03,L*.5,0,.01,-L*.75,'#111');mk(.045,.11,.06,0,-.09,-.02,'#1c1e22');
  if(c=='R'||c=='S'||c=='X')mk(.04,.13,.06,0,-.1,-L*.3,'#2a2e36');
  if(c=='R'||c=='G'||c=='N'||c=='X')mk(.05,.08,.22,0,-.02,.12,'#5a2c14');
  if(c=='N'){const s=mk(.045,.045,.3,0,.07,-L*.3,'#111');}
  if(c=='G')mk(.05,.05,.2,0,-.05,-L*.55,'#5a3a22');
  mk(.075,.075,.1,.01,-.08,0,sk);mk(.075,.075,.1,-.01,-.04,-L*.45,sk);
  flashM=mk(.09,.09,.06,0,.01,-L-.04,'#ffd37a');flashM.visible=false;}
 const sl=slotOf(c);if(c=='M')slots[2]==cw.id||0;}
function equip(id){if(rl)return;cw=WD[id];ads=false;setAds(false);buildVM();updHud();}
function setSlot(i){cur=i;equip(slots[i]);}
function setAds(v){ads=v&&cw.c!='M';cam.fov=ads?cw.zf:75;cam.updateProjectionMatrix();$('scope').style.display=ads&&cw.c=='N'?'block':'none';$('cross').style.display=ads?'none':'block';VM.visible=!(ads&&cw.c=='N');}
// ===== 메뉴 =====
function renderMenu(){const m=$('menu');let h='<h2>🎒 장비 선택 <small style="font-weight:400;opacity:.7">(Q로 닫기)</small></h2><h3>방어구</h3><div class="g">';
 for(const k in ARM)h+=`<button class="b${P.armor==k?' on':''}" onclick="setArmor('${k}')">${ARM[k][0]}</button>`;h+='</div>';
 for(const c in CAT){h+='<h3>'+CAT[c]+'</h3><div class="g">';WD.filter(w=>w.c==c).forEach(w=>h+=`<button class="b${slots.includes(w.id)?' on':''}" onclick="pickW(${w.id})">${w.n}</button>`);h+='</div>';}
 m.innerHTML=h;}
function setArmor(k){P.armor=k;P.ar=ARM[k][1];renderMenu();updHud();}
function pickW(id){const s=slotOf(WD[id].c);slots[s]=id;cur=s;am[id].m=WD[id].mag;am[id].r=WD[id].mag*4;rl=0;equip(id);renderMenu();}
function toggleMenu(){menuOpen=!menuOpen;for(const k in keys)keys[k]=false;mdown=false;$('menu').style.display=menuOpen?'block':'none';
 if(menuOpen){renderMenu();document.exitPointerLock();}else ren.domElement.requestPointerLock();}
// ===== 입력 =====
const keys={};$('ov').onclick=()=>ren.domElement.requestPointerLock();
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===ren.domElement;$('ov').style.display=(locked||menuOpen)?'none':'flex';});
addEventListener('keydown',e=>{keys[e.code]=true;if((e.code=='KeyQ'||e.code=='Tab')&&!e.repeat){e.preventDefault();if(locked||menuOpen)toggleMenu();}
 if(!locked)return;const k=['Digit1','Digit2','Digit3'].indexOf(e.code);if(k>=0)setSlot(k);if(e.code=='KeyR')reload();if(e.code=='Space')e.preventDefault();});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{if(!locked)return;const s=ads?.0009:.0024;P.yaw-=e.movementX*s*(ads?1.6:1);P.pitch=Math.max(-1.55,Math.min(1.55,P.pitch-e.movementY*s*(ads?1.6:1)));});
addEventListener('wheel',e=>{if(locked)setSlot((cur+(e.deltaY>0?1:2))%3);});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousedown',e=>{if(!locked)return;if(e.button==0){mdown=true;fire();}else if(e.button==2)setAds(!ads);});
addEventListener('mouseup',e=>{if(e.button==0)mdown=false;});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
// ===== 사운드 / 이펙트 =====
let ac;function snd(f,d,v){try{ac=ac||new AudioContext();const t=ac.currentTime,n=ac.sampleRate*d|0,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=(R()*2-1)*(1-i/n);const s=ac.createBufferSource(),g=ac.createGain(),fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;g.gain.value=v;s.buffer=b;s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start(t);}catch(e){}}
const pg=new THREE.BoxGeometry(.12,.12,.12),parts=[];
function spark(p,c,n){for(let i=0;i<(n||8);i++){const m=new THREE.Mesh(pg,new THREE.MeshBasicMaterial({color:c}));m.position.copy(p);
 m.userData={v:new THREE.Vector3((R()-.5)*6,R()*5,(R()-.5)*6),l:.6};scene.add(m);parts.push(m);}}
function tracer(a,b){const l=a.distanceTo(b);if(l<1)return;const m=new THREE.Mesh(new THREE.BoxGeometry(.03,.03,l),new THREE.MeshBasicMaterial({color:0xffe566}));
 m.position.copy(a).lerp(b,.5);m.lookAt(b);scene.add(m);setTimeout(()=>scene.remove(m),60);}
function boom(p){spark(p,0xff7a1a,30);spark(p,0xffee88,20);snd(500,.5,.6);
 mobs.slice().forEach(m=>{const d=m.g.position.distanceTo(p);if(d<5)hitMob(m,70*(1-d/5));});
 const d=Math.hypot(P.x-p.x,P.y+1-p.y,P.z-p.z);if(d<5)hurt(40*(1-d/5));}
// ===== 몹(표적) =====
const mobs=[];
function mkMob(type){const g=new THREE.Group(),cow=type=='cow',legs=[];
 const b=(w,h,d,x,y,z,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);g.add(m);return m;};
 if(cow){b(.75,.65,1.15,0,.8,0,'#5a3b2a');b(.77,.3,.5,0,.9,-.2,'#f4f4f4');b(.5,.5,.5,0,1.05,.75,'#5a3b2a');b(.3,.2,.1,0,.95,1.02,'#e8b8a8');}
 else{b(.85,.7,1,0,.8,0,'#f2f2f2');b(.4,.4,.4,0,1.05,.65,'#3b3030');b(.5,.18,.5,0,1.32,.55,'#f2f2f2');}
 for(const k of[-1,1]){b(.1,.1,.02,k*.12,1.12,cow?1.005:.851,'#fff');b(.06,.08,.02,k*.12,1.11,cow?1.02:.865,'#111');}
 for(const[x,z]of[[-.25,.4],[.25,.4],[-.25,-.4],[.25,-.4]])legs.push(b(.18,.45,.18,x,.225,z,'#3b3030'));g.userData.legs=legs;return g;}
