<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>쿨 낚시</title>
<style>
:root{--ink:#06405a;--mint:#19d3c5;--sun:#ffd166;--coral:#ff7a59;--glass:rgba(255,255,255,.22);--glass2:rgba(255,255,255,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0f8fd6;color:#fff;
  font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 16px 0;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.pill{background:var(--glass);border:1.5px solid rgba(255,255,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:18px;padding:6px 14px;display:flex;flex-direction:column;line-height:1.1;box-shadow:0 4px 16px rgba(0,80,120,.18);text-shadow:0 1px 3px rgba(0,60,90,.45)}
.pill .lab{font-size:11px;opacity:.9;letter-spacing:.04em}
.pill b{font-size:26px;font-variant-numeric:tabular-nums}
#score{color:var(--sun)}
#timerPill.warn{background:rgba(255,90,90,.45);animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#modePill{flex-direction:row;gap:8px;align-items:center;font-weight:700;font-size:14px;padding:10px 14px}
.sp{flex:1}
.btns{display:flex;gap:8px;pointer-events:auto}
.btns button{width:48px;height:48px;border-radius:16px;background:var(--glass);border:1.5px solid rgba(255,255,255,.55);font-size:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btns button.off{opacity:.5}

/* 토스트 */
#toast{position:fixed;left:50%;top:92px;transform:translate(-50%,-14px);opacity:0;transition:.3s;pointer-events:none;
  background:rgba(6,64,90,.55);padding:10px 20px;border-radius:999px;font-weight:700;font-size:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1.5px solid rgba(255,255,255,.4);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 포획 카드 */
#catchCard{position:fixed;left:50%;top:70px;transform:translate(-50%,-160%);opacity:0;visibility:hidden;transition:transform .5s cubic-bezier(.2,1.3,.4,1),opacity .3s,visibility .5s;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(220,250,250,.92));color:var(--ink);border-radius:24px;padding:14px 22px 14px 14px;display:flex;gap:14px;align-items:center;
  box-shadow:0 12px 40px rgba(0,70,110,.35);min-width:320px}
#catchCard.show{transform:translate(-50%,0);opacity:1;visibility:visible}
#catchCard canvas{background:linear-gradient(160deg,#b8f3ec,#6fd6ef);border-radius:16px}
#catchCard .nm{font-size:26px;font-weight:900;display:flex;align-items:center;gap:8px}
#catchCard .meta{font-size:14px;opacity:.75;margin-top:2px}
#catchCard .pts{font-size:26px;font-weight:900;color:#ff7a59}
.badge{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;color:#fff;background:#6bb6d9}
.badge.r1{background:#6bb6d9}.badge.r2{background:#ffa62b}.badge.r3{background:linear-gradient(90deg,#b86bff,#ff6bb0)}
.new{background:#ff5470;color:#fff;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;animation:pulse .7s infinite}

/* 화면 */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;
  background:radial-gradient(ellipse at 50% 40%,rgba(10,120,180,.15),rgba(5,60,110,.45))}
.screen h1{margin:0;font-size:clamp(40px,8vw,84px);font-weight:900;letter-spacing:-.02em;text-shadow:0 4px 0 rgba(0,90,130,.35),0 10px 40px rgba(0,60,100,.5)}
.screen h1 small{display:block;font-size:.22em;letter-spacing:.35em;font-weight:700;opacity:.9;margin-bottom:6px}
.screen p.sub{margin:0;font-size:clamp(14px,2.2vw,20px);opacity:.95;text-shadow:0 2px 8px rgba(0,60,90,.5)}
.modes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:960px}
.mode{width:min(280px,29vw);min-width:200px;padding:16px 14px;border-radius:24px;background:var(--glass);border:2px solid rgba(255,255,255,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:.2s;text-align:center;box-shadow:0 8px 28px rgba(0,80,120,.22)}
.mode .ic{font-size:40px}
.mode b{display:block;font-size:20px;margin:4px 0}
.mode span{font-size:13.5px;line-height:1.4;opacity:.95;display:block}
.mode.sel{background:#fff;color:var(--ink);transform:translateY(-6px) scale(1.04);border-color:#fff;box-shadow:0 14px 36px rgba(0,100,140,.4)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.big{font-size:24px;font-weight:900;padding:16px 46px;border-radius:999px;background:linear-gradient(180deg,#5cf0d8,#14c4c0);color:#044a5a;box-shadow:0 8px 0 #0a8f95,0 16px 30px rgba(0,80,110,.35)}
.big:active{transform:translateY(4px);box-shadow:0 4px 0 #0a8f95}
.sec{font-size:18px;font-weight:800;padding:14px 28px;border-radius:999px;background:var(--glass2);border:2px solid rgba(255,255,255,.6)}
.tips{font-size:13px;opacity:.9;max-width:680px;line-height:1.6}

#dex,#result{background:rgba(5,70,120,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.panel{background:rgba(255,255,255,.97);color:var(--ink);border-radius:30px;padding:24px 26px;width:min(860px,94vw);max-height:92vh;overflow:auto;box-shadow:0 18px 60px rgba(0,60,100,.4)}
.panel h2{margin:0 0 6px;font-size:26px}
.bigscore{font-size:68px;font-weight:900;color:#ff7a59;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.card{background:linear-gradient(160deg,#eafcfb,#d4f1fb);border-radius:18px;padding:10px;text-align:center;position:relative}
.card canvas{display:block;margin:0 auto}
.card b{display:block;font-size:16px}
.card small{opacity:.7;display:block;font-size:12px}
.card.unk canvas{filter:brightness(0) opacity(.28)}
.card .cnt{position:absolute;right:8px;top:6px;background:#19b3b8;color:#fff;font-weight:900;font-size:13px;border-radius:999px;padding:1px 9px}
.rec{display:inline-block;background:#ff5470;color:#fff;font-weight:900;padding:3px 12px;border-radius:999px;animation:pulse .7s infinite}
#pause{background:rgba(5,60,100,.5)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="pill"><span class="lab">점수</span><b id="score">0</b></div>
  <div class="pill" id="timerPill"><span class="lab">남은 시간</span><b id="time">3:00</b></div>
  <div class="pill" id="modePill"></div>
  <div class="sp"></div>
  <div class="btns">
    <button id="bSnd" aria-label="소리">🔊</button>
    <button id="bVib" aria-label="진동">📳</button>
    <button id="bPause" aria-label="일시정지">⏸</button>
  </div>
</div>
<div id="toast"></div>
<div id="catchCard"></div>

<div id="title" class="screen">
  <h1><small>COOL FISHING</small>쿨 낚시</h1>
  <p class="sub">시원한 물가에서 즐기는 3분 낚시 · 낚시 방식을 골라 보세요</p>
  <div class="modes" id="modes">
    <button class="mode" data-m="1"><div class="ic">⏱️</div><b>타이밍 탭</b><span>물고기가 <u>지친 순간(초록 링)</u>에<br>화면을 탭!</span></button>
    <button class="mode" data-m="2"><div class="ic">🎯</div><b>게이지 유지</b><span>꾹 눌러 막대를 올려<br>물고기를 따라가요</span></button>
    <button class="mode" data-m="3"><div class="ic">🌀</div><b>릴링 스와이프</b><span>물고기가 도망가는<br><u>반대 방향</u>으로 스와이프!</span></button>
  </div>
  <div class="row">
    <button class="big" id="bStart">낚시 시작</button>
    <button class="sec" id="bDex">📖 도감</button>
  </div>
  <div class="tips">수면을 탭해 찌를 던지고, 찌가 가라앉으며 <b>“!”</b>가 뜨면 바로 탭해서 챙겨요. 장력 게이지가 가득 차면 줄이 끊어져요.</div>
</div>

<div id="pause" class="screen hidden">
  <h1 style="font-size:56px">일시정지</h1>
  <div class="row"><button class="big" id="bResume">계속하기</button><button class="sec" id="bQuit">나가기</button></div>
</div>

<div id="result" class="screen hidden">
  <div class="panel">
    <h2>🎣 낚시 끝!</h2>
    <div class="bigscore" id="rScore">0</div>
    <div id="rBest" style="margin:6px 0 2px;font-weight:700"></div>
    <div id="rGrid" class="grid"></div>
    <div class="row" style="justify-content:center"><button class="big" id="bAgain" style="font-size:20px;padding:12px 34px">다시 하기</button><button class="sec" id="bTitle" style="color:var(--ink);background:#d7f3f6;border-color:#9fdce4">처음으로</button></div>
  </div>
</div>

<div id="dex" class="screen hidden">
  <div class="panel">
    <h2>📖 물고기 도감</h2>
    <div id="dexSum" style="opacity:.75;font-size:14px"></div>
    <div id="dGrid" class="grid"></div>
    <div class="row" style="justify-content:center"><button class="big" id="bDexClose" style="font-size:20px;padding:12px 40px">닫기</button></div>
  </div>
</div>

<script>
(()=>{
'use strict';
/* =====================================================================
   청량 낚시터  —  탑다운 수면뷰 / Canvas 2D / 단일 파일
   알고리즘: 물고기 FSM + 3가지 낚시 모드 + 어종 데이터테이블(가중치)
   ===================================================================== */
const $=id=>document.getElementById(id);
const cv=$('c'), ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ---------------- 설정/데이터 ---------------- */
const GAME_TIME=180;
const MODE_NAME=['','⏱️ 타이밍 탭','🎯 게이지 유지','🌀 릴링 스와이프'];
/* 어종 데이터 테이블: w=출현 가중치, L=몸길이(px), power=힘, detect=감지반경, bite=입질확률, hook=후킹 가능 시간(초) */
const SPECIES=[
 {id:'crucian',name:'붕어',rar:'흔함',rc:1,w:30,L:54,wr:.40,speed:60,power:.9,detect:150,bite:.55,hook:1.3,score:10,cm:[18,34],color:'#cdb96e',light:'#f4e8ae',fin:'#ee9a4e',pat:'scales',patc:'#fff6cc'},
 {id:'minnow',name:'피라미',rar:'흔함',rc:1,w:30,L:36,wr:.26,speed:95,power:.5,detect:130,bite:.6,hook:1.2,score:10,cm:[6,12],color:'#c4eaf6',light:'#ffffff',fin:'#ff9a62',pat:'stripe',patc:'#4fb2ea',school:true},
 {id:'carp',name:'잉어',rar:'흔함',rc:1,w:20,L:86,wr:.28,speed:70,power:1.6,detect:170,bite:.45,hook:1.1,score:30,cm:[40,72],color:'#fff3e2',light:'#ffffff',fin:'#ffb27a',pat:'koi',patc:'#ff7a3d',barbels:2},
 {id:'catfish',name:'메기',rar:'보통',rc:2,w:8,L:98,wr:.26,speed:55,power:2.2,detect:150,bite:.4,hook:1.0,score:60,cm:[45,90],color:'#5d7184',light:'#9db1c0',fin:'#41566a',pat:'spots',patc:'#a9bdca',barbels:4,headBoost:.55},
 {id:'bass',name:'배스',rar:'보통',rc:2,w:8,L:80,wr:.26,speed:100,power:2.6,detect:190,bite:.45,hook:.9,score:80,cm:[30,55],color:'#79bd4c',light:'#d6f2a0',fin:'#4b9a3f',pat:'spots',patc:'#2f6e3a'},
 {id:'sturgeon',name:'철갑상어',rar:'희귀',rc:3,w:4,L:130,wr:.17,speed:65,power:3.4,detect:160,bite:.3,hook:.85,score:200,cm:[120,210],color:'#8ba5c6',light:'#dbe8fb',fin:'#6e88ad',pat:'scutes',patc:'#f0f6ff',snout:.16,barbels:2,glow:true}
];
const SP_BY_ID={};SPECIES.forEach(s=>SP_BY_ID[s.id]=s);
const TOTAL_W=SPECIES.reduce((a,s)=>a+s.w,0);
function pickSpecies(){let r=Math.random()*TOTAL_W;for(const s of SPECIES){r-=s.w;if(r<=0)return s;}return SPECIES[0];}

/* 시간대 팔레트 (아침 → 낮 → 노을 → 밤) : 청량한 민트/시안 계열 유지 */
const PAL=[
 {t:0.00,edge:hex('#aaf4e8'),mid:hex('#5cdaec'),deep:hex('#2aa8de'),tint:[255,226,190],ta:.10,n:0,sun:1,name:'아침',icon:'🌅'},
 {t:0.30,edge:hex('#8ff5e6'),mid:hex('#27cbe6'),deep:hex('#0f8fd6'),tint:[255,255,255],ta:0,n:0,sun:1,name:'낮',icon:'☀️'},
 {t:0.60,edge:hex('#b6f3de'),mid:hex('#4fc3e2'),deep:hex('#3b88ce'),tint:[255,140,120],ta:.17,n:.25,sun:.7,name:'노을',icon:'🌇'},
 {t:0.85,edge:hex('#2f8fa9'),mid:hex('#18629c'),deep:hex('#0b2f66'),tint:[10,28,84],ta:.32,n:1,sun:.12,name:'밤',icon:'🌙'}
];
function getEnv(fr){
  let i=0;while(i<PAL.length-2&&fr>PAL[i+1].t)i++;
  const a=PAL[i],b=PAL[i+1];const k=clamp((fr-a.t)/(b.t-a.t),0,1),s=k*k*(3-2*k);
  const nm=s<.5?a:b;
  return{edge:mix(a.edge,b.edge,s),mid:mix(a.mid,b.mid,s),deep:mix(a.deep,b.deep,s),tint:mix(a.tint,b.tint,s),
    ta:lerp(a.ta,b.ta,s),n:lerp(a.n,b.n,s),sun:lerp(a.sun,b.sun,s),name:nm.name,icon:nm.icon};
}

/* ---------------- 상태 ---------------- */
let W=0,H=0,DPR=1,U=1;
let pier={},rod={},bounds={};
let state='title';           // title | play | over
let phase='idle';            // idle | cast | wait | bite | fight | catch | miss
let mode=store.get('cwf_mode',1);
let timeLeft=GAME_TIME,score=0,paused=false;
let sess={},fishes=[],ripples=[],drops=[],sparks=[],floaters=[];
let bobber=null,fight=null,catchAnim=null,snap=null,biter=null;
let clock=0,RDT=.016,tsc=1,slowT=0;
let shake=0,zoom=0,flash=0,missT=0,bubbleT=0,waitT=0,swapT=12,topUpT=0,hintShown=false;
let rodAng=null,tip={x:0,y:0},reelAng=0;
let env=getEnv(.3),frac=.3;
let rain={on:false,k:0,start:60,dur:30,done:false};
let soundOn=store.get('cwf_snd',true),vibOn=store.get('cwf_vib',true);
let dex=store.get('cwf_dex',{}),best=store.get('cwf_best',0);
let fid=0;
const ptr={down:new Set(),id:null,x:0,y:0,sx:0,sy:0,trail:[]};

/* ---------------- 사운드 (Web Audio 합성음, 에셋 없음) ---------------- */
const AF=(()=>{
  let ac=null,master=null,noiseBuf=null,rainG=null;
  function init(){
    if(ac){if(ac.state==='suspended')ac.resume();return;}
    try{
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      ac=new AC();master=ac.createGain();master.gain.value=soundOn?.85:0;master.connect(ac.destination);
      const len=ac.sampleRate*1.5;noiseBuf=ac.createBuffer(1,len,ac.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;
      const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=2200;
      rainG=ac.createGain();rainG.gain.value=0;s.connect(f);f.connect(rainG);rainG.connect(master);s.start();
    }catch(e){ac=null;}
  }
  function tone(fr,dur,type='sine',vol=.25,when=0,to=null){
    if(!ac)return;const t=ac.currentTime+when;const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(fr,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
  }
  function noise(dur,f0,f1,vol=.3,type='bandpass',when=0,q=1){
    if(!ac)return;const t=ac.currentTime+when;const s=ac.createBufferSource();s.buffer=noiseBuf;
    const f=ac.createBiquadFilter();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.05);
  }
  const fx={
    splash(){noise(.4,1800,500,.32);tone(320,.16,'sine',.1,0,120);},
    cast(){noise(.4,400,2600,.16);},
    tick(){tone(1000,.04,'square',.04);},
    nibble(){tone(520,.05,'sine',.08,0,380);},
    bite(){tone(860,.13,'sine',.3,0,360);tone(1180,.09,'sine',.16,.1,520);},
    hook(){tone(520,.1,'triangle',.25);tone(780,.14,'triangle',.25,.08);noise(.25,2400,800,.18);},
    good(){tone(900,.09,'sine',.2);tone(1350,.08,'sine',.12,.05);},
    bad(){tone(170,.16,'sawtooth',.16,0,110);},
    warn(){tone(240,.08,'square',.07);},
    snap(){noise(.3,5000,900,.3,'highpass');tone(300,.3,'sawtooth',.15,0,70);},
    miss(){tone(440,.18,'triangle',.18,0,260);tone(300,.25,'triangle',.18,.14,180);},
    catch(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.24,i*.1));tone(2093,.4,'sine',.1,.38);noise(.3,3000,6000,.1,'highpass',.1);},
    start(){[392,523,659].forEach((f,i)=>tone(f,.16,'triangle',.2,i*.08));},
    end(){[784,659,523,392].forEach((f,i)=>tone(f,.2,'triangle',.2,i*.1));}
  };
  return{init,fx,play(n){if(soundOn&&ac)try{fx[n]&&fx[n]();}catch(e){}},
    setOn(v){if(master)master.gain.value=v?.85:0;},
    setRain(k){if(ac&&rainG)rainG.gain.setTargetAtTime(soundOn?k*.05:0,ac.currentTime,.4);}};
})();
const sfx=n=>AF.play(n);
function vibrate(p){if(vibOn&&navigator.vibrate){try{navigator.vibrate(p);}catch(e){}}}

/* ---------------- 레이아웃/정적 장면 ---------------- */
let scene=null,leafSprite=null,capPat=null,clumps=[],pads=[],leaves=[],glints=[],motes=[],flies=[],rainD=[],leafSh=[];
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  U=clamp(Math.min(W/1024,H/700),.7,1.5);
  const pw=Math.min(340*U,W*.42);
  pier={w:pw,x:W/2-pw/2,y:H*.845};
  rod={bx:W/2+28*U,by:H-60*U};
  bounds={x0:46*U,x1:W-46*U,y0:46*U,y1:H*.79};
  buildScene();initEnv();
  fishes.forEach(f=>{f.x=clamp(f.x,bounds.x0,bounds.x1);f.y=clamp(f.y,bounds.y0,bounds.y1);});
}
function smoothClosed(c,pts){
  const n=pts.length,m=i=>({x:(pts[i].x+pts[(i+1)%n].x)/2,y:(pts[i].y+pts[(i+1)%n].y)/2});
  let s=m(n-1);c.moveTo(s.x,s.y);
  for(let i=0;i<n;i++){const e=m(i);c.quadraticCurveTo(pts[i].x,pts[i].y,e.x,e.y);}
  c.closePath();
}
function rockPath(c,x,y,r,seed){
  const pts=[],n=9;for(let i=0;i<n;i++){const a=i/n*TAU,j=.82+.22*Math.sin(seed*7.3+i*2.1)*Math.cos(seed+i);pts.push({x:x+Math.cos(a)*r*j*1.1,y:y+Math.sin(a)*r*j*.9});}
  c.beginPath();smoothClosed(c,pts);
}
function drawRock(c,x,y,r,seed){
  c.save();
  // 바위 둘레 물거품
  c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=3*U;c.setLineDash([10*U,8*U]);c.beginPath();c.ellipse(x,y,r*1.32,r*1.15,0,0,TAU);c.stroke();c.setLineDash([]);
  c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=2*U;c.beginPath();c.ellipse(x,y,r*1.55,r*1.35,0,0,TAU);c.stroke();
  c.shadowColor='rgba(0,70,110,.4)';c.shadowBlur=16*U;c.shadowOffsetX=7*U;c.shadowOffsetY=11*U;
  rockPath(c,x,y,r,seed);
  const g=c.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r*1.2);g.addColorStop(0,'#f1fbfb');g.addColorStop(.5,'#b9d9de');g.addColorStop(1,'#7ba6b4');
  c.fillStyle=g;c.fill();c.shadowColor='transparent';
  c.save();rockPath(c,x,y,r,seed);c.clip();
  c.fillStyle='rgba(110,225,180,.75)';c.beginPath();c.ellipse(x+r*.35,y+r*.3,r*.55,r*.32,.5,0,TAU);c.fill();
  c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.ellipse(x-r*.3,y-r*.35,r*.3,r*.16,-.5,0,TAU);c.fill();
  c.restore();c.restore();
}
function buildScene(){
  scene=document.createElement('canvas');scene.width=Math.round(W*DPR);scene.height=Math.round(H*DPR);
  const c=scene.getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);
  // 바위
  const R=[[.06,.90,34,1],[.135,.955,24,2],[.935,.885,36,3],[.865,.965,26,4],[.035,.07,42,5],[.075,.15,24,6],[.965,.10,36,7],[.93,.17,22,8],[.012,.50,26,9],[.99,.46,28,10]];
  R.forEach(r=>drawRock(c,W*r[0],H*r[1],r[2]*U,r[3]));
  // 부두 그림자 + 판자
  const px=pier.x,py=pier.y,pw=pier.w,ph=H-py+10;
  c.save();c.shadowColor='rgba(0,70,110,.4)';c.shadowBlur=26*U;c.shadowOffsetY=12*U;c.shadowOffsetX=4*U;
  c.fillStyle='#e9c690';c.beginPath();c.roundRect?c.roundRect(px,py,pw,ph,[16*U,16*U,0,0]):c.rect(px,py,pw,ph);c.fill();c.restore();
  c.save();c.beginPath();c.roundRect?c.roundRect(px,py,pw,ph,[16*U,16*U,0,0]):c.rect(px,py,pw,ph);c.clip();
  const pl=26*U;let k=0;
  for(let y=py;y<H+pl;y+=pl,k++){
    c.fillStyle=k%2?'#f7e1b6':'#f1d6a2';c.fillRect(px,y,pw,pl-2*U);
    c.fillStyle='rgba(150,100,50,.22)';c.fillRect(px,y+pl-3*U,pw,3*U);
    c.fillStyle='rgba(255,255,255,.28)';c.fillRect(px,y,pw,2*U);
    c.fillStyle='rgba(120,80,40,.35)';c.beginPath();c.arc(px+9*U,y+pl*.45,2*U,0,TAU);c.arc(px+pw-9*U,y+pl*.45,2*U,0,TAU);c.fill();
    // 나뭇결
    c.strokeStyle='rgba(160,110,60,.18)';c.lineWidth=1;c.beginPath();
    const o=(k*53)%90;c.moveTo(px+30*U+o,y+8*U);c.lineTo(px+90*U+o,y+10*U);c.moveTo(px+pw*.55+o*.4,y+16*U);c.lineTo(px+pw*.8,y+15*U);c.stroke();
  }
  c.restore();
  // 말뚝(물과 맞닿은 부분)
  [[px+9*U,py+16*U],[px+pw-9*U,py+16*U]].forEach(([x,y])=>{
    c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=3*U;c.beginPath();c.arc(x,y,17*U,0,TAU);c.stroke();
    const g=c.createRadialGradient(x-3,y-3,1,x,y,12*U);g.addColorStop(0,'#f6dcae');g.addColorStop(1,'#b98650');
    c.fillStyle=g;c.beginPath();c.arc(x,y,12*U,0,TAU);c.fill();
    c.strokeStyle='rgba(120,70,30,.4)';c.lineWidth=1.2;c.beginPath();c.arc(x,y,6*U,0,TAU);c.stroke();
  });
  // 양동이
  const bx=px+36*U,by=H-44*U;
  c.fillStyle='rgba(0,60,90,.25)';c.beginPath();c.ellipse(bx+5*U,by+8*U,20*U,17*U,0,0,TAU);c.fill();
  c.fillStyle='#3aa9e8';c.beginPath();c.arc(bx,by,18*U,0,TAU);c.fill();
  c.fillStyle='#8be0ff';c.beginPath();c.arc(bx,by,12.5*U,0,TAU);c.fill();
  c.strokeStyle='#fff';c.lineWidth=2*U;c.beginPath();c.arc(bx,by,18*U,0,TAU);c.stroke();
  c.fillStyle='rgba(255,255,255,.6)';c.beginPath();c.ellipse(bx-4*U,by-4*U,5*U,2.5*U,-.6,0,TAU);c.fill();
  // 랜턴(밤에 빛남)
  const lx=px+pw-34*U,ly=py+40*U;
  c.fillStyle='rgba(0,60,90,.25)';c.beginPath();c.arc(lx+3*U,ly+5*U,10*U,0,TAU);c.fill();
  c.fillStyle='#fff7d6';c.beginPath();c.arc(lx,ly,8*U,0,TAU);c.fill();
  c.strokeStyle='#3d6f86';c.lineWidth=2.5*U;c.beginPath();c.arc(lx,ly,9*U,0,TAU);c.stroke();
  pier.lx=lx;pier.ly=ly;
  // 나뭇잎 그림자 스프라이트(1회)
  if(!leafSprite){
    leafSprite=document.createElement('canvas');leafSprite.width=leafSprite.height=300;
    const s=leafSprite.getContext('2d');s.shadowColor='rgba(0,40,70,.9)';s.shadowBlur=14;s.shadowOffsetX=1000;
    s.fillStyle='#000';s.strokeStyle='#000';
    const L=(x,y,a,r)=>{s.beginPath();s.ellipse(x-1000,y,r*1.6,r*.62,a,0,TAU);s.fill();};
    s.lineWidth=5;s.beginPath();s.moveTo(20-1000,260);s.quadraticCurveTo(120-1000,170,250-1000,70);s.stroke();
    [[70,215,-.6,34],[120,180,-1.2,40],[160,150,.3,38],[200,105,-.7,36],[235,70,-.2,30],[100,235,.6,30],[165,205,.9,34],[215,150,.5,30]].forEach(l=>L(l[0],l[1],l[2],l[3]));
  }
  // 갈대 무더기
  clumps=[];
  const CL=[[0,.12,0],[0,.36,0],[0,.62,0],[1,.2,Math.PI],[1,.56,Math.PI],[1,.76,Math.PI],[.12,0,Math.PI/2],[.34,0,Math.PI/2],[.82,0,Math.PI/2],[.62,0,Math.PI/2]];
  CL.forEach(([fx,fy,dir],i)=>{
    const cx=fx*W+(fx===0?-6:fx===1?6:0),cy=fy*H+(fy===0?-6:0);
    const bl=[];const n=8+(i%3)*2;
    for(let k=0;k<n;k++){bl.push({a:dir+rand(-1.25,1.25),len:rand(70,150)*U,w:rand(2.5,4.5)*U,ph:rand(0,TAU),sp:rand(.6,1.2),col:pick(['#9aeab0','#6fdc9f','#46c995','#7fe3b8']),head:Math.random()<.2});}
    clumps.push({x:cx,y:cy,bl});
  });
}
function initEnv(){
  // 연잎, 낙엽
  pads=[];for(let i=0;i<6;i++){pads.push({x:rand(bounds.x0+40,bounds.x1-40),y:rand(bounds.y0+30,bounds.y1-90),r:rand(20,32)*U,rot:rand(0,TAU),vr:rand(-.05,.05),vx:rand(-3,3),vy:rand(-2,2),flower:Math.random()<.4,ph:rand(0,TAU)});}
  leaves=[];for(let i=0;i<7;i++){leaves.push({x:rand(0,W),y:rand(0,H*.8),r:rand(8,14)*U,rot:rand(0,TAU),vr:rand(-.4,.4),vx:rand(4,12),vy:rand(-3,3),col:pick(['#dff58a','#b6ec7a','#f6e98a'])});}
  glints=[];for(let i=0;i<40;i++)glints.push({x:rand(0,W),y:rand(0,H*.85),ph:rand(0,TAU),sp:rand(.8,2.4),sz:rand(5,11)*U});
  motes=[];for(let i=0;i<36;i++)motes.push({x:rand(0,W),y:rand(0,H),vx:rand(-6,6),vy:rand(-8,2),ph:rand(0,TAU),sz:rand(1.2,2.8)*U,fire:i%2===0});
  rainD=[];for(let i=0;i<170;i++)rainD.push({x:rand(0,W),y:rand(-H,H),v:rand(900,1300),len:rand(14,26),ly:rand(H*.1,H*.85)});
  leafSh=[];for(let i=0;i<5;i++)leafSh.push({x:[.08,.3,.7,.93,.5][i]*W,y:[.05,-.02,.02,.1,-.04][i]*H+ (i%2?20:0),s:rand(1,1.5)*U,rot:rand(0,TAU),ph:rand(0,TAU)});
  if(!capPat){
    const t=document.createElement('canvas');t.width=t.height=128;const c=t.getContext('2d');const id=c.createImageData(128,128);
    for(let y=0;y<128;y++)for(let x=0;x<128;x++){
      const u=x/128*TAU,v=y/128*TAU;
      const a=Math.sin(2*u+1.3*Math.sin(2*v)),b=Math.sin(2*v+1.3*Math.sin(3*u));
      const l=Math.pow(1-Math.abs(a+b)*.5,7);const i=(y*128+x)*4;
      id.data[i]=255;id.data[i+1]=255;id.data[i+2]=255;id.data[i+3]=Math.min(255,l*255);
    }
    c.putImageData(id,0,0);capPat=ctx.createPattern(t,'repeat');
  }
}

function addRipple(x,y,maxR,a=.6,lw=1.6,sp=1){if(ripples.length>70)ripples.shift();ripples.push({x,y,r:2,maxR,a,lw,sp:maxR*1.05*sp});}
function splash(x,y,n=12,pw=1){
  for(let i=0;i<n&&drops.length<180;i++){const a=rand(0,TAU),s=rand(30,110)*pw*U;
    drops.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s*.6,z:0,vz:rand(120,300)*pw,size:rand(1.6,3.6)*U});}
  addRipple(x,y,52*pw*U,.75);addRipple(x,y,84*pw*U,.4,1.2,.8);
}
function star(x,y,col,n=10,spd=160,life=.9){
  for(let i=0;i<n&&sparks.length<160;i++){const a=rand(0,TAU),s=rand(.3,1)*spd*U;
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life,max:life,col:Array.isArray(col)?pick(col):col,size:rand(4,9)*U,rot:rand(0,TAU),vr:rand(-6,6)});}
}
function floater(x,y,txt,col='#fff',size=24,life=1.1){if(floaters.length>12)floaters.shift();floaters.push({x,y,txt,col,size:size*U,life,max:life});}
let toastTm=0;

/* ---------------- 물고기 ---------------- */
function makeFish(sp,x,y,a,enter=false){
  return{id:++fid,sp,x,y,a,v:sp.speed*U*.5,state:'wander',t:0,tx:x,ty:y,tw:0,phase:rand(0,TAU),amp:.6,cool:0,nibbles:0,nt:0,orb:rand(0,TAU),orbDir:Math.random()<.5?1:-1,
    rel:rand(.92,1.1),vis:.4,hold:0,t2:0,leader:null,enter,leave:false,wake:0};
}
function spawnAtEdge(sp){
  const side=Math.floor(Math.random()*4);let x,y,a;
  if(side===0){x=bounds.x0-40;y=rand(bounds.y0,bounds.y1);a=rand(-.5,.5);}
  else if(side===1){x=bounds.x1+40;y=rand(bounds.y0,bounds.y1);a=Math.PI+rand(-.5,.5);}
  else if(side===2){x=rand(bounds.x0,bounds.x1);y=bounds.y0-40;a=Math.PI/2+rand(-.5,.5);}
  else{x=rand(bounds.x0,bounds.x1);y=bounds.y1+30;a=-Math.PI/2+rand(-.5,.5);}
  spawnSpecies(sp,x,y,a,true);
}
function spawnSpecies(sp,x,y,a,enter){
  if(sp.school){const lead=makeFish(sp,x,y,a,enter);fishes.push(lead);
    for(let i=0;i<2;i++){const f=makeFish(sp,x+rand(-30,30),y+rand(-30,30),a,enter);f.leader=lead;fishes.push(f);}}
  else fishes.push(makeFish(sp,x,y,a,enter));
}
function spawnInitial(){
  fishes=[];
  // 처음에 보통 어종 1마리는 보장
  const sp0=pick([SP_BY_ID.catfish,SP_BY_ID.bass]);
  spawnSpecies(sp0,rand(bounds.x0+60,bounds.x1-60),rand(bounds.y0+40,bounds.y1-120),rand(0,TAU),false);
  let guard=0;while(fishes.length<7&&guard++<20){spawnSpecies(pickSpecies(),rand(bounds.x0+40,bounds.x1-40),rand(bounds.y0+40,bounds.y1-80),rand(0,TAU),false);}
}
const fLen=f=>f.sp.L*f.rel*U*1.1;
function engagedCount(){return fishes.filter(f=>f.state==='interest'||f.state==='nibble').length;}

function updateFish(f,dt){
  const sp=f.sp,sU=sp.speed*U;f.t+=dt;f.cool=Math.max(0,f.cool-dt);
  const bob=(bobber&&bobber.mode==='water'&&phase!=='catch'&&phase!=='miss')?bobber:null;
  let want=f.a,speed=0,turn=2.4;
  const dB=bob?dist(f.x,f.y,bob.x,bob.y):1e9;
  switch(f.state){
    case 'wander':{
      f.tw-=dt;
      if(f.leave){f.tx=f.x<W/2?-160:W+160;f.ty=f.y;}
      else if(f.leader&&fishes.includes(f.leader)&&f.leader.state==='wander'){
        f.tx=f.leader.x-Math.cos(f.leader.a)*24*U+Math.sin(f.id)*26*U;f.ty=f.leader.y-Math.sin(f.leader.a)*24*U+Math.cos(f.id)*26*U;
      }else{
        if(f.leader&&!fishes.includes(f.leader))f.leader=null;
        if(f.tw<=0||dist(f.x,f.y,f.tx,f.ty)<30*U){
          f.tw=rand(2.5,6);
          if(bob&&f.cool<=0&&Math.random()<.45){const a=rand(0,TAU),r=rand(70,230)*U;f.tx=bob.x+Math.cos(a)*r;f.ty=bob.y+Math.sin(a)*r;}
          else{f.tx=rand(bounds.x0+30,bounds.x1-30);f.ty=rand(bounds.y0+30,bounds.y1-30);}
          f.tx=clamp(f.tx,bounds.x0+20,bounds.x1-20);f.ty=clamp(f.ty,bounds.y0+20,bounds.y1-20);
        }
      }
      want=Math.atan2(f.ty-f.y,f.tx-f.x);speed=sU*(f.leader?.8:.55);turn=2.2;
      if(f.enter)speed=sU*.7;
      if(bob&&f.cool<=0&&!f.leave&&dB<sp.detect*U&&engagedCount()<2&&phase==='wait'&&Math.random()<dt*1.2){f.state='interest';f.t2=0;}
      break;}
    case 'interest':{
      f.t2+=dt;want=Math.atan2(bob?bob.y-f.y:0,bob?bob.x-f.x:1);speed=sU*1.2;turn=4;
      if(!bob||phase!=='wait'||f.t2>7||dB>sp.detect*U*1.7){f.state='wander';f.cool=2;f.tw=0;break;}
      if(dB<30*U){f.state='nibble';f.orb=Math.atan2(f.y-bob.y,f.x-bob.x);f.nibbles=0;f.nt=rand(.5,.9);}
      break;}
    case 'nibble':{
      if(!bob||phase!=='wait'){f.state='wander';f.cool=2;f.tw=0;break;}
      f.orb+=f.orbDir*dt*1.5;
      const ox=bob.x+Math.cos(f.orb)*34*U,oy=bob.y+Math.sin(f.orb)*34*U;
      want=Math.atan2(oy-f.y,ox-f.x);speed=Math.min(sU*.9,dist(f.x,f.y,ox,oy)*3+10);turn=5;
      f.nt-=dt;
      if(f.nt<=0){
        f.nibbles++;f.nt=rand(.6,1.2);bob.dip=1;addRipple(bob.x,bob.y,34*U,.55,1.3);sfx('nibble');
        const p=sp.bite+f.nibbles*.12;
        if(!biter&&Math.random()<p)startBite(f);
        else if(f.nibbles>=3){f.state='wander';f.cool=7;f.tw=0;}
      }
      break;}
    case 'bite':{
      if(bob){f.x+=(bob.x-f.x)*Math.min(1,dt*10);f.y+=(bob.y-f.y)*Math.min(1,dt*10);}
      f.hold-=RDT;f.amp=1.2;f.phase+=dt*18;
      if(f.hold<=0)biteMissed(f);
      return;}
    case 'fight':return; // updateFight 에서 처리
    case 'caught':return;
    case 'flee':{
      f.t2+=dt;speed=sU*2.6;turn=6;want=f.a;
      if(f.t2>1.8){f.state='wander';f.cool=Math.max(f.cool,9);f.tw=0;}
      break;}
  }
  const da=angDiff(f.a,want);f.a+=clamp(da,-turn*dt,turn*dt);
  f.v=lerp(f.v,speed,Math.min(1,dt*3));
  f.x+=Math.cos(f.a)*f.v*dt;f.y+=Math.sin(f.a)*f.v*dt;
  f.phase+=dt*(4+f.v*.05);f.amp=clamp(.35+f.v/(sU||1)*.7,.3,1.8);
  // 경계 처리
  if(f.enter){if(f.x>bounds.x0&&f.x<bounds.x1&&f.y>bounds.y0&&f.y<bounds.y1)f.enter=false;}
  else if(!f.leave){
    if(f.x<bounds.x0){f.x=bounds.x0;f.a=Math.PI-f.a;}if(f.x>bounds.x1){f.x=bounds.x1;f.a=Math.PI-f.a;}
    if(f.y<bounds.y0){f.y=bounds.y0;f.a=-f.a;}if(f.y>bounds.y1){f.y=bounds.y1;f.a=-f.a;}
  }
  if(f.leave&&(f.x<-120||f.x>W+120)){f.dead=true;}
  // 물살
  if(f.v>sU*1.05){f.wake-=dt;if(f.wake<=0){f.wake=.28;addRipple(f.x,f.y,26*U,.35,1.1);}}
  // 시야 투명도 (찌 근처에서 선명)
  let tv=.34;if(bob&&dB<sp.detect*U*1.4)tv=.62;if(f.state==='interest'||f.state==='nibble')tv=1;
  tv*=1-env.n*.18;
  f.vis=lerp(f.vis,tv,Math.min(1,dt*3));
}

/* ---------------- 투척/찌 ---------------- */
function cast(tx,ty){
  tx=clamp(tx,bounds.x0,bounds.x1);ty=clamp(ty,bounds.y0,bounds.y1);
  const minD=150*U;let d=dist(rod.bx,rod.by,tx,ty);
  if(d<minD){const a=Math.atan2(ty-rod.by,tx-rod.bx);tx=rod.bx+Math.cos(a)*minD;ty=rod.by+Math.sin(a)*minD;d=minD;ty=Math.max(ty,bounds.y0);}
  const sx=bobber&&bobber.mode==='water'?bobber.x:tip.x,sy=bobber&&bobber.mode==='water'?bobber.y:tip.y;
  const dd=dist(sx,sy,tx,ty);
  bobber={mode:'air',sx,sy,tx,ty,u:0,dur:.5+dd/1500,x:sx,y:sy,h:0,hmax:60*U+dd*.26,sink:0,dip:0,t:0};
  fishes.forEach(f=>{if(f.state==='interest'||f.state==='nibble'){f.state='wander';f.cool=2;f.tw=0;}});
  phase='cast';sfx('cast');waitT=0;
}
function landBobber(){
  bobber.mode='water';bobber.h=0;bobber.x=bobber.tx;bobber.y=bobber.ty;
  splash(bobber.x,bobber.y,16,1);sfx('splash');phase='wait';waitT=0;
  // 착수 소리에 놀란 물고기
  fishes.forEach(f=>{if(dist(f.x,f.y,bobber.x,bobber.y)<55*U&&f.state==='wander'){f.cool=6;}});
  if(!hintShown){hintShown=true;toast('찌가 가라앉으며 “!”가 뜨면 바로 탭!',2600);}
}
function startBite(f){
  biter=f;f.state='bite';f.hold=f.sp.hook*1.2;phase='bite';bubbleT=0;
  if(bobber)bobber.dip=1;
  fishes.forEach(o=>{if(o!==f&&(o.state==='interest'||o.state==='nibble')){o.state='wander';o.cool=3;o.tw=0;}});
  sfx('bite');vibrate([30,40,30]);shake=Math.max(shake,5);flash=.35;zoom=.06;

function biteMissed(f){

  phase='wait';waitT=0;sfx('miss');floater(bobber?bobber.x:f.x,(bobber?bobber.y:f.y)-30*U,'놓쳤어요…','#ffffff',24);
  addRipple(f.x,f.y,50*U,.5);

function hook(){

  sfx('hook');vibrate(50);slowT=.3;flash=.5;shake=9;zoom=.07;
  splash(f.x,f.y,22,1.3);floater(f.x,f.y-34*U,'걸렸다!','#ffd166',32);
  toast(mode===1?'초록 링일 때 탭! 빨강일 땐 참아요':mode===2?'꾹 눌러 초록 막대를 물고기에 맞춰요':'화살표 반대 방향으로 스와이프!',3200);

/* ---------------- 파이팅 (3가지 모드) ---------------- */
const DIRV={L:[-1,0],R:[1,0],U:[0,-1],D:[0,1]},OPP={L:'R',R:'L',U:'D',D:'U'},DARROW={L:'←',R:'→',U:'↑',D:'↓'};
function startFight(f){
  const D0=dist(rod.bx,rod.by,f.x,f.y);
  fight={f,fat:100,ten:15,t:0,combo:0,D0,minD:Math.min(150*U,D0*.55),baseAng:Math.atan2(f.y-rod.by,f.x-rod.bx),ph0:rand(0,TAU),
    off:{x:0,y:0},offT:{x:0,y:0},pullOff:0,spl:.3,warnT:0,thr:.6,
    // 모드1
    ph:'pull',pt:.9,ptTot:.9,
    // 모드2
    fishPos:.5,fTarget:.5,fT:.5,barPos:.6,barV:0,
    // 모드3
    dir:pick(['L','R','U']),dtm:1.4,
    good:0};
  f.state='fight';
}
function fightHit(good,txt,col,x,y){
  floater(x,y,txt,col,26,.8);sfx(good?'good':'bad');if(good){reelAng+=1.2;}
}
function updateFight(dt){
  const F=fight,f=F.f,pw=f.sp.power;F.t+=dt;
  if(mode===1){
    F.pt-=dt;
    if(F.pt<=0){
      if(F.ph==='pull'){F.ph='tired';F.ptTot=F.pt=clamp(1.7-pw*.24,.75,1.4);}
      else{F.ph='pull';F.ptTot=F.pt=.9+pw*.22;}
    }
    if(F.ph==='pull'){F.ten+=dt*(4+pw*3.2);F.fat+=dt*2.2;F.offT.x=0;F.offT.y=0;F.pullOffT=44*U;}
    else{F.ten-=dt*14;F.pullOffT=0;}
    F.pullOff+=((F.pullOffT||0)-F.pullOff)*Math.min(1,dt*4);
    F.thr=F.ph==='pull'?.9:.35;
  }else if(mode===2){
    // 물고기 마커
    F.fT-=dt;if(F.fT<=0){F.fT=rand(.5,1.1)/(1+pw*.1);F.fTarget=clamp(F.fishPos+rand(-1,1)*(.22+pw*.1),.06,.94);}
    const sp2=.35+pw*.14;F.fishPos+=clamp(F.fTarget-F.fishPos,-sp2*dt,sp2*dt);
    // 플레이어 막대 (누르면 상승)
    const press=ptr.down.size>0;
    F.barV+=(press?-2.3:2.0)*dt;F.barV=clamp(F.barV,-1.1,1.1);F.barPos+=F.barV*dt;
    const bs=clamp(.30-.03*pw,.17,.3);
    if(F.barPos<bs/2){F.barPos=bs/2;F.barV=Math.abs(F.barV)*.25;}
    if(F.barPos>1-bs/2){F.barPos=1-bs/2;F.barV=-Math.abs(F.barV)*.25;}
    F.bs=bs;F.over=Math.abs(F.barPos-F.fishPos)<bs/2;
    if(F.over){F.fat-=dt*13;F.ten-=dt*14;}else{F.ten+=dt*(5+pw*2.2);F.fat+=dt*2;}
    F.offT.x=(F.fishPos-.5)*170*U;F.offT.y=0;F.thr=F.over?.4:.9;
  }else{
    F.dtm-=dt;
    if(F.dtm<=0){let d;do{d=pick(['L','R','U','D']);}while(d===F.dir);F.dir=d;F.dtm=rand(1.1,1.8)*(1.15-pw*.08);sfx('warn');}
    F.ten+=dt*pw*4.2;
    const v=DIRV[F.dir];F.offT.x=v[0]*70*U;F.offT.y=v[1]*50*U;F.thr=.8;
  }
  F.ten-=dt*2.5;
  F.off.x+=(F.offT.x-F.off.x)*Math.min(1,dt*3);F.off.y+=(F.offT.y-F.off.y)*Math.min(1,dt*3);
  F.ten=clamp(F.ten,0,100);F.fat=clamp(F.fat,0,100);
  // 위치/자세
  const D=lerp(F.minD,F.D0,F.fat/100)+F.pullOff;
  const ang=F.baseAng+Math.sin(F.t*1.8+F.ph0)*.2*(.5+pw*.25)+Math.sin(F.t*4.1)*.05;
  let tx=clamp(rod.bx+Math.cos(ang)*D+F.off.x,bounds.x0,bounds.x1),ty=clamp(rod.by+Math.sin(ang)*D+F.off.y,bounds.y0,bounds.y1);
  const k=Math.min(1,dt*6);f.x+=(tx-f.x)*k;f.y+=(ty-f.y)*k;
  const toRod=Math.atan2(rod.by-f.y,rod.bx-f.x);
  f.a=toRod+Math.sin(F.t*9)*.55*F.thr;f.phase+=dt*(14+pw*3);f.amp=1.5+.6*F.thr;
  f.vis=lerp(f.vis,1,Math.min(1,dt*6));
  bobber.x=f.x;bobber.y=f.y;
  F.spl-=dt;if(F.spl<=0){F.spl=rand(.2,.45)/(.6+F.ten/100);splash(f.x,f.y,3+Math.floor(F.ten/25),.5);}
  reelAng+=dt*(3+F.ten/100*8);
  if(F.ten>=75){F.warnT-=RDT;if(F.warnT<=0){F.warnT=.45;sfx('warn');vibrate(25);}}
  if(F.ten>=100)snapLine();else if(F.fat<=0)startCatch();
}
function tapFight(x,y){
  const F=fight;if(!F)return;
  if(mode===1){
    if(F.ph==='tired'){F.fat-=9+Math.min(F.combo,8)*.7;F.ten-=6;F.combo++;fightHit(true,F.combo>2?F.combo+' 콤보!':'좋아요!','#a5ffd9',F.f.x,F.f.y-34*U);addRipple(F.f.x,F.f.y,40*U,.7);}
    else{F.ten+=16;F.combo=0;fightHit(false,'앗! 아직이에요','#ffb3b3',F.f.x,F.f.y-34*U);shake=Math.max(shake,4);vibrate(20);}
  }else if(mode===3){/* 탭은 pointerup 에서 스와이프/연타 판정 */}
}
function swipeFight(dir){
  const F=fight;if(!F||mode!==3)return;const f=F.f;
  if(dir==='tap'){F.fat-=2.4;F.ten+=3.2;reelAng+=.8;sfx('tick');return;}
  if(dir===OPP[F.dir]){F.fat-=13;F.ten-=11;F.combo++;fightHit(true,'굿!','#a5ffd9',f.x,f.y-34*U);splash(f.x,f.y,6,.7);}
  else if(dir===F.dir){F.ten+=14;F.combo=0;fightHit(false,'반대예요!','#ffb3b3',f.x,f.y-34*U);shake=Math.max(shake,4);vibrate(20);}
  else{F.fat-=4;F.ten+=2;sfx('tick');}
}
function snapLine(){
  const F=fight,f=F.f;
  snap={t:0,ax:tip.x,ay:tip.y,bx:f.x,by:f.y};
  f.state='flee';f.t2=0;f.cool=10;f.a=Math.atan2(f.y-rod.by,f.x-rod.bx);
  phase='miss';missT=1;fight=null;biter=null;
  bobber.mode='hidden';sfx('snap');vibrate([60,40,60]);shake=12;flash=.3;
  floater(f.x,f.y-30*U,'줄이 끊어졌어요!','#ff9a9a',28,1.4);splash(f.x,f.y,16,1);
}
function startCatch(){
  const F=fight,f=F.f,sp=f.sp;
  const cm=Math.round(lerp(sp.cm[0],sp.cm[1],Math.random()));
  const frac2=(cm-sp.cm[0])/(sp.cm[1]-sp.cm[0]||1);
  const pts=Math.round(sp.score*(.85+.4*frac2));
  catchAnim={f,t:0,dur:1.0,fx:f.x,fy:f.y,tx:rod.bx-8*U,ty:pier.y+30*U,cm,pts};
  f.state='caught';phase='catch';fight=null;biter=null;bobber.mode='hidden';
  sfx('catch');vibrate([40,30,80]);shake=10;flash=.4;
  splash(f.x,f.y,26,1.4);addRipple(f.x,f.y,110*U,.7);
}
function finishCatch(){
  const C=catchAnim,sp=C.f.sp;
  fishes=fishes.filter(f=>f!==C.f);
  score+=C.pts;sess[sp.id]=(sess[sp.id]||0)+1;
  const first=!dex[sp.id];
  const d=dex[sp.id]||(dex[sp.id]={count:0,max:0});d.count++;d.max=Math.max(d.max,C.cm);store.set('cwf_dex',dex);
  showCatch(sp,C.cm,C.pts,first);
  star(C.tx,C.ty-20*U,sp.rc===3?['#ffe27a','#fff2b0','#ffffff','#ffd166']:sp.rc===2?['#fff6b0','#ffffff','#9bf0ff']:['#ffffff','#bff6ff'],sp.rc===3?36:sp.rc===2?22:14,sp.rc===3?260:180,1.1);
  floater(C.tx,C.ty-36*U,'+'+C.pts,'#ffd166',34,1.3);
  catchAnim=null;phase='idle';bobber=null;
  topUpT=2.5;
}

/* ---------------- 이벤트(잠자리/물총새/물고기 점프) ---------------- */
const ev={dragon:null,bird:null,jumper:null,tD:rand(8,16),tB:rand(25,40),tJ:rand(5,10)};
function updateEvents(dt){
  ev.tD-=dt;if(ev.tD<=0&&!ev.dragon){ev.tD=rand(22,45);const l=Math.random()<.5;
    ev.dragon={x:l?-40:W+40,y:rand(H*.12,H*.5),vx:(l?1:-1)*rand(90,130)*U,t:0,ph:rand(0,TAU),hov:rand(2,4)};}
  if(ev.dragon){const d=ev.dragon;d.t+=dt;d.ph+=dt;const sp=Math.sin(d.t*.9);d.x+=d.vx*dt*(.4+.9*(1+Math.sin(d.t*1.3))/2);d.y+=Math.sin(d.t*2.2)*30*dt;
    if(d.x<-80||d.x>W+80)ev.dragon=null;}
  ev.tB-=dt;if(ev.tB<=0&&!ev.bird&&state==='play'){ev.tB=rand(40,70);const l=Math.random()<.5;
    ev.bird={x:l?-60:W+60,y:rand(H*.2,H*.5),dir:l?1:-1,t:0,z:150,dived:false,dp:rand(.35,.6)};}
  if(ev.bird){const b=ev.bird;b.t+=dt;b.x+=b.dir*230*U*dt;
    const dx=W*b.dp;const prog=(b.x-dx)*b.dir;
    if(!b.dived){b.z=lerp(b.z,prog>-150?10:150,Math.min(1,dt*3));if(prog>-10){b.dived=true;b.z=0;splash(b.x,b.y,18,1.1);sfx('splash');}}
    else{b.z=lerp(b.z,170,Math.min(1,dt*2.2));}
    if(b.x<-100||b.x>W+100)ev.bird=null;}
  ev.tJ-=dt;if(ev.tJ<=0&&!ev.jumper){ev.tJ=rand(7,16);
    let x,y,tries=0;do{x=rand(bounds.x0+60,bounds.x1-60);y=rand(bounds.y0+40,bounds.y1-80);tries++;}while(bobber&&bobber.mode==='water'&&dist(x,y,bobber.x,bobber.y)<140*U&&tries<10);
    const a=rand(0,TAU);ev.jumper={x,y,a,t:0,dur:.75};splash(x,y,8,.7);addRipple(x,y,60*U,.6);}
  if(ev.jumper){const j=ev.jumper;j.t+=dt;if(j.t>=j.dur){splash(j.x+Math.cos(j.a)*80*U,j.y+Math.sin(j.a)*80*U,12,.9);ev.jumper=null;}}
}

/* ---------------- 업데이트 ---------------- */
function updateWorld(rdt){
  clock+=rdt;
  slowT=Math.max(0,slowT-rdt);tsc=lerp(tsc,slowT>0?.28:1,Math.min(1,rdt*12));const dt=rdt*tsc;
  shake*=Math.pow(.001,rdt);if(shake<.05)shake=0;zoom*=Math.pow(.005,rdt);if(zoom<.001)zoom=0;flash=Math.max(0,flash-rdt*1.6);
  // 시간대
  frac=state==='play'?clamp((GAME_TIME-timeLeft)/GAME_TIME,0,1):state==='over'?frac:.3;
  env=getEnv(frac);
  // 날씨
  if(state==='play'){const el=GAME_TIME-timeLeft;if(!rain.done&&el>=rain.start){rain.on=true;if(el>=rain.start+rain.dur){rain.on=false;rain.done=true;}}}else rain.on=false;
  rain.k+=((rain.on?1:0)-rain.k)*Math.min(1,rdt*.8);AF.setRain(rain.k);
  // 찌
  if(bobber){
    bobber.t+=dt;
    if(bobber.mode==='air'){bobber.u+=dt/bobber.dur;const u=Math.min(1,bobber.u);bobber.x=lerp(bobber.sx,bobber.tx,u);bobber.y=lerp(bobber.sy,bobber.ty,u);bobber.h=Math.sin(Math.PI*u)*bobber.hmax;if(bobber.u>=1)landBobber();}
    else if(bobber.mode==='water'){bobber.sink+=((phase==='bite'||phase==='fight'?1:0)-bobber.sink)*Math.min(1,dt*10);bobber.dip*=Math.pow(.02,dt);}
  }
  if(state==='play'&&phase==='wait'){waitT+=dt;}
  // 물고기
  fishes.forEach(f=>updateFish(f,dt));
  if(fight)updateFight(dt);
  fishes=fishes.filter(f=>!f.dead);
  // 어종 교체 / 보충
  swapT-=dt;if(swapT<=0){swapT=rand(14,24);const c=fishes.filter(f=>f.state==='wander'&&f.cool<=0&&!f.leave&&!f.leader&&!fishes.some(o=>o.leader===f));if(c.length>3)pick(c).leave=true;}
  topUpT-=dt;if(topUpT<=0){topUpT=rand(2,4);const n=fishes.filter(f=>!f.leave).length;if(n<7&&fishes.length<10)spawnAtEdge(pickSpecies());}
  // 낚싯대 방향
  const tgt=bobber&&bobber.mode!=='hidden'?{x:bobber.x,y:bobber.y-(bobber.h||0)}:catchAnim?{x:catchAnim.fx,y:catchAnim.fy}:{x:W/2+Math.sin(clock*.8)*40,y:rod.by-300};
  const want=Math.atan2(tgt.y-rod.by,tgt.x-rod.bx);
  rodAng=rodAng===null?want:rodAng+angDiff(rodAng,want)*Math.min(1,rdt*7);
  const tn=fight?fight.ten/100:0,L=140*U*(1-tn*.06);
  tip={x:rod.bx+Math.cos(rodAng)*L,y:rod.by+Math.sin(rodAng)*L};
  // 포획 애니메이션
  if(catchAnim){
    const C=catchAnim,f=C.f;C.t+=dt;const u=Math.min(1,C.t/C.dur),e=u*u*(3-2*u);
    f.x=lerp(C.fx,C.tx,e);f.y=lerp(C.fy,C.ty,e);C.h=Math.sin(Math.PI*u)*190*U;
    f.a=Math.atan2(C.ty-C.fy,C.tx-C.fx)+Math.sin(C.t*18)*.5;f.phase+=dt*20;f.amp=2;
    if(u>=1)finishCatch();
  }
  if(snap){snap.t+=rdt;if(snap.t>1)snap=null;}
  if(phase==='miss'){missT-=rdt;if(missT<=0){phase='idle';bobber=null;}}
  // 파문/물방울/스파크
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];const k=r.r/r.maxR;r.r+=r.sp*(1-k*.7)*dt;if(r.r>=r.maxR)ripples.splice(i,1);}
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.vz-=720*dt;d.z+=d.vz*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.z<0){if(Math.random()<.25)addRipple(d.x,d.y,14*U,.4,1);drops.splice(i,1);}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=rdt;if(s.life<=0){sparks.splice(i,1);continue;}s.vy+=200*rdt;s.x+=s.vx*rdt;s.y+=s.vy*rdt;s.rot+=s.vr*rdt;}
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.life-=rdt;f.y-=36*rdt*U;if(f.life<=0)floaters.splice(i,1);}
  // 떠다니는 것들
  pads.forEach(p=>{p.x+=p.vx*dt+Math.sin(clock*.5+p.ph)*4*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    if(p.x<bounds.x0)p.vx=Math.abs(p.vx);if(p.x>bounds.x1)p.vx=-Math.abs(p.vx);if(p.y<bounds.y0)p.vy=Math.abs(p.vy);if(p.y>bounds.y1-60)p.vy=-Math.abs(p.vy);});
  leaves.forEach(l=>{l.x+=l.vx*dt;l.y+=l.vy*dt+Math.sin(clock+l.rot)*5*dt;l.rot+=l.vr*dt;if(l.x>W+30){l.x=-30;l.y=rand(0,H*.8);}});
  motes.forEach(m=>{m.x+=m.vx*dt+Math.sin(clock*.7+m.ph)*10*dt;m.y+=m.vy*dt;if(m.x<-10)m.x=W+10;if(m.x>W+10)m.x=-10;if(m.y<-10)m.y=H+10;if(m.y>H+10)m.y=-10;});
  updateEvents(dt);
  if(bubbleT<5)bubbleT+=rdt;
  // 비
  if(rain.k>.02){const n=Math.floor(rain.k*rainD.length);for(let i=0;i<n;i++){const r=rainD[i];r.y+=r.v*dt;r.x-=r.v*.12*dt;
    if(r.y>=r.ly){if(ripples.length<60&&Math.random()<.6)addRipple(r.x,r.ly,rand(14,26)*U,.45,1);r.y=-30;r.x=rand(0,W*1.1);r.ly=rand(H*.05,H*.9);}}}
}
function updatePlay(rdt){
  timeLeft-=rdt;
  if(timeLeft<=0){timeLeft=0;endGame();}
}

/* ---------------- 입력 ---------------- */
function onDown(e){
  if(state!=='play'||paused)return;
  AF.init();
  const r=cv.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
  ptr.down.add(e.pointerId);if(ptr.id===null||ptr.down.size===1){ptr.id=e.pointerId;ptr.x=ptr.sx=x;ptr.y=ptr.sy=y;ptr.st=performance.now();ptr.trail=[{x,y}];}
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(phase==='idle'||phase==='wait'){if(y<pier.y-10*U||phase==='wait'&&y<bounds.y1+20)cast(x,y);}
  else if(phase==='bite')hook();
  else if(phase==='fight')tapFight(x,y);
  if(phase!=='fight')addRipple(x,y,34*U,.4,1.2);
}
function onMove(e){
  if(!ptr.down.has(e.pointerId))return;
  const r=cv.getBoundingClientRect();ptr.x=e.clientX-r.left;ptr.y=e.clientY-r.top;
  if(e.pointerId===ptr.id){ptr.trail.push({x:ptr.x,y:ptr.y});if(ptr.trail.length>24)ptr.trail.shift();}
}
function onUp(e){
  if(!ptr.down.has(e.pointerId))return;ptr.down.delete(e.pointerId);
  if(state==='play'&&phase==='fight'&&mode===3&&e.pointerId===ptr.id){
    const dx=ptr.x-ptr.sx,dy=ptr.y-ptr.sy;
    if(Math.hypot(dx,dy)<44*U)swipeFight('tap');
    else swipeFight(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'));
  }
  if(e.pointerId===ptr.id){ptr.id=null;ptr.trail=[];}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();onDown(e);});
cv.addEventListener('pointermove',onMove);
cv.addEventListener('pointerup',onUp);cv.addEventListener('pointercancel',onUp);
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------------- 그리기: 물고기 ---------------- */
function fishShape(sp,L,phase,amp){
  const N=13,P=[],A=[],B=[],Wd=L*sp.wr*.5;

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.save();

  if(zoom>0){const z=bobber&&bobber.mode==='water'?bobber:{x:W/2,y:H/2};ctx.translate(z.x,z.y);ctx.scale(1+zoom,1+zoom);ctx.translate(-z.x,-z.y);}
  drawWater();drawCaustics();drawGlints();drawLeafShadows();
  // 수면 아래
  fishes.forEach(f=>{if(f.state!=='caught')drawFishWorld(f);});
  drawRipples();
  pads.forEach(drawPad);leaves.forEach(drawLeaf);
  ctx.drawImage(scene,0,0,W,H);
  drawReeds();
  // 줄/찌/낚싯대
  const tn=fight?fight.ten/100:phase==='bite'?.15:.04;
  if(snap){const s=snap,k=s.t,mx=(s.ax+s.bx)/2,my=(s.ay+s.by)/2;ctx.save();ctx.strokeStyle='rgba(255,255,255,'+(1-k)+')';ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(s.ax,s.ay);ctx.quadraticCurveTo(lerp(s.ax,mx,k)+Math.sin(k*30)*10,lerp(s.ay,my,k)+10,lerp(s.ax,mx,k*1.1),lerp(s.ay,my,k*1.1)+20*k);
    ctx.moveTo(s.bx,s.by);ctx.lineTo(lerp(s.bx,mx,k)+Math.cos(k*25)*6,lerp(s.by,my,k)-8*k);ctx.stroke();ctx.restore();}

  else if(catchAnim){drawLineTo(catchAnim.f.x,catchAnim.f.y-(catchAnim.h||0),.3,true);}
  drawPlayer();drawRod(tn);drawBobber();
  // 잡혀 올라오는 물고기 (가장 위)
  if(catchAnim){const f=catchAnim.f,h=catchAnim.h||0,sc=1+h/230,L=fLen(f)*sc,S=fishShape(f.sp,L,f.phase,f.amp);
    ctx.save();ctx.translate(f.x+10*U,f.y+14*U);ctx.rotate(f.a);drawFishShadow(ctx,S,f.phase,f.amp,.8);ctx.restore();
    ctx.save();ctx.translate(f.x,f.y-h);ctx.rotate(f.a);drawFishBody(ctx,S,f.sp,f.phase,f.amp,1,clock);ctx.restore();}
  drawGauges();drawBubble();drawFlyers();drawTrail();drawParticles();
  ctx.restore();
  drawOverlays();
}
