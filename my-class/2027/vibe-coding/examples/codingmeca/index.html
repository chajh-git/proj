<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>코딩메카</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07090f; font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }
    canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #9fb3c8; font-size: 14px; pointer-events: none; }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="ui"></div>
  <div id="boot">불러오는 중…</div>
  <noscript>이 게임은 자바스크립트가 필요합니다.</noscript>
  <script type="module">
    // 로비: 입장 → 로그인/가입 → 역할에 따라 이동. 뒤 배경은 격납고 장면을 그대로 씁니다.
    import { createAppShell } from './web/core/app-shell.js';
    import { createAdapter, setPartViewAdapter } from './web/render/part-view-adapter.js';
    import { createHangarScene } from './web/scenes/hangar-scene.js';
    import { createSupabaseClient } from './web/core/supabase-client.js';
    import { rememberSession } from './web/core/session.js';
    import { createAuthUI } from './web/ui/auth-ui.js';

    const boot = document.getElementById('boot');
    try {
      setPartViewAdapter(await createAdapter());
      const shell = createAppShell({ canvas: document.getElementById('scene'), uiRoot: document.getElementById('ui'), spaceId: 'hangar' });
      shell.registerScene('hangar', createHangarScene);
      const client = await createSupabaseClient();
      rememberSession(shell.store, client);
      await shell.start();
      boot.remove();
      createAuthUI({ root: document.getElementById('ui'), client, store: shell.store, router: shell.router, audio: shell.audio });
      window.codingmeca = { shell, client };
    } catch (err) {
      console.error(err);
      boot.textContent = '불러오지 못했습니다. 새로고침(F5) 해 주세요. (' + (err && err.message ? err.message : err) + ')';
    }
  </script>
</body>
</html>
