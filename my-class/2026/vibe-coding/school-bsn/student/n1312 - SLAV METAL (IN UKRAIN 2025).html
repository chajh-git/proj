sc.add(new T.HemisphereLight(0xf0f4f8,0x8a7e70,1.9));const sun=new T.DirectionalLight(0xfff4e0,1.4);sun.position.set(50,80,30);sc.add(sun);
const matC={},mat=c=>matC[c]||(matC[c]=new T.MeshLambertMaterial({color:c,castShadow:true})),pick=l=>l[Math.random()*l.length|0],rnd=(a,b)=>a+Math.random()*(b-a);

const CL=[
{n:'소총수',w:'AK-74M',d:'5.45×39mm 만능 돌격소총. 수류탄 2',mag:30,res:150,cd:.1,dmg:24,auto:1,rl:2,sp:.012,hp:100,spd:5,gr:2,kit:0},

{n:'대전차병',w:'RPG-7',d:'로켓 폭발 범위피해. 재장전 느림',mag:1,res:6,cd:1,dmg:220,auto:0,rl:2.6,sp:0,hp:100,spd:4.6,gr:1,kit:0,rk:1},

let W,walls=[],cols=[],blocked,F;
function box(x,z,w,d,h,m,y0=0,solid=true,ry=0){const b=new T.Mesh(new T.BoxGeometry(w,h,d),m);b.position.set(x,y0+h/2,z);b.rotation.y=ry;W.add(b);if(solid){walls.push(b);cols.push([x-w/2,x+w/2,z-d/2,z+d/2,y0+h])}return b}
function cyl(x,y,z,r,l,m,rx=0,rz=0){const c=new T.Mesh(new T.CylinderGeometry(r,r,l,7),m);c.position.set(x,y,z);c.rotation.set(rx,0,rz);W.add(c);return c}
function newWorld(fog,gt){if(W)sc.remove(W);W=new T.Group();sc.add(W);walls=[];cols=[];AMB=[];MN=[];sc.fog=new T.Fog(fog,90,260);sc.background=tex(x=>{const gr=x.createLinearGradient(0,0,0,128);gr.addColorStop(0,'#4f6b8c');gr.addColorStop(1,'#'+fog.toString(16).padStart(6,'0'));x.fillStyle=gr;x.fillRect(0,0,128,128)},1,1);
 GT=gt;gt.repeat.set(gt.repeat.x*1.85,gt.repeat.y*1.85);CR=[];MK=null;AMP=[1,.6,.5][curMap]}
function rubble0(){}
function crater(x,z,r){CR.push({x,z,r})}
function crater_old(x,z,r){const c=cyl(x,.03,z,r,.06,mat(0x2e2519));c.scale.y=1;const t=new T.Mesh(new T.TorusGeometry(r,.25,5,14),mat(0x4a3b29));t.rotation.x=Math.PI/2;t.position.set(x,.1,z);W.add(t)}
function tree(x,z){const m=mat(0x2a211a),y0=hgt(x,z);cyl(x,y0+2,z,.14,4,m);for(let i=0;i<4;i++){const a=rnd(0,6),b=cyl(x+Math.cos(a)*.5,y0+rnd(2.2,3.6),z+Math.sin(a)*.5,.04,1.4,m,0,Math.cos(a)*.9)}}
function wreck(x,z,ry){const m=mat(0x2b2b28),r=mat(0x4a2a18);const h=box(x,z,3.4,6,1.1,m,.3,true,0);box(x,z+.4,2.2,2.6,.8,m,1.4,false);cyl(x,1.8,z-2.8,.1,3.4,m,Math.PI/2);box(x-1.9,z,.5,6,.6,r,0,false);box(x+1.9,z,.5,6,.6,r,0,false)}
function wire(x0,x1,z){const m=new T.LineBasicMaterial({color:0x222222});for(let x=x0;x<x1;x+=3){cyl(x,.6,z,.04,1.2,mat(0x3a2f22))}for(let k=0;k<3;k++){const p=[];for(let x=x0;x<=x1;x+=.8)p.push(new T.Vector3(x,.3+k*.3+Math.random()*.15,z+Math.random()*.4-.2));W.add(new T.Line(new T.BufferGeometry().setFromPoints(p),m))}}
function dec(w,h,d,x,y,z,c){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);W.add(m);return m}
function facR(w,h,t){return tex(x=>{if(t==1){speck(x,'#8c4a38',30);x.fillStyle='#00000030';for(let j=0;j<128;j+=8){x.fillRect(0,j,128,1);for(let i=((j/8)%2)*8;i<128;i+=16)x.fillRect(i,j,1,8)}}else{speck(x,'#cfc9b8',22);x.fillStyle='#00000028';x.fillRect(0,0,128,2);x.fillRect(0,63,128,2);x.fillRect(63,0,2,128)}
 for(let i=0;i<2;i++)for(let j=0;j<2;j++){const X=10+i*64,Y=12+j*64;x.fillStyle=t==1?'#e8dcc0':'#f4f4f0';x.fillRect(X-3,Y-3,36,42);x.fillStyle=Math.random()<.25?pick(['#c8a040','#a04040','#4060a0']):'#1a2228';x.fillRect(X,Y,30,36);x.fillStyle='#f4f4f0';x.fillRect(X+14,Y,2,36);x.fillRect(X,Y+16,30,2);if(t==0&&j==0){x.fillStyle='#8a8a82';x.fillRect(X-4,Y+40,38,5)}}},Math.max(1,Math.round(w/8)),Math.max(1,Math.round(h/6)))}
const WOODS={};function wood(){const c=pick(['#8a5a30','#6a7a8a','#5a7a4a','#9a6a3a']);return WOODS[c]||(WOODS[c]=new T.MeshLambertMaterial({map:tex(x=>{speck(x,c,35);x.fillStyle='#0003';for(let i=0;i<128;i+=10)x.fillRect(i,0,1,128)},2,1)}))}
function building(gx,gz,w,d,h,base){const t=Math.random()<.3?1:0,sm=new T.MeshLambertMaterial({map:facR(w,h,t)}),sd=new T.MeshLambertMaterial({map:facR(d,h,t)}),rf=mat(0x4a4640),b=new T.Mesh(new T.BoxGeometry(w,h,d),[sd,sd,rf,rf,sm,sm]);b.position.set(gx,h/2,gz);W.add(b);walls.push(b);cols.push([gx-w/2,gx+w/2,gz-d/2,gz+d/2,h]);const zf=gz+d/2;
 if(t==0){dec(w+.3,.6,.3,gx,h+.3,zf,0x8a877e);dec(1,2.2,1,gx+w*.25,h+1.1,gz,0x7a7a72);cyl(gx-w*.3,h+2,gz,.02,2.4,mat(0x222222));for(let f=1;f<Math.min(3,h/3);f++)for(let i=0;i<2;i++)dec(1.8,.12,1,gx-w*.25+i*w*.5,f*3,zf+.5,0x77756e)}
 else{dec(w+.8,.5,d+.8,gx,h+.25,gz,0xe8dcc0);const hh=Math.min(5,h*.35),rf2=new T.Mesh(new T.ConeGeometry(Math.max(w,d)*.75,hh,4),mat(pick([0x3f6a4a,0x7a3a2a])));rf2.rotation.y=Math.PI/4;rf2.scale.set(w/Math.max(w,d),1,d/Math.max(w,d));rf2.position.set(gx,h+.5+hh/2,gz);W.add(rf2)}

function buildTrench(){newWorld(0xaab4bb,tex(x=>speck(x,'#6a5c46',90),50,50));
 const earth=mat(0x6a5a44),bag=mat(0xa89a70),brick=mat(0x8a5a44),plank=tex(x=>{speck(x,'#5e4830',50);x.fillStyle='#0004';for(let i=0;i<128;i+=16)x.fillRect(i,0,2,128)},40,1);

 for(let i=0;i<60;i++)crater(rnd(-92,92),rnd(-34,34),rnd(1.4,3.5));for(let i=0;i<46;i++)tree(rnd(-94,94),rnd(-34,34));
 for(let i=0;i<26;i++)box(rnd(-90,90),rnd(-32,32),rnd(1.5,3),rnd(1,2),rnd(.7,1.1),earth);
 for(const[x,z]of[[-30,6],[40,-14],[0,20],[-62,-10],[66,12]])wreck(x,z);
 for(const[x,z]of[[20,0],[-50,18]]){box(x,z-4,8,.5,2.8,brick);box(x-4,z,.5,3.5,2.8,brick);box(x+4,z+1,.5,6,2.2,brick);box(x-1,z+4,3,.5,2.8,brick)}

function buildUrban(){newWorld(0xb2b0ac,tex(x=>speck(x,'#6a6a58',70),30,30));
 for(let gx=-84;gx<=84;gx+=24)for(let gz=-60;gz<=60;gz+=24){if(Math.random()<.12)continue;const w=rnd(13,16),d=rnd(13,16),h=Math.random()<.15?rnd(24,34):rnd(8,20);building(gx,gz,w,d,h);
  if(Math.random()<.6)for(let k=0;k<5;k++){const rb=new T.Mesh(new T.BoxGeometry(rnd(.5,1.4),rnd(.3,.8),rnd(.5,1.4)),mat(0x6d665c));rb.position.set(gx+rnd(-w/2-2,w/2+2),.3,gz+(Math.random()<.5?-1:1)*(d/2+rnd(.6,1.6)));rb.rotation.set(rnd(0,3),rnd(0,3),rnd(0,3));W.add(rb)}}

 for(let i=0;i<100;i++){const ax=Math.random()<.5,s=-72+24*(Math.random()*7|0),a=rnd(-92,92),o=rnd(-2.6,2.6),x=ax?s+o:a,z=ax?a:s+o,t=Math.random();
  if(t<.35){box(x,z,1.9,4.2,.9,mat(pick(car)),.35);box(x,z-.2,1.7,2.2,.7,mat(0x222222),1.2,false)}else if(t<.7)box(x,z,ax?.6:2.6,ax?2.6:.6,.9,mat(0x8a8a86));else box(x,z,ax?.9:3,ax?3:.9,1.1,mat(0x9a8a62))}
 for(const[x,z]of[[-8,74],[8,74],[0,80],[-14,-70],[14,-70]])box(x,z,6,1,1.2,mat(0x9a8a62));
