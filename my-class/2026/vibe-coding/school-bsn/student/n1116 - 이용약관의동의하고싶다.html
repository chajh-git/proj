<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이용약관에 동의하고 싶어 (오마주)</title>
<style>
:root{box-sizing:border-box;--bg:#d9dde3;--win:#f6f7f9;--ink:#1c2230;--bar:#2b4c8c;--ok:#1f8a4c;--no:#b3392f;--line:#aab1bd;--cv:#e9edf3;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--win:#222833;--ink:#e8ebf1;--bar:#3c64b4;--line:#465063;--cv:#161a21}}
:root[data-theme="dark"]{--bg:#14171d;--win:#222833;--ink:#e8ebf1;--bar:#3c64b4;--line:#465063;--cv:#161a21}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{display:flex;justify-content:center;padding:16px}
#win{position:relative;width:100%;max-width:420px;background:var(--win);border:2px solid var(--line);border-radius:6px;overflow:hidden;align-self:flex-start;margin-top:4vh}
#bar{display:flex;justify-content:space-between;align-items:center;background:var(--bar);color:#fff;padding:8px 12px;font-weight:700}
#x{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;padding:0 4px}
#prog{height:4px;background:var(--line)}#info{height:100%;width:0;background:var(--ok);transition:width .3s}
#stage{padding:16px;min-height:340px;display:flex;flex-direction:column;gap:12px}
p{margin:0;line-height:1.5}.big{font-size:28px;font-weight:800;text-align:center}.err{color:var(--no);min-height:1.4em}
button{font:inherit;font-weight:700;padding:12px 16px;border-radius:4px;border:2px solid var(--line);background:var(--win);color:var(--ink);cursor:pointer;touch-action:manipulation}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}button.no{background:none;border-color:var(--no);color:var(--no);margin-top:auto}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
input{font:inherit;font-size:20px;padding:10px;border:2px solid var(--line);border-radius:4px;background:var(--win);color:var(--ink);text-align:center}
.field{position:relative;height:150px;border:1px dashed var(--line)}.field button{position:absolute}
.meter,.bar{position:relative;height:22px;border:2px solid var(--line);background:var(--cv)}.meter i{display:block;height:100%;width:0;background:var(--ok)}
.bar b{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.55}.bar i{position:absolute;top:-4px;width:6px;height:28px;background:var(--no)}
.terms{height:120px;overflow:auto;border:2px solid var(--line);padding:8px;font-size:13px;line-height:1.6;background:var(--cv)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button{padding:14px 0;font-size:18px}
canvas{width:100%;max-width:300px;align-self:center;background:var(--cv);border:2px solid var(--line);touch-action:none}
label{display:block;padding:4px 0}
#win{--win:#f4efe6;--ink:#1c2230;--line:#9a8f7c;--cv:#fbf8f2;background:#eee6da;color:#1c2230;border:5px solid #0a3ec0;border-radius:12px}
#bar{background:linear-gradient(#2f7bf0,#0a4cd0 40%,#0841b8)}#tm{font-variant-numeric:tabular-nums}
button.ok{background:linear-gradient(#a9f6cc,#27a858);border:3px solid #3b6383;border-radius:14px;color:#fff;text-shadow:0 0 3px #294154,1px 1px 0 #294154}
button.no{background:linear-gradient(#ffb8b0,#d9453a);border:3px solid #6b2a24;border-radius:14px;color:#fff;text-shadow:0 0 3px #4a1a16,1px 1px 0 #4a1a16}
#x{background:#dd3a2e;border:2px solid #fff;border-radius:5px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;font-size:16px}
.pad{display:flex;gap:8px}.pad button{flex:1;padding:16px 0;touch-action:none;user-select:none}
@media (prefers-reduced-motion:reduce){#info{transition:none}}
html,body{background:linear-gradient(#8fd3ff,#e8f7ff 62%,#7bd66b 62%) fixed;min-height:100vh}
body::before{content:"두근두근 스무고개";position:fixed;top:calc(env(safe-area-inset-top,0px) + 1.5vh);left:0;right:0;text-align:center;font-size:30px;font-weight:900;color:#fff;text-shadow:2px 2px 0 #3b6383,-1px -1px 0 #3b6383;pointer-events:none}
#win{margin-top:9vh;box-shadow:0 10px 30px rgba(0,0,0,.35)}
select{font:inherit;padding:10px;border:2px solid var(--line);border-radius:4px;background:var(--win);color:var(--ink);width:100%}
</style></head>
<body><div id="win">
<div id="bar"><span id="tm" style="min-width:56px"></span><span id="title">이용약관</span><button id="x" aria-label="닫기">×</button></div>
<div id="prog"><div id="info"></div></div>
<div id="stage"></div>
</div>
<script>
const $=s=>document.querySelector(s),stage=$('#stage'),title=$('#title'),info=$('#info');
let clause=0,order=[],timers=[],raf=0;let mode='classic',pen=0,gt0=0,lim=20,bonus=0;
const T=(f,ms)=>{const t=setInterval(f,ms);timers.push(t);return t};
const clear=()=>{timers.forEach(clearInterval);timers=[];cancelAnimationFrame(raf);$('#tm').textContent=''};
const n=()=>clause+1;
function ui(html){stage.innerHTML=html+'<button class="no" id="no">동의하지 않음</button>';$('#no').onclick=()=>over('“동의하지 않음”을 눌렀습니다.');
stage.querySelectorAll('button.ok').forEach(b=>{if(b.textContent==='동의')b.textContent='동의함'});
const r=Math.random();if(r<.35)$('#no').style.cssText='background:var(--ok);border-color:var(--ok);color:#fff';else if(r<.55)stage.querySelectorAll('button.ok').forEach(b=>{if(b.textContent==='동의함'){b.style.background='linear-gradient(#ffb8b0,#d9453a)';b.style.borderColor='#6b2a24'}})}
function over(msg){clear();title.textContent='비동의 처리';const cz=mode==='casual'&&clause<12;stage.innerHTML=`<p class="big">비동의 처리됨</p><p>${msg}</p><button class="ok" id="r">${cz?'이 조항 다시 (+2분 패널티)':'제1조부터 다시'}</button>`;$('#r').onclick=()=>{if(cz){pen+=120;order[clause]=pickOne(clause);next()}else start()}}
function pass(){clear();clause++;info.style.width=clause/12*100+'%';clause>=12?jump():setTimeout(next,250)}
function next(){title.textContent=`이용약관 【제${n()}조】`;lim=clause<5?22:clause<9?18:14;order[clause]();countdown()}
function countdown(){const t0=performance.now(),tm=$('#tm');T(()=>{const l=lim-(performance.now()-t0)/1000;tm.textContent=Math.max(0,l).toFixed(1)+'초';tm.style.color=l<5?'#ffd166':'';if(l<=0)over('일정 시간 입력이 없어 비동의 처리되었습니다.')},100)}
function start(){clear();clause=0;info.style.width='0';const pick=(a,k)=>a.slice().sort(()=>Math.random()-.5).slice(0,k);
pen=0;gt0=performance.now();order=[plain,...pick(poolA,4),...pick(poolB,4),...pick(poolC,3)];next()}
$('#x').onclick=()=>over('창을 닫으면 비동의로 처리됩니다.');

function run(){let c=0;ui(`<p>제${n()}조: 버튼을 3번 누르세요.</p><div class="field" id="f"><button class="ok" id="b">동의</button></div>`);
const b=$('#b'),f=$('#f'),mv=()=>{b.style.left=Math.random()*(f.clientWidth-b.offsetWidth)+'px';b.style.top=Math.random()*(f.clientHeight-b.offsetHeight)+'px'};mv();
b.onpointerenter=e=>{if(e.pointerType==='mouse'&&Math.random()<.5)mv()};b.onclick=()=>++c>=3?pass():mv()}

function hold(){ui(`<p>제${n()}조: 버튼을 3.5초 동안 꾹 누르세요. 손을 떼면 처음부터입니다.</p><div class="meter"><i id="m"></i></div><button class="ok" id="b" style="touch-action:none">동의 (꾹 누르기)</button>`);
let v=0,t=0;const b=$('#b'),m=$('#m'),stop=()=>{clearInterval(t);v=0;m.style.width='0'};
b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);t=T(()=>{v+=50;m.style.width=v/35+'%';if(v>=3500)pass()},50)};
b.onpointerup=b.onpointercancel=stop;b.oncontextmenu=e=>e.preventDefault()}

function scroll(){const s='이용자는 본 약관의 모든 조항을 끝까지 읽었음을 확인하며, 읽지 않았더라도 읽은 것으로 간주됩니다. ';
ui(`<p>제${n()}조: 약관을 끝까지 스크롤하세요.</p><div class="terms" id="t">${Array.from({length:28},(_,i)=>`제${i+1}항. ${s}`).join('<br>')}<br><b>이상입니다.</b></div><button class="ok" id="b" disabled>동의</button>`);
const t=$('#t'),b=$('#b');t.onscroll=()=>{if(t.scrollTop+t.clientHeight>=t.scrollHeight-3)b.disabled=false};b.onclick=pass}

function cap(){const mk=()=>String(1000+Math.random()*9000|0);let c=mk();
ui(`<p>제${n()}조: 숫자를 거꾸로 입력하세요.</p><p class="big" id="c">${c}</p><input id="i" inputmode="numeric" maxlength="4" aria-label="거꾸로 입력"><button class="ok" id="b">동의</button><p class="err" id="e"></p>`);
$('#b').onclick=()=>{if($('#i').value===[...c].reverse().join(''))pass();else{c=mk();$('#c').textContent=c;$('#i').value='';$('#e').textContent='틀렸습니다. 숫자가 바뀌었습니다.'}}}

function timing(){ui(`<p>제${n()}조: 빨간 표시가 초록 구간에 있을 때 누르세요.</p><div class="bar"><b id="z"></b><i id="k"></i></div><button class="ok" id="b">정지</button><p class="err" id="e"></p>`);
const zl=15+Math.random()*55;$('#z').style.cssText=`left:${zl}%;width:10%`;let p=0,d=2.2;const k=$('#k');
T(()=>{p+=d;if(p>=97||p<=0)d=-d;k.style.left=p+'%'},16);
$('#b').onclick=()=>p>=zl&&p<=zl+10?pass():$('#e').textContent='빗나갔습니다. 다시!'}

function whack(){const w=['둥의','동익','똥의','돔의','동믜','동외','송의','등의'],it=[...w,'동의','동의','동의','동의'].sort(()=>Math.random()-.5);let c=0;
ui(`<p>제${n()}조: 정확히 “동의”인 칸 4개만 누르세요.</p><div class="grid">${it.map(s=>`<button data-s="${s}">${s}</button>`).join('')}</div>`);
stage.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>{if(b.dataset.s!=='동의')return over('비슷하게 생긴 글자를 눌렀습니다.');b.disabled=true;if(++c>=4)pass()})}

function seq(){const a=[1,2,3,4,5,6,7,8].sort(()=>Math.random()-.5);let c=1;ui(`<p>제${n()}조: 1부터 8까지 순서대로 누르세요.</p><div class="grid">${a.map(x=>`<button>${x}</button>`).join('')}</div><p class="err" id="e"></p>`);
const bs=[...stage.querySelectorAll('.grid button')];bs.forEach(b=>b.onclick=()=>{if(+b.textContent!==c){c=1;bs.forEach(x=>x.disabled=false);return $('#e').textContent='순서가 틀렸습니다. 처음부터!'}b.disabled=true;if(++c>8)pass()})}
function mash(){let c=0,t0=0;ui(`<p>제${n()}조: 4초 안에 25번 누르세요.</p><div class="meter"><i id="m"></i></div><button class="ok" id="b">동의 (연타)</button>`);
$('#b').onclick=()=>{const now=performance.now();if(!t0||now-t0>4000){t0=now;c=0}c++;$('#m').style.width=c*4+'%';if(c>=25)pass()}}
function slider(){const g=20+(Math.random()*60|0);ui(`<p>제${n()}조: 슬라이더를 정확히 ${g}에 맞추세요.</p><input type="range" id="r" min="0" max="100" value="0" aria-label="값"><p class="big" id="v">0</p><button class="ok" id="b">동의</button><p class="err" id="e"></p>`);
$('#r').oninput=e=>$('#v').textContent=e.target.value;$('#b').onclick=()=>+$('#r').value===g?pass():$('#e').textContent='정확하지 않습니다.'}
function math(){const a=6+(Math.random()*9|0),b=6+(Math.random()*9|0);ui(`<p>제${n()}조: ${a} × ${b} = ?</p><input id="i" inputmode="numeric" aria-label="답"><button class="ok" id="b">동의</button><p class="err" id="e"></p>`);
$('#b').onclick=()=>+$('#i').value===a*b?pass():over('오답을 입력했습니다.')}
function wait(){let t=0;ui(`<p>제${n()}조: 버튼이 초록색이 될 때까지 기다린 뒤 누르세요. 일찍 누르면 처음부터입니다.</p><button id="b">기다리는 중…</button><p class="err" id="e"></p>`);
const b=$('#b'),arm=()=>{b.className='';b.textContent='기다리는 중…';clearTimeout(t);t=setTimeout(()=>{b.className='ok';b.textContent='지금 동의!'},3000);timers.push(t)};arm();
b.onclick=()=>{if(b.className==='ok')pass();else{$('#e').textContent='너무 일찍 눌렀습니다.';arm()}}}
function checks(){const L=['개인정보 수집','제3자 제공','마케팅 수신','쿠키 사용','위치 정보','분쟁 중재'];ui(`<p>제${n()}조: 모든 항목에 체크하세요. 체크가 가끔 풀립니다.</p>${L.map(x=>`<label><input type="checkbox"> ${x}</label>`).join('')}<button class="ok" id="b">동의</button><p class="err" id="e"></p>`);
const bx=()=>[...stage.querySelectorAll('input')];T(()=>{const c=bx().filter(i=>i.checked);if(c.length)c[Math.random()*c.length|0].checked=false},2500);
$('#b').onclick=()=>bx().every(i=>i.checked)?pass():$('#e').textContent='체크하지 않은 항목이 있습니다.'}
function done(f){clear();let bt='';try{const t=(performance.now()-gt0)/1000+pen,k='agBest'+mode,o=+localStorage.getItem(k)||1e9;if(t<o)localStorage.setItem(k,t);bt=` · 최고 기록 ${Math.min(t,o).toFixed(1)}초`}catch(e){}title.textContent='클리어';stage.innerHTML=`<p class="big">약관 동의 완료!</p><p>클리어 타임 ${((performance.now()-gt0)/1000+pen).toFixed(1)}초 (패널티 ${pen}초 포함) · 사용한 질문 ${f}개${bt}</p><p>이제 게임을 즐기세요… 라고 하고 싶지만, 여기까지입니다.</p><button class="ok" id="r">다시 하기</button>`;$('#r').onclick=start}
const topics=['목적','용어의 정의','약관의 효력','계정 관리','개인정보 취급','결제와 환불','게임 데이터 취급','금지 행위','서비스 변경','책임의 제한','분쟁 해결','준거법','부칙'];
function wire(){const c=[['빨강','#d9453a'],['파랑','#2b6fd6'],['초록','#1f8a4c'],['노랑','#a88400']],t=c[Math.random()*4|0][0];const m=c.map(([a],i)=>[a,c[(i+1)%4][1]]).sort(()=>Math.random()-.5);
ui(`<p>제${n()}조: 폭탄을 해체하세요. 글자가 “${t}”인 선만 자르세요. 색에 속지 마세요.</p>${m.map(([a,h])=>`<button class="w" data-a="${a}" style="background:${h};color:#fff;border-color:${h}">${a}</button>`).join('')}`);
stage.querySelectorAll('.w').forEach(b=>b.onclick=()=>b.dataset.a===t?pass():over('폭탄이 터졌습니다.'))}
function mines(){const W=4,H=3,N=12,mi=new Set();while(mi.size<2)mi.add(Math.random()*N|0);let safe=N-2;
const cnt=i=>{let c=0;const x=i%W,y=i/W|0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(X>=0&&X<W&&Y>=0&&Y<H&&mi.has(Y*W+X))c++}return c};
ui(`<p>제${n()}조: 지뢰가 아닌 칸을 모두 여세요. (숫자는 주변 지뢰 수)</p><div class="grid">${Array.from({length:N},(_,i)=>`<button data-i="${i}">?</button>`).join('')}</div>`);
stage.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(mi.has(i))return over('지뢰를 밟았습니다.');b.textContent=cnt(i);b.disabled=true;if(--safe<=0)pass()})}
function flappy(){ui(`<p>제${n()}조: “날기”를 눌러 기둥 6개를 통과하세요.</p><canvas id="cv" width="300" height="200"></canvas><button class="ok" id="fb" style="touch-action:none">날기</button>`);
const g=$('#cv').getContext('2d');let y=100,v=0,ps=[],f=0,sc=0;$('#fb').onpointerdown=()=>v=-5.2;
const loop=()=>{v+=.35;y+=v;f++;if(f%80===1)ps.push({x:300,gy:50+Math.random()*100});ps.forEach(p=>p.x-=2);
for(const p of ps){if(!p.d&&p.x<0){p.d=1;if(++sc>=6)return pass()}if(p.x<44&&p.x>0&&(y<p.gy-38||y+14>p.gy+38))return over('기둥에 부딪혔습니다.')}
if(y<0||y>186)return over('땅에 떨어졌습니다.');
g.clearRect(0,0,300,200);g.fillStyle='#1f8a4c';ps.forEach(p=>{g.fillRect(p.x,0,30,p.gy-38);g.fillRect(p.x,p.gy+38,30,200)});g.fillStyle='#f0b429';g.fillRect(30,y,14,14);raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop)}
function plain(){ui(`<p>제${n()}조: 아래 약관에 동의하십시오.</p><div class="terms">제1항. 이용자는 이 게임을 즐길 것을 약속합니다.<br>제2항. 약관을 읽지 않고 누르는 행위는 권장되지 않습니다.<br>제3항. 동의함 버튼은 초록색인 경우가 많습니다. 항상은 아닙니다.</div><button class="ok" id="b">동의함</button>`);$('#b').onclick=pass}
function fake(){ui(`<p>제${n()}조: 버튼의 색이 아니라 글자를 읽으세요.</p><button class="ok" id="a">동의함</button><button id="c">동의하지 않음</button>`);
const a=$('#a'),c=$('#c');c.style.cssText='background:var(--no);border-color:var(--no);color:#fff';let sw=0;
[a,c].forEach(b=>{b.onpointerenter=()=>{if(sw)return;sw=1;const t=a.textContent;a.textContent=c.textContent;c.textContent=t};b.onclick=()=>b.textContent==='동의함'?pass():over('“동의하지 않음”을 눌렀습니다.')})}
function tiny(){ui(`<p>제${n()}조: 버튼이 아주 작습니다. 초록색이 동의함입니다.</p><div class="field" id="f"></div>`);const f=$('#f');
