}

function battleTick(ts){
  if(!_battle||_battle.ended)return;
  if(!_battle.lastTs)_battle.lastTs=ts;
  if(_battle.paused){_battle.lastTs=ts;_bLoop=requestAnimationFrame(battleTick);return}
  var rawDt=Math.min((ts-_battle.lastTs)/1000, 0.05);
  if(_battle.holdT>0){_battle.holdT-=rawDt;_battle.lastTs=ts;_bLoop=requestAnimationFrame(battleTick);return;}
  var dt=rawDt*(_battle.speedMult||1);
  if(_battle.slowT>0){_battle.slowT-=rawDt;dt*=0.35;}
  _battle.lastTs=ts;

  // money regen
  _battle.money=Math.min(_battle.moneyMax, _battle.money+_battle.moneyRate*dt*(1+0.3*((_battle.wl||1)-1))*(_battle.moneyMult||1)*(1+(_battle.moneyBonus||0))*(1+0.1*BU(1)));
  for(var ci=0;ci<_battle.cd.length;ci++)_battle.cd[ci]=Math.max(0,_battle.cd[ci]-dt);
  // 대포 충전은 튜토리얼 단계나 지갑 업그레이드 여부와 상관없이 전투 시작 직후부터 진행한다.
  _battle.cannonTutorialChargeStarted=true;
  var tutorialCannonWaiting=_battle.stage.id===1 && _battle.tutStep==='cannonWaitAfterSpeed';
  _battle.can=Math.min(cannonCap(),_battle.can+dt);
  // 튜토리얼: 성 체력과 상관없이, 시간이 지나 대포가 저절로 충전되면 딱 1번만 멈추고 대포를 누르면 다시 진행한다.
  if(_battle.stage.id===1 && (_battle.tutStep==='cannonWait' || tutorialCannonWaiting) && _battle.can>=cannonCap()) { _battle.tutStep='cannonReady'; _battle.paused=true; var pb=document.getElementById('pauseBtn');if(pb)pb.textContent='▶';refreshTutorialGuide(); }
  updateMoneyUI(); updateDeployUI(); updateBattleBtns(); updateCapUI(); bossTick(dt);

  // spawn enemies
  _battle.spawnTimer+=dt;
  var interval=Math.max(1.9, _battle.spawnInterval-_battle.wave*0.05);
  if(_battle.stage.boss && !_battle.bossSpawned && (_battle.wave>=_battle.maxWaves-1 || _battle.enemyBaseHp<_battle.enemyBaseMax*0.6)){
    _battle.bossSpawned=true;
    spawnBoss();
  }
  if(_battle.spawnTimer>=interval && _battle.wave<_battle.maxWaves){
    _battle.spawnTimer=0;
    spawnEnemy();
  }
  // after all waves, occasional stragglers if base still up
  if(_battle.wave>=_battle.maxWaves && _battle.enemies.length===0 && _battle.spawnTimer>4){
    _battle.spawnTimer=0;
    if(_battle.enemyBaseHp>0) spawnEnemy();
  }

  // ===== 아군 버프(오라) 계산 =====
  _battle.allies.forEach(function(a){a.mods={atk:0,spd:0,dr:0,mv:0,heal:0,rng:0}});
  var moneyBonus=0;
  _battle.allies.forEach(function(su){
    if(su.dead||!su.buffs)return;
    su.buffs.forEach(function(b){
      if(b.k==="money"){moneyBonus+=b.v;return}
      var ad=AURA[b.k];if(!ad)return;
      var r=b.r||14;
      _battle.allies.forEach(function(a){
        if(a.dead||a===su)return;
        if(ad.to&&ad.to.indexOf(a.role)===-1)return;
        if(Math.abs(a.x-su.x)>r)return;
        a.mods[ad.s]+=b.v;
      });
    });
  });
  _battle.moneyBonus=moneyBonus+((_battle.tb&&_battle.tb.money)||0);
  runBattleItems(dt);
  _battle.allies.forEach(function(a){if(!a.dead)buffVis(a,dt)});
  _battle.allies.forEach(function(a){
    if(a.dead)return;
    var m=a.mods;
    m.atk=Math.min(1.5,m.atk);m.spd=Math.min(1,m.spd);m.dr=Math.min(.6,m.dr);m.mv=Math.min(.6,m.mv);m.rng=Math.min(8,m.rng);m.heal=Math.min(.12,m.heal);
    var hr=(m.heal+getBuff(a,"regen"))*(1+(a.comboHeal||0));
    if(hr>0&&a.hp<a.maxHp){a.hp=Math.min(a.maxHp,a.hp+a.maxHp*hr*dt);updateUnitHp(a)}
  });

  // ===== 전투: 각 유닛은 자기 사거리 안의 가장 가까운 적만 공격한다. =====
  // 원거리·서포터는 앞줄(탱커/근접) 뒤에 멈춰 서서 싸운다.
  var frontX=null;
  _battle.allies.forEach(function(a){
    if(a.dead||a.role==="원거리"||a.role==="서포터")return;
    if(frontX===null||a.x<frontX)frontX=a.x;
  });
  _battle.allies.forEach(function(a){
    if(a.dead)return;
    if(a.stun>0){a.stun-=dt;return}
    var target=null,minDist=999;
    _battle.enemies.forEach(function(en){
      if(en.dead)return;
      var d=a.x-en.x;
      if(d>-1&&d<minDist){minDist=d;target=en}
    });
    var el=document.getElementById("u"+a.id);
    var rng=(a.range||5)+(a.mods.rng||0);
    var mult=(1+a.mods.atk)*(1+a.mods.spd);
    var cr=getBuff(a,"crit");if(cr)mult*=1+cr*1.5;
    var rg=getBuff(a,"rage");if(rg)mult*=1+rg*(1-Math.max(0,a.hp)/a.maxHp);
    var fz=getBuff(a,"frenzy");
    if(target&&minDist<=rng){
      a.fighting=target;
      if(fz)a.frenzy=Math.min(fz,(a.frenzy||0)+fz/6*dt);
      var dmg=a.atk*dt*(a.atkSpeed||1)*mult*(1+(a.frenzy||0));
      var ex=getBuff(a,"execute");if(ex&&target.hp/target.maxHp<0.3)dmg*=1+ex;
      var sl=getBuff(a,"slow");if(sl){target.slowT=2;target.slowF=1-sl}
      var vu=getBuff(a,"vuln");if(vu){target.vuln=vu;target.vulnT=2}
      var sp=getBuff(a,"splash");
      if(sp){_battle.enemies.forEach(function(o){if(o!==target&&!o.dead&&Math.abs(o.x-target.x)<=7)hitEnemy(o,dmg*sp,a)})}
      dmg*=traitMult(a,target);
      hitEnemy(target,dmg,a);
      var ls=getBuff(a,"lifesteal");if(ls){a.hp=Math.min(a.maxHp,a.hp+dmg*ls);updateUnitHp(a)}
      if(el)el.classList.add("fighting");
      atkVis(a,target,dt);
    } else if(a.x-6<=rng){
      a.fighting=null;a.frenzy=0;
      if(el)el.classList.add("fighting");
      var bd=a.atk*dt*(a.atkSpeed||1)*mult*(1+getBuff(a,"base"))*2;
      _battle.enemyBaseHp-=bd;
      atkVis(a,{x:6},dt);
      if(!(rng>8)){hurtAlly(a,10*dt,null)}
      updateBaseUI();
      if(_battle.enemyBaseHp<=0)endBattle(true);
    } else {
      a.fighting=null;a.frenzy=0;
      if(el)el.classList.remove("fighting");
      var nx=a.x-a.speed*60*dt*(1+a.mods.mv);
      if((a.role==="원거리"||a.role==="서포터")&&frontX!==null&&frontX<a.x){
        nx=Math.max(nx,frontX+7);
        if(nx>a.x)nx=a.x;
      }
      a.x=nx;
      setUnitPos(a);
    }
  });

  // 적: 사거리 안에 아군이 있으면 멈춰서 가장 가까운(=맨 앞) 아군을 공격.
  _battle.enemies.forEach(function(en){
    if(en.dead)return;
    if(en.slowT>0)en.slowT-=dt;
    if(en.vulnT>0){en.vulnT-=dt;if(en.vulnT<=0)en.vuln=0}
    if(en.stun>0){en.stun-=dt;if(en.stun<=0){var _ue=document.getElementById("u"+en.id);if(_ue)_ue.classList.remove("stunned")}return}
    if(en.boss){en.shockT=(en.shockT||6)-dt;if(en.shockT<=0)bossShock(en)}
    var slowed=en.slowT>0,slowF=slowed?(en.slowF||1):1;
    var target=null,minDist=999;
    _battle.allies.forEach(function(a){
      if(a.dead)return;
      var d=a.x-en.x;
      if(d>-1&&d<minDist){minDist=d;target=a}
    });
    var el=document.getElementById("u"+en.id);
    if(target&&minDist<=(en.range||5)){
      en.fighting=target;
      hurtAlly(target,en.atk*dt*(slowed?(1-(1-slowF)*0.5):1),en);
      atkVis(en,target,dt);
      if(el)el.classList.add("fighting");
    } else {
      en.fighting=null;
      if(el)el.classList.remove("fighting");
      en.x+=en.speed*60*dt*slowF;
      if(en.x>=ALLY_X+2){
        atkVis(en,{x:en.x+4},dt);
        _battle.allyBaseHp-=en.atk*dt*2;
        updateBaseUI();
        en.hp-=10*dt;
        updateUnitHp(en);
        if(en.hp<=0) killUnit(en);
        if(_battle.allyBaseHp<=0) endBattle(false);
      }
      setUnitPos(en);
    }
  });

  // cleanup dead
  _battle.allies=_battle.allies.filter(function(u){return !u.dead});
  _battle.enemies=_battle.enemies.filter(function(u){return !u.dead});

  _bLoop=requestAnimationFrame(battleTick);
}

function hitEnemy(en,dmg,src){
  if(en.dead)return;
  en.hp-=dmg*(1+(en.vuln||0));
  updateUnitHp(en);
  if(en.hp<=0){
    killUnit(en);
    var gain=en.reward*(1+getBuff(src,"killmoney"))*(1+0.12*BU(2));
    _battle.money+=gain;
    floatText(en.x,"+"+Math.max(1,Math.round(gain))+"원");
    updateMoneyUI();statInc("kills");
  }else knock(en);
}
function hurtAlly(a,amount,attacker){
  if(a.dead)return;
  amount*=(1-((a.mods&&a.mods.dr)||0));
  amount*=(1-(a.comboDr||0));
  if(a.role==="탱커")amount*=0.6;
  amount*=(1-getBuff(a,"dodge"));
  var th=getBuff(a,"thorn");
  if(th&&attacker&&!attacker.dead){
    attacker.hp-=amount*th;updateUnitHp(attacker);
    if(attacker.hp<=0){killUnit(attacker);_battle.money+=attacker.reward*(1+0.12*BU(2));updateMoneyUI();statInc("kills")}
  }
  if(a.shield>0){var sd=Math.min(a.shield,amount);a.shield-=sd;amount-=sd}
  a.hp-=amount;
  if(a.hp<=0){var rz=getBuff(a,"revive");if(rz&&!a.revived){a.revived=true;a.hp=a.maxHp*rz;a.shield=0}}
  updateUnitHp(a);
  if(a.hp<=0)killUnit(a);else knock(a);
}

/* GACHA */
function getRandomChar(minKey){
  var minIdx=0,i;
  if(minKey){for(i=0;i<RATES.length;i++)if(RATES[i].key===minKey)minIdx=i}
  var total=0;for(i=minIdx;i<RATES.length;i++)total+=RATES[i].chance;
  var rand=Math.random()*total,cum=0,key=RATES[minIdx].key;
  for(i=minIdx;i<RATES.length;i++){cum+=RATES[i].chance;if(rand<cum){key=RATES[i].key;break}}
  var g=CHAR_DB[key];
  if(!g||!g.list||!g.list.length) g=CHAR_DB.common;
  return{rarity:key,rarityName:g.name,name:g.list[Math.floor(Math.random()*g.list.length)],emoji:g.emoji,color:g.color};
}
function rarityAtLeast(key,min){return RARITY_ORDER.indexOf(key)<=RARITY_ORDER.indexOf(min)}
function rollBatch(count){
  var rs=[];
  for(var i=0;i<count;i++){
    var ch=((state.stats.pity||0)+1>=PITY_AT)?getRandomChar("legendary"):getRandomChar();
    state.stats.pity=rarityAtLeast(ch.rarity,"legendary")?0:(state.stats.pity||0)+1;
    rs.push(ch);
  }
  if(count>=30&&!rs.some(function(r){return rarityAtLeast(r.rarity,"epic")}))rs[rs.length-1]=getRandomChar("epic");
  return rs;
}
function updatePity(){
  var el=document.getElementById("pityInfo");

}

function spinReel(idx,fin,dur,delay){
  return new Promise(function(res){
    var strip=document.getElementById("strip"+idx);

    var cnt=buildStrip(strip,fin),off=(cnt-1)*REEL_H;
    strip.style.transition="none";

    void strip.offsetHeight;
    setTimeout(function(){
      strip.style.transition="transform "+dur+"ms cubic-bezier(0.15,0.85,0.25,1)";
      strip.style.transform="translateY(-"+off+"px)";
    },delay);
    setTimeout(function(){try{playStop()}catch(e){} res()},delay+dur);
  });
}
function doGacha(count){

      if(rs.some(function(r){return r.rarity==="secret"||r.rarity==="god"})){
        try{shake();launchFW(rs.some(function(r){return r.rarity==="god"}));playJack(rs.some(function(r){return r.rarity==="god"}))}catch(e){}
      }
      finish();
    }).catch(function(){if(msgEl)msgEl.textContent="오류!";finish()});
  }
}

/* MODAL */
function openConfirm(t,m,okCb,altCb,okLabel,altLabel){
  document.getElementById("modalTitle").textContent=t;
  document.getElementById("modalMsg").textContent=m;
  var ok=document.getElementById("modalOk");
  ok.textContent=okLabel||"확인";
  ok.onclick=function(){closeModal();if(okCb)okCb()};
  var cancelBtn=document.querySelector(".mca");
  if(altCb){cancelBtn.textContent=altLabel||"취소";cancelBtn.onclick=function(){closeModal();altCb()}}
  else{cancelBtn.textContent="취소";cancelBtn.onclick=closeModal}
  document.getElementById("confirmModal").classList.add("show");
}
function closeModal(){document.getElementById("confirmModal").classList.remove("show")}

/* AUDIO + FX */
var actx=null;
function getA(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();return actx}
function playSpin(ms){try{var ctx=getA(),now=ctx.currentTime,dur=ms/1000,n=Math.floor(dur*12);for(var i=0;i<n;i++){var t=now+(i/n)*dur*.9,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type="square";o.frequency.value=140+Math.random()*40;g.gain.setValueAtTime(.02,t);g.gain.exponentialRampToValueAtTime(.001,t+.03);o.start(t);o.stop(t+.04)}}catch(e){}}
function playStop(){try{var ctx=getA(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type="triangle";o.frequency.setValueAtTime(160,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(60,ctx.currentTime+.1);g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.12);o.start();o.stop(ctx.currentTime+.13)}catch(e){}}
function playJack(isG){try{var ctx=getA(),notes=isG?[523,659,784,1046]:[392,523,659];notes.forEach(function(f,i){var o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type="sine";o.frequency.value=f;var t=ctx.currentTime+i*.12;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.35)})}catch(e){}}
function shake(){document.body.classList.add("screen-shake");setTimeout(function(){document.body.classList.remove("screen-shake")},500)}
function launchFW(isG){var c=document.getElementById("fireworks");c.innerHTML="";var cols=isG?["#fff","#ffeaa7","#f1c40f"]:["#ff6b6b","#feca57","#48dbfb","#2ed573"];for(var b=0;b<(isG?4:2);b++){setTimeout(function(){var ox=20+Math.random()*60,oy=15+Math.random()*40;for(var i=0;i<20;i++){var fw=document.createElement("div");fw.className="firework";fw.style.background=cols[Math.floor(Math.random()*cols.length)];fw.style.left=ox+"%";fw.style.top=oy+"%";fw.style.width=fw.style.height=(3+Math.random()*4)+"px";var a=Math.random()*Math.PI*2,d=30+Math.random()*120;fw.style.setProperty("--fx",Math.cos(a)*d+"px");fw.style.setProperty("--fy",Math.sin(a)*d+"px");c.appendChild(fw)}},b*180)}setTimeout(function(){c.innerHTML=""},2000)}

try{init();}catch(e){
  console.error(e);
  try{
    state.currentScreen="home";
    if(!Array.isArray(state.storage))state.storage=[];
    if(!state.items)state.items={speed2:1,money2:1};
    updateRes();
    var c=document.getElementById("content");
    if(c && typeof renderHome==="function") renderHome(c);
    var lm=document.getElementById("leftMenu"),bb=document.getElementById("bottomBar");
    if(lm)lm.style.display="flex";
    if(bb && typeof renderBottom==="function")renderBottom("home");
  }catch(e2){ console.error(e2); }
}
