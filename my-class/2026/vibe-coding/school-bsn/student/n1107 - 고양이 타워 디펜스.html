<!DOCTYPE hVtml>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>고양이 타워 디팬스</title>
<style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;font-family:'Noto Sans KR',sans-serif;background:#3d2914;color:#fff;overflow:hidden;position:fixed;inset:0}
.frame{display:flex;flex-direction:column;background:#c4a574;border:5px solid #8b6914;box-shadow:inset 0 0 0 2px #d4b896;position:fixed;width:100%;height:100%;left:0;top:0;right:0;bottom:0}
/* 세로 모드: 화면을 가로로 강제 회전 */
@media (orientation: portrait) {
  .frame {
    width: 100vw;
    height: 100vh;
    transform: none;이
    position: fixed;
    inset: 0;
  }
  .frame:before{content:"📱 휴대폰을 가로로 돌리면 원래 화면으로 플레이할 수 있어!";position:absolute;z-index:999;top:0;left:0;right:0;background:rgba(255,240,180,.96);color:#4b3210;text-align:center;font-weight:900;font-size:.72rem;padding:5px;pointer-events:none;}
}

/* TOP */
.top-bar{background:linear-gradient(180deg,#e8c96a,#c9a84c);padding:5px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #8b6914;flex-shrink:0}
.top-bar .title{font-size:1.1rem;font-weight:900;color:#5a3a10;text-shadow:1px 1px 0 #f5e6b8}
.top-bar .xp{font-size:.95rem;font-weight:900;color:#fff;background:#222;padding:2px 12px;border-radius:8px;border:2px solid #f5c542}
.top-bar .xp span{color:#f5c542}

/* MAIN */
.main{flex:1;display:flex;overflow:hidden;position:relative}
.left-menu{width:160px;padding:10px 8px;display:flex;flex-direction:column;gap:8px;flex-shrink:0;z-index:2}
.menu-btn{background:linear-gradient(180deg,#ffe066,#f0c020);border:3px solid #5a3a10;border-radius:12px;padding:12px 6px;font-size:1rem;font-weight:900;color:#3a2a08;cursor:pointer;text-align:center;box-shadow:0 3px 0 #8b6914;font-family:inherit;transition:.1s}
.menu-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8b6914}
@media(max-width:700px){.left-menu{width:120px}.menu-btn{font-size:.8rem;padding:10px 4px}}
.center{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}

/* HOME */
.home-bg{flex:1;background:#5a8a6a;display:flex;align-items:center;justify-content:center;gap:16px;position:relative}
.home-bubble{background:#2d4a3e;border:3px solid #1a2e26;border-radius:14px;padding:14px 18px;max-width:240px;color:#e8f5e9;font-size:.85rem;line-height:1.5;font-weight:700}
.home-cat{font-size:6rem;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.2))}

/* 기본 냥코대포: 바닥을 따라 사거리 끝까지 퍼지는 핑크색 파동 */
.cannon-ground-wave{position:absolute;z-index:13;pointer-events:none;overflow:visible;height:62px;max-width:100%}
.cannon-ground-wave .ground-wave-ring{position:absolute;left:100%;bottom:2px;width:96px;height:34px;border:5px solid #ff8fd8;border-radius:50%;background:radial-gradient(ellipse,rgba(255,210,242,.72),rgba(255,80,190,.2) 60%,transparent 72%);box-shadow:0 0 8px 3px #ff8fd8,0 0 22px 7px rgba(255,70,180,.9),inset 0 0 14px rgba(255,235,250,.98);transform:translateX(-100%);animation:groundWaveTravel .95s cubic-bezier(.15,.7,.25,1) forwards}
.cannon-ground-wave .ground-wave-ring:before,.cannon-ground-wave .ground-wave-ring:after{content:"";position:absolute;left:8px;right:8px;top:5px;bottom:5px;border:2px solid rgba(255,225,248,.98);border-radius:50%;transform:scaleX(1.12)}
.cannon-ground-wave .ground-wave-ring:after{left:-9px;right:-9px;top:-7px;bottom:-7px;border-color:rgba(255,90,195,.9);border-width:3px}
.cannon-ground-wave .ground-wave-ring.second{animation-delay:.13s;opacity:.8;filter:hue-rotate(8deg)}
.cannon-ground-wave .ground-wave-line{position:absolute;left:0;right:0;bottom:17px;height:8px;border-radius:100%;background:linear-gradient(90deg,transparent,rgba(255,100,195,.2),#fff0fb,rgba(255,75,185,.9));box-shadow:0 0 10px 4px rgba(255,105,200,.9);transform:scaleX(0);transform-origin:right center;animation:groundWaveLine .85s ease-out forwards}
@keyframes groundWaveTravel{0%{left:100%;transform:translateX(-100%) scale(.55,.75);opacity:1}65%{opacity:1}100%{left:0;transform:translateX(0) scale(1.65,1.15);opacity:0}}
@keyframes groundWaveLine{0%{transform:scaleX(0);opacity:1}55%{transform:scaleX(1);opacity:.95}100%{transform:scaleX(1);opacity:0}}

/* 고양이 가이드와 반짝이는 튜토리얼 목표 */
.tutorial-guide{position:fixed;z-index:9999;right:12px;top:68px;display:flex;align-items:flex-end;gap:8px;max-width:min(390px,88vw);pointer-events:none;animation:guideIn .35s ease-out}
.tutorial-guide .guide-cat{font-size:3.4rem;filter:drop-shadow(0 0 9px #ffe66d);animation:catBob 1.2s ease-in-out infinite}
.tutorial-guide .guide-bubble{background:#fff9d8;color:#38270a;border:3px solid #f6c945;border-radius:16px;padding:10px 13px;font-size:.82rem;font-weight:900;line-height:1.45;box-shadow:0 0 0 3px #fff8b8,0 0 22px #ffd93d;max-width:290px;position:relative}
.tutorial-guide .guide-bubble:after{content:"";position:absolute;right:16px;bottom:-12px;border-width:12px 0 0 14px;border-style:solid;border-color:transparent transparent transparent #fff9d8}
.tutorial-guide .guide-tag{display:block;font-size:.68rem;color:#a65b00;margin-bottom:3px}
.tutorial-target{position:relative!important;z-index:9998!important;animation:tutorialSpark .85s ease-in-out infinite!important;outline:4px solid #fff36b!important;outline-offset:3px!important;box-shadow:0 0 0 7px rgba(255,221,45,.45),0 0 25px 10px rgba(255,234,80,.95)!important}
@keyframes tutorialSpark{0%,100%{filter:brightness(1);transform:scale(1)}50%{filter:brightness(1.65);transform:scale(1.045)}}
@keyframes catBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
@keyframes guideIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){.tutorial-guide{top:52px;right:5px;max-width:90vw}.tutorial-guide .guide-cat{font-size:2.5rem}.tutorial-guide .guide-bubble{font-size:.72rem;padding:8px 10px;max-width:245px}}

/* BOTTOM */
.bottom-bar{background:linear-gradient(180deg,#c9a84c,#a88b30);padding:6px 12px;display:flex;align-items:center;justify-content:space-between;border-top:3px solid #8b6914;flex-shrink:0;gap:8px}
.bot-left{display:flex;gap:6px}
.bot-btn{background:linear-gradient(180deg,#e8d5a0,#c4a574);border:3px solid #5a3a10;border-radius:10px;padding:6px 12px;font-size:.75rem;font-weight:900;color:#3a2a08;cursor:pointer;text-align:center;box-shadow:0 2px 0 #8b6914;font-family:inherit;min-width:60px}
.bot-btn .ic{font-size:1.2rem;display:block}
.bot-btn.gacha{background:linear-gradient(180deg,#7bed9f,#2ed573);border-color:#1a5c2e}
.bot-btn.yellow{background:linear-gradient(180deg,#ffe066,#f0c020)}
.bot-btn.red{background:linear-gradient(180deg,#ff7675,#e74c3c);color:#fff;border-color:#922b21}
.food-d{font-size:1rem;font-weight:900;color:#fff;background:#222;padding:3px 12px;border-radius:8px;border:2px solid #e74c3c}
.food-d span{color:#ff6b6b}
.back-round{width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,#ffe066,#f0c020);border:3px solid #5a3a10;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;box-shadow:0 2px 0 #8b6914;flex-shrink:0}

/* ===== STORAGE (떠다니는 캐릭터) ===== */
.storage-bg{flex:1;background:linear-gradient(180deg,#2a6b6b,#1a4a4a);position:relative;overflow:hidden}
.float-char{position:absolute;cursor:pointer;text-align:center;transition:transform .15s;z-index:1}
.float-char:hover{transform:scale(1.2);z-index:10}
.float-char .fc-emoji{font-size:2.2rem;filter:drop-shadow(1px 1px 2px rgba(0,0,0,.4))}
.float-char .fc-lv{font-size:.6rem;font-weight:900;color:#feca57;background:rgba(0,0,0,.5);border-radius:4px;padding:0 3px}
.float-char .fc-cnt{position:absolute;top:-4px;right:-6px;background:#e74c3c;color:#fff;font-size:.55rem;font-weight:900;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.storage-bottom{display:flex;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(180deg,#c9a84c,#a88b30);border-top:2px solid #8b6914}
.storage-info{margin-left:auto;font-size:.8rem;font-weight:700;color:#5a3a10}

/* ===== POWERUP ===== */
.pu-screen{flex:1;display:flex;flex-direction:column;background:linear-gradient(180deg,#f5e6c8,#e8d5a0);overflow:hidden}
.pu-cats{display:flex;gap:8px;padding:12px;overflow-x:auto;flex:1;align-items:center}
.pu-card{min-width:130px;width:130px;background:#1a1a1a;border:3px solid #555;border-radius:10px;padding:8px;text-align:center;cursor:pointer;flex-shrink:0;position:relative;transition:.15s}
.pu-card.selected{border-color:#f0c020;box-shadow:0 0 12px rgba(240,192,32,.5);transform:scale(1.08)}
.pu-card .pc-emoji{font-size:2.5rem}
.pu-card .pc-name{font-size:.75rem;font-weight:700;color:#fff;margin-top:2px}
.pu-card .pc-lv{font-size:.85rem;font-weight:900;color:#2ed573;margin-top:2px}
.pu-card .pc-rarity{font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:4px;display:inline-block;margin-top:2px}
.pu-desc{background:linear-gradient(180deg,#8b6914,#6b4e10);padding:10px 16px;text-align:center;font-size:.85rem;font-weight:700;color:#f5e6c8;min-height:50px}
.pu-actions{display:flex;gap:8px;padding:8px;justify-content:center;background:#2d2d2d}
.pu-actions button{font-family:inherit;font-weight:900;padding:8px 20px;border:3px solid #5a3a10;border-radius:10px;cursor:pointer;box-shadow:0 2px 0 #8b6914;font-size:.85rem}
.pu-lvup{background:linear-gradient(180deg,#ffe066,#f0c020);color:#3a2a08}
.pu-dupe{background:linear-gradient(180deg,#74b9ff,#0984e3);color:#fff;border-color:#0652a0}
.pu-cat-btns{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#d4b896}
.pu-cat-btn{font-family:inherit;font-weight:900;padding:8px 14px;border:2px solid #5a3a10;border-radius:8px;cursor:pointer;font-size:.8rem;white-space:nowrap;background:linear-gradient(180deg,#e8d5a0,#c4a574);color:#3a2a08}
.pu-cat-btn.active{background:linear-gradient(180deg,#ffe066,#f0c020)}

/* ===== FORMATION ===== */
.form-screen{flex:1;display:flex;flex-direction:column;background:linear-gradient(180deg,#f5e6c8,#e8d5a0);overflow:hidden}
.form-slots-area{padding:8px 12px;background:linear-gradient(180deg,#e8d5a0,#d4b896)}
.form-slots-label{font-size:.8rem;font-weight:900;color:#5a3a10;margin-bottom:4px}
.form-slots{display:flex;gap:6px;flex-wrap:wrap}
.form-slot{width:72px;height:72px;background:#1a1a1a;border:2px solid #888;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative}
.form-slot.filled{border-color:#f0c020}
.form-slot .fs-emoji{font-size:1.6rem}
.form-slot .fs-cost{font-size:.55rem;color:#feca57;font-weight:700}
.form-slot .fs-empty{font-size:.7rem;color:#555}
.form-pool-area{flex:1;overflow-y:auto;padding:8px}
.form-pool-label{font-size:.8rem;font-weight:900;color:#5a3a10;margin-bottom:6px}
.form-pool{display:flex;gap:6px;flex-wrap:wrap}
.form-char{width:80px;background:#1a1a1a;border:2px solid #555;border-radius:8px;padding:6px;text-align:center;cursor:pointer}
.form-char .fc-e{font-size:1.5rem}
.form-char .fc-n{font-size:.65rem;font-weight:700;color:#fff}
.form-char .fc-l{font-size:.6rem;color:#2ed573;font-weight:900}

/* ===== BATTLE ===== */
.battle-select{flex:1;overflow-y:auto;padding:10px;background:#4a6a5a}
.stage-btn{background:linear-gradient(180deg,#e67e22,#d35400);border:3px solid #6b3a00;border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer;box-shadow:0 3px 0 #6b3a00}
.stage-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6b3a00}
.stage-btn.cleared{background:linear-gradient(180deg,#27ae60,#1e8449);border-color:#0e5c2e}.stage-btn.locked{opacity:.45;cursor:not-allowed}
.stage-btn .sn{font-weight:900;font-size:.95rem;color:#fff;text-shadow:1px 1px 0 #000}
.stage-btn .si{font-size:.7rem;color:rgba(255,255,255,.8);margin-top:2px}

.battle-fs{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#1a1a1a}
@media (orientation: portrait) {
  .battle-fs {
    width: 100vw; height: 100vh;
    transform: none;
    top: 0; left: 0;
  }
}
.bf-top{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:rgba(0,0,0,.7);flex-shrink:0}
.bf-top .bt-name{font-weight:900;font-size:.9rem}
.bf-top .money{font-weight:900;font-size:1.1rem;color:#feca57}
.bf-area{flex:1;position:relative;background:linear-gradient(180deg,#1a3a2a 0%,#2d5a3a 30%,#4a7a4a 60%,#3a5a3a 100%);overflow:hidden}
.bf-sky{position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,#0a1a0a,#1a3a2a);pointer-events:none}
.bf-ground{position:absolute;bottom:0;left:0;right:0;height:28%;background:linear-gradient(180deg,#5a7a4a,#3a4a2a);border-top:3px solid #2a3a1a}
.bf-unit{position:absolute;bottom:22%;text-align:center;z-index:5;transition:none}
.bf-unit .bu-e{font-size:2rem;display:block;filter:drop-shadow(1px 1px 2px rgba(0,0,0,.5))}
.bf-unit .bu-e img{width:52px!important;height:64px!important;object-fit:cover;border-radius:4px!important;border:2px solid #fff!important;display:block;margin:0 auto}
.bf-unit .bu-hp{width:48px;height:5px;background:#333;border-radius:3px;margin:2px auto 0;overflow:hidden;border:1px solid #111}
.bf-unit .bu-hp-f{height:100%;background:#2ed573;transition:width .1s}
.bf-unit.enemy .bu-hp-f{background:#e74c3c}
.bf-unit.fighting .bu-e{animation:atkShake .2s infinite}
@keyframes atkShake{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.bf-base{position:absolute;bottom:14%;z-index:3;text-align:center}
.bf-base .bb-e{font-size:2.8rem}
.bf-base .bb-hp{width:50px;height:6px;background:#333;border-radius:3px;margin:2px auto;overflow:hidden;border:1px solid #111}
.bf-base .bb-hp-f{height:100%;background:#3498db}
.bf-base.enemy-b{left:2%}
.bf-base.enemy-b .bb-hp-f{background:#e74c3c}
.bf-base.ally-b{right:2%}
.bf-deploy{display:flex;gap:5px;padding:8px;background:#111;justify-content:center;flex-wrap:wrap;flex-shrink:0;border-top:2px solid #333}
.deploy-slot{width:70px;background:#1a1a1a;border:2px solid #555;border-radius:8px;padding:5px;text-align:center;cursor:pointer;opacity:.45;transition:.15s}
.deploy-slot.ready{opacity:1;border-color:#f0c020;box-shadow:0 0 8px rgba(240,192,32,.3)}
.deploy-slot:active{transform:scale(.95)}
.deploy-slot .ds-e{font-size:1.5rem}
.deploy-slot .ds-n{font-size:.55rem;font-weight:700;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deploy-slot .ds-r{font-size:.5rem;color:#9be7ff;font-weight:900;white-space:nowrap}
.deploy-slot .ds-c{font-size:.6rem;color:#feca57;font-weight:900}
.bf-bottom{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0a0a0a;flex-shrink:0}
.bf-bottom .back-round{width:40px;height:40px}

/* ===== GACHA ===== */
.gacha-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#2a3a4a;padding:10px}
.slot-m{background:linear-gradient(145deg,#2d2d44,#1a1a2e);border:4px solid #f0c020;border-radius:14px;padding:12px;box-shadow:0 0 0 3px #8b6914;max-width:340px;width:100%}
.reels{display:flex;gap:5px;justify-content:center;background:#0a0a14;border-radius:8px;padding:6px;border:2px solid #333;overflow:hidden;position:relative}
.reel{width:85px;height:110px;background:#111;border-radius:6px;overflow:hidden;position:relative;border:2px solid #444}
.reel-strip{position:absolute;width:100%}
.reel-item{height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3px;border-bottom:1px solid #222}
.reel-item .emoji{font-size:1.4rem}
.reel-item .rl{font-size:.55rem;font-weight:700;opacity:.85}
.reel-item .cn{font-size:.75rem;font-weight:900;word-break:keep-all}
.reel-item.common{background:linear-gradient(145deg,#1a3a1a,#2d5a2d);color:#4ade80}
.reel-item.rare{background:linear-gradient(145deg,#1a2a4a,#2d4a7a);color:#60a5fa}
.reel-item.epic{background:linear-gradient(145deg,#2a1a4a,#4a2d7a);color:#c084fc}
.reel-item.legendary{background:linear-gradient(145deg,#4a3a1a,#7a5a2d);color:#fbbf24}
.reel-item.mythic{background:linear-gradient(145deg,#4a1a1a,#7a2d2d);color:#f87171}
.reel-item.secret{background:linear-gradient(145deg,#0a0a0a,#1a1a1a);color:#fff}
.reel-item.god{background:linear-gradient(145deg,#f8f8f8,#e0e0e0);color:#111}
.reels::after{content:'';position:absolute;left:5px;right:5px;top:50%;height:110px;transform:translateY(-50%);border-top:2px solid rgba(240,192,32,.5);border-bottom:2px solid rgba(240,192,32,.5);pointer-events:none;border-radius:4px}
.spin-msg{text-align:center;color:#f0c020;font-weight:700;min-height:20px;font-size:.85rem}
.gacha-btns{display:flex;gap:8px}
.gacha-btns button{font-family:inherit;font-size:.9rem;font-weight:900;padding:8px 18px;border:3px solid #5a3a10;border-radius:10px;cursor:pointer;box-shadow:0 2px 0 #8b6914}
.gacha-btns button:disabled{opacity:.5}
.btn-1{background:linear-gradient(180deg,#7bed9f,#2ed573);color:#1a5c2e}
.btn-3{background:linear-gradient(180deg,#ffeaa7,#fdcb6e);color:#6b4c00}.btn-30{background:linear-gradient(180deg,#ff9ff3,#f368e0);color:#5b1453}
.rates-info{font-size:.65rem;color:rgba(255,255,255,.45);text-align:center;line-height:1.4}

/* ===== GACHA ROSTER ===== */
.gacha-roster{width:100%;max-width:700px;background:#1b2530;border:3px solid #f0c020;border-radius:12px;padding:8px;overflow-y:auto;max-height:30vh}
.gacha-roster-title{text-align:center;font-weight:900;color:#ffeaa7;margin-bottom:6px;font-size:.85rem}
.gacha-roster-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.gacha-roster-item{background:#111a22;border:1px solid #555;border-radius:6px;padding:4px;text-align:center;min-width:0}
.gacha-roster-item .gr-name{font-size:.55rem;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gacha-roster-item .gr-rarity{font-size:.48rem;font-weight:900}
@media(max-width:700px){.gacha-roster-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.gacha-roster{max-height:27vh}}

/* MODAL */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-ov.show{display:flex}
.modal-box{background:#f5e6c8;border-radius:12px;padding:18px;max-width:300px;width:100%;text-align:center;border:4px solid #8b6914;color:#3a2a08}
.modal-box h3{margin-bottom:6px;font-size:1rem}
.modal-box p{margin-bottom:12px;font-size:.8rem;white-space:pre-line;font-weight:700}
.modal-box .mb{display:flex;gap:6px;justify-content:center}
.modal-box .mb button{font-family:inherit;font-weight:900;padding:7px 16px;border:3px solid #5a3a10;border-radius:8px;cursor:pointer;box-shadow:0 2px 0 #8b6914;font-size:.8rem}
.mok{background:linear-gradient(180deg,#ffe066,#f0c020);color:#3a2a08}
.mca{background:linear-gradient(180deg,#dfe6e9,#b2bec3);color:#2d3436}

#fireworks{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.firework{position:absolute;width:5px;height:5px;border-radius:50%;animation:fw 1.2s ease-out forwards}
@keyframes fw{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--fx),var(--fy)) scale(0);opacity:0}}
.screen-shake{animation:sk .5s ease-in-out}

.form-right .form-pool-area{flex:1;min-height:0;overflow-y:auto;padding:8px}
.form-right .form-pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
.form-right .form-char{width:auto;padding:4px}
.form-right .fc-e{font-size:0}

/* ===== 던전 화면: 스크롤 + 카드 정리 ===== */
.dungeon-screen{flex:1;min-height:0;overflow-y:auto;box-sizing:border-box;padding:10px 12px 16px;background:linear-gradient(180deg,#f5e6c8,#e8d5a0);color:#3a2a08}
.dungeon-screen h2{margin:0 0 4px;font-size:1.05rem}
.dungeon-screen>p{margin:0 0 8px;font-size:.72rem;line-height:1.4}
.dg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.dungeon-card{background:#fff8e1;border:3px solid #b08a3c;border-radius:12px;padding:8px 10px;font-size:.78rem;line-height:1.45}
.dungeon-card h3{margin:0 0 4px;font-size:.9rem}
.dungeon-card button,.cat-use button{font-family:inherit;font-weight:900;padding:6px 12px;border:3px solid #5a3a10;border-radius:10px;background:linear-gradient(180deg,#ffe066,#f0c020);color:#3a2a08;cursor:pointer;margin-top:4px}
.dungeon-card button:disabled{opacity:.5;cursor:not-allowed}
.cat-use{margin-top:10px;background:#fff8e1;border:3px solid #b08a3c;border-radius:12px;padding:8px 10px}
.cat-use h3{margin:0 0 4px;font-size:.9rem}

/* ===== 스테이지별 풍경: 하늘·지형·원경이 전투 필드와 한 장면처럼 연결 ===== */
.bf-area{isolation:isolate;background:#9ad8ff}
.bf-sky{z-index:0}
.bf-clouds{z-index:1}
.bf-ground{z-index:2}

.bf-area:before{content:"";position:absolute;z-index:1;left:0;right:0;bottom:26%;height:43%;pointer-events:none;opacity:.92;
 background:
  radial-gradient(ellipse at 14% 100%,var(--far,#86b9a2) 0 22%,transparent 22.5%),
  radial-gradient(ellipse at 36% 100%,var(--far,#86b9a2) 0 30%,transparent 30.5%),
  radial-gradient(ellipse at 67% 100%,var(--far,#86b9a2) 0 27%,transparent 27.5%),
  radial-gradient(ellipse at 91% 100%,var(--far,#86b9a2) 0 23%,transparent 23.5%);
}
.bf-area:after{content:"";position:absolute;z-index:2;left:0;right:0;bottom:27%;height:25%;pointer-events:none;
 background:linear-gradient(180deg,transparent 0 68%,rgba(255,255,255,.07) 69% 72%,transparent 73%);
}
.bf-ground{position:absolute;z-index:4}
.bf-base,.bf-unit{z-index:5}

.fx-nyanko .nyanko-wave{position:absolute;right:8%;bottom:12%;width:34px;height:34px;border:6px solid #fff36b;border-radius:50%;box-shadow:0 0 10px #ffd52e,0 0 24px #ffef8a;animation:nyankoWave .65s ease-out forwards}
.fx-nyanko .wave2{animation-delay:.12s;border-color:#ff9f43}
@keyframes nyankoWave{from{right:8%;transform:translateY(0) scale(.5);opacity:1}to{right:88%;transform:translateY(-16px) scale(2.4);opacity:0}}
.fx-lightning span{position:absolute;right:8%;top:14%;font-size:clamp(3rem,8vw,6rem);color:#fff600;-webkit-text-stroke:2px #fff;filter:drop-shadow(0 0 8px #00d9ff);animation:lightningSweep .75s ease-out forwards}
.fx-lightning span:nth-child(2){top:38%;right:25%;font-size:clamp(2.5rem,6vw,4.5rem);animation-delay:.08s}
.fx-lightning span:nth-child(3){top:58%;right:48%;font-size:clamp(2.5rem,6vw,4.5rem);animation-delay:.15s}
@keyframes lightningSweep{0%{opacity:0;transform:scale(.3) rotate(-15deg)}20%{opacity:1;transform:scale(1.2) rotate(12deg)}80%{opacity:1}100%{opacity:0;transform:scale(.8) rotate(-8deg)}}
.fx-canon .canon-ball{position:absolute;right:7%;bottom:13%;font-size:clamp(2.5rem,6vw,4rem);animation:canonShot .6s cubic-bezier(.2,.7,.4,1) forwards;filter:drop-shadow(0 0 8px #ff9b32)}
.fx-canon .canon-trail{position:absolute;right:8%;bottom:18%;width:0;height:8px;background:linear-gradient(90deg,transparent,#ffcf68,#fff);border-radius:8px;box-shadow:0 0 10px #ff9b32;animation:canonTrail .55s ease-out forwards}
@keyframes canonShot{from{right:7%;transform:scale(.5) rotate(0);opacity:1}to{right:88%;transform:scale(1.3) rotate(-360deg);opacity:0}}
@keyframes canonTrail{from{right:8%;width:0;opacity:1}to{right:86%;width:75%;opacity:0}}


/* ===== 맵 테마 배경 ===== */
.battle-fs{background:var(--dirt2,#6a4220)}
.bf-sky{background:var(--sky,linear-gradient(180deg,#80c9fb 0%,#b9e3ff 55%,#e3f4ff 70%))}
.bf-clouds{opacity:var(--clo,1);background:
 radial-gradient(ellipse 14% 22% at 10% 30%,rgba(var(--cl,255,255,255),.9),transparent 72%),
 radial-gradient(ellipse 18% 26% at 32% 55%,rgba(var(--cl,255,255,255),.85),transparent 72%),
 radial-gradient(ellipse 13% 20% at 54% 25%,rgba(var(--cl,255,255,255),.9),transparent 72%),
 radial-gradient(ellipse 17% 24% at 78% 50%,rgba(var(--cl,255,255,255),.85),transparent 72%);
 background-size:50% 100%;background-repeat:repeat-x}
.bf-ground{z-index:2;background:var(--gpat,repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 7px,transparent 7px 16px)),var(--ground,linear-gradient(180deg,#9be05f 0%,#6cc24a 55%,#5aae3c 100%));border-top:3px solid var(--gtop,#4a9a2e)}
.bf-zig{z-index:3;background:linear-gradient(135deg,var(--zig,#5aae3c) 25%,transparent 25%) -8px 0,linear-gradient(225deg,var(--zig,#5aae3c) 25%,transparent 25%) -8px 0;background-size:16px 16px;background-color:var(--dirt,#8a5a2b)}
.bf-deploy{background:linear-gradient(180deg,var(--dirt,#8a5a2b),var(--dirt2,#6a4220))}
.bf-deco{position:absolute;left:0;top:0;width:100%;height:62%;pointer-events:none;z-index:1}
.bf-fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3}
.fx-stars{height:62%;background:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#fff,transparent),radial-gradient(1px 1px at 160px 20px,#fff,transparent),radial-gradient(2px 2px at 230px 60px,#ffeaa7,transparent),radial-gradient(1px 1px at 300px 110px,#fff,transparent),radial-gradient(1.5px 1.5px at 60px 130px,#fff,transparent),radial-gradient(1px 1px at 270px 25px,#cfe8ff,transparent);background-size:320px 150px;animation:fxTwinkle 3.2s ease-in-out infinite}
.fx-gold{height:62%;background:radial-gradient(2px 2px at 40px 40px,#ffe98a,transparent),radial-gradient(1.5px 1.5px at 120px 100px,#fff3b0,transparent),radial-gradient(2px 2px at 210px 60px,#ffd23c,transparent),radial-gradient(1.5px 1.5px at 280px 120px,#ffe98a,transparent);background-size:300px 150px;animation:fxTwinkle 2.4s ease-in-out infinite}
@keyframes fxTwinkle{50%{opacity:.4}}
.fx-snow{background:radial-gradient(2.5px 2.5px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 80px 120px,#fff,transparent),radial-gradient(3px 3px at 140px 70px,#fff,transparent),radial-gradient(2px 2px at 40px 170px,#fff,transparent);background-size:170px 200px;animation:fxFall 7s linear infinite}
.fx-snow2{opacity:.8;background:radial-gradient(1.5px 1.5px at 30px 50px,#fff,transparent),radial-gradient(1.5px 1.5px at 110px 20px,#fff,transparent),radial-gradient(2px 2px at 70px 130px,#fff,transparent);background-size:120px 150px;animation:fxFall2 4.5s linear infinite}
.fx-ash{background:radial-gradient(2px 2px at 30px 40px,rgba(210,210,210,.85),transparent),radial-gradient(2.5px 2.5px at 110px 120px,rgba(180,180,180,.85),transparent),radial-gradient(2px 2px at 70px 170px,rgba(230,230,230,.8),transparent);background-size:150px 200px;animation:fxFall 9s linear infinite}
@keyframes fxFall{to{background-position:0 200px}}
@keyframes fxFall2{to{background-position:0 150px}}
.fx-embers{background:radial-gradient(2.5px 2.5px at 30px 150px,#ff9a3a,transparent),radial-gradient(2px 2px at 90px 90px,#ffd23c,transparent),radial-gradient(3px 3px at 150px 40px,#ff6a1a,transparent),radial-gradient(2px 2px at 60px 20px,#ffb040,transparent);background-size:180px 180px;animation:fxRise 5s linear infinite}
.fx-embers2{opacity:.85;background:radial-gradient(2px 2px at 20px 100px,#ffb040,transparent),radial-gradient(1.5px 1.5px at 80px 40px,#ff7a2a,transparent),radial-gradient(2px 2px at 100px 120px,#ffd23c,transparent);background-size:130px 130px;animation:fxRise2 3.6s linear infinite}
@keyframes fxRise{to{background-position:0 -180px}}
@keyframes fxRise2{to{background-position:0 -130px}}
.fx-fire2{background:radial-gradient(3px 3px at 40px 90px,#d8ff7a,transparent),radial-gradient(2.5px 2.5px at 130px 40px,#b8ff6a,transparent),radial-gradient(3px 3px at 180px 120px,#e8ff9a,transparent);background-size:220px 160px;animation:fxTwinkle 3.8s ease-in-out infinite}
.fx-motes{background:radial-gradient(2px 2px at 50px 60px,rgba(255,225,160,.85),transparent),radial-gradient(1.5px 1.5px at 140px 110px,rgba(255,235,190,.85),transparent),radial-gradient(2px 2px at 210px 30px,rgba(255,215,140,.8),transparent);background-size:240px 150px;animation:fxTwinkle 4s ease-in-out infinite}
.fx-dust,.fx-wind{height:62%;background:repeating-linear-gradient(100deg,transparent 0 60px,rgba(255,235,180,.18) 60px 64px,transparent 64px 130px);background-size:260px 100%;animation:fxWind 2.6s linear infinite}
.fx-wind{background:repeating-linear-gradient(100deg,transparent 0 70px,rgba(255,255,255,.28) 70px 74px,transparent 74px 150px);background-size:300px 100%;animation:fxWind3 2s linear infinite}
.fx-dust2{height:62%;opacity:.7;background:repeating-linear-gradient(100deg,transparent 0 40px,rgba(230,215,190,.16) 40px 43px,transparent 43px 90px);background-size:180px 100%;animation:fxWind2 1.8s linear infinite}
@keyframes fxWind{to{background-position:-260px 0}}
@keyframes fxWind2{to{background-position:-180px 0}}
@keyframes fxWind3{to{background-position:-300px 0}}
.fx-bubbles{background:radial-gradient(circle at 20px 150px,transparent 0 4px,rgba(255,255,255,.55) 5px,transparent 6px),radial-gradient(circle at 90px 90px,transparent 0 6px,rgba(255,255,255,.5) 7px,transparent 8px),radial-gradient(circle at 140px 30px,transparent 0 3px,rgba(255,255,255,.55) 4px,transparent 5px);background-size:170px 200px;animation:fxRise3 6s linear infinite}
@keyframes fxRise3{to{background-position:0 -200px}}
.fx-rays{height:62%;background:repeating-linear-gradient(110deg,rgba(255,255,255,.14) 0 22px,transparent 22px 90px);animation:fxRay 6s ease-in-out infinite}
@keyframes fxRay{50%{opacity:.3}}
.fx-fog{top:38%;height:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent 40%,rgba(255,255,255,.18),transparent);background-size:200% 100%;animation:fxFog 18s linear infinite}
@keyframes fxFog{to{background-position:200% 0}}
.fx-flash{background:rgba(225,235,255,.85);opacity:0;animation:fxFlash 6.5s linear infinite}
@keyframes fxFlash{0%,90%,100%{opacity:0}91%{opacity:.7}92%{opacity:0}93.5%{opacity:.45}95%{opacity:0}}

/* ===== 맵 디테일 애니메이션 ===== */
.bf-clouds{animation:cloudMove var(--clspd,80s) linear infinite}
.fx-clouds2{top:18%;height:42%;width:200%;opacity:.9;background:radial-gradient(ellipse 20% 26% at 20% 40%,rgba(255,255,255,.88),transparent 72%),radial-gradient(ellipse 16% 22% at 70% 55%,rgba(255,255,255,.82),transparent 72%);background-size:50% 100%;background-repeat:repeat-x;animation:cloudMove 38s linear infinite}
.bf-deco.bob{animation:bobY 6s ease-in-out infinite}
.bf-deco.bob2{animation:bobY 7.5s ease-in-out infinite reverse}
@keyframes bobY{50%{transform:translateY(-6px)}}
.bf-deco.rock{animation:rockBoat 4s ease-in-out infinite}
@keyframes rockBoat{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(3px) rotate(.5deg)}}
.bf-deco.pulse{animation:fxGlow 4.8s ease-in-out infinite}
@keyframes fxGlow{50%{opacity:.5}}
.bf-deco.flicker{animation:fxFlick 1.7s steps(1) infinite}
@keyframes fxFlick{0%{opacity:1}20%{opacity:.7}40%{opacity:.95}60%{opacity:.6}80%{opacity:.9}100%{opacity:1}}
.bf-deco.drift{animation:cometDrift 9s linear infinite}
@keyframes cometDrift{0%{transform:translateX(80px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(-140px);opacity:0}}
.spin{animation:spinA 16s linear infinite}
.spinr{animation:spinA 22s linear infinite reverse}
@keyframes spinA{to{transform:rotate(360deg)}}
.fx-birds{height:62%;overflow:hidden}
.bd{position:absolute;left:-6%;animation:birdFly linear infinite}
.bd svg{display:block;animation:flap .5s ease-in-out infinite}
.bd.bat{animation-name:birdFly,batBob;animation-timing-function:linear,ease-in-out;animation-iteration-count:infinite,infinite;animation-direction:normal,alternate}
.bd.bat svg{animation-duration:.25s}
@keyframes birdFly{from{left:-6%}to{left:104%}}
@keyframes batBob{to{margin-top:16px}}
@keyframes flap{50%{transform:scaleY(.4)}}
.fx-fish{height:62%;overflow:hidden}
.fi{position:absolute}
.fi.r{left:-6%;animation:birdFly linear infinite}
.fi.l{left:104%;animation:fishL linear infinite}
.fi.l svg{transform:scaleX(-1)}
@keyframes fishL{from{left:104%}to{left:-6%}}
.fx-waves{top:50%;height:12%;width:200%;animation:cloudMove 9s linear infinite}
.fx-waves svg{width:100%;height:100%;display:block}
.fx-train{height:62%;overflow:hidden}
.tr{position:absolute;top:55%;left:-14%;animation:birdFly 16s linear infinite}
.tr svg{display:block}
.fx-smoke i{position:absolute;bottom:44%;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:radial-gradient(circle,rgba(75,65,65,.6),transparent 70%);animation:smokeUp 8.8s linear infinite}
@keyframes smokeUp{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.85}100%{transform:translate(20px,-130px) scale(2.3);opacity:0}}
.fx-bolt{height:62%;opacity:0;animation:fxFlash 6.5s linear infinite;animation-delay:.05s}
.fx-bolt polyline{fill:none;stroke:#fff;stroke-width:2.2;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px #bcd0ff)}
.fx-shoot{height:62%;overflow:hidden}
.fx-shoot i{position:absolute;top:10%;left:80%;width:70px;height:2px;background:linear-gradient(90deg,#fff,transparent);opacity:0;animation:fxShoot 7s linear infinite}
.fx-shoot.meteor i{height:3px;width:90px;background:linear-gradient(90deg,#ffb060,transparent)}
@keyframes fxShoot{0%{opacity:0;transform:translate(0,0) rotate(-28deg)}2%{opacity:1}12%{opacity:0;transform:translate(-300px,170px) rotate(-28deg)}100%{opacity:0}}
.fx-leaves{background:radial-gradient(4px 2.5px at 30px 20px,#6bbf4a,transparent),radial-gradient(4px 2.5px at 110px 90px,#e8a83a,transparent),radial-gradient(3px 2px at 70px 150px,#8fd45a,transparent);background-size:150px 190px;animation:fxFall3 8s linear infinite}
.fx-petals{background:radial-gradient(4px 3px at 30px 20px,#ffb0c8,transparent),radial-gradient(3px 2.5px at 100px 80px,#ffd0e0,transparent),radial-gradient(4px 3px at 60px 140px,#ff9ab8,transparent);background-size:140px 180px;animation:fxFall3 9s linear infinite}
.fx-feathers{opacity:.85;background:radial-gradient(1.5px 5px at 40px 30px,#fff,transparent),radial-gradient(1.5px 4px at 120px 100px,#fff8dc,transparent),radial-gradient(1.5px 5px at 80px 160px,#fff,transparent);background-size:160px 200px;animation:fxFall4 12s linear infinite}
.fx-confetti{background:radial-gradient(2.5px 2.5px at 20px 20px,#ff6a6a,transparent),radial-gradient(2.5px 2.5px at 70px 60px,#6ad0ff,transparent),radial-gradient(2.5px 2.5px at 120px 40px,#ffd23c,transparent),radial-gradient(2.5px 2.5px at 50px 110px,#7aff8a,transparent),radial-gradient(2.5px 2.5px at 150px 130px,#d08aff,transparent);background-size:170px 150px;animation:fxFall5 3.8s linear infinite}
@keyframes fxFall3{to{background-position:0 190px}}
@keyframes fxFall4{to{background-position:0 200px}}
@keyframes fxFall5{to{background-position:0 150px}}
.fx-lavabub{top:40%;height:60%;background:radial-gradient(circle at 20px 120px,transparent 0 5px,rgba(255,150,50,.85) 6px,transparent 8px),radial-gradient(circle at 90px 60px,transparent 0 7px,rgba(255,190,70,.8) 8px,transparent 10px),radial-gradient(circle at 130px 130px,transparent 0 4px,rgba(255,120,40,.85) 5px,transparent 7px);background-size:160px 160px;animation:fxRise4 5s linear infinite}
.fx-bubbles2{top:40%;height:60%;background:radial-gradient(circle at 25px 120px,transparent 0 5px,rgba(170,235,120,.65) 6px,transparent 8px),radial-gradient(circle at 100px 70px,transparent 0 7px,rgba(200,245,140,.6) 8px,transparent 10px),radial-gradient(circle at 140px 140px,transparent 0 4px,rgba(150,225,110,.65) 5px,transparent 7px);background-size:170px 170px;animation:fxRise5 6s linear infinite}
@keyframes fxRise4{to{background-position:0 -160px}}
@keyframes fxRise5{to{background-position:0 -170px}}
.fx-wisp{opacity:.8;background:radial-gradient(9px 9px at 60px 80px,rgba(150,225,255,.75),transparent),radial-gradient(7px 7px at 170px 40px,rgba(190,235,255,.7),transparent),radial-gradient(8px 8px at 250px 110px,rgba(140,215,255,.7),transparent);background-size:300px 160px;animation:fxDrift 9s ease-in-out infinite alternate}
@keyframes fxDrift{from{background-position:0 0}to{background-position:40px -24px}}
.fx-rain{transform:skewX(-10deg);background:radial-gradient(1px 8px at 20px 20px,rgba(205,220,255,.75),transparent),radial-gradient(1px 8px at 55px 70px,rgba(205,220,255,.75),transparent),radial-gradient(1px 8px at 85px 40px,rgba(205,220,255,.75),transparent);background-size:100px 100px;animation:fxFall6 .55s linear infinite}
@keyframes fxFall6{to{background-position:0 100px}}
.fx-drip{background:radial-gradient(1.5px 4px at 80px 20px,rgba(150,200,255,.85),transparent),radial-gradient(1.5px 4px at 230px 60px,rgba(150,200,255,.85),transparent);background-size:300px 170px;animation:fxFall7 2.4s linear infinite}
@keyframes fxFall7{to{background-position:0 170px}}
.fx-glint{background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);background-size:250% 100%;animation:fxGlint 5s ease-in-out infinite}
@keyframes fxGlint{from{background-position:120% 0}to{background-position:-60% 0}}
.fx-aurora{height:50%;filter:blur(8px);background:linear-gradient(90deg,rgba(80,255,180,0),rgba(80,255,180,.3),rgba(120,160,255,.3),rgba(200,100,255,.24),rgba(200,100,255,0));background-size:200% 100%;animation:fxAur 12s ease-in-out infinite alternate}
@keyframes fxAur{from{background-position:0 0;opacity:.5}to{background-position:100% 0;opacity:1}}
.fx-flicker{background:radial-gradient(ellipse 30% 40% at 20% 35%,rgba(255,190,90,.28),transparent),radial-gradient(ellipse 30% 40% at 80% 35%,rgba(255,190,90,.25),transparent);animation:fxFlick 2.2s steps(1) infinite}
.fx-aura{background:radial-gradient(ellipse at 50% 100%,rgba(160,60,220,.38),transparent 65%);animation:fxAura 3.5s ease-in-out infinite}
@keyframes fxAura{50%{opacity:.3}}
.fx-flames{top:44%;height:18%;transform-origin:bottom;background:radial-gradient(ellipse 14px 26px at 14px 100%,rgba(255,150,40,.9),transparent 70%) 0 0/28px 100%,radial-gradient(ellipse 10px 18px at 10px 100%,rgba(255,225,110,.9),transparent 70%) 6px 0/22px 100%;animation:fxFlame .6s ease-in-out infinite alternate}
@keyframes fxFlame{from{transform:scaleY(.8)}to{transform:scaleY(1.2)}}

/* ===== 전투 UI 2차 리뉴얼 (스크린샷 스타일) ===== */
.bf-top .bt-right{align-items:flex-end;gap:3px}
.bf-top .bt-name{font-size:1.05rem;text-align:right}
.bf-top .money{font-variant-numeric:tabular-nums;min-width:120px;text-align:right}
.money-gauge{width:128px;height:8px;border:2px solid #1d1d1d;background:#3a3a3a;border-radius:5px;overflow:hidden}
.money-gauge i{display:block;height:100%;width:0;background:linear-gradient(180deg,#fff2a0,#f0b400);transition:width .15s linear}
.bf-float{position:absolute;bottom:34%;z-index:8;font-weight:900;font-size:.85rem;color:#ffd23c;-webkit-text-stroke:3px #1d1d1d;paint-order:stroke fill;pointer-events:none;transform:translateX(-50%);animation:floatUp .9s ease-out forwards}
@keyframes floatUp{from{opacity:1;margin-bottom:0}to{opacity:0;margin-bottom:36px}}
.round-btn{position:relative;width:90px;height:90px;border-radius:50%;flex-shrink:0;align-self:center;border:5px solid #262626;background:radial-gradient(circle at 35% 30%,#f2f2f2,#8f8f8f);overflow:hidden;padding:0;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.round-btn .rb-cat{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);line-height:0}
.round-btn .rb-lv{position:absolute;top:5px;left:0;right:0;text-align:center;font-weight:900;font-size:.58rem;color:#555;-webkit-text-stroke:2.5px #fff;paint-order:stroke fill;z-index:2}
.round-btn .rb-cost{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-weight:900;font-size:.9rem;color:#ffd23c;-webkit-text-stroke:3.5px #1d1d1d;paint-order:stroke fill;z-index:2}
.round-btn.wallet:not(.ready){filter:grayscale(.95) brightness(.85)}
.round-btn.wallet.ready{background:radial-gradient(circle at 35% 30%,#fff8c8,#f0b400);border-color:#ffd23c;box-shadow:0 0 14px rgba(255,210,60,.95)}
.round-btn.wallet:disabled{filter:none;background:radial-gradient(circle at 35% 30%,#fff8c8,#d8a010);border-color:#b08a20}
.round-btn.cannon{background:radial-gradient(circle,#777,#3a3a3a);border-color:#2a2a2a}
.round-btn.cannon .rb-ring{position:absolute;inset:0;border-radius:50%;z-index:1;background:conic-gradient(transparent 0deg var(--p,0deg),rgba(0,0,0,.62) var(--p,0deg) 360deg)}
.round-btn.cannon .rb-ic{position:absolute;top:3px;left:8px;font-size:.85rem;z-index:2}
.round-btn.cannon .rb-txt{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-weight:900;font-size:.92rem;color:#fff;-webkit-text-stroke:3.5px #1d1d1d;paint-order:stroke fill;z-index:2}
.round-btn.cannon.ready{background:radial-gradient(circle,#ffb4ec,#d02ab0);border-color:#fff;box-shadow:0 0 18px #ff6ad8;animation:cannonReady .9s ease-in-out infinite alternate}
.round-btn.cannon.ready .rb-ring{display:none}
.round-btn.cannon.ready .rb-txt{font-size:.8rem}
@keyframes cannonReady{to{box-shadow:0 0 30px #ff9be8;transform:scale(1.05)}}
.round-btn:active:not(:disabled){transform:scale(.96)}
.deploy-slot{border-color:#1a1a1a;border-radius:4px;opacity:1;background:linear-gradient(180deg,#d4d4d4,#9a9a9a)}
.deploy-slot:not(.ready){filter:grayscale(.9) brightness(.82)}
.deploy-slot.ready{border-color:#ffd23c;box-shadow:0 0 12px rgba(255,210,60,.85)}
.deploy-slot .ds-e{inset:3px 3px 20px 3px}
.deploy-slot .ds-c{left:auto;right:4px;top:auto;bottom:11px;font-size:.78rem;-webkit-text-stroke:3px #1d1d1d}
.deploy-slot .ds-r{left:3px;right:auto;top:2px}
.deploy-slot .ds-bar{height:6px;bottom:3px}
.bf-base{position:absolute}
.bf-base.dmg1 .crack1,.bf-base.dmg2 .crack2{opacity:1}
.bf-base .crack{opacity:0;transition:opacity .4s}
.bf-base.dmg2::after{content:"🔥";position:absolute;top:28%;left:50%;margin-left:-12px;font-size:1.3rem;animation:fxFlick 1s steps(1) infinite}
.bf-base.bhit .bb-e{animation:baseShake .15s linear}
@keyframes baseShake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.bf-base.ally-b.fire .bb-e{animation:recoil .45s ease-out}
@keyframes recoil{25%{transform:translateX(7px)}}

.si-deco{position:absolute;left:0;top:0;width:100%;height:68%}
.si-name{font-weight:900;font-size:.82rem;margin-top:3px}
.si-desc{font-size:.62rem;line-height:1.35;color:#5a4a30;margin-top:1px;max-height:3.9em;overflow:auto}
.si-right{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.si-box{background:rgba(255,255,255,.72);border:2px solid #b89a5a;border-radius:10px;padding:3px 7px}
.si-box .en-t{color:#5a3a10}
.si-box .en-i small{color:#444}
.si-rw{font-weight:900;font-size:.9rem;color:#2a6a2a}
.si-sub{font-size:.58rem;color:#6a5a40}
.si-strip{display:flex;gap:4px}
.si-st{position:relative;flex:1;height:30px;border:3px solid #3a2208;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}
.si-st b{color:#fff;font-size:.72rem;-webkit-text-stroke:2px #000;paint-order:stroke fill}
.si-st em{position:absolute;right:2px;bottom:0;font-style:normal;font-size:.6rem}
.si-st.on{border-color:#ffd23c;box-shadow:0 0 0 2px #ffd23c}
.si-st.lk{filter:grayscale(1) brightness(.7)}
.bf-unit.imgboss{width:150px;margin-left:-75px}
.bf-unit .bu-e img.bu-img{width:auto!important;height:clamp(96px,30vh,170px)!important;max-width:none;object-fit:contain!important;filter:drop-shadow(0 4px 3px rgba(0,0,0,.5))}
.bf-unit.imgboss .bu-shadow{width:110px;margin-left:-55px}
.combo-ban{position:absolute;left:50%;top:20%;transform:translateX(-50%);z-index:70;min-width:min(300px,86%);padding:8px 12px 9px;border-radius:16px;background:linear-gradient(180deg,rgba(40,10,70,.94),rgba(18,4,40,.94));border:3px solid #d46aff;box-shadow:0 0 18px #c040ff,inset 0 0 14px rgba(200,100,255,.45);color:#fff;text-align:center;pointer-events:none;animation:cbIn .45s ease-out}
.combo-ban.out{animation:cbOut .6s ease-in forwards}
.cb-t{font-weight:900;font-size:1.05rem;color:#ffe9ff;text-shadow:0 0 8px #e070ff;margin-bottom:4px;letter-spacing:1px}
.cb-r{display:flex;align-items:center;gap:8px;justify-content:center;background:rgba(255,255,255,.1);border:2px solid rgba(255,200,255,.5);border-radius:10px;padding:3px 8px;margin-top:4px}
.cb-faces{display:flex;gap:3px}
.cb-f{display:block;width:30px;height:34px;overflow:hidden;border-radius:6px;background:#fff;text-align:center}
.cb-f img{width:30px!important;height:34px!important;border:none!important;border-radius:0!important}
.cb-i{display:flex;flex-direction:column;text-align:left}
.cb-i b{font-size:.78rem;color:#ffd8ff}
.cb-i small{font-size:.62rem;color:#e8d8ff}
.cb-more{font-size:.65rem;margin-top:3px;color:#dcc}
@keyframes cbIn{from{opacity:0;transform:translateX(-50%) scale(.6)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes cbOut{to{opacity:0;transform:translateX(-50%) translateY(-18px) scale(.95)}}
@media(max-height:360px){.si-card{padding:4px 8px 6px;gap:3px}.si-thumb{height:56px}.si-desc{max-height:2.7em}.si-st{height:24px}.si-h{font-size:.8rem}}
/* ===== 외형 디테일 · 공격 모션 ===== */
.bf-unit{--dir:-1}.bf-unit.enemy{--dir:1}
.bf-unit .bu-body{will-change:transform}
.en-svg{width:62px;height:54px;display:block;overflow:visible;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.bf-unit.boss .en-svg{width:100px;height:88px}
.bf-unit.boss .bu-body{position:relative}
.bf-unit.boss:not(.imgboss) .bu-body::before{content:"";position:absolute;left:50%;top:55%;width:120px;height:90px;margin:-45px 0 0 -60px;border-radius:50%;background:radial-gradient(circle,rgba(255,60,60,.38),rgba(255,60,60,0) 68%);z-index:-1;animation:bossAura 1.4s ease-in-out infinite}
.bf-unit.boss:not(.imgboss) .bu-body::after{content:"👑";position:absolute;left:50%;top:-14px;margin-left:-11px;font-size:1.25rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));animation:crownB 1.2s ease-in-out infinite}
.bf-unit.imgboss .bu-body::before{content:"";position:absolute;left:50%;top:55%;width:150px;height:130px;margin:-65px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,60,.3),rgba(255,210,60,0) 68%);z-index:-1;animation:bossAura 1.4s ease-in-out infinite}
@keyframes bossAura{50%{transform:scale(1.12);opacity:.7}}
@keyframes crownB{50%{transform:translateY(-3px) rotate(6deg)}}
.en-svg .en-main{transform-box:fill-box;transform-origin:50% 100%;animation:enBreath 1.7s ease-in-out infinite}
@keyframes enBreath{50%{transform:scale(1.025,.975)}}
.en-svg .tail{transform-box:fill-box;transform-origin:100% 100%;animation:tailW .9s ease-in-out infinite}
@keyframes tailW{50%{transform:rotate(-14deg)}}
.en-svg .tong{transform-box:fill-box;transform-origin:0 50%;animation:tongF .7s ease-in-out infinite}
@keyframes tongF{50%{transform:scaleX(.55)}}
.en-svg .twk{animation:hcTwk 2.4s ease-in-out infinite}
.en-svg .orb{transform-box:fill-box;transform-origin:50% 50%;animation:orbP 1s ease-in-out infinite}
@keyframes orbP{50%{transform:scale(1.18)}}
.en-svg .wpn,.gear-svg .wpn{transform-box:fill-box;transform-origin:50% 92%}
.bu-gear{position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;pointer-events:none;z-index:4}
.gear-svg{width:80px;height:80px;display:block;overflow:visible}
.gear-svg .cape{transform-box:fill-box;transform-origin:0 50%;animation:capeF .7s ease-in-out infinite}
@keyframes capeF{50%{transform:skewY(7deg) scaleX(.9)}}
.gear-svg .halo{transform-box:fill-box;transform-origin:50% 50%;animation:haloP 1.6s ease-in-out infinite}
@keyframes haloP{50%{transform:translateY(-2px) scale(1.06)}}
.gear-svg .orb{transform-box:fill-box;transform-origin:50% 50%;animation:orbP .9s ease-in-out infinite}
.bf-unit.r-rare .bu-body{filter:drop-shadow(0 0 4px #3b82f6)}
.bf-unit.r-epic .bu-body{filter:drop-shadow(0 0 5px #a855f7)}
.bf-unit.r-legendary .bu-body{filter:drop-shadow(0 0 6px #fbbf24)}
.bf-unit.r-mythic .bu-body{filter:drop-shadow(0 0 7px #ef4444)}
.bf-unit.r-secret .bu-body{filter:drop-shadow(0 0 7px #facc15) drop-shadow(0 0 3px #111)}
.bf-unit.r-god .bu-body{filter:drop-shadow(0 0 9px #fff) drop-shadow(0 0 4px #ffd23c);animation-name:buPop,buWalk}
.bf-unit.hit .bu-body{filter:brightness(1.7)}
/* 전투 자세 / 공격 모션 */
.bf-unit.fighting .bu-body,.bf-unit.enemy.fighting .bu-body{animation:stance .5s ease-in-out infinite}
@keyframes stance{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.bf-unit.fighting.a-bite .bu-body{animation:aBite .46s ease-out}
.bf-unit.fighting.a-strike .bu-body{animation:aStrike .5s ease-out}
.bf-unit.fighting.a-claw .bu-body{animation:aClaw .48s ease-out}
.bf-unit.fighting.a-smash .bu-body,.bf-unit.fighting.a-chop .bu-body{animation:aSmash .56s ease-out}
.bf-unit.fighting.a-arrow .bu-body,.bf-unit.fighting.a-bullet .bu-body,.bf-unit.fighting.a-bolt .bu-body,.bf-unit.fighting.a-orb .bu-body{animation:aShoot .42s ease-out}
.bf-unit.fighting.a-fire .bu-body,.bf-unit.fighting.a-cast .bu-body,.bf-unit.fighting.a-note .bu-body{animation:aCast .52s ease-out}
.bf-unit.fighting.a-breath .bu-body{animation:aBreath .6s ease-out}
.bf-unit.fighting.a-bash .bu-body{animation:aBash .46s ease-out}
.bf-unit.fighting.a-heal .bu-body,.bf-unit.fighting.a-potion .bu-body{animation:aHop .5s ease-out}
.bf-unit.fighting.a-thrust .bu-body{animation:aThrust .42s ease-out}
.bf-unit.fighting.a-slash .bu-body,.bf-unit.fighting.a-dual .bu-body{animation:aSlash .44s ease-out}
.bf-unit.hurt .bu-body{animation:hurtA .2s ease-out!important}
@keyframes aBite{0%{transform:none}30%{transform:translateX(calc(var(--dir)*-6px)) scale(.92,1.06)}55%{transform:translateX(calc(var(--dir)*16px)) scale(1.14,.9)}100%{transform:none}}
@keyframes aStrike{0%{transform:none}25%{transform:translateX(calc(var(--dir)*-10px)) scaleX(.85)}50%{transform:translateX(calc(var(--dir)*24px)) scaleX(1.35)}100%{transform:none}}
@keyframes aClaw{0%{transform:none}30%{transform:translateX(calc(var(--dir)*-7px)) rotate(calc(var(--dir)*-8deg))}55%{transform:translateX(calc(var(--dir)*14px)) rotate(calc(var(--dir)*10deg)) scale(1.1)}100%{transform:none}}
@keyframes aSmash{0%{transform:none}35%{transform:translateY(-14px) rotate(calc(var(--dir)*-10deg)) scale(.96,1.06)}58%{transform:translateY(2px) rotate(calc(var(--dir)*8deg)) scale(1.12,.88)}100%{transform:none}}
@keyframes aShoot{0%{transform:none}25%{transform:translateX(calc(var(--dir)*-8px))}45%{transform:translateX(calc(var(--dir)*3px))}100%{transform:none}}
@keyframes aCast{0%{transform:none}40%{transform:translateY(-8px) scale(1.08)}65%{transform:translateY(-8px) scale(1.12)}100%{transform:none}}
@keyframes aBreath{0%{transform:none}35%{transform:translateX(calc(var(--dir)*-10px)) rotate(calc(var(--dir)*-8deg)) scale(.96,1.08)}60%{transform:translateX(calc(var(--dir)*6px)) rotate(calc(var(--dir)*6deg)) scale(1.1)}100%{transform:none}}
@keyframes aBash{0%{transform:none}30%{transform:translateX(calc(var(--dir)*-8px))}55%{transform:translateX(calc(var(--dir)*18px)) scale(1.08,.94)}100%{transform:none}}
@keyframes aHop{0%{transform:none}40%{transform:translateY(-10px) scale(.96,1.08)}70%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes aThrust{0%{transform:none}25%{transform:translateX(calc(var(--dir)*-6px))}45%{transform:translateX(calc(var(--dir)*20px)) scaleX(1.12)}100%{transform:none}}
@keyframes aSlash{0%{transform:none}30%{transform:translateX(calc(var(--dir)*-6px)) rotate(calc(var(--dir)*8deg))}55%{transform:translateX(calc(var(--dir)*12px)) rotate(calc(var(--dir)*-10deg))}100%{transform:none}}
@keyframes hurtA{0%{transform:none}35%{transform:translateX(calc(var(--dir)*-7px)) scale(.94,1.04) rotate(calc(var(--dir)*-4deg))}100%{transform:none}}
/* 무기/소품 모션 */
.bf-unit.a-slash .wpn,.bf-unit.a-dual .wpn{animation:wSlash .46s ease-out}
.bf-unit.a-chop .wpn,.bf-unit.a-smash .wpn{animation:wChop .56s ease-out}
.bf-unit.a-thrust .wpn{animation:wThrust .42s ease-out}
.bf-unit.a-bash .wpn{animation:wBash .46s ease-out}
.bf-unit.a-arrow .wpn,.bf-unit.a-bullet .wpn,.bf-unit.a-bolt .wpn,.bf-unit.a-orb .wpn{animation:wShoot .42s ease-out}
.bf-unit.a-heal .wpn,.bf-unit.a-note .wpn,.bf-unit.a-cast .wpn,.bf-unit.a-potion .wpn,.bf-unit.a-fire .wpn{animation:wCast .52s ease-out}
.bf-unit.a-claw .wpn{animation:wShoot .48s ease-out}
@keyframes wSlash{0%{transform:none}25%{transform:rotate(calc(var(--dir)*-55deg))}60%{transform:rotate(calc(var(--dir)*85deg))}100%{transform:none}}
@keyframes wChop{0%{transform:none}35%{transform:rotate(calc(var(--dir)*-100deg))}62%{transform:rotate(calc(var(--dir)*75deg))}100%{transform:none}}
@keyframes wThrust{0%{transform:none}25%{transform:translateX(calc(var(--dir)*-8px))}48%{transform:translateX(calc(var(--dir)*16px))}100%{transform:none}}
@keyframes wBash{0%{transform:none}35%{transform:translateX(calc(var(--dir)*-6px))}58%{transform:translateX(calc(var(--dir)*13px)) scale(1.12)}100%{transform:none}}
@keyframes wShoot{0%{transform:none}30%{transform:translateX(calc(var(--dir)*-5px))}50%{transform:translateX(calc(var(--dir)*3px))}100%{transform:none}}
@keyframes wCast{0%{transform:none}45%{transform:scale(1.28) translateY(-3px)}100%{transform:none}}
/* 이펙트 */
.bf-area.shake{animation:camShake .3s linear}
@keyframes camShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
.fx{position:absolute;bottom:calc(11% + 16px);width:0;height:0;z-index:7;pointer-events:none}
.fx i,.fx b,.fx svg{position:absolute;display:block}
.fx.pj{z-index:9;bottom:calc(11% + 28px)}
.pjs{left:-16px;top:-5px;transform:scaleX(var(--d));filter:drop-shadow(0 0 3px var(--c))}
.bul{left:-14px;top:-2px;width:26px;height:4px;border-radius:3px;background:linear-gradient(calc(90deg*var(--d)),transparent,#fff 60%,var(--c));transform:scaleX(var(--d));box-shadow:0 0 6px var(--c)}
.orbp{left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#fff 0 25%,var(--c) 55%,transparent 72%);box-shadow:0 0 10px var(--c),calc(var(--d)*-12px) 0 8px -2px var(--c)}
.firep{left:-11px;top:-12px;width:22px;height:22px;border-radius:50% 50% 50% 8%;background:radial-gradient(circle at 40% 55%,#fff6b0 0 20%,var(--c) 50%,#ff3a1a 80%);transform:rotate(-45deg);box-shadow:0 0 12px var(--c),calc(var(--d)*-14px) 0 10px -3px #ff7a2a}
.flm{left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,var(--c) 50%,transparent 74%);box-shadow:0 0 8px var(--c);animation:flmA .5s ease-out forwards}
@keyframes flmA{from{transform:scale(.6)}to{transform:scale(1.7)}}
.txtp{left:-9px;top:-12px;font-style:normal;font-weight:900;font-size:1.15rem;color:var(--c);text-shadow:0 0 6px var(--c),0 0 2px #fff;-webkit-text-stroke:1px #1d1d1d;animation:txtSpin .5s linear infinite}
.txtp.pot{animation:potA .5s ease-in-out}
@keyframes txtSpin{to{transform:rotate(360deg)}}
@keyframes potA{50%{transform:translateY(-24px) rotate(180deg)}to{transform:translateY(0) rotate(360deg)}}
.sparkw{z-index:10;transform:scale(var(--s))}
.sparkw .sp{left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,var(--c) 28% 46%,transparent 66%);animation:sparkA .32s ease-out forwards}
.sparkw b{left:-2px;top:-2px;width:5px;height:5px;background:var(--c);border-radius:1px;animation:debris .4s ease-out forwards}
@keyframes sparkA{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
@keyframes debris{from{transform:rotate(var(--a)) translateX(2px);opacity:1}to{transform:rotate(var(--a)) translateX(24px) scale(.4);opacity:0}}
.slashw{transform:scale(var(--s))}
.slashw .sl{left:-24px;top:-36px;width:48px;height:48px;border:6px solid transparent;border-top-color:var(--c);border-right-color:var(--c);border-radius:50%;filter:drop-shadow(0 0 5px var(--c));transform:scaleX(var(--d)) rotate(-70deg) scale(.5);opacity:0;animation:slashA .3s ease-out forwards}
.slashw.s2 .sl{top:-16px;animation-delay:.02s}
@keyframes slashA{0%{transform:scaleX(var(--d)) rotate(-80deg) scale(.5);opacity:0}30%{opacity:1}100%{transform:scaleX(var(--d)) rotate(55deg) scale(1.15);opacity:0}}
.streak{transform:scale(var(--s))}
.streak .stk{left:-30px;top:-1px;height:4px;border-radius:3px;background:linear-gradient(calc(90deg*var(--d)),transparent,var(--c));box-shadow:0 0 8px var(--c);animation:stkA .26s ease-out forwards;transform-origin:calc(50% - var(--d)*50%) 50%}
@keyframes stkA{from{transform:scaleX(.2);opacity:1}to{transform:scaleX(1);opacity:0}}
.clawfx{transform:scale(var(--s))}
.clawfx .cl{top:-22px;width:4px;height:36px;border-radius:2px;background:linear-gradient(#fff,var(--c));transform:rotate(26deg) scaleY(0);transform-origin:50% 0;box-shadow:0 0 6px var(--c);animation:clawA .34s ease-out forwards}
.clawfx .c1{left:-12px}.clawfx .c2{left:-2px;animation-delay:.04s}.clawfx .c3{left:8px;animation-delay:.08s}
@keyframes clawA{0%{transform:rotate(26deg) scaleY(0);opacity:1}45%{transform:rotate(26deg) scaleY(1);opacity:1}100%{transform:rotate(26deg) scaleY(1);opacity:0}}
.bitew{transform:scale(var(--s))}
.bitew .fg{left:-9px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent}
.bitew .fg.a{top:-16px;border-top:14px solid #fff;animation:fangA .3s ease-out forwards}
.bitew .fg.b{top:4px;border-bottom:14px solid #fff;animation:fangB .3s ease-out forwards}
@keyframes fangA{from{transform:translateY(-12px);opacity:1}60%{transform:translateY(0)}to{transform:translateY(0);opacity:0}}
@keyframes fangB{from{transform:translateY(12px);opacity:1}60%{transform:translateY(0)}to{transform:translateY(0);opacity:0}}
.shockw{transform:scale(var(--s))}
.shockw .sh{left:-16px;top:6px;width:32px;height:12px;border:4px solid var(--c);border-radius:50%;animation:shockA .5s ease-out forwards;box-shadow:0 0 8px var(--c)}
.shockw .sh2{left:-12px;top:8px;width:24px;height:8px;border:3px solid #fff;border-radius:50%;animation:shockA .5s .06s ease-out forwards;opacity:.8}
.shockw .dust{left:-14px;top:2px;width:12px;height:12px;border-radius:50%;background:rgba(220,210,190,.75);animation:dustA .6s ease-out forwards}
.shockw .dust.d2{left:4px;animation-delay:.05s}
@keyframes shockA{from{transform:scale(.4);opacity:1}to{transform:scale(3.6,2.4);opacity:0}}
@keyframes dustA{from{transform:translateY(0) scale(.5);opacity:.9}to{transform:translateY(-22px) scale(1.7);opacity:0}}
.ringw{transform:scale(var(--s))}
.ringw .rg{left:-22px;top:-14px;width:44px;height:44px;border:4px solid var(--c);border-radius:50%;box-shadow:0 0 12px var(--c),inset 0 0 8px var(--c);animation:ringA .55s ease-out forwards}
@keyframes ringA{from{transform:scale(.3);opacity:1}to{transform:scale(1.8);opacity:0}}
.runew{transform:scale(var(--s))}
.runew .rune{left:-24px;top:8px;width:48px;height:16px;border:3px dashed var(--c);border-radius:50%;box-shadow:0 0 10px var(--c);animation:runeA .55s ease-out forwards}
@keyframes runeA{from{transform:scale(.4) rotate(0);opacity:1}to{transform:scale(1.5) rotate(180deg);opacity:0}}
.poofw{transform:scale(var(--s))}
.poofw .pf{width:22px;height:22px;border-radius:50%;background:rgba(235,235,235,.85);animation:poofA .6s ease-out forwards}
.poofw .pf.a{left:-22px;top:-8px}.poofw .pf.b{left:0;top:-16px;animation-delay:.04s}.poofw .pf.c{left:-8px;top:2px;animation-delay:.08s}
.poofw .pst{left:-8px;top:-24px;font-style:normal;font-size:1.1rem;color:var(--c);text-shadow:0 0 6px var(--c);animation:starUp .6s ease-out forwards}
@keyframes poofA{from{transform:scale(.4);opacity:.9}to{transform:scale(1.9) translateY(-14px);opacity:0}}
@keyframes starUp{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-34px) rotate(160deg) scale(1.2);opacity:0}}
/* 맵 목록 안의 적 미니 스프라이트 */
.en-sp{display:block;line-height:0}
.en-sp .en-svg{width:34px;height:30px;filter:none}
.en-sp .en-svg *{animation:none!important}
.en-i.sil .en-sp{filter:brightness(0);opacity:.88}
.si-box .en-sp .en-svg{width:40px;height:35px}
/* ===== 아군 리모델링 ===== */
.bf-unit:not(.enemy) .bu-body{background:none!important;border:none!important;box-shadow:none!important;border-radius:0!important;display:block;width:74px;height:74px;margin:0 0 0 -7px;overflow:visible}
.bf-unit:not(.enemy) .bu-body::before,.bf-unit:not(.enemy) .bu-body::after{display:none!important}
.bf-unit:not(.enemy) .bu-shadow{width:52px;margin-left:-26px;bottom:-5px}
.fig{position:relative;width:74px;height:74px}
.fig svg{position:absolute;left:0;top:0;width:74px;height:74px;overflow:visible}
.fig .fig-front{z-index:3}
.fig .fig-back{z-index:1}
.fig .bu-e{position:absolute!important;left:26.25%;top:28.75%;width:47.5%!important;height:40%!important;border-radius:42%/46%;overflow:hidden;z-index:2;background:#fff;font-size:1.25rem;display:flex;align-items:center;justify-content:center}
.fig .bu-e img{width:100%!important;height:100%!important;object-fit:cover}
.fig svg .wpn{transform-box:view-box}
.fig-front .cape,.fig-back .cape{transform-box:fill-box;transform-origin:0 50%;animation:capeF .7s ease-in-out infinite}
.fig-back .tail{transform-box:fill-box;transform-origin:0 100%;animation:tailW .9s ease-in-out infinite}

var _pcId=0,_pcGrid=null;
function pcGrid(){
  if(_pcGrid)return _pcGrid;
  var G=[];for(var y=0;y<24;y++){var r=[];for(var x=0;x<20;x++)r.push(".");G.push(r)}
  function p(x,y,c){G[y][x]=c}
  function run(y,x1,x2,c){for(var x=x1;x<=x2;x++)p(x,y,c)}
  [[3,1,"K"],[3,2,"K"],[4,2,"W"],[5,2,"K"],[3,3,"K"],[4,3,"P"],[5,3,"W"],[6,3,"K"],[3,4,"K"],[4,4,"W"],[5,4,"P"],[6,4,"W"],[7,4,"K"]].forEach(function(e){p(e[0],e[1],e[2]);p(19-e[0],e[1],e[2])});
  run(5,3,16,"K");
  for(var y=6;y<=17;y++){p(2,y,"K");run(y,3,16,"H");p(17,y,"K")}
  run(18,3,16,"K");
  p(5,19,"K");run(19,6,13,"C");p(14,19,"K");
  for(var y2=20;y2<=21;y2++){p(4,y2,"K");run(y2,5,14,"W");p(15,y2,"K")}
  p(4,22,"K");run(22,5,6,"W");p(7,22,"K");run(22,8,11,"W");p(12,22,"K");run(22,13,14,"W");p(15,22,"K");
  run(23,5,14,"K");
  p(18,19,"K");p(19,19,"K");p(17,20,"K");p(18,20,"W");p(19,20,"K");p(16,21,"K");p(17,21,"W");p(18,21,"K");p(16,22,"K");p(17,22,"K");
  _pcGrid=G;return G;
}
var PC_COLLAR={common:"#4ade80",rare:"#60a5fa",epic:"#c084fc",legendary:"#fbbf24",mythic:"#f87171",secret:"#8a8a8a",god:"#ffd23c"};
var PC_COL={K:"#1d1d1d",W:"#ffffff",P:"#ffb3c1"};
function pixelCat(ch,h){
  h=h||64;
  var G=pcGrid(),id="pc"+(++_pcId),photo=CHAR_PHOTOS[ch.name];
  var svg='<svg class="pcat '+(ch.color||"")+'" viewBox="0 0 20 24" width="'+Math.round(h*20/24)+'" height="'+h+'" shape-rendering="crispEdges" style="display:block;margin:0 auto">';
  for(var y=0;y<24;y++){
    var x=0;
    while(x<20){
      var c=G[y][x];
      if(c==="."||c==="H"){x++;continue}
      var x2=x;while(x2+1<20&&G[y][x2+1]===c)x2++;
      var fill=c==="C"?(PC_COLLAR[ch.color]||"#4ade80"):PC_COL[c];
      svg+='<rect x="'+x+'" y="'+y+'" width="'+(x2-x+1)+'" height="1" fill="'+fill+'"/>';
      x=x2+1;
    }
  }
  if(photo){
    svg+='<clipPath id="'+id+'"><rect x="3" y="6" width="14" height="12"/></clipPath><image href="'+photo+'" x="3" y="4" width="14" height="17.5" preserveAspectRatio="xMidYMid slice" clip-path="url(#'+id+')"/>';
  }else{
    svg+='<rect x="3" y="6" width="14" height="12" fill="#fff"/><rect x="6" y="11" width="1" height="2" fill="#1d1d1d"/><rect x="13" y="11" width="1" height="2" fill="#1d1d1d"/><rect x="9" y="13" width="2" height="1" fill="#ff8aa0"/><rect x="8" y="14" width="1" height="1" fill="#1d1d1d"/><rect x="11" y="14" width="1" height="1" fill="#1d1d1d"/><rect x="9" y="15" width="2" height="1" fill="#1d1d1d"/><rect x="4" y="13" width="2" height="1" fill="#ffc2cf"/><rect x="14" y="13" width="2" height="1" fill="#ffc2cf"/>';
  }
  return svg+'</svg>';
}
function charFace(name,emoji,size,shape){

  var br = shape==='rect' ? '4px' : '8px';

}

/* STORAGE - floating chars */
function renderStorage(c){
  if(state.storage.length===0){c.innerHTML='<div class="storage-bg"><div class="empty-msg" style="padding-top:60px">저장고가 비어있다냥!<br>뽑기에서 획득하라냥!</div></div>';return}
  c.innerHTML='<div class="storage-bg" id="stBg"></div>';
  var bg=document.getElementById("stBg");
  var sorted=state.storage.slice().sort(function(a,b){return RARITY_ORDER.indexOf(a.rarity)-RARITY_ORDER.indexOf(b.rarity)});
  sorted.forEach(function(e,i){
    var el=document.createElement("div");
    el.className="float-char";
    var x=5+Math.random()*85, y=5+Math.random()*75;
    el.style.left=x+"%"; el.style.top=y+"%";
    el.innerHTML='<div class="fc-emoji">'+charFace(e.name,e.emoji,42)+'</div><div class="fc-lv">Lv.'+e.level+'</div><div style="font-size:.55rem;font-weight:900">'+(CHAR_ROLES[e.name]||CHAR_DB[e.rarity].role||'근접딜러')+'</div>'+(e.count>1?'<div class="fc-cnt">'+e.count+'</div>':'');
    el.onclick=function(){openCharAction(e)};
    bg.appendChild(el);
  });
  var info=document.getElementById("stInfo");
  if(info) info.textContent=state.storage.length+" / 128";
}

function openCharAction(e){
  openConfirm(e.name+" Lv."+e.level,
    "사용: 파워업 / 중복시 레벨+1\n버리기: ⭐XP +"+(SELL_XP[e.rarity]||5),
    function(){useChar(e.id)},
    function(){sellChar(e.id)},
    "사용","버리기"
  );
  setTimeout(refreshTutorialGuide,30);
}

function useChar(id){
  var e=state.storage.find(function(c){return String(c.id)===String(id)});
  if(!e)return;
  if(tut().firstPull && !tut().storageUse){tut().storageUse=true;save();}
  if(e.count>1){var used=e.count-1;e.level=Math.min(30,e.level+used);e.count=1;toast("⬆️ "+e.name+" 중복 "+used+"개를 한꺼번에 사용! → Lv."+e.level);save();if(state.currentScreen==="storage")renderStorage(document.getElementById("content"));else showScreen("powerup")}
  else{state.powerupTarget=e.id;showScreen("powerup")}
  setTimeout(refreshTutorialGuide,180);
}
function sellChar(id){
  var e=state.storage.find(function(c){return String(c.id)===String(id)});
  if(!e)return;
  var xp=SELL_XP[e.rarity]||5;
  if(e.count>1)e.count--;
  else{state.formation=state.formation.map(function(f){return f===e.id?null:f});if(state.powerupTarget===e.id)state.powerupTarget=null;state.storage=state.storage.filter(function(c){return c.id!==e.id})}
  state.xp+=xp;updateRes();save();
  if(state.currentScreen==="storage")renderStorage(document.getElementById("content"));
}
function sellAll(){
  if(state.storage.length===0)return;
  openConfirm("전부 XP 교환","모든 캐릭터를 XP로 교환하겠냥?",function(){
    var total=0;
    state.storage.forEach(function(e){total+=(SELL_XP[e.rarity]||5)*e.count});
    state.xp+=total;state.storage=[];state.formation=[null,null,null,null,null];state.powerupTarget=null;
    updateRes();save();renderStorage(document.getElementById("content"));
    alert("⭐ XP +"+total+" 획득!");
  });
}

  var filter=state.puFilter||"all";

  RARITY_ORDER.forEach(function(r){

  });
  catHtml+='</div>';

  var sel=state.powerupTarget?list.find(function(e){return String(e.id)===String(state.powerupTarget)}):list[0];
  if(sel) state.powerupTarget=sel.id;

  var cardsHtml='<div class="pu-grid" id="puCats">';

    cardsHtml+='<div class="pu-card'+selC+'" onclick="state.powerupTarget=\''+e.id+'\';renderPowerup(document.getElementById(\'content\'))"><div class="pc-emoji">'+pixelCat(e,52)+'</div><div class="pc-name">'+e.name+'</div><div class="pc-lv">Lv.'+e.level+(e.count>1?" x"+e.count:"")+(formOf(e)>1?" "+"★".repeat(formOf(e)-1):"")+'</div></div>';
  });
  cardsHtml+='</div>';

  var stats=sel?getCharStats(sel):{atk:0,hp:0};
  var cost=sel?LV_UP_COST(sel.level,sel.rarity):0;
  var eyeType=catsEyeTypeFor(sel);

  var eyeReady=!!(sel&&sel.catsEyeReady);
  var can=sel && state.xp>=cost && (sel.level<30 || eyeReady);
  var left='';
  if(sel){
    left='<div class="pu-big">'+figPreview(sel,formOf(sel),104)+'</div><div class="pu-nm">'+sel.name+(formOf(sel)>1?' <span class="evo-tag">'+FORM_NAME[formOf(sel)]+'</span>':'')+' <span class="rarity-tag '+sel.color+'" style="position:static">'+sel.rarityName+'</span></div><div class="pu-st">'+stats.role+' · Lv.'+sel.level+(sel.level>=30?' (캣츠아이 성장)':'')+'<br>공격 '+stats.atk+' / 체력 '+stats.hp+'</div><div class="pu-bf">'+stats.buffs.map(function(b){return "✦ "+buffName(b)+": "+buffText(b)}).join("<br>")+'</div>';
    left+=evoPanelHtml(sel);
    left+='<div class="pu-actions"><button class="pu-lvup" '+(can?"":"disabled")+' onclick="levelUp()">'+(sel.level>=30?(eyeReady?(state.xp>=cost?"레벨 업! → Lv."+(sel.level+1)+" ⭐"+cost:"XP 부족 ⭐"+cost):"캣츠아이 사용 후 레벨업 · XP "+cost):(can?"레벨 업! ⭐"+cost:"XP 부족 ⭐"+cost))+'</button>';
    if(sel.level>=30) left+='<button class="pu-dupe" '+((eyeCount>0&&!eyeReady)?"":"disabled")+' onclick="prepareCatsEye()">★ 캣츠아이 사용 ('+(eyeCount||0)+')</button>';
    if(sel.count>1) left+='<button class="pu-dupe" onclick="dupeLevelUp()">중복 소모 레벨업</button>';

function getCharStats(e){
  var db=CHAR_DB[e.rarity],lv=e.level||1,kit=CHAR_KIT[e.name],role=(kit&&kit.role)||CHAR_ROLES[e.name]||db.role||"근접딜러";
  var baseAtk=Math.floor(db.baseAtk*(1+(lv-1)*0.15));
  var baseHp=Math.floor(db.baseHp*(1+(lv-1)*0.2));
  var atk=baseAtk,hp=baseHp,range=5,atkSpeed=1;
  if(role==="탱커"){hp=Math.floor(baseHp*3.5);atk=Math.max(1,Math.floor(baseAtk*0.3));range=4;atkSpeed=.85}
  else if(role==="근접딜러"){hp=Math.floor(baseHp*1.3);atk=Math.floor(baseAtk*1.7);range=5;atkSpeed=1.1}
  else if(role==="원거리"){hp=Math.floor(baseHp*0.55);atk=Math.floor(baseAtk*1.9);range=18;atkSpeed=.95}
  else if(role==="서포터"){hp=Math.floor(baseHp*0.9);atk=Math.floor(baseAtk*0.5);range=8;atkSpeed=.9}
  if(kit){atk=Math.max(1,Math.floor(atk*kit.atk));hp=Math.floor(hp*kit.hp)}
  var comboAtk=0,comboHp=0,comboSpd=0,comboDr=0,comboHeal=0,comboRange=0;
  activeNyanCombos().forEach(function(combo){comboAtk+=combo.atk||0;comboHp+=combo.hp||0;comboSpd+=combo.spd||0;comboDr+=combo.dr||0;comboHeal+=combo.heal||0;comboRange+=combo.range||0;});
  atk=Math.floor(atk*(1+comboAtk));hp=Math.floor(hp*(1+comboHp));atkSpeed*=1+comboSpd;range+=comboRange;
  atk=Math.max(1,Math.floor(atk*ALLY_NERF));hp=Math.max(1,Math.floor(hp*ALLY_NERF));
  return{atk:atk,hp:hp,role:role,range:range,atkSpeed:atkSpeed,buffs:kit?kit.buffs:[],comboDr:Math.min(.5,comboDr),comboHeal:comboHeal};
}
function catsEyeTypeFor(e){
  if(!e)return null;
  if(e.rarity==="common"||e.rarity==="rare"||e.rarity==="epic")return "hero";
  if(e.rarity==="legendary"||e.rarity==="mythic")return "legend";
  return "super";
}
function prepareCatsEye(){if(!tut().catsEye){tut().catsEye=true;save();}
  var e=state.storage.find(function(c){return String(c.id)===String(state.powerupTarget)});if(!e||e.level<30)return;
  if(e.catsEyeReady){alert("이미 캣츠아이를 사용했다냥! 레벨 업 버튼을 눌러라냥!");return;}
  var type=catsEyeTypeFor(e);
  if(!type||(dungeonState.catsEye[type]||0)<=0){alert("사용할 수 있는 해당 등급 캣츠아이가 없다냥! 던전에서 획득하라냥!");return;}
  dungeonState.catsEye[type]--;e.catsEyeReady=true;state.dungeonState=dungeonState;save();renderPowerup(document.getElementById("content"));
}
function levelUp(){
  var e=state.storage.find(function(c){return String(c.id)===String(state.powerupTarget)});if(!e)return;

function applyNyanCombo(id){
  var combo=NYAN_COMBOS.find(function(x){return x.id===id;});if(!combo)return;
  var next=[],used={};
  combo.chars.forEach(function(name){var e=state.storage.find(function(x){return x.name===name&&!used[String(x.id)]});if(e){next.push(e.id);used[String(e.id)]=true;}});
  // Fill remaining slots with current formation units, preserving them where possible.
  state.formation.forEach(function(fid){if(next.length>=5||!fid||used[String(fid)])return;var e=state.storage.find(function(x){return String(x.id)===String(fid)});if(e&&!next.some(function(nid){var ne=state.storage.find(function(x){return String(x.id)===String(nid)});return ne&&ne.name===e.name;})){next.push(e.id);used[String(e.id)]=true;}});
  while(next.length<5)next.push(null);state.formation=next.slice(0,5);
  save();renderFormation(document.getElementById('content'));
  var missing=combo.chars.filter(function(name){return !state.storage.some(function(e){return e.name===name});});
  if(missing.length)alert('「'+combo.name+'」 조합으로 편성했어요!\n아직 없는 캐릭터: '+missing.join(', ')+'\n필요한 캐릭터를 모두 편성해야 냥콤보 버프가 발동해요.');
}

  var pre=sg===0?"적들이 "+st.name+"에 몰려오고 있다냥! 기지를 지키며 적 기지를 부수자냥!":sg===1?"기계 군단이 "+st.name+josa(st.name,"을","를")+" 점령했다냥! 미래의 전장을 되찾아라냥!":"우주 저편 "+st.name+"에서 알 수 없는 힘이 깨어나고 있다냥! 별들을 지켜라냥!";
  if(st.bossImg)pre="⚠️ 최종 보스 「"+st.boss+"」가 기다리는 마지막 전장이다냥! 모든 힘을 모아 도전하라냥!";
  else if(st.boss)pre+=" 이곳에는 보스 「"+st.boss+"」가 숨어 있다냥!";
  return '['+ch.n+'] '+pre;
}
function renderBattle(c){
  var sg=state.mapSaga||0;if(!sagaOpen(sg))sg=0;state.mapSaga=sg;
  var front=sagaFront(sg);
  if(!mapKeep||mapSel===null||sagaOf(mapSel)!==sg)mapSel=front;
  mapKeep=false;
  mapChap=Math.floor(mapSel/CHAP_SIZE);
  var tt=document.getElementById("topTitle");if(tt)tt.textContent="🗺️ "+SAGAS[sg].n;
  c.innerHTML='<div class="mp"><div class="mp-saga" id="mpSaga"></div><div class="mp-tabs" id="mpTabs"></div><div class="mp-map" id="mpMap"><div class="mp-scroll" id="mpScroll"></div>'
    +'<button class="mp-arr l" onclick="mapScroll(-1)">◀</button><button class="mp-arr r" onclick="mapScroll(1)">▶</button>'
    +'<div class="mp-en" id="mpEn"></div><div class="mp-info" id="mpInfo"></div></div></div>';

function mapDrawSagas(){
  var h='';
  SAGAS.forEach(function(sg,s){
    var open=sagaOpen(s),cur=(state.mapSaga||0)===s;
    h+='<button class="mp-sg sg'+s+(cur?' on':'')+(open?'':' lk')+'" onclick="mapSetSaga('+s+')">'+(open?sg.ic:'🔒')+' '+sg.n+'<i>'+(open?sagaCleared(s)+'/48':'')+'</i></button>';
  });
  var e=document.getElementById('mpSaga');if(e)e.innerHTML=h;

function mapSetSaga(s){
  if(!sagaOpen(s)){toast('🔒 '+SAGAS[s].n+' · '+sagaGateText(s));return;}
  state.mapSaga=s;save();
  var tt=document.getElementById("topTitle");if(tt)tt.textContent="🗺️ "+SAGAS[s].n;
  closeStageInfo();
  mapSetChap(Math.floor(sagaFront(s)/CHAP_SIZE),true);
}
function mapDrawTabs(){
  var h='',sg=state.mapSaga||0;
  for(var ci=sg*6;ci<sg*6+6;ci++){
    var ch=CHAPS[ci],open=stageUnlocked(ci*CHAP_SIZE),done=0;
    for(var k=0;k<CHAP_SIZE;k++)if(stageCleared(ci*CHAP_SIZE+k))done++;
    h+='<button class="mp-tab'+(ci===mapChap?' on':'')+(open?'':' lk')+'" onclick="mapSetChap('+ci+')">'+(open?'':'🔒 ')+(ci%6+1)+'장 '+ch.sh+(open&&done?'<i>'+done+'/'+CHAP_SIZE+'</i>':'')+'</button>';
  }
  var t=document.getElementById('mpTabs');if(t)t.innerHTML=h;
}
function mapSetChap(ci,frontOnly){
  mapChap=ci;var pick=ci*CHAP_SIZE;
  for(var k=0;k<CHAP_SIZE;k++){var i=ci*CHAP_SIZE+k;if(stageUnlocked(i)&&!stageCleared(i)){pick=i;break;}if(stageUnlocked(i))pick=i;}
  mapDrawSagas();mapDrawTabs();mapDrawCanvas();mapPick(pick,true);
  try{maybeStory()}catch(e){}

function mapGo(){
  var i=mapSel;if(i===null||!stageUnlocked(i))return;
  closeStageInfo();mapKeep=stageCleared(i);
  var used={};
  if(tut().finished){ITEM_KEYS.forEach(function(k){if(state.itemSel&&state.itemSel[k]&&itemCount(k)>0){state.items[k]--;used[k]=1;if(state.items[k]<=0)state.itemSel[k]=false;}});}
  window._pendingItems=used;
  var _nu=Object.keys(used).length;if(_nu)missionAdd("item",_nu);
  startBattle(STAGES[i]);
  if(!_battle){ITEM_KEYS.forEach(function(k){if(used[k])state.items[k]++});window._pendingItems=null;}
}

function updateDeployUI(){
  if(!_battle)return;
  _battle.team.forEach(function(e,i){
    var slot=document.getElementById("ds"+i);
    if(!slot)return;
    var cost=CHAR_DB[e.rarity].cost,cd=_battle.cd[i]||0,mx=(DEPLOY_CD[e.rarity]||2)*(1-0.03*BU(4));
    if(_battle.money>=cost&&cd<=0) slot.classList.add("ready");
    else slot.classList.remove("ready");
    var o=document.getElementById("dcd"+i);
    if(o)o.style.height=(cd>0?Math.min(100,cd/mx*100):0)+"%";
    var br=document.getElementById("dbar"+i);
    if(br)br.style.width=(cd>0?Math.max(0,100-cd/mx*100):100)+"%";
  });
}
function updateBattleBtns(){
  if(!_battle)return;
  var w=document.getElementById("walletBtn"),c=document.getElementById("canBtn");
  if(w){
    var wc=_battle.wl*150, lv=document.getElementById("wlLv"), cost=document.getElementById("wlCost");
    if(lv)lv.textContent=_battle.wl;
    if(cost)cost.textContent=_battle.wl>=WALLET_MAX?"MAX":wc+"원";
    w.disabled=_battle.wl>=WALLET_MAX||_battle.money<wc;
    w.classList.toggle("ready",!w.disabled);
  }
  if(c){
    var rd=_battle.can>=cannonCap(), _cn=CANNONS[state.cannon]||CANNONS.basic;
    var txt=document.getElementById("canTxt"), ic=document.getElementById("canIc"), ring=document.getElementById("canRing");
    if(txt)txt.textContent=rd?"발사!":Math.ceil(cannonCap()-_battle.can);
    if(ic)ic.textContent=rd?_cn.ic:"⏳";

function fireCannon(){
  if(!_battle||_battle.ended||_battle.can<cannonCap())return;
  var tutorialCannon=_battle.stage.id===1 && _battle.tutStep==='cannonReady';
  sfx("cannon");missionAdd("cannon",1);
  var type=state.cannon||"basic",cn=CANNONS[type]||CANNONS.basic;
  var minX=cannonMinX();
  // 냥코대포만 사정거리 안의 적을 공격한다. 기절포와 캐논포는 전방 화면 전체가 대상.
  var targets=_battle.enemies.filter(function(en){
    if(en.dead)return false;
    if(type==="stun"||type==="canon")return en.x<=ALLY_X && en.x>=0;
    return en.x>=minX && en.x<=ALLY_X;
  });
  // 사거리 안에 적이 없어도 대포는 발사할 수 있다. 피해는 대상이 있을 때만 적용된다.
  _battle.can=0;
  var area=document.getElementById('bArea');
  showCannonEffect(type,area);
  if(type==="basic" && area){
    var wave=document.createElement('div');wave.className='cannon-ground-wave';
    var maxPx=Math.max(40,(ALLY_X-minX)/WORLD*area.clientWidth);
    wave.style.left=(minX/WORLD*area.clientWidth)+'px';
    wave.style.width=maxPx+'px';
    wave.style.bottom='12%';
    wave.innerHTML='<span class="ground-wave-line"></span><span class="ground-wave-ring"></span><span class="ground-wave-ring second"></span>';

  }
  var dmg=(150+Math.min(_battle.stage.id,48)*60)*(1+0.2*BU(6))*cn.mul;
  targets.forEach(function(en){
    if(en.dead)return;
    hitEnemy(en,dmg,null);
    if(en.dead)return;
    var el=document.getElementById("u"+en.id);
    if(type==="stun"){
      en.stun=5;
      if(el)el.classList.add("stunned");
    }else if(type==="canon"){
      en.stun=0.8;
      en.x=Math.max(2,en.x-30);

      if(el){el.style.transition="transform .55s ease-out";el.style.transform="translateX(-34px)";setTimeout(function(){if(el)el.style.transform="";if(el)el.style.transition=""},600)}
    }else{
      en.stun=0.5;en.x=Math.max(2,en.x-6);setUnitPos(en);
    }
  });
  flashFx(type==="stun"?"blue":(type==="canon"?"orange":""));
  try{shake()}catch(e){}
  updateBattleBtns();
  if(tutorialCannon){_battle.tutStep='done';_battle.paused=false;var po=document.getElementById('pauseOv');if(po)po.remove();var pb=document.getElementById('pauseBtn');if(pb)pb.textContent='❚❚';refreshTutorialGuide();}
}
