<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끝말잇기 온라인</title>

    <!-- Pixelarticons Icon Library -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixelarticons@1.8.0/pixelarticons.css">
    
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');

        @font-face {
            font-family: 'Galmuri11';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2506-1@1.0/Galmuri11-Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Galmuri11', 'Galmuri9', sans-serif !important;
            box-shadow: none !important;
            text-shadow: none !important;
            outline: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #08090c;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.redd.it/rkx6ciyfzii71.png') no-repeat center center;
            background-size: cover;
            filter: brightness(0.2) contrast(1.2);
            z-index: 1;
        }

        .scanline-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.3) 50%
            );
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        #app {
            position: relative;
            z-index: 10;
            width: 880px;
            height: 640px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .logo-box {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .logo-sub {
            font-size: 14px;
            color: #ffe600;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .logo-main {
            font-size: 36px;
            color: #ffffff;
            letter-spacing: 2px;
        }

        .user-hud {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffe600;
            padding: 8px 14px;
            color: #ffffff;
            font-size: 14px;
        }

        .pixel-btn {
            background-color: #ffe600;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 10px 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 15px;
            clip-path: polygon(
                0 4px, 4px 4px, 4px 0,
                calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px,
                100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%,
                4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)
            );
        }

        .pixel-btn:hover { background-color: #ffff66; }
        .pixel-btn:active { transform: translateY(2px); background-color: #cca300; }
        .pixel-btn.danger { background-color: #ff3344; color: #ffffff; }

        .pixel-input {
            background-color: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 12px 16px;
            font-size: 16px;
            clip-path: polygon(
                0 4px, 4px 4px, 4px 0,
                calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px,
                100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%,
                4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)
            );
        }

        .pixel-input:focus { border-color: #ffe600; }

        .view-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .lobby-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .room-grid {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .room-card {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.15);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
        }

        .room-card:hover { border-color: #ffe600; }

        #game-view {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        /* 체력바 및 타이머 HUD */
        .battle-hud {
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        .player-status-card {
            flex: 1;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 10px 14px;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .player-status-card.active {
            border-color: #ffe600;
            background: rgba(255, 230, 0, 0.08);
        }

        .hp-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .hp-bar-fill {
            height: 100%;
            background: #ff3344;
            width: 100%;
            transition: width 0.3s ease;
        }

        .timer-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff3344;
            padding: 8px 16px;
            color: #ff3344;
            min-width: 120px;
        }

        .timer-value {
            font-size: 26px;
            font-weight: bold;
        }

        .arena-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            border: 2px dashed rgba(255, 230, 0, 0.4);
            position: relative;
            min-height: 150px;
        }

        .current-word-display {
            font-size: 44px;
            color: #ffe600;
            letter-spacing: 4px;
        }

        .chat-stream {
            height: 100px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.15);
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-line {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
        }

        .toast-message {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff3344;
            color: #ffffff;
            padding: 8px 18px;
            font-size: 14px;
            border: 2px solid #ffffff;
            display: none;
            z-index: 100;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: #000000;
            border: 3px solid #ffe600;
            padding: 26px;
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div class="scanline-overlay"></div>

    <!-- 닉네임 입력 모달 -->
    <div id="nickname-modal" class="modal-overlay">
        <div class="modal-card">
            <div style="font-size: 20px; color: #ffe600;">
                <i class="pixelarticons-user"></i> 닉네임 설정
            </div>
            <p style="color: #aaa; font-size: 13px;">게임에서 사용할 이름을 입력하세요.</p>
            <input type="text" id="nickname-input" class="pixel-input" placeholder="닉네임..." maxlength="10" onkeydown="if(event.key==='Enter') setNickname()">
            <button class="pixel-btn" onclick="setNickname()">접속하기</button>
        </div>
    </div>

    <!-- 방 만들기 모달 -->
    <div id="create-room-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div style="font-size: 20px; color: #ffe600;">
                <i class="pixelarticons-plus"></i> 방 생성하기
            </div>
            <input type="text" id="room-title-input" class="pixel-input" placeholder="방 제목을 입력하세요..." maxlength="20">
            <div style="display: flex; gap: 8px;">
                <button class="pixel-btn" style="flex: 1;" onclick="createRoom()">생성</button>
                <button class="pixel-btn danger" style="flex: 1;" onclick="closeCreateRoomModal()">취소</button>
            </div>
        </div>
    </div>

    <div id="app">
        <!-- 상단 헤더 -->
        <header>
            <div class="logo-box">
                <span class="logo-sub">실시간 1대1</span>
                <span class="logo-main">끝말잇기</span>
            </div>
            <div class="user-hud">
                <i class="pixelarticons-user"></i>
                <span id="hud-username">대기 중...</span>
            </div>
        </header>

        <div id="toast" class="toast-message">알림 메세지</div>

        <!-- 로비 화면 -->
        <div id="lobby-view" class="view-panel">
            <div class="lobby-toolbar">
                <span style="color: #ffffff; font-size: 16px;">방 목록</span>
                <button class="pixel-btn" onclick="openCreateRoomModal()">
                    <i class="pixelarticons-plus"></i> 방 만들기
                </button>
            </div>
            <div class="room-grid" id="room-list">
                <!-- 방 목록 -->
            </div>
        </div>

        <!-- 게임 화면 -->
        <div id="game-view" class="view-panel">
            <!-- 배틀 HUD (HP & 타이머) -->
            <div class="battle-hud">
                <div class="player-status-card" id="p1-card">
                    <div style="display: flex; justify-content: space-between; font-size: 14px;">
                        <span id="p1-name" style="color: #ffe600;">1P</span>
                        <span id="p1-hp-text">100 HP</span>
                    </div>
                    <div class="hp-bar-bg">
                        <div class="hp-bar-fill" id="p1-hp-bar"></div>
                    </div>
                </div>

                <div class="timer-center">
                    <span style="font-size: 11px; color: #aaa;">남은 시간</span>
                    <span class="timer-value" id="timer-count">15.0</span>
                </div>

                <div class="player-status-card" id="p2-card">
                    <div style="display: flex; justify-content: space-between; font-size: 14px;">
                        <span id="p2-name" style="color: #ffe600;">2P</span>
                        <span id="p2-hp-text">100 HP</span>
                    </div>
                    <div class="hp-bar-bg">
                        <div class="hp-bar-fill" id="p2-hp-bar"></div>
                    </div>
                </div>
            </div>

            <div class="arena-box">
                <div style="position: absolute; top: 10px; left: 14px; font-size: 12px; color: #888;" id="turn-indicator">상대방 대기 중...</div>
                <div class="current-word-display" id="current-word">대기 중</div>
            </div>

            <div class="chat-stream" id="word-history">
                <!-- 게임 로그 -->
            </div>

            <div style="display: flex; gap: 8px;">
                <input type="text" id="word-input" class="pixel-input" placeholder="단어 입력..." style="flex: 1;" onkeydown="handleKeyPress(event)" disabled>
                <button class="pixel-btn" id="submit-btn" onclick="submitWord()" disabled>입력</button>
                <button class="pixel-btn danger" onclick="leaveRoom()">나가기</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://alimbllldqphxjbnirra.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsaW1ibGxsZHFwaHhqYm5pcnJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NDE1NTcsImV4cCI6MjEwNjExNzU1N30.I7SH8lD0xSC9N2xmHHl_hpLxasgNe0nyYEKlUd8NmJk";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myUserId = "";
        let currentRoomId = null;
        let isMyTurn = false;
        let currentLastWord = "";
        let usedWordsSet = new Set();
        let dictionaryArray = [];
        let dictionarySet = new Set();
        let isDictLoaded = false;
        
        // 타이머 및 게임 상태
        let turnTimer = null;
        let maxTurnTime = 15.0; // 턴당 제한시간 (점점 줄어듦)
        let timeRemaining = 15.0;
        let p1Hp = 100;
        let p2Hp = 100;
        let p1User = "";
        let p2User = "";

        async function loadDictionary() {
            try {
                const response = await fetch("https://raw.githubusercontent.com/open-korean-text/open-korean-text/master/src/main/resources/org/openkoreantext/processor/util/noun/nouns.txt");
                const text = await response.text();
                dictionaryArray = text.split('\n').map(w => w.trim()).filter(w => w.length >= 2 && w.length <= 4);
                dictionarySet = new Set(dictionaryArray);
                isDictLoaded = true;
            } catch (err) {
                console.error("단어 로드 오류:", err);
            }
        }

        function setNickname() {
            const input = document.getElementById('nickname-input').value.trim();
            if (!input) {
                alert("닉네임을 입력하세요!");
                return;
            }
            myUserId = input;
            document.getElementById('hud-username').innerText = myUserId;
            document.getElementById('nickname-modal').style.display = 'none';

            fetchRooms();
            subscribeRoomList();
            loadDictionary();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        function openCreateRoomModal() {
            document.getElementById('create-room-modal').style.display = 'flex';
        }

        function closeCreateRoomModal() {
            document.getElementById('create-room-modal').style.display = 'none';
        }

        // 실시간 턴 타이머
        function startTimer() {
            clearInterval(turnTimer);
            timeRemaining = maxTurnTime;
            updateTimerDisplay();

            turnTimer = setInterval(() => {
                timeRemaining -= 0.1;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    clearInterval(turnTimer);
                    handleTimeOut();
                }
            }, 100);
        }

        function updateTimerDisplay() {
            document.getElementById('timer-count').innerText = Math.max(0, timeRemaining).toFixed(1);
        }

        // 시간 초과 처리 (HP 차감)
        async function handleTimeOut() {
            if (isMyTurn) {
                showToast("시간 초과! 체력이 차감됩니다.");
                await applyPenalty(myUserId);
            }
        }

        // 페널티 적용 (HP 20 감소 및 턴 넘김)
        async function applyPenalty(targetUser) {
            let nextP1Hp = p1Hp;
            let nextP2Hp = p2Hp;

            if (targetUser === p1User) nextP1Hp = Math.max(0, p1Hp - 20);
            else if (targetUser === p2User) nextP2Hp = Math.max(0, p2Hp - 20);

            // 제한시간 0.5초 감소 (최소 5초까지)
            maxTurnTime = Math.max(5.0, maxTurnTime - 0.5);

            const nextTurnUser = (targetUser === p1User) ? p2User : p1User;

            await supabaseClient.from('rooms').update({
                current_turn: nextTurnUser,
                p1_hp: nextP1Hp,
                p2_hp: nextP2Hp
            }).eq('id', currentRoomId);
        }

        async function fetchRooms() {
            const { data, error } = await supabaseClient
                .from('rooms')
                .select('*')
                .eq('status', 'waiting')
                .order('created_at', { ascending: false });

            if (error) return;

            const roomListEl = document.getElementById('room-list');
            roomListEl.innerHTML = '';

            if (data.length === 0) {
                roomListEl.innerHTML = '<div style="text-align:center; padding:30px; color:rgba(255,255,255,0.4);">현재 개설된 방이 없습니다.</div>';
                return;
            }

            data.forEach(room => {
                const item = document.createElement('div');
                item.className = 'room-card';
                item.innerHTML = `
                    <div>
                        <span style="font-size:16px;">${room.title}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="color:#ffe600; font-size:13px;">${room.player2_id ? '게임 중' : '대기 중'}</span>
                        <button class="pixel-btn" onclick="joinRoom('
room.id','{room.player1_id}')">입장</button>
                    </div>
                `;
                roomListEl.appendChild(item);
            });
        }

        function subscribeRoomList() {
            supabaseClient
                .channel('public:rooms')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => {
                    fetchRooms();
                })
                .subscribe();
        }

        async function createRoom() {
            const titleInput = document.getElementById('room-title-input');
            const title = titleInput.value.trim();

            if (!title) {
                showToast("방 제목을 입력해주세요!");
                return;
            }

            closeCreateRoomModal();

            // 랜덤 시작어 선택
            const startWord = isDictLoaded ? dictionaryArray[Math.floor(Math.random() * dictionaryArray.length)] : "끝말잇기";

            const { data, error } = await supabaseClient
                .from('rooms')
                .insert([{ 
                    title: title, 
                    player1_id: myUserId, 
                    current_turn: myUserId, 
                    status: 'waiting',
                    last_word: startWord,
                    p1_hp: 100,
                    p2_hp: 100
                }])
                .select();

            if (error) {
                showToast("방 생성 실패!");
                return;
            }

            enterGameView(data[0].id);
        }

        async function joinRoom(roomId, player1Id) {
            if (player1Id === myUserId) {
                enterGameView(roomId);
                return;
            }

            const { error } = await supabaseClient
                .from('rooms')
                .update({ player2_id: myUserId, status: 'playing' })
                .eq('id', roomId);

            if (error) {
                showToast("입장 실패!");
                return;
            }

            enterGameView(roomId);
        }

        function enterGameView(roomId) {
            currentRoomId = roomId;
            usedWordsSet.clear();
            maxTurnTime = 15.0;
            document.getElementById('word-history').innerHTML = '';
            document.getElementById('lobby-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'flex';

            subscribeGameRoom(roomId);
            subscribeGameLogs(roomId);
        }

        function subscribeGameRoom(roomId) {
            supabaseClient
                .channel(`game_${roomId}`)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` }, payload => {
                    const room = payload.new;
                    if (!room) return;
                    
                    p1User = room.player1_id || '';
                    p2User = room.player2_id || '';
                    p1Hp = room.p1_hp ?? 100;
                    p2Hp = room.p2_hp ?? 100;

                    // UI 업데이트
                    document.getElementById('p1-name').innerText = p1User || '1P';
                    document.getElementById('p2-name').innerText = p2User || '대기 중...';

                    document.getElementById('p1-hp-text').innerText = `${p1Hp} HP`;
                    document.getElementById('p2-hp-text').innerText = `${p2Hp} HP`;
                    document.getElementById('p1-hp-bar').style.width = `${p1Hp}%`;
                    document.getElementById('p2-hp-bar').style.width = `${p2Hp}%`;

                    // 승패 판정
                    if (p1Hp <= 0 || p2Hp <= 0) {
                        clearInterval(turnTimer);
                        const winner = p1Hp > 0 ? p1User : p2User;
                        document.getElementById('turn-indicator').innerText = "게임 종료!";
                        document.getElementById('current-word').innerText = `${winner} 승리!`;
                        document.getElementById('word-input').disabled = true;
                        document.getElementById('submit-btn').disabled = true;
                        return;
                    }

                    // 대기 중인지 승부 중인지 판별
                    if (room.status === 'waiting' || !room.player2_id) {
                        document.getElementById('turn-indicator').innerText = "상대방 접속 대기 중...";
                        document.getElementById('current-word').innerText = "대기 중";
                        document.getElementById('word-input').disabled = true;
                        document.getElementById('submit-btn').disabled = true;
                        clearInterval(turnTimer);
                        return;
                    }

                    // 정상 플레이 상태
                    isMyTurn = (room.current_turn === myUserId);
                    document.getElementById('turn-indicator').innerText = isMyTurn ? "내 차례입니다!" : "상대방 차례입니다...";
                    document.getElementById('word-input').disabled = !isMyTurn;
                    document.getElementById('submit-btn').disabled = !isMyTurn;

                    if (room.last_word) {
                        currentLastWord = room.last_word;
                        document.getElementById('current-word').innerText = currentLastWord;
                    }

                    startTimer();
                })
                .subscribe();
        }

        function subscribeGameLogs(roomId) {
            supabaseClient
                .channel(`logs_${roomId}`)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'game_logs', filter: `room_id=eq.${roomId}` }, payload => {
                    const log = payload.new;
                    usedWordsSet.add(log.word);

                    const historyEl = document.getElementById('word-history');
                    const line = document.createElement('div');
                    line.className = 'chat-line';
                    line.innerHTML = `<span style="color:#ffe600;">[${log.player_id}]</span> ${log.word}`;
                    historyEl.appendChild(line);
                    historyEl.scrollTop = historyEl.scrollHeight;
                })
                .subscribe();
        }

        function getPhoneticVariants(char) {
            const code = char.charCodeAt(0) - 0xAC00;
            if (code < 0 || code > 11172) return [char];

            const initialIdx = Math.floor(code / 588);
            const medialIdx = Math.floor((code % 588) / 28);
            const finalIdx = code % 28;

            let variants = [char];

            if (initialIdx === 2 && [12, 17, 18, 20].includes(medialIdx)) {
                const newCode = 0xAC00 + (11 * 588) + (medialIdx * 28) + finalIdx;
                variants.push(String.fromCharCode(newCode));
            }
            if (initialIdx === 5) {
                if ([2, 4, 12, 17, 18, 20].includes(medialIdx)) {
                    const newCode = 0xAC00 + (11 * 588) + (medialIdx * 28) + finalIdx;
                    variants.push(String.fromCharCode(newCode));
                } else {
                    const newCode = 0xAC00 + (2 * 588) + (medialIdx * 28) + finalIdx;
                    variants.push(String.fromCharCode(newCode));
                }
            }

            return variants;
        }

        async function submitWord() {
            const inputEl = document.getElementById('word-input');
            const word = inputEl.value.trim();

            if (!word) return;

            if (!isMyTurn) {
                showToast("상대방 차례입니다!");
                return;
            }

            // 잘못된 단어 입력 시 HP 감점 규칙
            if (usedWordsSet.has(word)) {
                showToast("이미 사용된 단어입니다! (-20 HP)");
                inputEl.value = '';
                await applyPenalty(myUserId);
                return;
            }

            if (isDictLoaded && !dictionarySet.has(word)) {
                showToast("사전에 없는 명사입니다! (-20 HP)");
                inputEl.value = '';
                await applyPenalty(myUserId);
                return;
            }

            if (currentLastWord !== "") {
                const lastChar = currentLastWord.slice(-1);
                const validFirstChars = getPhoneticVariants(lastChar);
                const inputFirstChar = word.charAt(0);

                if (!validFirstChars.includes(inputFirstChar)) {
                    showToast(`'${lastChar}'(으)로 시작해야 합니다! (-20 HP)`);
                    inputEl.value = '';
                    await applyPenalty(myUserId);
                    return;
                }
            }

            inputEl.value = '';

            // 정상 성공 처리
            maxTurnTime = Math.max(5.0, maxTurnTime - 0.5); // 입력 성공 시 제한시간 축소
            const nextTurnUser = (myUserId === p1User) ? p2User : p1User;

            await supabaseClient.from('game_logs').insert([{ room_id: currentRoomId, player_id: myUserId, word: word }]);

            await supabaseClient.from('rooms').update({
                last_word: word,
                current_turn: nextTurnUser
            }).eq('id', currentRoomId);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') submitWord();
        }

        async function leaveRoom() {
            clearInterval(turnTimer);
            if (currentRoomId) {
                await supabaseClient.from('rooms').delete().eq('id', currentRoomId);
            }
            location.reload();
        }
    </script>
