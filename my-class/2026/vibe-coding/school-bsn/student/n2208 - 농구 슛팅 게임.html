<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>농구 슛 슈팅 게임</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            touch-action: none; /* 모바일 드래그 시 스크롤 방지 */
            user-select: none;
        }
        canvas {
            display: block;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        /* Custom Glowing & Glassmorphism Utilities */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 overflow-hidden select-none">


    <!-- 메인 컨테이너 -->
    <div class="relative w-full max-w-5xl flex flex-col items-center">
       
        <!-- 상단 헤더 & 상태 UI -->
        <div class="w-full glass-panel rounded-2xl p-3 sm:p-4 mb-3 flex flex-wrap justify-between items-center gap-2 shadow-xl border border-slate-700/50">
            <!-- 게임 제목 및 라운드 -->
            <div class="flex items-center space-x-3">
                <div class="bg-orange-500 text-white p-2 rounded-xl shadow-lg shadow-orange-500/30">
                    🏀
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-slate-100 leading-tight">농구 슈팅 게임</h1>
                    <div class="flex items-center space-x-2 text-xs sm:text-sm font-semibold">
                        <span class="text-orange-400">라운드 <span id="round-display">1</span></span>
                        <span class="text-slate-500">•</span>
                        <span class="text-amber-300">목표: <span id="target-score-display">200</span>점</span>
                    </div>
                </div>
            </div>


            <!-- 스코어 현황 -->
            <div class="flex items-center space-x-4 sm:space-x-6 text-center">
                <div>
                    <p class="text-[10px] sm:text-xs font-medium text-slate-400">현재 점수</p>
                    <p id="score-display" class="text-xl sm:text-2xl font-black text-amber-400 tracking-wider">0</p>
                </div>
                <div>
                    <p class="text-[10px] sm:text-xs font-medium text-slate-400">남은 시간</p>
                    <p id="timer-display" class="text-xl sm:text-2xl font-black text-emerald-400 tracking-wider">50<span class="text-xs font-normal">초</span></p>
                </div>
                <div>
                    <p class="text-[10px] sm:text-xs font-medium text-slate-400">최고 기록</p>
                    <p id="high-score-display" class="text-xl sm:text-2xl font-black text-purple-400 tracking-wider">0</p>
                </div>
            </div>
        </div>


        <!-- 게임 캔버스 영역 -->
        <div class="relative w-full aspect-[16/9] max-h-[70vh] rounded-2xl overflow-hidden shadow-2xl border border-slate-800">
            <canvas id="gameCanvas" class="w-full h-full cursor-grab active:cursor-grabbing"></canvas>


            <!-- 시작 / 일시정지 / 게임오버 모달 오버레이 -->
            <div id="overlay-modal" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center transition-opacity duration-300 z-20">
                <div class="max-w-md w-full bg-slate-900 border border-slate-700/80 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
                    <div id="modal-icon" class="text-5xl sm:text-6xl animate-bounce">🏀</div>
                    <h2 id="modal-title" class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-200">
                        농구 슛 슈팅 게임
                    </h2>
                   
                    <div id="modal-desc" class="text-sm sm:text-base text-slate-300 space-y-2 leading-relaxed bg-slate-800/60 p-4 rounded-xl border border-slate-700/40">
                        <p>🎯 <span class="text-orange-400 font-bold">클린 골 (직접)</span>: 100점</p>
                        <p>📐 <span class="text-amber-400 font-bold">뱅크 슛 (백보드 맞고)</span>: 50점</p>
                        <p class="text-xs text-slate-400 pt-2 border-t border-slate-700">
                            공을 드래그하여 각도와 파워를 조절한 뒤 놓아서 슛을 쏘세요!<br>
                            8m 장애물 벽과 위아래로 움직이는 수비수를 피해 넣어야 합니다.
                        </p>
                    </div>


                    <button id="start-btn" onclick="startGame()" class="w-full py-3.5 px-6 rounded-xl font-bold text-lg bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-slate-950 shadow-lg shadow-orange-500/25 transition-all transform active:scale-95">
                        게임 시작
                    </button>
                </div>
            </div>


            <!-- 라운드 클리어 모달 오버레이 -->
            <div id="round-clear-modal" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20">
                <div class="max-w-md w-full bg-slate-900 border border-emerald-500/40 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-5">
                    <div class="text-5xl animate-bounce">🎉</div>
                    <h2 class="text-3xl font-black text-emerald-400">ROUND CLEAR!</h2>
                    <p id="round-clear-desc" class="text-slate-300 font-medium">
                        축하합니다! 목표 점수를 달성했습니다.
                    </p>
                    <div class="bg-slate-800/80 p-4 rounded-2xl space-y-1">
                        <p class="text-xs text-slate-400">현재 누적 점수</p>
                        <p id="round-clear-score" class="text-3xl font-black text-amber-400">0</p>
                    </div>
                    <button onclick="nextRound()" class="w-full py-3.5 px-6 rounded-xl font-bold text-lg bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 shadow-lg shadow-emerald-500/25 hover:from-emerald-600 hover:to-teal-500 transition-all transform active:scale-95">
                        다음 라운드 도전
                    </button>
                </div>
            </div>
        </div>


        <!-- 하단 조작 안내 -->
        <div class="w-full flex justify-between items-center text-xs text-slate-400 mt-2 px-2">
            <span>💡 팁: 높은 포물선을 그려 8m 벽과 수비수를 넘기세요.</span>
            <span>드래그 & 드롭으로 발사</span>
        </div>
    </div>


    <!-- 스크립트 시작 -->
    <script>
        // 캔버스 및 디바이스 설정
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');


        // 게임 상태 변수
        let gameState = 'READY'; // READY, PLAYING, ROUND_CLEAR, GAME_OVER
        let score = 0;
        let round = 1;
        let targetScore = 200;
        let timeLeft = 50;
        let timerInterval = null;
        let highScore = parseInt(localStorage.getItem('basketball_high_score') || '0', 10);


        // UI 요소
        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer-display');
        const roundDisplay = document.getElementById('round-display');
        const targetScoreDisplay = document.getElementById('target-score-display');
        const highScoreDisplay = document.getElementById('high-score-display');
        const overlayModal = document.getElementById('overlay-modal');
        const roundClearModal = document.getElementById('round-clear-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalIcon = document.getElementById('modal-icon');
        const startBtn = document.getElementById('start-btn');


        // 초기 최고점수 렌더링
        highScoreDisplay.textContent = highScore;


        // 화면 크기 반응형 가상 뷰포트 크기 설정 (원래 비율 유지 1200x675)
        const GAME_WIDTH = 1200;
        const GAME_HEIGHT = 675;


        // 물리 상수
        const GRAVITY = 0.45;
        const BOUNCE_RESTITUTION = 0.65; // 반발 계수


        // 스코어 팝업 텍스트 리스트
        let scorePopups = [];


        // 파티클 시스템 (클리어 시 효과)
        let particles = [];


        // 농구공 객체
        const ball = {
            startX: 120,
            startY: 480,
            x: 120,
            y: 480,
            vx: 0,
            vy: 0,
            radius: 18,
            isDragging: false,
            isShot: false,
            touchedBackboard: false, // 뱅크슛 유무 판별
            rotation: 0,
            rotationSpeed: 0,
            reset: function() {
                this.x = this.startX;
                this.y = this.startY;
                this.vx = 0;
                this.vy = 0;
                this.isShot = false;
                this.isDragging = false;
                this.touchedBackboard = false;
                this.rotation = 0;
                this.rotationSpeed = 0;
            }
        };


        // 조작 드래그 위치 정보
        let dragCurrent = { x: 0, y: 0 };


        // 장애물: 8m 벽 (중앙 배치)
        const wall = {
            x: 480,
            y: 220,
            width: 24,
            height: 380, // 땅에서 위로 길게 솟은 8m 벽
            label: "8m Wall"
        };


        // 수비수 객체
        const defender = {
            x: 720,
            y: 350,
            width: 38,
            height: 110,
            baseY: 350,
            minY: 180,
            maxY: 460,
            speed: 3,
            direction: 1,
            armAngle: 0, // 2라운드부터 팔 흔들기
            update: function() {
                // 상하 이동
                this.y += this.speed * this.direction;
                if (this.y <= this.minY) {
                    this.y = this.minY;
                    this.direction = 1;
                } else if (this.y >= this.maxY) {
                    this.y = this.maxY;
                    this.direction = -1;
                }


                // 2라운드 이상: 손/팔 흔들기 애니메이션
                if (round >= 2) {
                    this.armAngle += 0.12;
                } else {
                    this.armAngle = 0;
                }
            }
        };


        // 골대 및 백보드 객체
        const hoop = {
            x: 1000,
            y: 260,
            baseX: 1000,
            width: 80,
            rimThickness: 8,
            netHeight: 50,
            moveSpeed: 2,
            moveDirection: 1,
            moveRange: 70, // 3라운드 좌우 이동 범위


            // 백보드 사양
            backboard: {
                x: 1080, // hoop.x + hoop.width
                y: 160,
                width: 14,
                height: 150
            },


            update: function() {
                // 3라운드 이상: 골대가 좌우로 이동
                if (round >= 3) {
                    this.x += this.moveSpeed * this.moveDirection;
                    if (Math.abs(this.x - this.baseX) > this.moveRange) {
                        this.moveDirection *= -1;
                    }
                } else {
                    this.x = this.baseX;
                }
                // 백보드 위치 업데이트 (림 오른쪽 끝에 고정)
                this.backboard.x = this.x + this.width;
            }
        };


        // 캔버스 크기 맞춤 및 비율 계산
        let scale = 1;
        function resizeCanvas() {
            const container = canvas.parentElement;
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;


            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;


            const scaleX = containerWidth / GAME_WIDTH;
            scaleY = containerHeight / GAME_HEIGHT;
            scale = Math.min(scaleX, scaleY);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();


        // 좌표 변환 (마우스/터치 위치 -> 캔버스 가상 좌표)
        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;


            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }


            const x = (clientX - rect.left) * (GAME_WIDTH / rect.width);
            const y = (clientY - rect.top) * (GAME_HEIGHT / rect.height);
            return { x, y };
        }


        // --- 마우스 및 터치 이벤트 핸들러 ---
        function handleStart(pos) {
            if (gameState !== 'PLAYING' || ball.isShot) return;


            // 농구공 근처를 클릭했는지 확인
            const dist = Math.hypot(pos.x - ball.x, pos.y - ball.y);
            if (dist < ball.radius * 2.5) {
                ball.isDragging = true;
                dragCurrent = { x: pos.x, y: pos.y };
            }
        }


        function handleMove(pos) {
            if (!ball.isDragging) return;
            dragCurrent = { x: pos.x, y: pos.y };
        }


        function handleEnd() {
            if (!ball.isDragging) return;
            ball.isDragging = false;


            // 당긴 거리 기반 발사 속도 계산 (슬링샷 스타일)
            const dx = ball.startX - dragCurrent.x;
            const dy = ball.startY - dragCurrent.y;


            // 공을 뒤로 당길 때만 발사
            if (dx > 10) {
                const launchPower = 0.22;
                ball.vx = dx * launchPower;
                ball.vy = dy * launchPower;
                ball.isShot = true;
                ball.rotationSpeed = ball.vx * 0.05; // 회전 효과
            } else {
                ball.reset();
            }
        }


        // 마우스 이벤트 등록
        canvas.addEventListener('mousedown', (e) => handleStart(getCanvasCoordinates(e)));
        window.addEventListener('mousemove', (e) => handleMove(getCanvasCoordinates(e)));
        window.addEventListener('mouseup', handleEnd);


        // 터치 이벤트 등록
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleStart(getCanvasCoordinates(e));
        }, { passive: false });
        window.addEventListener('touchmove', (e) => {
            handleMove(getCanvasCoordinates(e));
        });
        window.addEventListener('touchend', handleEnd);


        // --- 게임 루프 및 타이머 ---
        function startGame() {
            score = 0;
            round = 1;
            targetScore = 200;
            updateUI();


            overlayModal.classList.add('hidden');
            roundClearModal.classList.add('hidden');


            startRound();
        }


        function startRound() {
            gameState = 'PLAYING';
            timeLeft = 50;
            timerDisplay.textContent = timeLeft + '초';
            ball.reset();


            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (gameState === 'PLAYING') {
                    timeLeft--;
                    timerDisplay.textContent = timeLeft + '초';


                    if (timeLeft <= 0) {
                        endGame(false);
                    }
                }
            }, 1000);
        }


        function updateUI() {
            scoreDisplay.textContent = score;
            roundDisplay.textContent = round;
            targetScoreDisplay.textContent = targetScore;
            highScoreDisplay.textContent = highScore;
        }


        function nextRound() {
            round++;
            targetScore = round * 200; // 라운드별 200의 배수 목표 (R1: 200, R2: 400, R3: 600...)
            updateUI();


            roundClearModal.classList.add('hidden');
            startRound();
        }


        function endGame(isVictory) {
            gameState = 'GAME_OVER';
            clearInterval(timerInterval);


            // 최고점수 기록 저장
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('basketball_high_score', highScore);
                highScoreDisplay.textContent = highScore;
            }


            modalIcon.textContent = isVictory ? "🏆" : "💥";
            modalTitle.textContent = isVictory ? "전설의 슈터 승리!" : "타임 아웃! 게임 오버";
            modalDesc.innerHTML = `
                <p class="text-lg font-bold text-slate-100 mb-2">최종 점수: <span class="text-amber-400">${score}</span>점</p>
                <p class="text-sm text-slate-300">도달 라운드: ${round} 라운드</p>
            `;
            startBtn.textContent = "다시 도전하기";
            overlayModal.classList.remove('hidden');
        }


        // 득점 처리 함수
        function addScore(points, isBankShot, hitX, hitY) {
            score += points;
            updateUI();


            // 팝업 텍스트 추가
            scorePopups.push({
                text: isBankShot ? "+50 BANK SHOT!" : "+100 SWISH!",
                color: isBankShot ? "#f59e0b" : "#10b981",
                x: hitX,
                y: hitY - 20,
                alpha: 1.0,
                scale: 1.2
            });


            // 폭죽 효과 파티클 생성
            createFireworks(hitX, hitY);


            // 라운드 목표점수 달성 체크
            if (score >= targetScore) {
                gameState = 'ROUND_CLEAR';
                clearInterval(timerInterval);
                setTimeout(() => {
                    document.getElementById('round-clear-score').textContent = score;
                    roundClearModal.classList.remove('hidden');
                }, 800);
            }
        }


        // 파티클 생성 함수
        function createFireworks(x, y) {
            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: `hsl(${Math.random() * 50 + 20}, 100%, 60%)`,
                    radius: Math.random() * 4 + 2,
                    alpha: 1.0,
                    life: 1.0
                });
            }
        }


        // --- 충돌 판정 및 물리 업데이트 ---
        function updatePhysics() {
            defender.update();
            hoop.update();


            if (!ball.isShot) return;


            // 중력 적용
            ball.vy += GRAVITY;
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.rotation += ball.rotationSpeed;


            // 바닥 충돌
            const groundY = GAME_HEIGHT - 70;
            if (ball.y + ball.radius > groundY) {
                ball.y = groundY - ball.radius;
                ball.vy *= -BOUNCE_RESTITUTION;
                ball.vx *= 0.8; // 마찰력


                // 공이 거의 정지하면 리셋
                if (Math.abs(ball.vy) < 1.5 && Math.abs(ball.vx) < 1) {
                    ball.reset();
                }
            }


            // 화면 좌/우 벽 충돌
            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.vx *= -BOUNCE_RESTITUTION;
            } else if (ball.x + ball.radius > GAME_WIDTH) {
                ball.x = GAME_WIDTH - ball.radius;
                ball.vx *= -BOUNCE_RESTITUTION;
                // 오른쪽 밖으로 너무 멀리 나가면 리셋
                setTimeout(() => { if (ball.isShot) ball.reset(); }, 1200);
            }


            // 1. 8m 벽 충돌 판정 (AABB)
            if (ball.x + ball.radius > wall.x &&
                ball.x - ball.radius < wall.x + wall.width &&
                ball.y + ball.radius > wall.y) {
               
                // 좌/우 옆면 충돌 처리
                if (ball.x < wall.x) {
                    ball.x = wall.x - ball.radius;
                    ball.vx *= -BOUNCE_RESTITUTION;
                } else if (ball.x > wall.x + wall.width) {
                    ball.x = wall.x + wall.width + ball.radius;
                    ball.vx *= -BOUNCE_RESTITUTION;
                }
                // 상단 면 충돌
                if (ball.y < wall.y + 10 && ball.vy > 0) {
                    ball.vy *= -BOUNCE_RESTITUTION;
                }
            }


            // 2. 수비수 충돌 판정
            const defHeadY = defender.y - 15;
            const defHeightTotal = defender.height + (round >= 2 ? 40 : 0); // 손 흔들 시 높이 확장
            if (ball.x + ball.radius > defender.x - defender.width/2 &&
                ball.x - ball.radius < defender.x + defender.width/2 &&
                ball.y + ball.radius > defHeadY &&
                ball.y - ball.radius < defender.y + defender.height) {


                // 수비수에 튕겨 나감
                ball.vx = -Math.abs(ball.vx) * 0.8 - 2;
                ball.vy *= 0.8;
            }


            // 3. 백보드 충돌 판정
            const bb = hoop.backboard;
            if (ball.x + ball.radius > bb.x &&
                ball.x - ball.radius < bb.x + bb.width &&
                ball.y + ball.radius > bb.y &&
                ball.y - ball.radius < bb.y + bb.height) {


                ball.x = bb.x - ball.radius;
                ball.vx *= -BOUNCE_RESTITUTION;
                ball.touchedBackboard = true; // 뱅크슛 플래그
            }


            // 4. 링 (Rim) 충돌 - 앞쪽 링 & 뒤쪽 링 점 충돌
            const frontRim = { x: hoop.x, y: hoop.y };
            const backRim = { x: hoop.x + hoop.width, y: hoop.y };


            [frontRim, backRim].forEach(rimPt => {
                const dist = Math.hypot(ball.x - rimPt.x, ball.y - rimPt.y);
                if (dist < ball.radius + hoop.rimThickness / 2) {
                    // 점 충돌 반사각 계산
                    const angle = Math.atan2(ball.y - rimPt.y, ball.x - rimPt.x);
                    const speed = Math.hypot(ball.vx, ball.vy);
                    ball.vx = Math.cos(angle) * speed * BOUNCE_RESTITUTION;
                    ball.vy = Math.sin(angle) * speed * BOUNCE_RESTITUTION;


                    // 겹침 해제
                    ball.x = rimPt.x + Math.cos(angle) * (ball.radius + hoop.rimThickness / 2);
                    ball.y = rimPt.y + Math.sin(angle) * (ball.radius + hoop.rimThickness / 2);
                }
            });


            // 5. 골대 입구 통과 (득점 판정)
            // 공이 림 안쪽 X 영역 통과 + 위에서 아래로 통과하는 Y 속도
            if (ball.x > hoop.x + 10 &&
                ball.x < hoop.x + hoop.width - 10 &&
                ball.y > hoop.y &&
                ball.y < hoop.y + 25 &&
                ball.vy > 0) {


                const points = ball.touchedBackboard ? 50 : 100;
                addScore(points, ball.touchedBackboard, hoop.x + hoop.width / 2, hoop.y);
                ball.reset();
            }
        }


        // --- 렌더링 함수들 ---
        function drawBackground() {
            // 코트 바닥
            const groundY = GAME_HEIGHT - 70;
            ctx.fillStyle = "#334155";
            ctx.fillRect(0, groundY, GAME_WIDTH, 70);


            // 코트 라인
            ctx.strokeStyle = "#64748b";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(GAME_WIDTH, groundY);
            ctx.stroke();


            // 거리 표시 스케일 안내
            ctx.fillStyle = "#94a3b8";
            ctx.font = "12px sans-serif";
            ctx.fillText("0m (Shooter)", 100, groundY + 25);
            ctx.fillText("8m (Wall Barrier)", wall.x - 20, groundY + 25);
            ctx.fillText("15m (Hoop)", hoop.baseX - 10, groundY + 25);
        }


        function drawWall() {
            // 8m 콘크리트 벽 장벽
            const gradient = ctx.createLinearGradient(wall.x, 0, wall.x + wall.width, 0);
            gradient.addColorStop(0, '#64748b');
            gradient.addColorStop(0.5, '#94a3b8');
            gradient.addColorStop(1, '#475569');


            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.roundRect(wall.x, wall.y, wall.width, wall.height, 6);
            ctx.fill();


            // 벽 격자 무늬 패턴
            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 2;
            for (let y = wall.y + 30; y < wall.y + wall.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(wall.x, y);
                ctx.lineTo(wall.x + wall.width, y);
                ctx.stroke();
            }


            // "8m" 라벨 표시
            ctx.fillStyle = "#f8fafc";
            ctx.font = "bold 13px sans-serif";
            ctx.textAlign = "center";
            ctx.save();
            ctx.translate(wall.x + wall.width / 2, wall.y + 40);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText("8m BARRIER", 0, 4);
            ctx.restore();
        }


        function drawDefender() {
            ctx.save();
            ctx.translate(defender.x, defender.y);


            // 수비수 캐릭터 머리
            ctx.fillStyle = "#f43f5e";
            ctx.beginPath();
            ctx.arc(0, -10, 16, 0, Math.PI * 2);
            ctx.fill();


            // 수비수 몸통
            ctx.fillStyle = "#e11d48";
            ctx.beginPath();
            ctx.roundRect(-18, 8, 36, 65, 8);
            ctx.fill();


            // 수비수 눈
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(-6, -12, 4, 0, Math.PI * 2);
            ctx.arc(6, -12, 4, 0, Math.PI * 2);
            ctx.fill();


            // 수비수 팔 (2라운드 이상 시 좌우로 흔들림)
            ctx.strokeStyle = "#e11d48";
            ctx.lineWidth = 10;
            ctx.lineCap = "round";


            const leftArmAngle = Math.sin(defender.armAngle) * 0.6 - 0.8;
            const rightArmAngle = -Math.sin(defender.armAngle) * 0.6 + 0.8;


            // 왼팔
            ctx.save();
            ctx.translate(-16, 16);
            ctx.rotate(leftArmAngle - Math.PI / 3);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, 45);
            ctx.stroke();
            ctx.restore();


            // 오른팔
            ctx.save();
            ctx.translate(16, 16);
            ctx.rotate(rightArmAngle + Math.PI / 3);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, 45);
            ctx.stroke();
            ctx.restore();


            ctx.restore();
        }


        function drawHoopAndBackboard() {
            const bb = hoop.backboard;


            // 백보드 지지대
            ctx.fillStyle = "#475569";
            ctx.fillRect(bb.x + bb.width, bb.y + 40, 40, 12);
            ctx.fillRect(bb.x + bb.width + 30, bb.y + 40, 12, GAME_HEIGHT - (bb.y + 40) - 70);


            // 백보드 (유리)
            ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
            ctx.strokeStyle = "#cbd5e1";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.roundRect(bb.x, bb.y, bb.width, bb.height, 4);
            ctx.fill();
            ctx.stroke();


            // 백보드 내부 사각형 박스
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 3;
            ctx.strokeRect(bb.x, bb.y + 50, bb.width, 50);


            // 림 (Hoop Rim)
            ctx.strokeStyle = "#f97316";
            ctx.lineWidth = hoop.rimThickness;
            ctx.beginPath();
            ctx.moveTo(hoop.x, hoop.y);
            ctx.lineTo(hoop.x + hoop.width, hoop.y);
            ctx.stroke();


            // 넷 (Net - 그물망)
            ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
            ctx.lineWidth = 2;
            const netSegments = 5;
            const segmentWidth = hoop.width / netSegments;


            ctx.beginPath();
            for (let i = 0; i <= netSegments; i++) {
                ctx.moveTo(hoop.x + i * segmentWidth, hoop.y);
                ctx.lineTo(hoop.x + 10 + i * (segmentWidth - 3), hoop.y + hoop.netHeight);
            }
            for (let i = 0; i <= netSegments; i++) {
                ctx.moveTo(hoop.x + hoop.width - i * segmentWidth, hoop.y);
                ctx.lineTo(hoop.x + hoop.width - 10 - i * (segmentWidth - 3), hoop.y + hoop.netHeight);
            }
            ctx.stroke();
        }


        function drawBall() {
            ctx.save();
            ctx.translate(ball.x, ball.y);
            ctx.rotate(ball.rotation);


            // 공 본체
            const grad = ctx.createRadialGradient(-ball.radius/3, -ball.radius/3, 2, 0, 0, ball.radius);
            grad.addColorStop(0, '#f97316');
            grad.addColorStop(0.8, '#ea580c');
            grad.addColorStop(1, '#c2410c');


            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
            ctx.fill();


            // 농구공 검은 선 무늬
            ctx.strokeStyle = '#431407';
            ctx.lineWidth = 2;


            // 십자선
            ctx.beginPath();
            ctx.moveTo(-ball.radius, 0);
            ctx.lineTo(ball.radius, 0);
            ctx.moveTo(0, -ball.radius);
            ctx.lineTo(0, ball.radius);
            ctx.stroke();


            // 곡선 라인
            ctx.beginPath();
            ctx.arc(0, 0, ball.radius * 0.7, -Math.PI / 4, Math.PI / 4);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, ball.radius * 0.7, (3 * Math.PI) / 4, (5 * Math.PI) / 4);
            ctx.stroke();


            ctx.restore();
        }


        // 드래그 시 궤적 예상 점선 가이드
        function drawTrajectory() {
            if (!ball.isDragging) return;


            // 조작 당김 선
            ctx.strokeStyle = "rgba(251, 146, 60, 0.6)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(ball.startX, ball.startY);
            ctx.lineTo(dragCurrent.x, dragCurrent.y);
            ctx.stroke();


            // 예상 발사 속도
            const dx = ball.startX - dragCurrent.x;
            const dy = ball.startY - dragCurrent.y;


            if (dx <= 0) return; // 뒤로 당길 때만 표시


            let simX = ball.startX;
            let simY = ball.startY;
            let simVx = dx * 0.22;
            let simVy = dy * 0.22;


            ctx.fillStyle = "rgba(251, 146, 60, 0.8)";
            for (let i = 0; i < 25; i++) {
                simVy += GRAVITY;
                simX += simVx;
                simY += simVy;


                if (simY > GAME_HEIGHT - 70) break; // 바닥 도달 시 중단


                ctx.beginPath();
                ctx.arc(simX, simY, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }


        // 팝업 텍스트 & 파티클 애니메이션 렌더링
        function drawEffects() {
            // 점수 팝업 텍스트
            for (let i = scorePopups.length - 1; i >= 0; i--) {
                const p = scorePopups[i];
                p.y -= 1.2;
                p.alpha -= 0.02;


                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.font = "bold 22px sans-serif";
                ctx.textAlign = "center";
                ctx.shadowColor = "rgba(0,0,0,0.5)";
                ctx.shadowBlur = 4;
                ctx.fillText(p.text, p.x, p.y);
                ctx.restore();


                if (p.alpha <= 0) scorePopups.splice(i, 1);
            }


            // 폭죽 파티클
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.vy += 0.15; // 파티클 중력
                pt.alpha -= 0.025;


                ctx.save();
                ctx.globalAlpha = Math.max(0, pt.alpha);
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();


                if (pt.alpha <= 0) particles.splice(i, 1);
            }
        }


        // --- 메인 게임 루프 ---
        function gameLoop() {
            // 화면 지우기
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);


            // 오프젝트 렌더링
            drawBackground();
            drawWall();
            drawHoopAndBackboard();
            drawDefender();
            drawTrajectory();
            drawBall();
            drawEffects();


            // 물리 업데이트
            if (gameState === 'PLAYING') {
                updatePhysics();
            }


            requestAnimationFrame(gameLoop);
        }


        // 게임 루프 시작
        requestAnimationFrame(gameLoop);
    </script>
