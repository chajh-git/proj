<p id="d">형광등이 윙윙대는 끝없는 노란 방. 저팔게 3마리와 친구가 돌아다닌다.<br>만나면 죽는다. 초록빛 출구를 찾아 이 곳을 빠져나가라.<br><small>이동 WASD/방향키 · 시선 마우스 · 모바일은 왼쪽 화면 드래그로 이동, 오른쪽 화면 드래그로 회전</small></p>

function solid(x,y){return map[y|0][x|0]!=0}

function update(dt){
let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+mv.y,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+mv.x;

const l=Math.hypot(f,s);if(l>1){f/=l;s/=l}const sp=3*dt,ca=Math.cos(P.a),sa=Math.sin(P.a);

if(can(P.x+vx,P.y))P.x+=vx;if(can(P.x,P.y+vy))P.y+=vy;

const zb=[];

c.putImageData(ib,0,0)}
function render(dt){

else{const st=(wx*12)%1,hs=hh(mx*31+(wx*6|0),my*17+side)&255;k*=(st<.12?.86:1)*(.9+hs/255*.12)*(wx<.03?.8:1)}
k*=side?.82:1;const y0=(H-lh)/2;
c.fillStyle=`rgb(
r*k|0,{g*k|0},${b*k|0})`;c.fillRect(x,y0,1,lh);
