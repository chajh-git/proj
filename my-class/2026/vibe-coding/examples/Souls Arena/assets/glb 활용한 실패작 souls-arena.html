const clang=(t,v)=>{[820,1330,1970,2640].forEach((f,i)=>tone(t,f,f*.995,.55-i*.08,'sine',v/(i+1.5)));noise(t,.08,'highpass',3000,5000,.7,v*1.2)};
return{
