 Object.assign(P,{hp:100,st:100,state:'idle',t:0,guard:false,parry:0,lockT:0,stDelay:0,dead:false,flash:0});P.pos.set(0,0,8);P.yaw=PI;yaw=PI;pitch=.2;P.m.g.rotation.x=0;P.pp.set(0,0,8);
 ENCOUNTER.forEach((n,i)=>{const a=PI+(i-(ENCOUNTER.length-1)/2)*1.2;enemies.push(new Enemy(ENEMIES[n],Math.sin(a)*-6,Math.cos(a)*-6+(ENCOUNTER.length>1?0:0)))});
 tgt=null;endT=0;resume()}
function resume(){$('ov').style.display='none';running=true;try{rd.domElement.requestPointerLock()}catch(e){}}
$('bt').onclick=()=>{if($('bt').textContent=='계속')resume();else startGame()};
/* ---------- UI/루프 ---------- */
function ui(){$('hp').style.width=P.hp+'%';$('st').style.width=P.st+'%';
 const tg=target();$('eb').style.display=tg?'block':'none';if(tg){$('en').textContent=tg.d.name;$('eh').style.width=Math.max(0,tg.hp/tg.max*100)+'%'}
 const lk=$('lk');if(lockOn&&tg){const v=V(tg.pos.x,2.4,tg.pos.z).project(cam);if(v.z<1){lk.style.display='block';lk.style.left=(v.x+1)/2*innerWidth+'px';lk.style.top=(1-v.y)/2*innerHeight+'px'}else lk.style.display='none'}else lk.style.display='none';
 msgT=Math.max(0,msgT-.016);$('msg').style.opacity=Math.min(1,msgT*2.5)}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;DT=dt;
 if(running){updP(dt);enemies.forEach(e=>e.update(dt));collide();
  if(endT>0){endT-=dt;if(endT<=0)showOv(result,result=='YOU DIED'?'다시 도전하시겠습니까?':'전투 승리. 다시 도전하시겠습니까?','다시 시작')}}
 posePl();enemies.forEach(e=>{if(!e.dead)e.pose()});updCam(dt);fx(now);ui();rd.render(sc,cam)}
startGame();showOv('SOULS ARENA',null,'시작');requestAnimationFrame(loop);
</script></body></html>
