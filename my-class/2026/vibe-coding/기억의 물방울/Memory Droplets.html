<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>💧Memory Droplets</title>
<style>
:root{--void:#03050b;--ink:#e8eeff;--cy:#7cf}
html,body{margin:0;height:100%;background:var(--void);overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,5,11,.74);color:var(--ink);text-align:center;gap:12px;padding:24px;cursor:default}
#ov h1{margin:0;font-size:clamp(30px,7vw,58px);font-weight:800;letter-spacing:.02em}
#ov p{margin:0;opacity:.85;line-height:1.7;max-width:520px}
#ov b{color:var(--cy)}
#ov p:empty{display:none}
#res{border-collapse:collapse;margin:4px auto 0;font-size:18px;line-height:1.9}
#res td{border:none;padding:0 10px}
#res td:first-child{text-align:right;opacity:.6}
#res td:last-child{text-align:left;font-weight:700;color:var(--cy)}
@keyframes pls{0%,100%{opacity:.55;text-shadow:0 0 0 rgba(124,204,255,0)}50%{opacity:1;text-shadow:0 0 28px rgba(124,204,255,.7)}}
#ov h1{animation:pls 2.2s ease-in-out infinite}
#nick{margin-top:6px;width:220px;max-width:80%;padding:10px 14px;font-size:16px;font-weight:600;font-family:inherit;text-align:center;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(124,204,255,.5);border-radius:10px;outline:none;cursor:text}
#nick:focus{border-color:var(--cy);background:rgba(255,255,255,.14)}
#nick::placeholder{color:rgba(232,238,255,.45)}
#pallbl{margin-top:4px;font-size:13px;opacity:.7}
#pal{display:grid;grid-template-columns:repeat(6,34px);gap:10px;justify-content:center;cursor:default}
.sw{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.25);box-shadow:0 0 10px rgba(0,0,0,.4);transition:transform .12s,border-color .12s}
.sw:hover{transform:scale(1.15)}
#go{margin-top:14px;padding:12px 48px;font-size:18px;font-weight:800;letter-spacing:.14em;font-family:inherit;color:#03050b;background:#fff;border:none;border-radius:12px;cursor:pointer;box-shadow:0 0 22px rgba(255,255,255,.3);transition:transform .12s,filter .12s}
#go:hover{transform:scale(1.06);filter:brightness(1.1)}
#go:active{transform:scale(.97)}
.sw.sel{border-color:#fff;transform:scale(1.18);box-shadow:0 0 0 3px rgba(255,255,255,.25),0 0 14px rgba(255,255,255,.35)}
</style></head><body>
<canvas id="c"></canvas>
<div id="ov"><h1 id="ttl">Memory Droplets</h1><p id="msg"></p><input id="nick" type="text" autocomplete="off" spellcheck="false" placeholder="Name"><div id="pal"></div><button id="go" type="button">START</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov'),ttl=document.getElementById('ttl'),msg=document.getElementById('msg'),nick=document.getElementById('nick');
// ===== 조정 가능한 파라미터 (밀도 = N / (W*H)) =====
const P={
  // ---------- 맵 ----------
  W:2400,        // 맵 가로 크기 (px, 게임 내 좌표 기준). 맵은 원형이며 지름 = W와 H 중 작은 값 (반지름 = 지름/2)
  H:2400,        // 맵 세로 크기 (px). W와 같게 두는 것을 권장. 맵을 키우면 개체 밀도가 낮아져 만남이 줄어듦
  N:79,         // 맵에 유지되는 총 개체 수 (플레이어 포함). 흡수로 줄면 화면 밖에서 자동 보충됨

  // ---------- 배경 별빛 (글로우가 있는 작고 희미한 점들) ----------
  STAR_DENS:1000,  // 배경 점 밀도 = 1000×1000px 면적당 점 개수. 클수록 빽빽함 (0이면 점 없음, 45면 화면에 보이는 점이 대략 수십 개)
  STAR_PARALLAX:.7, // 원근감 정도 (0~1). 멀리 있는(작고 어두운) 점일수록 카메라 이동에 덜 따라 움직임. 0이면 모두 맵과 함께 고정

  // ---------- 개체(물방울) ----------
  R:12.36,       // 개체 몸통(원)의 반지름 (px). (기존 20 × 0.618) 충돌 판정, 투사체 피격, 연쇄 접촉 거리(2R)의 기준
  TAIL:1.25,        // 꼬리 끝까지의 거리 = 반지름 × TAIL. 1.0이면 완전한 원(꼬리 없음),
                 //   값이 클수록 꼬리가 길고 뾰족해짐 (이전 값 2.1 → 현재 1.55는 돌출 길이 절반)
  V:63.10144,    // 개체 기본 이동 속도 (px/초). 플레이어와 봇 모두 동일, 항상 앞으로 전진
  TURN:5,        // 플레이어 회전 속도 (라디안/초). 클수록 마우스 방향으로 빨리 꺾음 (봇은 이 값의 0.6배)

  // ---------- 투사체 ----------
  PSPD:800,      // 투사체 비행 속도 (px/초)
  PRNG:600,      // 투사체 사거리 (px). 이 거리를 날아가면 사라짐 (조준선 길이도 이 값)
  CD:2.5,        // 투사체 발사 쿨다운 (초). 발사 후 다시 쏠 수 있을 때까지의 시간

  // ---------- 연쇄(넉백) ----------
  D1:160,        // 투사체에 맞은 개체가 밀려나는 첫 거리 (px). 연쇄 접촉이 일어나면 밀려나는 거리가 계속 늘어남
  CHAIN_SPD:.45,  // 넉백/연쇄 이동 속도 배율. 1이면 원래 속도, .5면 절반 (밀려나는 총 거리는 동일, 시간만 길어짐)

  // ---------- 점수 / 가속 ----------
  E:3,           // 연쇄 접촉 1회당 획득 점수 (2번째 접촉은 2배인 E×2)
  WALL_E:3,      // 연쇄로 밀려난 개체들이 맵 외곽 경계에 부딪혀 흡수될 때, 흡수된 개체 1마리당 추가 획득 점수
  DRAIN:1,       // 스페이스 가속 중 초당 소모되는 점수
  BOOST:2,       // 가속 시 이동 속도 배율 (회전 속도는 0.7배로 감소)
  CAP:30,        // 하단 가속 게이지가 가득 차는 기준 점수 (게이지 표시용, 점수 자체의 상한은 아님)

  // ---------- 압력 충전 발사 (마우스 왼쪽 버튼 길게 누르기, 플레이어 전용) ----------
  CHG_TIME:2,    // 압력이 0 → 최대가 되는 데 걸리는 시간 (초). 쿨다운이 끝난 상태에서만 충전됨
  CHG_SLOW:.04,  // 최대 압력일 때 이동 속도 배율 (0.04 = 거의 정지). 압력에 비례해 선형으로 느려짐
  CHG_PSPD:2.5,  // 최대 압력일 때 투사체 속도 배율 (압력 0이면 1배, 압력에 비례해 증가)
  CHG_KB:2,      // 최대 압력일 때 넉백 거리 추가 배율. 넉백 거리 = D1 × (1 + CHG_KB × 압력) → 최대 시 D1의 3배

  // ---------- 진화 단계 (점수에 따라 개체 외형이 단계별로 진화) ----------
  FX_HOLD:12,    // 내 개체의 연쇄 효과가 유지되는 시간(초). 한 번의 발사로 연쇄 클래쉬에 성공하면 그 연쇄 횟수(1~5)에 해당하는 효과 단계가 이 시간 동안 유지됨
  FX_FADE:3,     // 유지 시간이 끝나기 전 마지막 몇 초 동안 효과가 서서히 옅어짐
  // (적 개체 전용) 점수 기준 진화 단계. 내 개체는 이 값이 아니라 '한 번의 발사로 일으킨 연쇄 클래쉬 횟수'로 단계가 정해짐
  TIERS:[5,14,28,48,80], // 각 진화 단계에 도달하는 점수 5개. 1단계 보조 링 → 2단계 위성 → 3단계 갈라진 꼬리 → 4단계 코로나 광선 → 5단계 이중 링+큰 후광. 값을 키우면 진화가 늦어짐

  // ---------- 중력 (점수가 높은 개체가 더 낮은 점수의 개체를 끌어당김) ----------
  GRAV_V:34,     // 중력 최대 끌림 속도 (px/초). 0이면 중력 없음. 기본 이동 속도(V)와 비교해 조절
  GRAV_R:420,    // 중력이 미치는 최대 거리 (px). 실제 범위는 점수 차이가 클수록 이 값에 가까워짐 (최소 40%)
  GRAV_SCORE:40, // 점수 차이가 이 값 이상이면 중력이 최대 강도. 작을수록 약간의 점수 차이에도 크게 끌림

  // ---------- 각성 (마우스 우클릭 또는 Shift: 점수를 소모해 잠시 강해짐) ----------
  AWK_COST:30,   // 각성에 소모되는 점수 (하단 게이지 CAP과 같게 두면 게이지가 가득 찼을 때 사용 가능)
  AWK_TIME:6,    // 각성 지속 시간 (초). 발동 순간 투사체 쿨다운도 초기화됨
  AWK_KB:1.6,    // 각성 중 발사한 투사체의 넉백 거리 배율. 각성 중 투사체는 맞은 개체를 관통해 계속 날아감

  // ---------- 글로우 (점수가 높을수록 밝고 넓게) ----------
  GLOW_BASE:1.7, // 점수가 적을 때 글로우 반경 (몸통 반지름의 배수)
  GLOW_GAIN:4.5, // 점수가 매우 높을 때 추가되는 반경 (배수). 최대 반경 = GLOW_BASE + GLOW_GAIN
  GLOW_K:25,     // 글로우 포화 속도. 작을수록 적은 점수에서도 빨리 최대치에 가까워짐 (점수=K일 때 약 63%)

  // ---------- 사운드 (Web Audio로 실시간 합성, 별도 파일 불필요 / M 키로 음소거) ----------
  VOL:.5,        // 전체 볼륨 (0~1)
  SND_RANGE:900, // 다른 개체가 내는 소리가 들리는 최대 거리 (px). 멀수록 작아지고 이 거리 밖에서는 들리지 않음 (내 개체 소리는 항상 최대)

  // ---------- 색상 (시작 화면 팔레트에서 내 색 선택) ----------
  PAL_N:18,      // 팔레트에 표시되는 총 색 개수 (흰색 1개 + 나머지를 색상환에 균등 분할. 18이면 색 17개 + 흰색)
  COLOR_EXCL:25, // 내 색 주변에서 다른 개체가 쓰지 못하는 색상 범위 (± 도, 색상환 기준). 클수록 내 색과 더 확실히 구별됨

  // ---------- 별명 ----------
  NAME_MAX:6,    // 별명 최대 글자 수. 순위표 칸 너비에 맞춘 값이라 너무 키우면 점수와 겹칠 수 있음

  // ---------- 기타 ----------
  FPS:60         // 목표 프레임 수 (모니터 주사율이 높으면 이 값에 맞춰 프레임을 건너뜀)
};
const TAU=Math.PI*2;
// ===== 원형 맵: 중심 (MCX,MCY), 반지름 MR =====
const MCX=P.W/2,MCY=P.H/2,MR=Math.min(P.W,P.H)/2;
const outMap=(x,y,pad=0)=>Math.hypot(x-MCX,y-MCY)>MR-pad;                 // 경계(안쪽으로 pad만큼 여유)를 벗어났는가
function clampMap(o,pad){const dx=o.x-MCX,dy=o.y-MCY,d=Math.hypot(dx,dy),L=MR-pad;if(d>L){o.x=MCX+dx/d*L;o.y=MCY+dy/d*L}}   // 경계 안쪽으로 되돌림
function rndInMap(pad){const a=Math.random()*TAU,r=(MR-pad)*Math.sqrt(Math.random());return[MCX+Math.cos(a)*r,MCY+Math.sin(a)*r]}   // 원 안의 균등 무작위 점
const sa=document.createElement('div');
sa.style.cssText='position:fixed;left:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);width:1px;visibility:hidden';
document.body.appendChild(sa);
let cw=0,ch=0,dpr=1;const ins={t:0,b:0};
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hs=(h,a,l=62)=>{if(h==null){const v=Math.round(255-Math.max(0,82-l)*1.2);return `rgba(${v},${v},${v},${a})`}return `hsla(${h},92%,${l}%,${a})`};
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d}
const zoom=()=>clamp(Math.min(cw,ch)/800,.7,1.3);
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);cw=innerWidth;ch=innerHeight;cv.width=cw*dpr;cv.height=ch*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const r=sa.getBoundingClientRect();ins.t=r.top;ins.b=Math.max(0,ch-r.bottom)}
addEventListener('resize',resize);

let tailAng=[],tailLen=26,trail=[],trailLife=.3,shards=[],PL=0,topFade=0,wasTop=false,flash=0,edge=0,slowT=0,slowK=1,deadScore=0,stars=[],starSpr=[],maxClash=0,pendFire=false,suck=[],suckAcc=0,ents,projs,chains,parts,absorbs,pops,vort,player,shake,freeze,uid,state='menu',t0=0,deadAt=0,surv=0,maxScore=0,ovAt=0;
const mouse={x:0,y:0},keys={space:false,mouse:false},V={cx:0,cy:0,z:1};

let myHue=210;   // 내가 선택한 색(색상 각도 0~360, null이면 흰색)
let palIdx=0;
// 다른 개체의 색: 기존 분포(황금각)를 내 색 ±COLOR_EXCL 구간을 뺀 나머지 범위로 압축해 내 색과 겹치지 않게 함
function botHue(id){const h=(id*137.508)%360,ex=P.COLOR_EXCL;if(myHue==null)return h;return (myHue+ex+h/360*(360-2*ex))%360}
function mk(x,y,isP){const id=uid++;return{id,x,y,a:rnd(0,TAU),hue:isP?myHue:botHue(id),score:0,cd:isP?0:rnd(0,P.CD),claimed:false,circ:false,ct:0,dead:false,isP,ta:rnd(0,TAU),tt:rnd(0,2),pulse:0,boost:false,charge:0,name:'',lvS:0,tier:0,cl:0,clT:0,mix:[],awk:0,mc:0,ph:rnd(0,TAU)}}
function spawnPos(minD){
  for(let i=0;i<40;i++){
    const[x,y]=rndInMap(60);
    if(player&&!player.dead&&Math.hypot(x-player.x,y-player.y)<minD)continue;
    if(ents.every(e=>e.dead||Math.hypot(e.x-x,e.y-y)>70))return[x,y];
  }
  return rndInMap(60);
}
function refill(){
  ents=ents.filter(e=>!e.dead||e===player);
  const far=Math.hypot(cw,ch)/2/zoom()+90;
  while(ents.filter(e=>!e.dead).length<P.N){const[x,y]=spawnPos(far);ents.push(mk(x,y,false))}
}
function reset(){
  uid=0;maxClash=0;pendFire=false;tailAng=[];tailLen=26;trail=[];shards=[];PL=0;topFade=0;wasTop=false;flash=0;edge=0;slowT=0;slowK=1;deadScore=0;suck=[];suckAcc=0;ents=[];projs=[];chains=[];parts=[];absorbs=[];pops=[];vort=[];shake=0;freeze=0;maxScore=0;
  keys.mouse=false;
  player=mk(P.W/2,P.H/2,true);ents.push(player);
  // 시작 화면에서 입력한 별명을 순위표에 사용 (비어 있으면 '나')
  const nm=nick.value.trim().slice(0,P.NAME_MAX);player.name=nm;
  try{localStorage.setItem('dc_nick',nm)}catch(_){}
  nick.blur();go.blur();
  while(ents.length<P.N){const[x,y]=spawnPos(260);ents.push(mk(x,y,false))}
  t0=performance.now();state='play';ov.style.display='none';
}
function showOv(over){
  ovAt=performance.now();ov.style.display='flex';chargeSound(0);
  if(!over)nick.focus();
  if(over){state='over';ttl.textContent='Clashed';const sv=surv/1000,svt=sv<60?Math.floor(sv)+' sec':(sv/60).toFixed(1)+' min';msg.innerHTML=`<table id="res"><tr><td>Survive:</td><td>${svt}</td></tr><tr><td>Score:</td><td>${Math.round(maxScore)}</td></tr><tr><td>Max Clash:</td><td>${maxClash}</td></tr></table>`}
  else{ttl.textContent='Memory Droplets';msg.innerHTML=''}
}
// 시작 화면의 다른 영역을 클릭해도 시작하지 않음. START 버튼을 눌러야만 시작 (게임오버 직후 오클릭 방지로 0.5초 대기)
const go=document.getElementById('go');
go.addEventListener('click',()=>{if(performance.now()-ovAt>500)reset()});
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mousedown',e=>{if(e.button===2)tryAwake()});   // 우클릭: 각성
// 마우스 왼쪽 버튼: 누르고 있는 동안 압력 충전, 떼면 그 압력으로 발사 (짧게 클릭하면 일반 발사)
cv.addEventListener('mousedown',e=>{if(e.button===0&&state==='play'&&!player.dead)keys.mouse=true});
addEventListener('mouseup',e=>{
  if(e.button!==0||!keys.mouse)return;
  keys.mouse=false;
  if(state==='play'&&!player.dead){
    if(player.claimed)pendFire=true;   // 피격(연쇄) 중에 뗐다면 충전량을 유지했다가 풀려나는 즉시 발사
    else{fire(player,player.charge);player.charge=0}
  }
});
addEventListener('keydown',e=>{
  // 별명 입력 중에는 스페이스 등 키를 게임 입력으로 가로채지 않음 (Enter로는 시작하지 않음, START 버튼만)
  if(e.target===nick||e.target===go)return;
  if((e.code==='ShiftLeft'||e.code==='ShiftRight')&&!e.repeat)tryAwake();   // Shift: 각성
  if(e.code==='KeyM'&&!e.repeat)muted=!muted;   // M 키: 소리 켜기/끄기
  if(e.code==='Space'){keys.space=true;e.preventDefault()}});
addEventListener('keyup',e=>{if(e.code==='Space')keys.space=false});
addEventListener('blur',()=>{keys.space=false;keys.mouse=false;pendFire=false;if(player)player.charge=0});

// ===== 사운드 (Web Audio 합성) =====
let AC=null,master=null,muted=false,nbuf=null,chOsc=null,chGain=null,chOsc2=null,chGain2=null;
function audioInit(){
  // 브라우저 정책상 첫 클릭/키 입력 이후에 오디오를 시작
  if(AC){if(AC.state==='suspended')AC.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  AC=new C();master=AC.createGain();master.gain.value=P.VOL;master.connect(AC.destination);
}
addEventListener('pointerdown',audioInit,true);addEventListener('keydown',audioInit,true);
// 플레이어와의 거리에 따른 음량 (0~1)
const vf=(x,y)=>{if(!player)return 1;return Math.pow(clamp(1-Math.hypot(x-player.x,y-player.y)/P.SND_RANGE,0,1),1.5)};
// 단음: f=시작 주파수, dur=길이(초), to=끝 주파수(슬라이드), delay=지연(초)
function tone(f,dur,o={}){
  const{type='sine',vol=.3,to=null,delay=0}=o;
  if(!AC||muted||vol<.002)return;
  const t=AC.currentTime+delay,osc=AC.createOscillator(),g=AC.createGain();
  osc.type=type;osc.frequency.setValueAtTime(f,t);
  if(to)osc.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+dur+.03);
}
// 노이즈 버스트 (바람/타격 질감): f0→f1로 변하는 밴드패스 필터
function noise(dur,o={}){
  const{vol=.3,f0=2000,f1=null,delay=0,q=1}=o;
  if(!AC||muted||vol<.002)return;
  if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const t=AC.currentTime+delay,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf;s.loop=true;fl.type='bandpass';fl.Q.value=q;fl.frequency.setValueAtTime(f0,t);
  if(f1)fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.03);
}
// 연쇄 단계가 오를수록 한 음씩 올라가는 펜타토닉 음계
const PENTA=[0,2,4,7,9],note=i=>523.25*Math.pow(2,(PENTA[i%5]+12*Math.floor(i/5))/12);
const sfx={
  // 발사: 압력(pw)이 클수록 낮고 묵직한 소리
  fire(x,y,pw,lv=0){const v=vf(x,y);tone(900-500*pw,.18+.15*pw,{type:'triangle',vol:.22*v,to:200-100*pw});noise(.12+.1*pw,{vol:.18*v*(1+pw),f0:3000-1500*pw,f1:500,q:.8});
    // 진화 단계가 높을수록 화음과 저음이 겹쳐 풍성해짐
    if(lv>.8)tone((900-500*pw)*1.5,.2+.15*pw,{vol:.1*v*Math.min(1,lv/3),to:(200-100*pw)*1.5});
    if(lv>2.5)tone(75,.45,{vol:.22*v*Math.min(1,(lv-2)/3),to:40})},
  // 투사체 피격
  hit(x,y){const v=vf(x,y);tone(180,.14,{type:'square',vol:.2*v,to:60});noise(.08,{vol:.25*v,f0:1800,f1:400})},
  // 연쇄 접촉: k(연쇄 단계)가 오를수록 음이 높아짐
  contact(k,x,y,lv=0){const v=vf(x,y),f=note(k-2);tone(f,.35,{vol:.22*v});tone(f*2,.25,{type:'triangle',vol:.1*v,delay:.03});
    // 고득점 개체의 연쇄에는 화음이 추가됨
    if(lv>=1.5)tone(note(k),.35,{vol:.12*v,delay:.02});
    if(lv>=3.5)tone(note(k+2),.35,{type:'triangle',vol:.1*v,delay:.04});
    if(lv>=4.5)tone(f/2,.5,{vol:.16*v})},
  // 흡수 성공: 빨려드는 소리 + 맑은 화음, 많이 가져올수록 크고 묵직함
  absorb(n,loot,x,y){
    const v=vf(x,y),big=Math.min(1,(loot+n*3)/40);
    tone(900,.5,{vol:.2*v,to:120});noise(.5,{vol:.2*v,f0:3000,f1:300,q:2});
    [0,4,7,12].forEach((s,i)=>tone(523.25*Math.pow(2,s/12),.5+.4*big,{vol:(.13+.1*big)*v,delay:.45+i*.06}));
    if(big>.5)tone(130,.7,{vol:.3*v*big,to:55,delay:.4});
  },
  // 쿨다운 초기화(반격 가능) 신호음
  reset(){tone(660,.12,{type:'triangle',vol:.22});tone(990,.2,{type:'triangle',vol:.2,delay:.09})},
  // 압력 최대 도달
  max(){tone(1320,.18,{type:'square',vol:.12});tone(1760,.25,{type:'square',vol:.1,delay:.1})},
  // 내 개체가 흡수당함
  over(){tone(440,1.1,{type:'sawtooth',vol:.2,to:55});noise(.8,{vol:.2,f0:1500,f1:80})},
  // 진화 단계 상승: 단계가 높을수록 더 많은 음이 쌓이는 상승 아르페지오
  tier(t,v=1){const sc=[0,4,7,12,16,19];for(let i=0;i<=Math.min(t,5);i++)tone(523.25*Math.pow(2,sc[i]/12),.5+.1*t,{vol:.15*v,delay:i*.06});tone(130.8,.9,{vol:.2*v,to:65})},
  // 1위 탈환
  crown(){[784,988,1175,1568].forEach((f,i)=>tone(f,.45,{type:'triangle',vol:.14,delay:i*.07}))},
  // 각성 발동
  awake(){tone(180,.7,{type:'sawtooth',vol:.16,to:1400});noise(.6,{vol:.22,f0:500,f1:5000,q:1.5});[0,4,7,12].forEach((s,i)=>tone(523.25*Math.pow(2,s/12),.7,{type:'triangle',vol:.14,delay:.5+i*.05}))},
};
// 압력 충전 중 지속음: 압력이 오를수록 음이 높아지고 커짐 (q=0이면 정지). lv=진화 단계가 높을수록 위에 화음이 겹침
function chargeSound(q,lv=0){
  if(!AC)return;
  const t=AC.currentTime;
  if(q>0&&!muted){
    if(!chOsc){
      chOsc=AC.createOscillator();chGain=AC.createGain();chOsc.type='sawtooth';chGain.gain.value=0;chOsc.connect(chGain);chGain.connect(master);chOsc.start();
      chOsc2=AC.createOscillator();chGain2=AC.createGain();chOsc2.type='triangle';chGain2.gain.value=0;chOsc2.connect(chGain2);chGain2.connect(master);chOsc2.start();
    }
    const f=70+260*q,h=clamp(lv/5,0,1);
    chOsc.frequency.setTargetAtTime(f,t,.03);chGain.gain.setTargetAtTime(.04+.1*q,t,.03);
    chOsc2.frequency.setTargetAtTime(f*1.5,t,.03);chGain2.gain.setTargetAtTime(h*(.02+.07*q),t,.03);
  }else if(chOsc){
    chGain.gain.setTargetAtTime(0,t,.03);chGain2.gain.setTargetAtTime(0,t,.03);
    const o=chOsc,o2=chOsc2;chOsc=null;chOsc2=null;o.stop(t+.2);o2.stop(t+.2);
  }
}

// ===== 이펙트 헬퍼 =====
function burst(x,y,e,n){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(80,420);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0,m:rnd(.3,.7),h:e.hue,s:rnd(2,5)})}if(parts.length>700)parts.splice(0,parts.length-700)}
function ring(x,y,h,r,soft,delay=0){parts.push({x,y,ring:1,l:-delay,m:soft?.6:.38,h,r,soft})}   // soft=true: 선이 느껴지지 않는 부드러운 빛 띠

// ===== 게임 로직 =====
// 점수 → 연속 진화 레벨(0~5), 정수 단계
function lvOf(sc){const T=P.TIERS;if(sc<=0)return 0;let prev=0;for(let i=0;i<T.length;i++){if(sc<T[i])return i+(sc-prev)/(T[i]-prev);prev=T[i]}return T.length}
function tierOf(sc){let n=0;for(const t of P.TIERS)if(sc>=t)n++;return n}
function pushMix(o,h){o.mix.push({h,t:1});if(o.mix.length>8)o.mix.shift()}
// 진화 단계 상승 연출
function tierUp(e,t){
  ring(e.x,e.y,e.hue,80+t*22,true);ring(e.x,e.y,null,50+t*16,true);burst(e.x,e.y,e,14+t*6);e.pulse=1;
  if(e.isP){edge=Math.max(edge,1);flash=Math.max(flash,.14+.04*t);shake=Math.min(30,shake+6+t*2);sfx.tier(t,1)}
  else sfx.tier(t,.5*vf(e.x,e.y));
}
// 연쇄 단계 연출: 내 개체가 한 번의 발사로 일으킨 연쇄 클래쉬 횟수(1~5)에 따라 효과가 달라짐. 단계가 오를수록 빛 띠가 겹겹이 퍼지고, 입자·섬광·진동이 커지며, 5단계에선 금빛이 더해짐
function chainUp(e,lv){
  const x=e.x,y=e.y;
  for(let i=0;i<lv;i++)ring(x,y,i%2?null:e.hue,56+i*24+lv*14,true,i*.09);
  if(lv>=5)ring(x,y,48,260,true,.1*lv);
  burst(x,y,e,10+lv*8);if(lv>=4)burst(x,y,{hue:48},8+lv*2);
  e.pulse=1;
  edge=Math.max(edge,lv>=3?.35+.13*lv:0);
  flash=Math.max(flash,.04+.035*lv);shake=Math.min(30,shake+3+lv*2.6);
  sfx.tier(lv,1);
}
// 연쇄 단계 설정: 단계가 바뀌었거나 효과가 꺼진 상태였으면 연출 재생, 아니면 유지 시간만 갱신
function setChainFx(e,lv){
  lv=clamp(lv,1,5);
  const ch=lv!==e.cl||e.clT<=0;
  e.cl=lv;e.clT=P.FX_HOLD;
  if(ch)chainUp(e,lv);
}
// 사망 연출: 모은 빛이 사방으로 흩어졌다가 근처 개체들에게 빨려듦 (점수가 높을수록 크고 화려함)
function deathLight(x,y,hue,score){
  const pw=clamp(score/60,0,1),n=Math.round(clamp(8+score*.8,8,90));
  for(let i=0;i<n;i++){const a=rnd(0,TAU),sp=rnd(120,420)*(.6+pw);shards.push({x,y,px:x,py:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,wait:rnd(.35,.85),h:hue==null?null:hue+rnd(-20,20),s:rnd(2,4.5),tgt:null,fade:0})}
  if(shards.length>160)shards.splice(0,shards.length-160);
  ring(x,y,hue,90+140*pw,true);ring(x,y,null,140+200*pw,true);burst(x,y,{hue},20+Math.round(50*pw));
  shake=Math.min(34,shake+8+16*pw);flash=Math.max(flash,.25+.4*pw);
}
// 각성: 점수를 소모해 일정 시간 동안 투사체가 관통하고 넉백이 강해짐
function tryAwake(){
  if(state!=='play'||player.dead||player.awk>0||player.score<P.AWK_COST)return;
  player.score-=P.AWK_COST;player.awk=P.AWK_TIME;player.cd=0;
  ring(player.x,player.y,48,120,true);ring(player.x,player.y,null,170,true);burst(player.x,player.y,{hue:48},30);
  edge=1;flash=Math.max(flash,.25);shake=Math.min(30,shake+10);sfx.awake();
}
function steer(e,ta,rate,dt){const d=angDiff(e.a,ta),m=rate*dt;e.a+=Math.abs(d)<m?d:Math.sign(d)*m}
function fire(e,pw=0){
  // pw = 압력(0~1). 클수록 투사체가 빠르고, 맞은 개체의 넉백 거리가 길어짐
  if(e.cd>0||e.claimed||e.dead)return;
  e.cd=P.CD;const dx=Math.cos(e.a),dy=Math.sin(e.a);
  projs.push({x:e.x+dx*P.R*2,y:e.y+dy*P.R*2,dx,dy,o:e,d:0,pw,v:P.PSPD*(1+(P.CHG_PSPD-1)*pw),lv:e.lvS,aw:e.awk>0,kb:e.awk>0?P.AWK_KB:1});
  burst(e.x+dx*P.R*2,e.y+dy*P.R*2,e,5+Math.round(pw*12));
  sfx.fire(e.x,e.y,pw,e.lvS);
  if(pw>0&&e.isP)shake=Math.min(26,shake+pw*10);
}
function bot(e,dt){
  e.tt-=dt;if(e.tt<=0){e.ta=rnd(0,TAU);e.tt=rnd(1,3)}
  if(outMap(e.x,e.y,140))e.ta=Math.atan2(MCY-e.y,MCX-e.x);   // 경계에 가까워지면 중심 쪽으로 방향 전환
  let ta=e.ta;
  if(e.cd<=0){
    let best=null,bd=520;
    for(const o of ents){if(o===e||o.dead||o.claimed)continue;const d=Math.hypot(o.x-e.x,o.y-e.y);if(d<bd){bd=d;best=o}}
    if(best){ta=Math.atan2(best.y-e.y,best.x-e.x);if(Math.abs(angDiff(e.a,ta))<.1){fire(e);e.cd+=rnd(0,4)}}
  }
  steer(e,ta,P.TURN*.6,dt);
}
function startChain(o,e,dx,dy,pw=0,kb=1){o.mc=Math.max(o.mc,1);if(o.isP)maxClash=Math.max(maxClash,1);e.claimed=true;chains.push({o,m:[e],dx,dy,k:1,D:P.D1*(1+P.CHG_KB*pw)*kb,t:0})}
function contact(c,e,m){
  const sumR=c.m.length*P.R;
  c.m.push(e);e.claimed=true;e.circ=true;e.ct=0;c.k++;c.D+=sumR;c.t=0;
  c.o.score+=P.E*(c.k===2?2:1);
  c.o.mc=Math.max(c.o.mc,c.m.length);   // 순위표용: 한 번의 발사로 엮은 최대 개체 수
  if(c.o.isP)maxClash=Math.max(maxClash,c.m.length);
  if(c.o.isP)maxScore=Math.max(maxScore,c.o.score);
  const x=(e.x+m.x)/2,y=(e.y+m.y)/2,k=c.k;
  if(c.o.isP)setChainFx(c.o,k-1);   // 연쇄 클래쉬 N번 성공 = 단계 N
  ring(x,y,null,40+k*14);burst(x,y,e,10+k*3);burst(x,y,m,8);
  pops.push({x,y,t:0,k});sfx.contact(k,x,y,c.o.lvS);
  if(c.o.isP)shake=Math.min(26,shake+5+k*2);
  if(c.o.isP)freeze=Math.max(freeze,Math.min(.1,.025+.01*k));
}
function endChain(c,wall){
  // wall = 연쇄가 맵 외곽 경계에 부딪혀 끝남 → 1마리여도 흡수 + 경계 충돌 보너스
  if((c.k<2&&!wall)||c.o.dead){
    // 흡수 판정 없이 연쇄가 끝남: 맞았던 플레이어는 쿨다운을 즉시 초기화해 바로 반격 가능
    for(const m of c.m){m.claimed=false;m.circ=false;if(m.isP&&!m.dead){m.cd=0;ring(m.x,m.y,m.hue,46);sfx.reset()}}
    return}
  // 흡수 판정 완료: 엮인 개체 전원이 발사자에게 빨려들어감
  // 흡수당하는 개체들이 보유한 점수를 전부 발사자가 가져감
  const ps=c.m.includes(player)?player.score:0;   // 내가 흡수당하는 경우 사망 연출용으로 점수를 미리 저장
  let loot=0;for(const m of c.m){loot+=m.score;m.score=0}
  c.o.score+=loot;
  if(wall)c.o.score+=P.WALL_E*c.m.length;
  const pdead=player.dead;
  let mag=clamp((c.m.length*3+loot+c.o.score*.35)/70,0,1);
  if(c.o.isP){const L=clamp(c.k-1,1,5);setChainFx(c.o,L);mag=.15+.85*(L-1)/4}   // 내 흡수 연출 규모는 연쇄 단계로 결정   // 흡수 규모(0~1): 클수록 연출이 화려해짐
  sfx.absorb(c.m.length,loot,c.o.x,c.o.y);
  if(c.o.isP)maxScore=Math.max(maxScore,c.o.score);
  c.m.forEach((m,i)=>{
    m.dead=true;
    absorbs.push({x:m.x,y:m.y,sx:m.x,sy:m.y,hue:m.hue,o:c.o,t:-i*.07,dur:.55+rnd(0,.15),sw:rnd(.6,1.2)*(Math.random()<.5?-1:1),tr:[],big:mag});
    ring(m.x,m.y,m.hue,50);
  });
  vort.push({o:c.o,t:0,n:c.m.length,big:mag});
  if(c.o.isP&&mag>.4){slowT=.25+.45*mag;slowK=.3;flash=Math.max(flash,.18+.3*mag);shake=Math.min(30,shake+4+10*mag)}   // 큰 흡수: 슬로모션 + 섬광
  if(c.m.includes(player)&&!pdead){
    pendFire=false;deadAt=performance.now();surv=deadAt-t0;sfx.over();
    deadScore=ps;deathLight(player.x,player.y,player.hue,ps);
    if(ps>20){slowT=.45;slowK=.3}
  }
  refill();
}
function update(dt){
  for(const e of ents){
    if(e.dead)continue;
    e.cd=Math.max(0,e.cd-dt);e.pulse=Math.max(0,e.pulse-dt*3);if(e.circ)e.ct+=dt;if(e.awk>0)e.awk=Math.max(0,e.awk-dt);
    e.boost=false;if(e.claimed&&!e.isP){e.charge=0;continue}
    let turn=P.TURN,sp=P.V;
    if(e.isP){
      // 마우스를 누르고 있는 동안(쿨다운 완료 상태) 압력 충전. 떼는 순간은 mouseup 핸들러에서 그 압력으로 발사
      if(pendFire&&!e.claimed){pendFire=false;fire(e,e.charge);e.charge=0}
      if(keys.mouse&&e.cd<=0){const pc=e.charge;e.charge=Math.min(1,e.charge+dt/P.CHG_TIME);if(pc<1&&e.charge>=1){sfx.max();ring(e.x,e.y,null,100,true);ring(e.x,e.y,e.hue,150,true);burst(e.x,e.y,e,14);flash=Math.max(flash,.08)}}
      else if(!pendFire)e.charge=0;   // 쿨다운 중이거나 마우스를 뗀 상태 (피격 중 뗀 충전은 유지)
      // 스페이스: 점수를 소모해 이동 속도 증가 (가속)
      if(keys.space&&e.score>0){
        e.boost=true;e.score=Math.max(0,e.score-P.DRAIN*dt);sp*=P.BOOST;turn*=.7;
        parts.push({x:e.x-Math.cos(e.a)*P.R,y:e.y-Math.sin(e.a)*P.R,vx:0,vy:0,l:0,m:.4,h:e.hue,s:7});
      }
      sp*=1-(1-P.CHG_SLOW)*e.charge;   // 압력이 클수록 이동 속도 감소 (가속 후에 적용)
      steer(e,Math.atan2(mouse.y-ch/2,mouse.x-cw/2),turn,dt);
    }else bot(e,dt);
    // 중력: 나보다 점수가 높은 개체가 가까이 있으면 그쪽으로 끌려감 (점수 차이가 클수록 강하고 멀리까지 미침)
    let gx=0,gy=0;
    if(P.GRAV_V>0)for(const a of ents){
      if(a===e||a.dead||a.score<=e.score)continue;

      if(a5>.01){gl(0,0,r*6.5,h,.5*a5);gl(0,0,r*3.6,h,.3*a5)}
      // 4단계: 코로나 광선 (희미한 선 + 글로우)
      if(a4>.01){const n=10,rot=tt*.22;for(let i=0;i<n;i++){const an=rot+i*TAU/n,lg=i%2?1.4:.6,len=r*(2.4+lg*a4+.25*Math.sin(tt*3+i*1.7));softLine(Math.cos(an)*r*1.3,Math.sin(an)*r*1.3,Math.cos(an)*len,Math.sin(an)*len,h,(i%2?.55:.35)*a4,(i%2?2.2:1.5)*z,true)}}
      // 3단계: 뒤로 갈라져 뻗는 꼬리 (판정은 그대로, 그리기만 길어짐)
      if(a3>.01){const ba=e.a+Math.PI;for(let q=-1;q<=1;q++){const an=ba+q*.3,len=r*(2.3+1.6*a3+.9*a5+(q?0:.8*a3))*(1+.08*Math.sin(tt*5+q*2));softLine(Math.cos(an)*r*.8,Math.sin(an)*r*.8,Math.cos(an)*len,Math.sin(an)*len,h,.9*a3,(q?1.8:2.8)*z,true)}}
      // 1단계: 천천히 도는 점선 링 / 5단계: 반대로 도는 두 번째 링
      if(a1>.01){softCircle(r*1.85,h,.55*a1,1.6*z,9,tt*.35);if(a5>.01)softCircle(r*2.3,h,.65*a5,1.8*z,12,-tt*.45)}
      // 2단계: 공전하는 위성 2개 / 5단계: 바깥 궤도에 2개 더
      if(a2>.01)for(let i=0;i<2;i++){const an=tt*1.7+i*Math.PI;sat(Math.cos(an)*r*2.35,Math.sin(an)*r*2.35,2.4*z,a2,h)}
      if(a5>.01)for(let i=0;i<2;i++){const an=-tt*1.15+i*Math.PI+1.2;sat(Math.cos(an)*r*2.9,Math.sin(an)*r*2.9,3*z,a5,h)}
      // 각성: 금빛 이중 빛 띠 + 후광 + 회전하는 불꽃
      if(awk>0){
        haloStroke(0,0,r*(2.9+.25*Math.sin(tt*9)),48,.6*awk,2*z);
        haloStroke(0,0,r*2.35,48,.35*awk,1.4*z);
        gl(0,0,r*5,48,.5*awk);
        for(let i=0;i<6;i++){const an=tt*3.2+i*TAU/6;sat(Math.cos(an)*r*2.6,Math.sin(an)*r*2.6,2*z,awk,48)}

    }
  }
  if(e.circ){const s=1+.4*Math.exp(-e.ct*9)*Math.cos(e.ct*28);ctx.scale(s,1/s)}else ctx.rotate(e.a);
  const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r*1.1);

  ctx.fillStyle=g;ctx.strokeStyle=e.claimed?'#fff':hs(h,1,86);ctx.lineWidth=2*z;

  else{const d=r*P.TAIL,f=Math.acos(r/d);ctx.moveTo(d,0);ctx.lineTo(r*Math.cos(f),r*Math.sin(f));ctx.arc(0,0,r,f,TAU-f);ctx.closePath()}
  ctx.fill();ctx.stroke();

  if(e.mix.length){
    ctx.globalCompositeOperation='lighter';
    const tt=performance.now()/1000+e.ph;
    for(let i=0;i<e.mix.length;i++){const m=e.mix[i],an=tt*1.4+i*TAU/Math.max(3,e.mix.length);
      ctx.fillStyle=hs(m.h,.85*m.t,72);ctx.beginPath();ctx.arc(Math.cos(an)*r*.55,Math.sin(an)*r*.55,2.3*z,0,TAU);ctx.fill();
      for(let q=-1;q<=1;q++)gl(Math.cos(an+q*.28)*r*1.12,Math.sin(an+q*.28)*r*1.12,5.5*z,m.h,.28*m.t)}

}
function render(){
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.setLineDash([]);
  V.z=zoom();V.cx=player.x+rnd(-1,1)*shake/V.z;V.cy=player.y+rnd(-1,1)*shake/V.z;
  const z=V.z;
  drawBG();
  if(!player.dead&&player.cd<=0){
    ctx.save();ctx.setLineDash([8,10]);ctx.strokeStyle='rgba(255,255,255,'+(.14+.45*player.charge)+')';ctx.lineWidth=2+2*player.charge;ctx.beginPath();
    ctx.moveTo(cw/2+Math.cos(player.a)*P.R*2.2*z,ch/2+Math.sin(player.a)*P.R*2.2*z);
    ctx.lineTo(cw/2+Math.cos(player.a)*P.PRNG*z,ch/2+Math.sin(player.a)*P.PRNG*z);ctx.stroke();ctx.restore();
  }
  // 플레이어 빛 꼬리: 점수가 높을수록 길고 굵고 선명. 방향을 틀면 뒤쪽 마디가 천천히 따라와 완만하게 휨. 희미한 선 위에 글로우를 겹쳐 선이 느껴지지 않음
  if(PL>.02&&tailAng.length){
    ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.lineJoin='round';
    const bo=player.boost&&!player.dead,TN=tailAng.length,step=tailLen/TN*z;
    let[x,y]=S(player.x,player.y);const pts=[[x,y]];
    for(let i=0;i<TN;i++){x+=Math.cos(tailAng[i])*step;y+=Math.sin(tailAng[i])*step;pts.push([x,y])}
    ctx.strokeStyle=hs(player.hue,.025+.03*PL,80);ctx.lineWidth=1*z;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();
    for(let i=0;i<=TN;i++){
      const t=i/TN,hh=(bo&&player.hue!=null)?player.hue+t*70:player.hue;
      const ta=Math.pow(1-t,1.3)*(bo?1.5:1),tr=P.R*z*(.5+1.1*PL)*(1-.65*t)*(bo?1.25:1);
      gl(pts[i][0],pts[i][1],tr,hh,(.06+.18*PL)*ta);
      gl(pts[i][0],pts[i][1],tr*2.8,hh,(.04+.1*PL)*ta);
    }
    ctx.globalCompositeOperation='source-over';
  }
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){
    const[sx,sy]=S(p.x,p.y),k=p.l/p.m;
    if(k<0)continue;
    if(p.ring){if(p.soft)haloStroke(sx,sy,p.r*z*(.2+k),p.h,.9*(1-k),(3*(1-k)+1)*.7);else{ctx.strokeStyle=hs(p.h,1-k);ctx.lineWidth=3*(1-k)+1;ctx.beginPath();ctx.arc(sx,sy,p.r*z*(.2+k),0,TAU);ctx.stroke()}}
    else{ctx.fillStyle=hs(p.h,1-k,65);ctx.beginPath();ctx.arc(sx,sy,p.s*z*(1-k*.7),0,TAU);ctx.fill()}
  }
  ctx.globalCompositeOperation='source-over';
  for(const e of ents)if(!e.dead&&e!==player)drawEnt(e);
  if(!player.dead)drawEnt(player);
  // 1위 표식: 내 개체 위에 떠오르는 별 모양 왕관
  if(!player.dead&&topFade>.01){
    const[px,py]=S(player.x,player.y),cx=px,cy=py-P.R*z*(3.3+Math.sin(performance.now()/420)*.18),ro=P.R*z*.9*(.7+.3*topFade),ri=ro*.45,aa=topFade;
    ctx.save();ctx.globalCompositeOperation='lighter';
    const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,ro*2.6);cg.addColorStop(0,`hsla(48,100%,70%,${.5*aa})`);cg.addColorStop(1,'hsla(48,100%,60%,0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,ro*2.6,0,TAU);ctx.fill();
    ctx.beginPath();for(let i=0;i<10;i++){const rr=i%2?ri:ro,an=-Math.PI/2+i*Math.PI/5;ctx[i?'lineTo':'moveTo'](cx+Math.cos(an)*rr,cy+Math.sin(an)*rr)}ctx.closePath();
    ctx.fillStyle=`hsla(48,100%,72%,${.6*aa})`;ctx.fill();ctx.strokeStyle=`rgba(255,250,220,${.3*aa})`;ctx.lineWidth=1;ctx.stroke();
    gl(cx,cy,ro*3.4,48,.35*aa);gl(cx,cy,ro*1.6,48,.5*aa);
    ctx.restore();
  }
  // 압력 충전 중 빨려드는 흰 점
  if(!player.dead&&suck.length){
    ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
    for(const d of suck){
      const p=d.l/d.m,rin=P.R*.6,dist=rin+(d.r0-rin)*(1-p*p),dist2=dist+P.R*.5*p;
      const[x1,y1]=S(player.x+Math.cos(d.a)*dist,player.y+Math.sin(d.a)*dist),[x2,y2]=S(player.x+Math.cos(d.a)*dist2,player.y+Math.sin(d.a)*dist2);
      const al=Math.min(1,p*5)*(1-p*.4);
      ctx.strokeStyle=`rgba(255,255,255,${al*.5})`;ctx.lineWidth=d.s*z*.8;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      ctx.fillStyle=d.c===1?hs(player.hue,al,78):d.c===2?`rgba(255,214,120,${al})`:`rgba(255,255,255,${al})`;ctx.beginPath();ctx.arc(x1,y1,d.s*z,0,TAU);ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
  }
  // 투사체
  ctx.globalCompositeOperation='lighter';
  for(const p of projs){
    const[sx,sy]=S(p.x,p.y),h=p.aw?48:p.o.hue,lq=clamp((p.lv||0)/5,0,1),len=(34+60*p.pw)*(1+.5*lq)*(p.aw?1.3:1);
    ctx.strokeStyle=hs(h,.7,70);ctx.lineWidth=(5+4*p.pw)*(p.aw?1.3:1)*z;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx-p.dx*len*z,sy-p.dy*len*z);ctx.lineTo(sx,sy);ctx.stroke();
    if(lq>.5||p.aw)softLine(sx,sy,sx-p.dx*len*1.8*z,sy-p.dy*len*1.8*z,48,.5,2.4*z,true);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx,sy,(4+3*p.pw)*z,0,TAU);ctx.fill();
  }
  // 흡수 연출: 소용돌이 링 + 빨려드는 오브와 꼬리
  for(const v of vort){
    const[sx,sy]=S(v.o.x,v.o.y),p=v.t/.6;
    const B=v.big||0,nr=3+Math.round(3*B);
    for(let j=0;j<nr;j++){const q=(p+j/nr)%1;haloStroke(sx,sy,(1-q)*(90+v.n*12)*(1+1.4*B)*z,v.o.hue,.7*(1-p)*(1-q),(1+1.2*B)*1.1)}
  }
  for(const a of absorbs){
    if(a.t<0)continue;
    const p=Math.min(1,a.t/a.dur);
    for(let j=1;j<a.tr.length;j++){
      const w=j/a.tr.length,[x1,y1]=S(a.tr[j-1][0],a.tr[j-1][1]),[x2,y2]=S(a.tr[j][0],a.tr[j][1]);
      ctx.strokeStyle=hs(a.hue,w*.85,62);ctx.lineWidth=(P.R*1.5*w+1)*z*(1-p*.5);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    }
    const[sx,sy]=S(a.x,a.y),r=P.R*z*(1-p*.55)*2.2,g=ctx.createRadialGradient(sx,sy,0,sx,sy,r);
    g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.35,hs(a.hue,.9,65));g.addColorStop(1,hs(a.hue,0,60));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,r,0,TAU);ctx.fill();
  }
  for(const s of shards){
    const[sx,sy]=S(s.x,s.y),[qx,qy]=S(s.px,s.py),a=1-s.fade;
    softLine(sx,sy,qx-(sx-qx)*1.5,qy-(sy-qy)*1.5,s.h,.6*a,s.s*z*.7,true);
    ctx.fillStyle=hs(s.h,.18*a,70);ctx.beginPath();ctx.arc(sx,sy,s.s*z*3.2,0,TAU);ctx.fill();
    ctx.fillStyle=hs(s.h,.95*a,80);ctx.beginPath();ctx.arc(sx,sy,s.s*z,0,TAU);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  // 쿨다운 링
  if(!player.dead){
    const r=P.R*z*1.95,rdy=player.cd<=0;
    ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.035)';ctx.beginPath();ctx.arc(cw/2,ch/2,r,0,TAU);ctx.stroke();
    ctx.strokeStyle=rdy?hs(player.hue,.2,70):'rgba(255,255,255,.2)';ctx.beginPath();ctx.arc(cw/2,ch/2,r,-Math.PI/2,-Math.PI/2+TAU*(1-player.cd/P.CD));ctx.stroke();
  }
  // 연쇄 단계 텍스트
  ctx.textAlign='center';
  for(const p of pops){
    const[sx,sy]=S(p.x,p.y),k=p.t/.9,sz=(18+p.k*6)*(1+.5*Math.exp(-p.t*10));
    ctx.font=`800 ${sz}px system-ui`;ctx.lineWidth=4;ctx.strokeStyle=`rgba(3,5,11,${1-k})`;ctx.fillStyle=hs((p.k*40)%360,1-k,72);

  }
  // 단계 상승/각성/1위 시 화면 가장자리가 내 색으로 번지고, 큰 사건에는 섬광이 번쩍임
  if(edge>.01){
    ctx.save();ctx.globalCompositeOperation='lighter';
    const R2=Math.hypot(cw,ch)/2,gr=ctx.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*.3,cw/2,ch/2,R2);
    gr.addColorStop(0,hs(player.hue,0,70));gr.addColorStop(1,hs(player.hue,.6*Math.min(1,edge),66));
    ctx.fillStyle=gr;ctx.fillRect(0,0,cw,ch);ctx.restore();
  }

}
function hud(){
  // 하단 게이지: 가속 에너지(점수, 스페이스로 소모)
  const bw=Math.min(400,cw-40),bh=14,bx=(cw-bw)/2,by=ch-ins.b-30,s=player.score;
  // mode 0=일반, 1=각성 가능(테두리가 금빛으로 맥동), 2=각성 중(남은 시간이 금빛으로 줄어듦)
  const gauge=(y,frac,full,mode)=>{
    ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(bx,y,bw,bh);
    const g=ctx.createLinearGradient(bx,0,bx+bw,0);
    if(mode===2){g.addColorStop(0,'hsl(40,95%,52%)');g.addColorStop(1,'#fff6d0')}else{g.addColorStop(0,hs(player.hue,1,52));g.addColorStop(1,'#fff')}
    ctx.fillStyle=g;ctx.fillRect(bx,y,bw*Math.min(1,frac),bh);
    if(mode){ctx.strokeStyle=`rgba(255,214,120,${mode===2?.9:.5+.5*Math.abs(Math.sin(performance.now()/250))})`;ctx.lineWidth=2}
    else{ctx.strokeStyle=full?'rgba(255,255,255,.95)':'rgba(255,255,255,.35)';ctx.lineWidth=full?2:1}
    ctx.strokeRect(bx,y,bw,bh);
  };
  const aw=player.awk>0;
  gauge(by,aw?player.awk/P.AWK_TIME:s/P.CAP,s>P.CAP,aw?2:(s>=P.AWK_COST?1:0));
  // 우측 상단 상위 10위
  const live=ents.filter(e=>!e.dead).sort((a,b)=>b.score-a.score),rank=live.indexOf(player)+1,rows=live.slice(0,10);
  if(rank>10)rows.push(player);
  const lw=218,lx=cw-lw-14,ly=ins.t+14;   // 칸: 순위 · 색점 · 이름 · 점수 · (금색) ×최대 연쇄 횟수
  ctx.fillStyle='rgba(3,5,11,.55)';ctx.fillRect(lx,ly,lw,16+rows.length*22);
  rows.forEach((e,i)=>{
    const y=ly+26+i*22,me=e===player;
    ctx.fillStyle=me?'#fff':'rgba(220,230,255,.8)';ctx.font=(me?'700 ':'500 ')+'13px system-ui';
    ctx.textAlign='left';ctx.fillText(String(live.indexOf(e)+1),lx+10,y);ctx.fillText(e.name,lx+50,y);
    const rr=(me&&rank===1)?4.5+2*Math.abs(Math.sin(performance.now()/260)):4.5;
    ctx.fillStyle=hs(e.hue,1,60);ctx.beginPath();ctx.arc(lx+38,y-4,rr,0,TAU);ctx.fill();
    ctx.fillStyle=me?'#fff':'rgba(220,230,255,.8)';ctx.textAlign='right';ctx.fillText(String(Math.round(e.score)),lx+lw-54,y);
    ctx.fillStyle=me?'#ffd978':'rgba(255,214,120,.7)';ctx.fillText('×'+e.mc,lx+lw-10,y);   // 한 번의 발사로 일으킨 최대 연쇄 충돌 횟수
  });
}

// ===== 메인 루프 =====
let last=performance.now(),fcount=0,skip=1,cal=[];
function frame(now){
  requestAnimationFrame(frame);
  if(cal){cal.push(now);if(cal.length>40){const d=[];for(let i=1;i<cal.length;i++)d.push(cal[i]-cal[i-1]);d.sort((a,b)=>a-b);skip=P.FPS?Math.max(1,Math.round(1000/d[d.length>>1]/P.FPS)):1;cal=null}}
  if(++fcount%skip)return;
  const rdt=Math.min(.1,(now-last)/1000);last=now;
  flash=Math.max(0,flash-rdt*1.6);edge=Math.max(0,edge-rdt*.9);
  const sdt=rdt*(slowT>0?slowK:1);slowT=Math.max(0,slowT-rdt);   // 큰 사건 때 잠깐 슬로모션
  if(state==='play'){
    if(freeze>0)freeze-=rdt;
    else{let t=sdt;while(t>1e-4){const s=Math.min(t,1/60);update(s);t-=s}}
    chargeSound(player.dead?0:player.charge,player.lvS);
    if(player.dead&&now-deadAt>1300+900*clamp(deadScore/60,0,1))showOv(true);
  }
  visuals(sdt);
  render();
}
// ----- 내 색 팔레트 -----
const palEl=document.getElementById('pal');
const PAL=[];for(let i=0;i<P.PAL_N-1;i++)PAL.push(Math.round(i*360/(P.PAL_N-1)*100)/100);PAL.push(null);   // 마지막 = 흰색
function buildPalette(){
  palEl.innerHTML='';
  PAL.forEach((h,i)=>{
    const d=document.createElement('div');
    d.className='sw'+(i===palIdx?' sel':'');d.dataset.i=i;d.style.background=h==null?'#fff':`hsl(${h},92%,58%)`;
    palEl.appendChild(d);
  });
  myHue=PAL[palIdx];
  nick.style.borderColor=myHue==null?'#fff':`hsl(${myHue},92%,62%)`;   // 입력창 테두리에도 선택한 색 반영
  go.style.background=myHue==null?'#fff':`hsl(${myHue},92%,62%)`;      // START 버튼도 선택한 색으로
}
palEl.addEventListener('mousedown',e=>e.preventDefault());   // 색을 눌러도 별명 입력창 포커스 유지
palEl.addEventListener('click',e=>{
  const t=e.target.closest('.sw');if(!t)return;
  palIdx=+t.dataset.i;try{localStorage.setItem('dc_pi2',palIdx)}catch(_){}
  buildPalette();   // 실제 개체 색은 게임 시작(reset) 때 반영됨
});
palIdx=PAL.length-1;   // 기본 선택 = 흰색(마지막 칸). 한 번 고른 색은 브라우저에 저장되어 다음에도 유지
try{const sv=parseInt(localStorage.getItem('dc_pi2'));if(!isNaN(sv)&&sv>=0&&sv<PAL.length)palIdx=sv}catch(_){}
buildPalette();
nick.maxLength=P.NAME_MAX;try{nick.value=localStorage.getItem('dc_nick')||''}catch(_){}
resize();mouse.x=cw/2;mouse.y=ch/2;reset();state='menu';showOv(false);
requestAnimationFrame(frame);
