<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>좀비피하기</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#101820; color:#f4f7f8; font-family:system-ui, sans-serif; text-align:center; }
  h1 { margin:18px 8px 6px; font-size:clamp(22px,4vw,34px); color:#a8ef78; }
  p { margin:5px 10px 12px; color:#d0d8dc; }
  .hud { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:10px; }
  .stat { background:#22313b; border:1px solid #41525d; border-radius:10px; padding:8px 14px; min-width:100px; }
  #game { display:block; width:min(94vw,800px); height:auto; margin:0 auto; border:3px solid #53636b; border-radius:12px; background:#19251f; touch-action:none; }
  .controls { max-width:800px; margin:12px auto; padding:0 12px 18px; color:#d0d8dc; }
  button { border:0; border-radius:10px; padding:11px 17px; margin:4px; background:#a8ef78; color:#162219; font-weight:800; cursor:pointer; font-size:15px; }
  button:active { transform:scale(.97); }
  .mobile { display:none; }
  .pad { display:grid; grid-template-columns:repeat(3,54px); gap:5px; justify-content:center; margin:8px; }
  .pad button { padding:12px 0; margin:0; }
  @media (pointer:coarse) { .mobile { display:block; } }
  #message { min-height:25px; color:#ffe28a; font-weight:700; }
</style>
</head>
<body>
<h1>🧟 좀비피하기</h1>
<p>좀비를 피하고 최대한 오래 살아남아라!</p>
<div class="hud">
  <div class="stat">❤️ 체력: <b id="health">100</b></div>
  <div class="stat">🏆 점수: <b id="score">0</b></div>
  <div class="stat">⏱️ 생존: <b id="time">0</b>초</div>
  <div class="stat">🧟 좀비: <b id="count">0</b></div>
</div>
<canvas id="game" width="800" height="500" aria-label="좀비 생존 게임"></canvas>
<div id="message">이동: WASD / 방향키 · 공격: 스페이스바</div>
<div class="controls">
  <button id="start">게임 시작 / 다시 시작</button>
  <div class="mobile">
    <p>휴대폰/태블릿 조작</p>
    <div class="pad">
      <span></span><button data-key="ArrowUp">⬆️</button><span></span>
      <button data-key="ArrowLeft">⬅️</button><button data-key="Space">⚔️</button><button data-key="ArrowRight">➡️</button>
      <span></span><button data-key="ArrowDown">⬇️</button><span></span>
    </div>
  </div>
  <p>팁: 좀비와 거리를 유지하고, 가까이 오면 스페이스바를 눌러 공격하세요.</p>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const healthEl = document.getElementById('health');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const countEl = document.getElementById('count');
  const message = document.getElementById('message');
  const keys = {};
  let player, zombies, score, elapsed, lastTime, spawnTimer, attackTimer, running, gameOver;

  function reset() {
    player = { x:400, y:250, r:15, hp:100, speed:230, invuln:0, facingX:1, facingY:0 };
    zombies = []; score=0; elapsed=0; lastTime=0; spawnTimer=0; attackTimer=0;
    running=true; gameOver=false;
    message.textContent='살아남아라! 좀비를 가까이 오게 한 뒤 공격!';
    updateHud();
    requestAnimationFrame(loop);
  }
  function updateHud() {
    healthEl.textContent=Math.max(0,Math.ceil(player.hp));
    scoreEl.textContent=score;
    timeEl.textContent=Math.floor(elapsed);
    countEl.textContent=zombies.length;
  }
  function spawnZombie() {
    const side=Math.floor(Math.random()*4);
    let x=0,y=0;
    if(side===0){x=Math.random()*800;y=-20;}
    else if(side===1){x=820;y=Math.random()*500;}
    else if(side===2){x=Math.random()*800;y=520;}
    else {x=-20;y=Math.random()*500;}
    const difficulty=1+Math.min(elapsed/90,1.3);
    zombies.push({x,y,r:13,hp:1,speed:(36+Math.random()*22)*difficulty,hitFlash:0});
  }
  function attack() {
    if(!running || attackTimer>0) return;
    attackTimer=0.35;
    let hit=false;
    for(let i=zombies.length-1;i>=0;i--){
      const z=zombies[i];
      const dx=z.x-player.x, dy=z.y-player.y;
      const d=Math.hypot(dx,dy);
      if(d<75){
        zombies.splice(i,1); score+=10; hit=true;
      }
    }
    message.textContent=hit?'명중! +10점':'공격했어요! 좀비가 가까이 있을 때 맞아요.';
  }
  function loop(timestamp) {
    if(!running) return;
    const dt=Math.min((timestamp-(lastTime||timestamp))/1000,0.033);
    lastTime=timestamp; elapsed+=dt; spawnTimer+=dt;
    attackTimer=Math.max(0,attackTimer-dt);
    player.invuln=Math.max(0,player.invuln-dt);

    let mx=0,my=0;
    if(keys.ArrowLeft||keys.KeyA) mx--;
    if(keys.ArrowRight||keys.KeyD) mx++;
    if(keys.ArrowUp||keys.KeyW) my--;
    if(keys.ArrowDown||keys.KeyS) my++;
    if(mx||my){
      const len=Math.hypot(mx,my); mx/=len; my/=len;
      player.x+=mx*player.speed*dt; player.y+=my*player.speed*dt;
      player.facingX=mx; player.facingY=my;
    }
    player.x=Math.max(player.r,Math.min(800-player.r,player.x));
    player.y=Math.max(player.r,Math.min(500-player.r,player.y));

    const spawnEvery=Math.max(0.65,2.3-elapsed*0.012);
    if(spawnTimer>spawnEvery && zombies.length<35){spawnZombie();spawnTimer=0;}
    for(const z of zombies){
      const dx=player.x-z.x,dy=player.y-z.y,d=Math.hypot(dx,dy)||1;
      z.x+=dx/d*z.speed*dt; z.y+=dy/d*z.speed*dt;
      if(d<player.r+z.r && player.invuln<=0){
        player.hp-=12; player.invuln=0.65;
        message.textContent='좀비에게 공격받았어요! 거리를 유지하세요.';
      }
    }
    if(player.hp<=0){
      player.hp=0; running=false; gameOver=true;
      draw();
      ctx.fillStyle='rgba(0,0,0,.72)'; ctx.fillRect(0,0,800,500);
      ctx.fillStyle='#ff7777'; ctx.font='bold 46px system-ui'; ctx.textAlign='center';
      ctx.fillText('GAME OVER',400,225);
      ctx.fillStyle='#ffffff'; ctx.font='bold 24px system-ui';
      ctx.fillText('최종 점수: '+score,400,270);
      ctx.font='18px system-ui'; ctx.fillText('다시 시작 버튼을 눌러 재도전!',400,310);
      message.textContent='게임 오버! 최종 점수 '+score+'점';
      updateHud(); return;
    }
    updateHud(); draw(); requestAnimationFrame(loop);
  }
  function draw() {
    ctx.clearRect(0,0,800,500);
    ctx.fillStyle='#1b2b23'; ctx.fillRect(0,0,800,500);
    ctx.strokeStyle='#2a3c31'; ctx.lineWidth=1;
    for(let x=0;x<800;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,500);ctx.stroke();}
    for(let y=0;y<500;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke();}
    // 작은 장애물 장식
    ctx.fillStyle='#35463c';
    [[95,100],[675,85],[140,390],[650,390],[390,75],[470,425]].forEach(([x,y])=>{ctx.fillRect(x,y,22,16);});
    // 공격 범위 효과
    if(attackTimer>0){
      ctx.strokeStyle='#ffe28a';ctx.lineWidth=4;ctx.beginPath();
      ctx.arc(player.x,player.y,70,0,Math.PI*2);ctx.stroke();
    }
    for(const z of zombies){
      ctx.fillStyle='#83b56b';ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#243b24';ctx.beginPath();ctx.arc(z.x-4,z.y-3,2,0,Math.PI*2);ctx.arc(z.x+4,z.y-3,2,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#263a25';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(z.x-5,z.y+5);ctx.lineTo(z.x+5,z.y+5);ctx.stroke();
    }
    // 플레이어
    ctx.fillStyle=(player.invuln>0 && Math.floor(elapsed*14)%2===0)?'#ffffff':'#64b5ff';
    ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#eaf6ff';ctx.lineWidth=3;ctx.beginPath();
    ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+player.facingX*22,player.y+player.facingY*22);ctx.stroke();
    ctx.fillStyle='#eaf6ff';ctx.font='12px system-ui';ctx.textAlign='left';ctx.fillText('생존자',player.x-22,player.y-22);
  }
  document.addEventListener('keydown',e=>{
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    keys[e.code]=true;
    if(e.code==='Space'&&!e.repeat) attack();
  });
  document.addEventListener('keyup',e=>{keys[e.code]=false;});
  document.getElementById('start').addEventListener('click',reset);
  document.querySelectorAll('[data-key]').forEach(btn=>{
    const key=btn.dataset.key;
    const down=e=>{e.preventDefault();keys[key]=true;if(key==='Space')attack();};
    const up=e=>{e.preventDefault();keys[key]=false;};
    btn.addEventListener('pointerdown',down);
    btn.addEventListener('pointerup',up);
    btn.addEventListener('pointerleave',up);
    btn.addEventListener('pointercancel',up);
  });
  // 첫 화면
  player={x:400,y:250,r:15,hp:100,speed:230,invuln:0,facingX:1,facingY:0};
  zombies=[];score=0;elapsed=0;running=false;
  draw(); updateHud();
  ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(0,0,800,500);
  ctx.fillStyle='#a8ef78';ctx.font='bold 36px system-ui';ctx.textAlign='center';
  ctx.fillText('좀비피하기',400,215);
  ctx.fillStyle='#ffffff';ctx.font='20px system-ui';ctx.fillText('시작 버튼을 눌러 생존을 시작하세요',400,260);
})();
</script>
</body>
</html>
