
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>달빛 도장 격투</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e8edf2;--ink:#17212c;--chip:#ffffff;--line:#c3cfda}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141c;--ink:#e6edf4;--chip:#172230;--line:#2c3b4c}}
:root[data-theme="dark"]{--bg:#0d141c;--ink:#e6edf4;--chip:#172230;--line:#2c3b4c}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;min-height:100vh}
h1{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400;font-size:26px;margin:4px 0 10px;letter-spacing:.02em}
#wrap{width:100%;max-width:960px}
canvas{width:100%;height:auto;display:block;border-radius:6px;border:2px solid var(--line);background:#000;touch-action:none}
.keys{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin:12px 0 4px;font-size:14px}
.keys span{display:flex;align-items:center;gap:6px}
kbd{background:var(--chip);border:1px solid var(--line);border-bottom-width:3px;border-radius:5px;padding:2px 8px;font:600 13px system-ui,sans-serif;min-width:18px;text-align:center}
.touch{display:none;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.touch button{background:var(--chip);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:14px 16px;font:600 15px 'Noto Sans KR',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
@media (pointer:coarse){.touch{display:flex}}
</style>
</head>
<body>
<h1>달빛 도장 격투</h1>
<div id="wrap">
<canvas id="c" width="800" height="450"></canvas>
<div class="keys">
<span><kbd>A</kbd><kbd>D</kbd>이동</span>
<span><kbd>W</kbd>평타</span>
<span><kbd>Z</kbd>기술 (충격파)</span>
<span><kbd>X</kbd>필살기 (게이지 100%)</span>
<span><kbd>S</kbd>방어</span>
<span><kbd>Space</kbd>점프</span>
</div>
<div class="touch">
<button data-k="KeyA">◀</button><button data-k="KeyD">▶</button><button data-k="KeyS">방어</button><button data-k="Space">점프</button><button data-k="KeyW">평타</button><button data-k="KeyZ">기술</button><button data-k="KeyX">필살기</button>
</div>
</div>
<script>
let S=2;const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function setRes(v){S=v;cv.width=Math.round(800*v);cv.height=Math.round(450*v)}setRes(2);
const W=800,H=450,GY=372,OX=60,FONT="'Black Han Sans','Noto Sans KR','Malgun Gothic',sans-serif";
const keys={},pressed={},buf={KeyW:0,KeyZ:0,KeyX:0};
const GAME=['KeyA','KeyD','KeyW','Space','KeyZ','KeyX','Enter','KeyS'];
addEventListener('keydown',e=>{if(GAME.includes(e.code)){e.preventDefault();if(!keys[e.code])pressed[e.code]=true;keys[e.code]=true}});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
addEventListener('beforeunload',e=>{if(phase!=='title'){e.preventDefault();e.returnValue=''}});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*800,y=(e.clientY-r.top)/r.height*450;pressed.Enter=true});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();if(!keys[k])pressed[k]=true;keys[k]=true});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{keys[k]=false}))});

function shade(h,a){const n=parseInt(h.slice(1),16);return'#'+[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,v+a)).toString(16).padStart(2,'0')).join('')}
let WORLD=800;const clampX=x=>Math.max(40,Math.min(WORLD-40,x));
const lp=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
const ease=u=>u*u*(3-2*u);

function makeFloor(c,fw){
 const fl=document.createElement('canvas');fl.width=fw;fl.height=95;const q=fl.getContext('2d');
 const g=q.createLinearGradient(0,0,0,95);g.addColorStop(0,shade(c.floor,14));g.addColorStop(1,shade(c.floor,-72));q.fillStyle=g;q.fillRect(0,0,fw,95);
 q.strokeStyle='rgba(0,0,0,.3)';q.lineWidth=2;
 for(let i=-(Math.ceil(fw/172)+2);i<=Math.ceil(fw/172)+2;i++){q.beginPath();q.moveTo(fw/2+i*34,0);q.lineTo(fw/2+i*86,95);q.stroke()}
 for(let k=1;k<=7;k++){const y=95*Math.pow(k/7,1.6);q.beginPath();q.moveTo(0,y);q.lineTo(fw,y);q.stroke()}
 const gl=q.createLinearGradient(0,0,0,48);gl.addColorStop(0,'rgba(255,255,255,.2)');gl.addColorStop(1,'rgba(255,255,255,0)');q.fillStyle=gl;q.fillRect(0,0,fw,48);
 q.fillStyle='rgba(255,255,255,.22)';q.fillRect(0,0,fw,3);
 if(c.glow===2){q.save();q.globalCompositeOperation='lighter';
  for(let i=0;i<Math.round(10*fw/800);i++){let x=(i*83+30)%fw,y=2;q.beginPath();q.moveTo(x,y);for(let k=0;k<6;k++){x+=((i*17+k*29)%46)-17;y+=15;q.lineTo(x,y)}
   q.strokeStyle='rgba(255,80,20,.35)';q.lineWidth=7;q.stroke();q.strokeStyle='rgba(255,190,90,.85)';q.lineWidth=2;q.stroke()}q.restore()}
 return fl}
function makeBG(c){
 const FW=c.wide?W*2:W,XR=c.wide?W+(FW-W)*.5:W;
 const far=document.createElement('canvas');far.width=XR+OX*2;far.height=H;const g=far.getContext('2d');g.translate(OX,0);
 const X0=-OX,WW=XR+OX*2;
 let s=g.createLinearGradient(0,0,0,GY);s.addColorStop(0,c.sky[0]);s.addColorStop(1,c.sky[1]);g.fillStyle=s;g.fillRect(X0,0,WW,H);
 if(c.stars){g.fillStyle='#fff';for(let i=0;i<110;i++){g.globalAlpha=.25+.75*((i*37)%10)/10;g.fillRect(X0+(i*131.7)%WW,(i*53.3)%250,1.8,1.8)}g.globalAlpha=1}
 const[mc,mx,my,mr]=c.moon;let gl=g.createRadialGradient(mx,my,mr*.6,mx,my,mr*3.4);gl.addColorStop(0,mc+'77');gl.addColorStop(1,mc+'00');g.fillStyle=gl;g.fillRect(X0,0,WW,GY);
 if(c.deco==='planet'){const px=210,py=150,pr=86;const pg=g.createRadialGradient(px-26,py-26,8,px,py,pr);pg.addColorStop(0,'#c8a0ff');pg.addColorStop(.6,'#6a3ad0');pg.addColorStop(1,'#1a0a48');g.fillStyle=pg;g.beginPath();g.arc(px,py,pr,0,7);g.fill();
  g.strokeStyle='rgba(220,190,255,.55)';g.lineWidth=7;g.beginPath();g.ellipse(px,py,pr*1.7,pr*.38,-.35,Math.PI*.05,Math.PI*.95);g.stroke();g.beginPath();g.ellipse(px,py,pr*1.7,pr*.38,-.35,Math.PI*1.05,Math.PI*1.95);g.stroke()}
 g.fillStyle=mc;g.beginPath();g.arc(mx,my,mr,0,7);g.fill();g.fillStyle='rgba(0,0,0,.08)';[[-.3,-.2,.2],[.3,.15,.25],[-.1,.4,.14]].forEach(k=>{g.beginPath();g.arc(mx+k[0]*mr,my+k[1]*mr,k[2]*mr,0,7);g.fill()});
 if(c.deco==='storm'){for(let i=0;i<22;i++){const x=X0+(i*97)%WW,y=30+(i*53)%130,r=50+(i*29)%60;const cg=g.createRadialGradient(x,y,0,x,y,r);cg.addColorStop(0,'rgba(8,12,24,.7)');cg.addColorStop(1,'rgba(8,12,24,0)');g.fillStyle=cg;g.fillRect(x-r,y-r,r*2,r*2)}}
 c.m.forEach((col,i)=>{g.fillStyle=col;g.beginPath();g.moveTo(X0,GY);for(let x=X0;x<=XR+OX;x+=16)g.lineTo(x,GY-130+i*34+Math.sin(x*.011+i*2)*30+Math.sin(x*.029+i)*14);g.lineTo(XR+OX,GY);g.fill()});
 if(c.deco==='lava'){[[170,150,180],[610,190,210],[420,120,120]].concat(c.wide?[[900,170,190],[1130,140,160],[760,110,110]]:[]).forEach(v=>{const[vx,vh,vw]=v;g.fillStyle='#1a0504';g.beginPath();g.moveTo(vx-vw,GY);g.lineTo(vx-18,GY-vh);g.lineTo(vx+18,GY-vh);g.lineTo(vx+vw,GY);g.closePath();g.fill();
   const cg=g.createRadialGradient(vx,GY-vh,2,vx,GY-vh,60);cg.addColorStop(0,'#ffd070');cg.addColorStop(.4,'#ff6a20');cg.addColorStop(1,'#ff3a1000');g.fillStyle=cg;g.fillRect(vx-60,GY-vh-60,120,120);
   g.strokeStyle='#ff7a30';g.lineWidth=3;g.beginPath();g.moveTo(vx-8,GY-vh+4);g.lineTo(vx-30,GY-vh*.4);g.lineTo(vx-18,GY-6);g.stroke();g.beginPath();g.moveTo(vx+10,GY-vh+4);g.lineTo(vx+34,GY-vh*.5);g.lineTo(vx+20,GY-6);g.stroke()});
  const lg=g.createLinearGradient(0,GY-70,0,GY);lg.addColorStop(0,'rgba(255,90,20,0)');lg.addColorStop(1,'rgba(255,110,30,.6)');g.fillStyle=lg;g.fillRect(X0,GY-70,WW,70)}
 if(c.deco==='canyon'){[[110,210,150],[400,250,190],[690,200,160],[-10,170,120],[820,180,130]].forEach(v=>{const[mx2,mh,mw]=v;const rg=g.createLinearGradient(mx2-mw/2,0,mx2+mw/2,0);rg.addColorStop(0,'#8a4420');rg.addColorStop(.5,'#c8703a');rg.addColorStop(1,'#6a3418');g.fillStyle=rg;
   g.beginPath();g.moveTo(mx2-mw/2,GY);g.lineTo(mx2-mw/2+16,GY-mh);g.lineTo(mx2+mw/2-16,GY-mh);g.lineTo(mx2+mw/2,GY);g.closePath();g.fill();
   g.strokeStyle='rgba(255,220,170,.18)';g.lineWidth=2;for(let k=1;k<6;k++){const yy=GY-mh+k*mh/6;g.beginPath();g.moveTo(mx2-mw/2+14,yy);g.lineTo(mx2+mw/2-14,yy+4);g.stroke()}})}
 function roofs(x,y,sc,n){for(let i=0;i<n;i++){const w=(130-i*24)*sc,yy=y-i*36*sc;
  g.fillStyle=c.wall;g.fillRect(x-w*.32,yy-30*sc,w*.64,30*sc);
  g.fillStyle=c.roof;g.beginPath();g.moveTo(x-w/2-12*sc,yy-26*sc);g.quadraticCurveTo(x,yy-58*sc,x+w/2+12*sc,yy-26*sc);g.lineTo(x+w/2,yy-18*sc);g.lineTo(x-w/2,yy-18*sc);g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,.12)';g.fillRect(x-w/2,yy-20*sc,w,3);
  if(c.glow)[-1,1].forEach(d=>{const lx=x+d*(w/2+4*sc),ly=yy-14*sc,lg=g.createRadialGradient(lx,ly,0,lx,ly,16*sc);lg.addColorStop(0,'#ffd27a');lg.addColorStop(1,'#ffd27a00');g.fillStyle=lg;g.fillRect(lx-16*sc,ly-16*sc,32*sc,32*sc)})}}
 if(!c.noroof){roofs(660,GY-40,1.3,4);roofs(310,GY-18,.85,1);roofs(470,GY-18,.7,1);roofs(160,GY-18,.6,2)}
 if(!c.notree){g.fillStyle='#4a2f26';g.fillRect(20,GY-130,10,130);
  [[28,236,48],[64,206,42],[8,266,52],[88,256,36],[46,176,34],[2,196,36]].forEach(k=>{g.fillStyle=c.tree;g.globalAlpha=.95;g.beginPath();g.arc(k[0],k[1],k[2],0,7);g.fill();g.fillStyle='#ffffff22';g.beginPath();g.arc(k[0]-k[2]*.3,k[1]-k[2]*.3,k[2]*.5,0,7);g.fill()});g.globalAlpha=1}
 if(c.deco==='clouds'){for(let i=0;i<26;i++){const x=X0+i*38,y=GY-26+Math.sin(i*1.9)*10,r=26+(i*13)%26;g.fillStyle='rgba(255,255,255,.82)';g.beginPath();g.arc(x,y,r,0,7);g.fill()}}
 g.fillStyle=shade(c.floor,-30);g.fillRect(X0,GY,WW,H-GY);
 return{far,floor:makeFloor(c,FW)}}
const BGC=BGS.map(c=>{const r=makeBG(c);try{const f=r.far,g=document.createElement('canvas');g.width=f.width;g.height=f.height;const q=g.getContext('2d');q.filter='blur(1.4px)';q.drawImage(f,0,0);q.filter='none';r.far=g}catch(e){}return r});
const grainC=document.createElement('canvas');grainC.width=grainC.height=128;{const q=grainC.getContext('2d'),d=q.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}q.putImageData(d,0,0)}
const grainPat=ctx.createPattern(grainC,'repeat');
const bl1=document.createElement('canvas');bl1.width=200;bl1.height=113;const bl1x=bl1.getContext('2d');
const bl2=document.createElement('canvas');bl2.width=64;bl2.height=36;const bl2x=bl2.getContext('2d');
const vig=document.createElement('canvas');vig.width=W;vig.height=H;
(function(){const g=vig.getContext('2d'),v=g.createRadialGradient(W/2,H/2,H*.38,W/2,H/2,W*.62);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=v;g.fillRect(0,0,W,H)})();

/* ---------- stages ---------- */
const PAL1={top:'#169c96',skin:'#f0b896',pants:'#17151c',glove:'#17151c',shoe:'#0e0e12',hair:'#9a4630',hs:'bun',fem:1,crop:1,sash:'#0b8f8a'};
const SPT={eat:{dur:2.5,ok:d=>true},gorga:{dur:2.6,ok:d=>true},beam:{dur:1.6,ok:d=>d>110},thunder:{dur:1.5,ok:d=>true},quake:{dur:1.4,ok:d=>d<340},dash:{dur:1.5,ok:d=>d>150&&d<470},meteor:{dur:2.3,ok:d=>true},breath:{dur:2.3,ok:d=>d>170&&d<460},yong:{dur:2.5,ok:d=>true}};
const STG=[
