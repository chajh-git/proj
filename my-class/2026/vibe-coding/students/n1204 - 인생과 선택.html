<!DOCTYPE html> <html lang="ko"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"> <title>인생과 선택</title> <style> *{box-sizing:border-box} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0;font-family:system-ui,sans-serif;color:#f5f1e8;background:linear-gradient(145deg,#111827,#312e81 65%,#581c87);min-height:100vh;padding:20px} .app{max-width:850px;margin:auto} .head,.panel{background:#ffffff12;border:1px solid #ffffff24;border-radius:16px;padding:18px;margin-bottom:14px} .head{display:flex;justify-content:space-between;align-items:center;gap:12px} .eyebrow,.muted,.stat{color:#c4c7d5;font-size:13px} .title{font-size:25px;font-weight:800} .btn,.choice{cursor:pointer;color:white;border:1px solid #ffffff30;background:#ffffff12;border-radius:12px;padding:12px;font:inherit} .choice{display:block;width:100%;text-align:left;margin-top:9px} .choice:hover,.btn:hover{background:#ffffff25;border-color:#c4b5fd} .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px} .bar{height:6px;background:#ffffff20;border-radius:9px;overflow:hidden;margin-top:5px} .fill{height:100%;background:#c4b5fd} .gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px} .ending{border:1px solid #ffffff25;background:#ffffff0a;border-radius:10px;padding:10px;font-size:12px} .locked{opacity:.5;filter:grayscale(1)} .modal{position:fixed;inset:0;background:#0b1020f2;padding:20px;overflow:auto;z-index:5} .modal-inner{max-width:850px;margin:auto} .hidden{display:none!important} @media(max-width:560px){body{padding:10px}.stats{gap:5px}.stat{font-size:11px}.gallery{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}} </style> </head> <body> <div class="app"> <header class="head"> <div><div class="eyebrow">A LIFE OF CHOICES</div><div class="title">인생과 선택</div></div> <button class="btn" id="gallery-open">엔딩 도감 <span id="count">0</span>/50</button> </header> <div class="stats" id="stats"></div> <main class="panel" id="scene"> <div class="muted">당신의 인생이 시작됩니다.</div> <h2>어떤 삶을 살아갈까요?</h2> <p>중요한 순간마다 선택하고, 나만의 인생 엔딩을 발견해 보세요.</p> <button class="choice" id="start">인생 시작하기</button> </main> </div> <div class="modal hidden" id="gallery"> <div class="modal-inner"> <header class="head"><h2>엔딩 도감</h2><button class="btn" id="gallery-close">닫기 ✕</button></header> <p class="muted">발견한 엔딩은 자동으로 저장됩니다.</p> <div class="gallery" id="gallery-list"></div> <button class="btn" id="reset-collection" style="margin-top:14px">수집 기록 초기화</button> </div> </div> <script> const $=s=>document.querySelector(s),names=['건강','행복','관계','재산','지혜'],keys=['health','joy','bond','wealth','wisdom']; let s; const tot=c=>Object.values(c).reduce((x,y)=>x+y,0); const events=[ [5,'새로운 세상','처음 세상을 마주합니다.',['가족의 사랑 속에서 자란다','호기심 가득 세상을 탐험한다','건강하고 씩씩하게 자란다'],[{bond:8,joy:5},{wisdom:6,joy:4},{health:8}]], [7,'첫 학교생활','학교에 처음 들어가는 날입니다.',['새 친구들에게 먼저 말을 건다','선생님 말씀을 열심히 듣는다','운동장에서 신나게 뛰논다'],[{bond:7,joy:4},{wisdom:7,joy:2},{health:7,joy:4}]], [10,'처음 맞는 시험','시험 결과가 기대보다 좋지 않습니다.',['친구와 함께 공부한다','좋아하는 분야를 깊게 파고든다','계획을 세워 꾸준히 노력한다'],[{wisdom:5,bond:5},{joy:8,wisdom:3},{wisdom:7,health:2}]], [12,'소중한 취미','마음을 사로잡는 취미를 발견했습니다.',['혼자 깊이 빠져 연습한다','친구들과 함께 즐긴다','대회에 나가 실력을 겨뤄 본다'],[{wisdom:6,joy:6},{bond:6,joy:6},{joy:5,wisdom:4,health:2}]], [15,'갈림길의 교실','주변의 기대와 내 마음이 다릅니다.',['안정적인 길을 선택한다','내 꿈을 따라 도전한다','친구들과 활동에 집중한다'],[{wealth:5,wisdom:3},{joy:8,wisdom:5},{bond:8,joy:3}]], [18,'부모님을 떠나는 날','짐을 챙겨 집을 나섭니다. 부모님은 웃으려 애쓰지만 눈가가 촉촉합니다.',['자주 연락하겠다고 약속한다','독립적으로 모든 일을 해내겠다고 다짐한다','떠나기 전 가족과 하루를 보낸다'],[{bond:10,joy:3},{wisdom:6,wealth:3},{bond:8,joy:5}]], [20,'스무 살, 첫 밤','새로운 도시의 밤. 친구들이 클럽에 가자고 권합니다.',['친구들과 클럽에 간다','야경을 보며 혼자 생각을 정리한다','친구들과 카페에서 이야기한다'],[{joy:8,bond:5,health:-2},{wisdom:7,joy:3},{bond:8,joy:4}]], [22,'첫 직장','첫 월급을 받았습니다. 앞으로의 삶을 어떻게 꾸릴까요?',['저축과 계획을 우선한다','경험과 배움에 투자한다','가족에게 선물을 보낸다'],[{wealth:8,wisdom:4},{wisdom:8,joy:3},{bond:8,joy:4}]], [25,'사랑과 만남','마음이 가는 사람을 만났습니다.',['솔직하게 마음을 전한다','천천히 서로를 알아간다','지금은 내 꿈에 집중한다'],[{joy:7,bond:7},{wisdom:5,bond:6},{wisdom:6,joy:2}]], [28,'뜻밖의 기회','새로운 분야에 도전할 기회가 찾아왔습니다.',['안정된 직장을 지킨다','새로운 도전을 시작한다','주변 사람들과 상의한다'],[{wealth:6,health:3},{joy:7,wisdom:6},{bond:6,wisdom:4}]], [30,'일과 삶의 균형','야근이 이어지며 지쳐 갑니다.',['휴가를 내고 쉬어 간다','성과를 위해 더 달린다','동료와 업무를 나눈다'],[{health:7,joy:5},{wealth:8,health:-3},{bond:7,wisdom:3}]], [32,'가족의 시간','가족과 보내는 시간이 줄어들고 있음을 느낍니다.',['일정을 조정해 함께한다','일에 집중해 미래를 준비한다','함께할 새로운 전통을 만든다'],[{bond:8,joy:4},{wealth:7,wisdom:2},{bond:7,joy:5}]], [34,'내 집 마련','거처를 마련할 시기가 되었습니다.',['무리하지 않는 곳을 고른다','가족이 편한 동네를 고른다','당분간 자유롭게 임대로 산다'],[{wealth:7,wisdom:3},{bond:7,joy:4},{joy:6,wisdom:3}]], [36,'실패와 회복','큰 계획이 뜻대로 되지 않았습니다.',['실패를 분석하고 재도전한다','잠시 쉬며 마음을 돌본다','도움을 요청한다'],[{wisdom:8,health:-2},{health:8,joy:4},{bond:7,wisdom:4}]], [38,'멘토가 되다','후배가 고민을 털어놓습니다.',['시간을 내어 끝까지 들어준다','내 경험을 정리해 알려 준다','스스로 길을 찾도록 지켜본다'],[{bond:8,joy:3},{wisdom:7,bond:4},{wisdom:6,joy:3}]], [40,'삶의 방향','지금까지의 삶을 돌아보며 방향을 고민합니다.',['새로운 목표를 세운다','현재의 소중한 것들을 지킨다','사회에 도움이 되는 일을 시작한다'],[{wisdom:6,joy:5},{bond:5,health:4},{bond:7,joy:5}]], [43,'뜻밖의 위기','예상치 못한 어려움이 닥쳤습니다.',['침착하게 계획을 세운다','가족과 함께 의논한다','잠시 멈추고 마음을 추스른다'],[{wisdom:7,wealth:4},{bond:8,joy:3},{health:7,joy:3}]], [45,'오래된 우정','오랜 친구가 힘든 시간을 보내고 있습니다.',['곁에서 함께한다','실질적인 도움을 준다','친구가 스스로 결정하도록 기다린다'],[{bond:9,joy:3},{wealth:-3,bond:7},{wisdom:6,bond:4}]], [47,'오랜 꿈','미뤄 둔 꿈이 다시 떠오릅니다.',['지금 바로 시작한다','조금씩 준비해 나간다','꿈을 응원해 줄 사람을 찾는다'],[{joy:8,wisdom:4},{wisdom:6,wealth:4},{bond:7,joy:4}]], [50,'새로운 장','인생의 다음 장을 맞이합니다.',['배우고 싶은 것을 공부한다','여행하며 세상을 만난다','가족과 시간을 보낸다'],[{wisdom:8,joy:4},{joy:8,health:3},{bond:8,joy:4}]], [52,'새로운 출발','소중한 사람이 독립해 새로운 길을 떠납니다.',['응원하며 보내 준다','자주 찾아가겠다고 말한다','나도 내 시간을 새로 계획한다'],[{bond:7,wisdom:4},{bond:8,joy:3},{joy:6,wisdom:5}]], [55,'건강의 신호','몸이 예전 같지 않다는 신호를 느낍니다.',['생활 습관을 바꾼다','주변 사람들과 운동한다','무리하지 않고 속도를 늦춘다'],[{health:9,wisdom:4},{health:6,bond:5},{health:7,joy:4}]], [57,'지역의 모임','이웃이 함께하자고 손을 내밉니다.',['모임에 적극 참여한다','재능을 기부한다','가끔 얼굴만 비춘다'],[{bond:8,joy:4},{bond:6,wisdom:5},{joy:5,health:3}]], [60,'다음 세대','젊은 세대가 당신에게 조언을 구합니다.',['경험을 나눈다','스스로 답을 찾도록 응원한다','함께 새로운 것을 배운다'],[{wisdom:7,bond:5},{bond:6,wisdom:4},{joy:6,wisdom:5}]], [62,'건강 검진','정기 검진을 받을 때가 되었습니다.',['결과에 맞춰 식단을 바꾼다','꾸준히 걷기를 시작한다','가족과 함께 건강을 챙긴다'],[{health:9,wisdom:3},{health:8,joy:3},{health:6,bond:6}]], [65,'은퇴의 문턱','오랜 일터를 떠날 시간이 다가옵니다.',['새로운 취미를 시작한다','지역사회 활동에 참여한다','가족과 여행을 계획한다'],[{joy:7,wisdom:4},{bond:7,joy:4},{bond:6,joy:6}]], [67,'여유로운 아침','시간이 넉넉해진 아침을 맞습니다.',['텃밭이나 정원을 가꾼다','책을 읽고 글을 쓴다','오랜 친구들을 만난다'],[{health:5,joy:7},{wisdom:8,joy:3},{bond:8,joy:4}]], [70,'추억의 상자','오래된 사진과 편지를 정리합니다.',['추억을 기록으로 남긴다','가족과 이야기를 나눈다','새로운 추억을 만들러 나간다'],[{wisdom:7,joy:4},{bond:8,joy:4},{joy:7,health:3}]], [72,'아이들의 부탁','아이들이 옛이야기를 들려 달라고 합니다.',['재미난 옛이야기를 들려준다','함께 놀며 시간을 보낸다','삶의 교훈을 천천히 전한다'],[{joy:7,bond:6},{health:4,joy:7},{wisdom:8,bond:4}]], [75,'인생의 마지막 계절','지나온 삶을 천천히 돌아봅니다.',['사랑했던 사람들에게 감사한다','배운 것을 다음 세대에 남긴다','평온한 하루하루를 소중히 여긴다'],[{bond:8,joy:5},{wisdom:8,bond:4},{health:4,joy:7}]] ]; const types=[ ['건강의 수호자','몸과 마음을 돌보며 활기찬 삶을 살았습니다.'], ['기쁨의 여행자','작은 순간의 기쁨을 모아 풍요로운 추억을 만들었습니다.'], ['사랑의 연결자','사람들과 깊은 관계를 맺고 서로의 삶을 밝혀주었습니다.'], ['풍요로운 설계자','꾸준한 계획과 노력으로 안정과 풍요를 일구었습니다.'], ['지혜의 탐구자','배움과 성찰을 멈추지 않고 삶의 의미를 찾아갔습니다.'], ['모험의 개척자','익숙한 길을 벗어나 새로운 가능성을 열었습니다.'], ['헌신의 등불','주변과 공동체를 위해 마음과 시간을 나누었습니다.'], ['창조의 예술가','자신만의 시선으로 세상을 아름답게 표현했습니다.'], ['회복의 달인','어려움 속에서도 다시 일어나 더 단단해졌습니다.'], ['균형의 현자','꿈과 평온 사이에서 자신만의 균형을 찾았습니다.'] ],ranks=['조용한 씨앗','따뜻한 발자취','빛나는 여정','위대한 유산','전설의 삶']; const endings=Array.from({length:50},(_,i)=>({id:i+1,title:types[Math.floor(i/5)][0]+' — '+ranks[i%5],desc:types[Math.floor(i/5)][1]+' '+['작은 선택들이 삶의 밑거름이 되었습니다.','소중한 사람과 순간들이 삶을 채웠습니다.','당신의 선택은 주변에 긍정적인 영향을 주었습니다.','당신의 삶은 많은 이에게 기억될 것입니다.','당신의 이야기는 세대를 넘어 전해집니다.'][i%5]})); let found=new Set();try{found=new Set(JSON.parse(localStorage.getItem('life50')||'[]'))}catch(e){} function save(){try{localStorage.setItem('life50',JSON.stringify([...found]))}catch(e){}$('#count').textContent=found.size} function drawStats(){$('#stats').innerHTML=keys.map((k,i)=>`<div><div class="stat">${names[i]} ${s[k]}</div><div class="bar"><div class="fill" style="width:${Math.min(100,s[k]/1.5)}%"></div></div></div>`).join('')} function gallery(){$('#gallery-list').innerHTML=endings.map(e=>found.has(e.id)?`<div class="ending"><b>${String(e.id).padStart(2,'0')} · ${e.title}</b><p>${e.desc}</p></div>`:`<div class="ending locked"><b>${String(e.id).padStart(2,'0')} · ???</b><p>아직 발견하지 못한 엔딩</p></div>`).join('');$('#gallery').classList.remove('hidden')} function show(){drawStats();let e=events[s.i];$('#scene').innerHTML=`<div class="muted">나이 ${e[0]}세 · ${s.i+1}/${events.length}</div><h2>${e[1]}</h2><p>${e[2]}</p>${e[3].map((c,j)=>`<button class="choice" data-j="${j}">${c}</button>`).join('')}`;$('#scene').querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>choose(+b.dataset.j))} function choose(j){let e=events[s.i];keys.forEach(k=>s[k]=Math.max(0,s[k]+(e[4][j][k]||0)));s.history.push({age:e[0],event:e[1],choice:e[3][j]});s.i++;s.i<events.length?show():finish()} function finish(){let v=keys.map(k=>s[k]),a=v.indexOf(Math.max(...v)),sorted=[...v].sort((x,y)=>y-x),lead=sorted[0]-sorted[1],gain=v.reduce((x,y)=>x+y,0)-150,lo=events.reduce((q,e)=>q+Math.min(...e[4].map(tot)),0),hi=events.reduce((q,e)=>q+Math.max(...e[4].map(tot)),0),r=Math.max(0,Math.min(4,Math.floor((gain-lo)/(hi-lo)*5))),t=lead>=12?a:a+5,id=t*5+r+1,e=endings[id-1];found.add(id);save();drawStats();$('#scene').innerHTML=`<div class="muted">인생의 끝 · 엔딩 ${id}/50</div><h2>${e.title}</h2><p>${e.desc}</p><div class="panel"><b>이번 인생의 발자취</b>${s.history.map(h=>`<p class="muted">${h.age}세 · ${h.event}<br>선택: ${h.choice}</p>`).join('')}</div><button class="choice" id="end-gallery">엔딩 도감 열기 (${found.size}/50)</button><button class="choice" id="again">새로운 인생 시작하기</button>`;$('#end-gallery').onclick=gallery;$('#again').onclick=restart} function restart(){s={health:30,joy:30,bond:30,wealth:30,wisdom:30,i:0,history:[]};show()} $('#start').onclick=restart;$('#gallery-open').onclick=gallery;$('#gallery-close').onclick=()=>$('#gallery').classList.add('hidden');$('#reset-collection').onclick=()=>{if(confirm('수집 기록을 초기화할까요?')){found.clear();save();gallery()}};s={health:30,joy:30,bond:30,wealth:30,wisdom:30,i:0,history:[]};save(); </script> </body> </html>
