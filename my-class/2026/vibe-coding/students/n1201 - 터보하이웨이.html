<!DOCTYPE html> <html lang="ko"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <title>터보 하이웨이</title> <style> :root{--bg:#f1f1ec;--fg:#1c1c1a;--sub:#6b6b66;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#f0f0ea;--sub:#9a9a94}} :root[data-theme="dark"]{--bg:#17171a;--fg:#f0f0ea;--sub:#9a9a94} html{scroll-padding-top:env(safe-area-inset-top,0px)} body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px} h1{font-size:20px;margin:4px 0} p{color:var(--sub);font-size:13px;margin:2px 0 10px;text-align:center} canvas{max-width:100%;height:auto;max-height:72vh;aspect-ratio:3/4;border-radius:10px;background:#2a7d3a;touch-action:none} #diff{display:flex;gap:6px;margin:2px 0 8px;flex-wrap:wrap;justify-content:center} #diff button{padding:6px 12px;border:1px solid var(--sub);border-radius:8px;background:transparent;color:var(--fg);font-size:13px} #diff button.on{border-color:#1e88e5;border-width:2px;font-weight:bold} .shop{width:100%;max-width:480px;margin-top:14px;font-size:13px} .shop h2{font-size:15px;margin:10px 0 6px} .shop .row{display:flex;flex-wrap:wrap;gap:6px} .shop button{padding:8px 10px;border:1px solid var(--sub);border-radius:8px;background:transparent;color:var(--fg);font-size:13px} .shop button:disabled{opacity:.4} .shop button.on{border-color:#1e88e5;border-width:2px} .pad{display:flex;gap:8px;margin-top:10px} .pad button{width:64px;height:48px;font-size:20px;border:0;border-radius:10px;background:var(--fg);color:var(--bg);user-select:none;touch-action:none} </style> </head> <body> <h1>🏎️ 터보 하이웨이</h1> <p>자동으로 시작됩니다! P: 일시정지 · ↑ 가속 · ↓ 브레이크 · ←→ 조향 · Space 총 발사(탄약 제한, 초록 상자로 보충) · 도로의 🛡⚡🧲 아이템을 먹어 보세요! </p> <div id="diff"></div> <canvas id="c" width="480" height="640"></canvas> <button id="start" style="margin-top:10px;padding:10px 28px;font-size:16px;border:0;border-radius:10px;background:#1e88e5;color:#fff">🔄 다시 시작</button> <button id="pause" style="margin-top:10px;padding:10px 18px;font-size:16px;border:0;border-radius:10px;background:#ef6c00;color:#fff">⏸ 일시정지</button> <button id="mute" style="margin-top:10px;padding:10px 18px;font-size:16px;border:0;border-radius:10px;background:#607d8b;color:#fff">🔊 소리 켜짐</button> <button id="music" style="margin-top:10px;padding:10px 18px;font-size:16px;border:0;border-radius:10px;background:#5e35b1;color:#fff">🎵 음악 켜짐</button> <div class="pad"> <button data-k="ArrowLeft">◀</button><button data-k="ArrowUp">▲</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button><button data-k=" ">🔫</button> </div> <div class="shop" id="shop"></div> <script> const cv=document.getElementById('c'),g=cv.getContext('2d'); const W=480,H=640,RL=90,RR=390;let PW=34,PH=60; const keys={}; let pu={shield:0,turbo:0,magnet:0},items=[],pspawn=700,wz=0,runSt={k:0,p:0,u:0,f:0,b:0,fin:0},newAch=[],tookHit=false; let bossN=0,warn=0,paused=false; function togglePause(){if(state!=='play')return;paused=!paused;document.getElementById('pause').textContent=paused?'▶ 계속하기':'⏸ 일시정지'} let boxes=[],bspawn=300,ammo=40; let boss=null,nextBoss=1200,ebs=[],lives=0,inv=0; let coinList=[],coins=0,cspawn=200; let sv={coins:0,own:['#1e88e5'],car:'#1e88e5',rate:0,dual:false,veh:'car',vown:['car'],mag:0,up:{dmg:0,eng:0,shd:0,mg:0,gold:0},rank:[],ach:{},st:{runs:0,kills:0,coins:0,boss:0,fin:0,bus:0},ms:[],diff:'normal'}; const UP={dmg:{n:'🔥 총알 위력',c:90,m:3,d:'피해 +0.5'},eng:{n:'⚡ 엔진',c:40,m:5,d:'최고속도 증가'},shd:{n:'🛡 방어막',c:80,m:2,d:'충돌 +1회 방어'},mg:{n:'🧲 코인 자석',c:50,m:3,d:'코인을 끌어당김'},gold:{n:'💰 코인 보너스',c:70,m:3,d:'획득 코인 +25%'}}; function maxAmmo(){return 40+sv.mag*15} const DIFF={easy:{n:'🟢 쉬움',sp:1.35,ev:1.25,bh:0.7,bf:1.3,bs:0.85,bx:0.7,rw:0.8,ex:1},normal:{n:'🟡 보통',sp:1,ev:1,bh:1,bf:1,bs:1,bx:1,rw:1,ex:0},hard:{n:'🟠 어려움',sp:0.8,ev:0.85,bh:1.4,bf:0.85,bs:1.1,bx:1.3,rw:1.3,ex:0},hell:{n:'🔴 강건',sp:0.6,ev:0.7,bh:1.9,bf:0.7,bs:1.25,bx:1.6,rw:1.8,ex:0}}; function D(){return DIFF[sv.diff]||DIFF.normal} function renderDiff(){document.getElementById('diff').innerHTML=Object.keys(DIFF).map(k=>'<button data-d="'+k+'" class="'+(sv.diff===k?'on':'')+'">'+DIFF[k].n+'</button>').join('')} function blip(f1,f2,d,type,v,delay){if(!AC||muted)return;const T=AC.currentTime+(delay||0),o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,T);o.frequency.exponentialRampToValueAtTime(f2,T+d);gn.gain.setValueAtTime(v,T);gn.gain.exponentialRampToValueAtTime(0.001,T+d);o.connect(gn);gn.connect(AC.destination);o.start(T);o.stop(T+d+0.02)} const MS=[{id:'kill',n:'차량 30대 격파',g:30,r:40,st:'k'},{id:'coin',n:'코인 80개 모으기',g:80,r:40,st:'c'},{id:'boss',n:'보스 2회 격파',g:2,r:80,st:'b'},{id:'pol',n:'경찰차 10대 격파',g:10,r:50,st:'p'},{id:'bus',n:'버스 5대 격파',g:5,r:50,st:'u'},{id:'fire',n:'소방차 8대 격파',g:8,r:50,st:'f'},{id:'dist',n:'한 판에 1500m 달리기',g:1500,r:70,st:'d',max:true}]; const ACH=[{id:'a1',n:'첫 출발',d:'게임 1회 플레이',r:10,f:()=>sv.st.runs>=1},{id:'a2',n:'1000m 돌파',d:'한 판에 1000m',r:30,f:()=>dist>=1000},{id:'a3',n:'파괴왕',d:'누적 100대 격파',r:50,f:()=>sv.st.kills>=100},{id:'a4',n:'부자',d:'누적 코인 500개',r:50,f:()=>sv.st.coins>=500},{id:'a5',n:'보스 헌터',d:'보스 1회 격파',r:60,f:()=>sv.st.boss>=1},{id:'a6',n:'최강 보스 격파',d:'👑 보스 격파',r:200,f:()=>sv.st.fin>=1},{id:'a7',n:'버스 사냥꾼',d:'버스 20대 격파',r:60,f:()=>sv.st.bus>=20},{id:'a8',n:'무결점 주행',d:'피해 없이 1500m',r:100,f:()=>!tookHit&&dist>=1500}]; function newMs(){const p=MS.filter(x=>!sv.ms.some(m=>m.id===x.id));return{id:p[Math.floor(Math.random()*p.length)].id,p:0}} function initMs(){while(sv.ms.length<3)sv.ms.push(newMs())} function recordRun(){ sv.st.runs++;sv.st.kills+=runSt.k;sv.st.coins+=coins;sv.st.boss+=runSt.b;sv.st.fin+=runSt.fin;sv.st.bus+=runSt.u; sv.rank.push({d:Math.floor(dist),k:kills,c:coins,df:sv.diff});sv.rank.sort((a,b)=>b.d-a.d);sv.rank=sv.rank.slice(0,5); newAch=[]; for(const a of ACH)if(!sv.ach[a.id]&&a.f()){sv.ach[a.id]=1;sv.coins+=a.r;newAch.push('🏆 '+a.n+' +'+a.r+'🪙')} for(let i=0;i<sv.ms.length;i++){const m=sv.ms[i],d=MS.find(x=>x.id===m.id);m.p=d.max?Math.max(m.p,Math.floor(dist)):m.p+(d.st==='c'?coins:runSt[d.st]); if(m.p>=d.g){sv.coins+=d.r;newAch.push('📋 '+d.n+' 완료 +'+d.r+'🪙');sv.ms.splice(i,1,newMs())}} } function mkBoss(){ const n=bossN++,fin=n>=4,k=Math.min(n,4),w=fin?110:70+k*8,h=fin?190:130+k*10; const b={x:W/2,y:-h,w,h,hp:fin?260+30*(n-4):40+22*n,t:0,hit:0,f:1.5,n,fin,rest:105+h/2,sf:1.2+0.15*k,amp:Math.min(120,95+k*8),vol:0, col:['#37474f','#4e342e','#1b5e20','#4a148c','#b71c1c'][k],str:fin?'#ffd600':'#ef6c00',name:fin?'👑 최강 보스':'BOSS Lv.'+(n+1),rw:fin?800:200+120*n,rc:fin?200:30+20*n}; b.hp=Math.round(b.hp*D().bh);b.max=b.hp;return b; } function bossFire(b){ const k=Math.min(b.n,4),rage=b.hp<b.max/2,sp=(260+25*k)*(rage?1.25:1)*D().bs,y=b.y+b.h/2; b.f=Math.max(0.4,b.fin?0.8:1.2-0.15*k)*(rage?0.65:1)*D().bf;b.vol++; const cnt=b.fin?5:b.n<2?2:3; if(b.fin&&b.vol%3===0){for(let i=0;i<10;i++){const a=0.15*Math.PI+i*(0.7*Math.PI/9);ebs.push({x:b.x,y,vx:Math.cos(a)*sp*0.8,vy:Math.sin(a)*sp*0.8})}return} for(let i=0;i<cnt;i++){const o=i-(cnt-1)/2,dx=(px-b.x)/Math.max(100,520-y);ebs.push({x:b.x+o*18,y,vx:(dx+o*0.25)*sp,vy:sp})} } let parts=[],shake=0,AC=null,muted=false,lastSfx=0; let musicOn=true,mStep=0,mNext=0,NB=null,mGain=null; function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();mGain=AC.createGain();mGain.gain.value=0.3;mGain.connect(AC.destination)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()} function playBoom(big){ if(!AC||muted)return;const n=performance.now();if(n-lastSfx<50)return;lastSfx=n; const T=AC.currentTime,d=big?0.7:0.35,len=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,len,AC.sampleRate),a=buf.getChannelData(0); for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5); const src=AC.createBufferSource();src.buffer=buf; const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(big?1400:2200,T);f.frequency.exponentialRampToValueAtTime(120,T+d); const gn=AC.createGain();gn.gain.value=big?0.9:0.55;src.connect(f);f.connect(gn);gn.connect(AC.destination);src.start(); const o=AC.createOscillator(),og=AC.createGain();o.type='sine';o.frequency.setValueAtTime(110,T);o.frequency.exponentialRampToValueAtTime(35,T+d); og.gain.setValueAtTime(big?0.8:0.5,T);og.gain.exponentialRampToValueAtTime(0.001,T+d);o.connect(og);og.connect(AC.destination);o.start();o.stop(T+d); } function boom(m,big){ booms.push(m);const n=big?34:16; for(let i=0;i<n;i++){const a=Math.random()*6.283,sp=60+Math.random()*260,l=0.5+Math.random()*0.6; parts.push({x:m.x,y:m.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,l,m:l,s:3+Math.random()*5,c:['#ff9800','#ffeb3b','#f44336','#555','#bdbdbd'][Math.floor(Math.random()*5)]})} shake=Math.max(shake,big?14:6);playBoom(big); } const CH=[[55,[220,261.63,329.63]],[43.65,[174.61,220,261.63]],[65.41,[261.63,329.63,392]],[49,[196,246.94,293.66]]]; function tone(f,t,d,type,v,lp){const o=AC.createOscillator(),g2=AC.createGain();o.type=type;o.frequency.value=f;let n=o;if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);n=fl}g2.gain.setValueAtTime(v,t);g2.gain.exponentialRampToValueAtTime(0.001,t+d);n.connect(g2);g2.connect(mGain);o.start(t);o.stop(t+d+0.02)} function nhit(t,d,v,hp){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1} const s2=AC.createBufferSource();s2.buffer=NB;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g2=AC.createGain();g2.gain.setValueAtTime(v,t);g2.gain.exponentialRampToValueAtTime(0.001,t+d);s2.connect(f);f.connect(g2);g2.connect(mGain);s2.start(t,Math.random()*0.5,d+0.02)} function kick(t){const o=AC.createOscillator(),g2=AC.createGain();o.freq
