<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>폐쇄구역 생존기</title>
<style>
:root{color-scheme:dark;--bg:#14160f;--ink:#d8d4c0;--dim:#8a8670;--red:#b0392e;--ok:#7a9a4a;--warn:#c9962f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#wrap{position:relative;width:100%;height:100%}

#mm{position:absolute;top:12px;right:12px;width:140px;height:140px;border:1px solid #5a5742;background:#0009}#fm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;border:2px solid #5a5742}

.bar{width:170px;height:12px;background:#0009;border:1px solid #5a5742}
.bar i{display:block;height:100%;background:var(--ok);width:100%}

button{font:inherit;color:var(--ink);background:#2a2c1e;border:1px solid #6a6748;padding:6px 12px;cursor:pointer}button:disabled{opacity:.35}
#panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(390px,90%);max-height:80%;overflow:auto;background:#0c0d08f2;border:1px solid #5a5742;padding:14px;display:none;font-size:14px}
#panel b{display:block;margin:10px 0 2px;color:var(--warn)}.r{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0}

#btns{position:absolute;right:14px;bottom:26px;display:grid;grid-template-columns:repeat(2,64px);gap:8px}#btns button{height:52px;background:#2a2c1ecc;touch-action:manipulation}
</style></head><body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="moodles"><div class="md" id="mh">🍖</div><div class="md" id="mt">💧</div><div class="md" id="mi">🩸</div></div>
<div id="clock"></div>
<div id="bottom"><div class="bar"><i id="hp"></i></div><span id="inv"></span></div>
<canvas id="mm" width="140" height="140"></canvas><canvas id="fm"></canvas><div id="panel"></div><div id="tc"><div id="stick"><i id="knob"></i></div><div id="btns"><button data-k="atk">공격</button><button data-k="KeyE">E</button><button data-k="run">달리기</button><button data-k="KeyB">건축</button><button data-k="KeyI">가방</button><button data-k="KeyM">지도</button><button data-k="KeyF">먹기</button></div></div><div id="hint"></div><div id="msg"></div>
<div id="screen"><h1 id="st">폐쇄구역 생존기</h1><p id="sd">마을은 이미 무너졌습니다. 집을 뒤져 먹을 것과 물을 구하고, 소리를 죽이고, 밤을 넘기세요.</p><p>이동 WASD · 달리기 Shift(소리가 커집니다) · 공격 클릭 또는 Space · 가방과 제작 I · 지도 M · 건축 B · 뒤지기와 운전 E · 연료 넣기 R · 먹기 F · 마시기 G · 붕대 H. 폰에서는 화면의 조이스틱과 버튼을 쓰세요.</p><button id="go">시작하기</button></div>
</div>
<script>
const N=320,$=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),G=document.createElement('canvas'),g=G.getContext('2d'),DK=document.createElement('canvas'),dc=DK.getContext('2d');

let W,H,cx=0,cy=0;
function rs(){W=DK.width=cv.width=cv.clientWidth;H=DK.height=cv.height=cv.clientHeight}
addEventListener('resize',rs);
let seed=1;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const sc=(x,y)=>[(x-y)*32+1536,(x+y)*16],sp=(x,y)=>[(x-y)*32-cx,(x+y)*16-cy];
const PAL=[['#9a8b6c','#7b6d52','#5e5340'],['#8a5448','#6e4138','#54322b'],['#7d8480','#626965','#4b514e'],['#6c7a5c','#55614a','#414a38']];
const touch=matchMedia('(pointer:coarse)').matches,NM={f:'통조림',w:'물',b:'붕대',cl:'헝겊',wd:'나무',nl:'못',fu:'연료'};
let SO,SO1,HM,FH,HS,w1,furn,bush,WL,GT,walls,crates,trees,cars,decals,Z,P,parts,T,kills,running=false,hurt=0,msgT=0,keys={},mx=0,my=0,spawnT=0,drv=null,build=0,invOpen=0,tRun=0,jv={x:0,y:0};
const bl=(x,y,r,lv=0)=>{for(const[a,b]of[[x-r,y-r],[x+r,y-r],[x-r,y+r],[x+r,y+r]]){const i=Math.floor(a),j=Math.floor(b);if(i<0||j<0||i>=N||j>=N||(lv?SO1:SO)[j*N+i])return true}return false};
const move=(e,dx,dy,r)=>{const L=e.lv|0;if(!bl(e.x+dx,e.y,r,L))e.x+=dx;if(!bl(e.x,e.y+dy,r,L))e.y+=dy};
const CG=[...Array(8)].map((_,i)=>`hsl(
88+i*1.5,{22+i%4*2}%,24+i*.8%)`),CR=[...Array(8)].map((,i)=>`hsl(80,3%,{19+i*.4}%)`),CF=[[30,25],[210,10],[8,28],[38,35]].map(k=>[...Array(8)].map((_,i)=>`hsl(k[0],{k[1]}%,27+i*.8%)`)),CP=[...Array(8)].map((,i)=>`hsl(40,6%,{42+i*.7}%)`);
function ground(){const px=Math.floor(P.x),py=Math.floor(P.y),R=Math.ceil((W/64+H/32)/2)+4;
 for(let y=Math.max(0,py-R);y<Math.min(N,py+R);y++)for(let x=Math.max(0,px-R);x<Math.min(N,px+R);x++){
  const[a,b]=sp(x,y);if(a<-40||a>W+40||b<-40||b>H+10)continue;
  const h=(Math.imul(x,73856093)^Math.imul(y,19349663))>>>0,t=GT[y*N+x];
  ctx.fillStyle=(t==1?CR:t==2?CF[FH[y*N+x]]:t==3?CP:CG)[h&7];ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(a+32,b+16);ctx.lineTo(a,b+32);ctx.lineTo(a-32,b+16);ctx.fill();
  if(t==1){const rx=x%32,ry=y%32;ctx.strokeStyle='#c9b24a';ctx.lineWidth=2;if(rx==28&&ry<26&&y%2==0){ctx.beginPath();ctx.moveTo(a+32,b+16);ctx.lineTo(a,b+32);ctx.stroke()}if(ry==28&&rx<26&&x%2==0){ctx.beginPath();ctx.moveTo(a-32,b+16);ctx.lineTo(a,b+32);ctx.stroke()}}
  if(t==2){ctx.strokeStyle='rgba(0,0,0,.13)';ctx.beginPath();ctx.moveTo(a-16,b+8);ctx.lineTo(a+16,b+24);ctx.stroke()}
  if(t==0&&h%3==0){ctx.fillStyle='rgba(20,30,10,.5)';ctx.fillRect(a-20+(h>>3)%40,b+6+(h>>9)%18,2,3)}}
 for(const d of decals){const[a,b]=sp(d.x,d.y);if(a<-30||a>W+30||b<-30||b>H+30)continue;ctx.fillStyle='rgba(90,12,12,.7)';ctx.beginPath();ctx.ellipse(a,b,16,7,0,0,7);ctx.fill();ctx.fillStyle=d.c;ctx.beginPath();ctx.ellipse(a,b,11,4,.4,0,7);ctx.fill();ctx.fillStyle='#7f8f6a';ctx.beginPath();ctx.arc(a+10,b-1,3,0,7);ctx.fill()}}
const shade=(h,f)=>{const n=parseInt(h.slice(1),16);return `rgb((n>>16)*f|0,{(n>>8&255)*f|0},${(n&255)*f|0})`};
const MAP=document.createElement('canvas'),MK=document.createElement('canvas'),MC=document.createElement('canvas'),mm=('mm').getContext('2d'),fm=('fm');let mapOpen=0,rv=0;
MAP.width=MAP.height=MK.width=MK.height=MC.width=MC.height=N;
function mapInit(){const m=MAP.getContext('2d');for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=GT[y*N+x];m.fillStyle=t==1?'#6b6a60':t==2?'#8a7452':t==3?'#8d8a7a':'#3b4a2a';m.fillRect(x,y,1,1)}
 m.fillStyle='#b9ab8c';for(const w of walls)m.fillRect(w.x,w.y,1,1);m.fillStyle='#24381c';for(const t of trees)m.fillRect(t.x,t.y,1,1);
 MK.getContext('2d').clearRect(0,0,N,N);reveal()}
function reveal(){const k=MK.getContext('2d');k.fillStyle='#fff';k.beginPath();k.arc(P.x,P.y,16,0,7);k.fill();const c=MC.getContext('2d');c.globalCompositeOperation='source-over';c.clearRect(0,0,N,N);c.drawImage(MAP,0,0);c.globalCompositeOperation='destination-in';c.drawImage(MK,0,0);c.globalCompositeOperation='source-over'}
function drawMM(){mm.imageSmoothingEnabled=false;mm.fillStyle='#14160f';mm.fillRect(0,0,140,140);mm.drawImage(MC,P.x-35,P.y-35,70,70,0,0,140,140);
 for(const c of cars){const dx=(c.x-P.x)*2+70,dy=(c.y-P.y)*2+70;if(dx>0&&dx<140&&dy>0&&dy<140){mm.fillStyle='#d8b030';mm.fillRect(dx-2,dy-2,4,4)}}
 mm.fillStyle='#e04a3a';mm.beginPath();mm.arc(70,70,3,0,7);mm.fill()}
function drawFM(){const s=Math.floor(Math.min(W,H)*.9);fm.width=fm.height=s;fm.style.width=fm.style.height=s+'px';const f=fm.getContext('2d'),k=s/N;f.imageSmoothingEnabled=false;f.fillStyle='#14160f';f.fillRect(0,0,s,s);f.drawImage(MC,0,0,s,s);
 f.fillStyle='#d8b030';for(const c of cars)if(MK.getContext('2d').getImageData(c.x|0,c.y|0,1,1).data[3])f.fillRect(c.x*k-2,c.y*k-2,4,4);
 f.fillStyle='#e04a3a';f.beginPath();f.arc(P.x*k,P.y*k,4,0,7);f.fill();f.fillStyle='#d8d4c0';f.font='14px sans-serif';f.fillText('지도 · 가 본 곳만 표시됩니다 · M 키로 닫기',8,18)}
function car(c){const ca=Math.cos(c.a),sa=Math.sin(c.a),fv=ca+sa,q=(l,w,z)=>{const[a,b]=sp(c.x+ca*l-sa*w,c.y+sa*l+ca*w);return[a,b-z]},
 poly=(p,col)=>{ctx.fillStyle=col;ctx.beginPath();p.forEach((k,i)=>i?ctx.lineTo(k[0],k[1]):ctx.moveTo(k[0],k[1]));ctx.fill()},
 lit=(nl,nw)=>{const nx=ca*nl-sa*nw,ny=sa*nl+ca*nw;return[nx+ny,Math.max(.45,.72+.3*(ny-nx))]},
 pr=(l0,l1,w,z0,z1,top,side,ib=0,jf=0,iw=0,gl=0)=>{
  const B=[[l0,-w],[l1,-w],[l1,w],[l0,w]],U=[[l0+ib,-w+iw],[l1-jf,-w+iw],[l1-jf,w-iw],[l0+ib,w-iw]],NL=[[0,-1],[1,0],[0,1],[-1,0]];
  for(let i=0;i<4;i++){const[v,f]=lit(NL[i][0],NL[i][1]);if(v<.05)continue;const j=(i+1)%4,P=[q(B[i][0],B[i][1],z0),q(B[j][0],B[j][1],z0),q(U[j][0],U[j][1],z1),q(U[i][0],U[i][1],z1)];
   poly(P,shade(side,f));
   if(gl){const L=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],g=(u0,u1,v0,v1)=>{const pt=(u,y)=>L(L(P[0],P[1],u),L(P[3],P[2],u),y);poly([pt(u0,v0),pt(u1,v0),pt(u1,v1),pt(u0,v1)],shade('#5a7482',Math.min(1,f*1.15)))};
    if(i%2)g(.1,.9,.2,.85);else if(c.t==2)g(.1,.9,.2,.85);else{g(.07,.47,.2,.85);g(.53,.93,.2,.85)}}}
  poly(U.map(k=>q(k[0],k[1],z1)),top)},
 V=[[15,-.8,.5,30,.22,.34,.07],[17,-1.2,.85,40,.08,.28,.04],[15,0,.85,30,.1,.3,.07]][c.t||0],
 wheel=(l,s)=>{if(lit(0,s)[0]<.05)return;const d=(r,z)=>Array.from({length:12},(_,k)=>{const t=k/12*6.283;return q(l+Math.cos(t)*r*.04,s*.6,z+Math.sin(t)*r)});poly(d(8,7),'#0c0c09');poly(d(6.5,7),'#1b1b15');poly(d(3,7),'#6a6a60')};
 poly([[-1.6,-.7],[1.6,-.7],[1.6,.7],[-1.6,.7]].map(k=>q(k[0],k[1],0)),'rgba(0,0,0,.35)');
 pr(-1.58,1.58,.6,3,8,'#1a1a17','#1a1a17');
 pr(-1.45,1.45,.58,5,V[0],shade(c.c,1.05),c.c);
 if(c.t==2)poly([[-1.35,-.5],[-.05,-.5],[-.05,.5],[-1.35,.5]].map(k=>q(k[0],k[1],V[0])),shade(c.c,.4));
 for(const s of[-1,1]){wheel(-.95,s);wheel(.95,s);
  if(lit(0,s)[0]>.05){ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;for(const l of[-.15,.6]){ctx.beginPath();ctx.moveTo(...q(l,s*.58,15));ctx.lineTo(...q(l,s*.58,8));ctx.stroke()}}}
 pr(V[1],V[2],.5,V[0],V[3],shade(c.c,1.12),c.c,V[4],V[5],V[6],1);
 for(const s of[-1,1])if(lit(0,s)[0]>.05){const[a,b]=q(V[2]-.1,s*.68,V[0]+4);ctx.fillStyle=shade(c.c,.8);ctx.fillRect(a-2,b-1.5,4,3)}
 const hl=drv===c?'#fff6c0':'#cbbf8a';
 for(const e of[1,-1])if(fv*e>.05){const x=e*1.46,col=e>0?hl:'#8a2020';poly([q(x,-.52,9),q(x,-.26,9),q(x,-.26,12.5),q(x,-.52,12.5)],col);poly([q(x,.52,9),q(x,.26,9),q(x,.26,12.5),q(x,.52,12.5)],col)}}
function drive(dt){const c=drv,th=c.fuel>0?(keys.KeyW?1:0)-(keys.KeyS?1:0)-(Math.abs(jv.y)>.3?jv.y:0):0,st=(keys.KeyD?1:0)-(keys.KeyA?1:0)+(Math.abs(jv.x)>.3?jv.x:0);
 c.v+=th*(th>0?5:4)*dt;c.v*=1-(th?.25:1.2)*dt;c.v=Math.max(-3,Math.min(9,c.v));c.fuel=Math.max(0,c.fuel-Math.abs(th)*dt*.8);
 c.a+=st*Math.sign(c.v)*Math.min(1,Math.abs(c.v)/3)*1.8*dt;
 const nx=c.x+Math.cos(c.a)*c.v*dt,ny=c.y+Math.sin(c.a)*c.v*dt;
 if(bl(nx,ny,.6)||bl(nx+Math.cos(c.a)*.9,ny+Math.sin(c.a)*.9,.5)||bl(nx-Math.cos(c.a)*.9,ny-Math.sin(c.a)*.9,.5)){if(Math.abs(c.v)>5){P.hp-=Math.abs(c.v)*2;hurt=1;say('충돌했다!')}c.v*=-.3}else{c.x=nx;c.y=ny}
 P.x=c.x;P.y=c.y;P.moving=true;P.run=Math.abs(c.v)>1;
 for(const z of Z)if(Math.abs(c.v)>2.5&&Math.hypot(z.x-c.x,z.y-c.y)<1.2)dmg(z,3);
 Z=Z.filter(z=>!z.dead)}
function dmg(z,n){z.hp-=n;z.st=1;blood(z.x,z.y,6);if(z.hp<=0&&!z.dead){kills++;z.dead=1;decals.push({x:z.x,y:z.y,c:z.c});if(decals.length>400)decals.shift()}}
function place(){const tx=Math.floor(P.x+Math.cos(P.a)*1.8),ty=Math.floor(P.y+Math.sin(P.a)*1.8),i=ty*N+tx;if(tx<0||ty<0||tx>=N||ty>=N||P.cd>0||P.lv)return;P.cd=.3;
 const w=walls.find(w=>w.x==tx&&w.y==ty&&w.own);
 if(w){walls=walls.filter(q=>q!==w);SO[i]=0;P.i.wd++;say('바리케이드를 철거했다');return}
 if(SO[i]||Math.hypot(tx+.5-P.x,ty+.5-P.y)<1||Z.some(z=>Math.floor(z.x)==tx&&Math.floor(z.y)==ty))return say('여기에는 지을 수 없다');
 if(P.i.wd<2||P.i.nl<1)return say('나무 2, 못 1이 필요하다');
 P.i.wd-=2;P.i.nl--;SO[i]=1;walls.push({x:tx,y:ty,h:30,own:1,c:['#9a7a4a','#7a5c36','#5e4529']});say('바리케이드를 설치했다')}
function use(k){const I=P.i;if(I[k]<1)return;
 if(k=='f'){I.f--;P.hu=Math.max(0,P.hu-40);say('통조림을 먹었다')}
 if(k=='w'){I.w--;P.th=Math.max(0,P.th-45);say('물을 마셨다')}
 if(k=='b'&&P.hp<100){I.b--;P.hp=Math.min(100,P.hp+25);say('붕대를 감았다')}
 renderInv()}
const RC=[['붕대',{cl:2},i=>i.b++],['못 깎기',{wd:1},i=>i.nl+=2],['배트 강화',{wd:3,nl:3},i=>P.wl++]];
function renderInv(){if(!invOpen)return;const I=P.i;
 ('panel').innerHTML='<b>가방</b>'+Object.keys(NM).map(k=>`<divclass="r"><span>{NM[k]} × I[k]</span>{'fwb'.includes(k)?`<button data-u="${k}">사용</button>`:''}</div>`).join('')+'<b>제작</b>'+RC.map((r,n)=>`<div class="r"><span>${r[0]}${n==2?` (Lv${P.wl})`:''} — Object.entries(r[1]).map(e=>NM[e[0]]+e[1]).join('')</span><buttondata-c="{n}" ${Object.entries(r[1]).every(e=>I[e[0]]>=e[1])&&!(n==2&&P.wl>=3)?'':'disabled'}>제작</button></div>`).join('')+'<b>건축</b><div class="r"><span>B 키로 건축 모드. 바리케이드 = 나무 2 + 못 1</span></div><button data-x>닫기</button>'}
function act(k){if(!running)return;const I=P.i;
 if(k=='KeyM'&&!invOpen){mapOpen^=1;fm.style.display=mapOpen?'block':'none';if(mapOpen)drawFM();return}if(mapOpen)return;
 if(k=='KeyI'||k=='Tab'){invOpen^=1;$('panel').style.display=invOpen?'block':'none';renderInv();return}
 if(invOpen)return;
 if(k=='KeyB'&&!drv){build^=1;say(build?'건축 모드: 공격으로 설치':'건축 모드 해제')}
 if(k=='KeyE'){const Q=HS[HM[(P.y|0)*N+(P.x|0)]-1];if(!drv&&Q&&Q.fl==2&&Math.hypot(Q.sx+.5-P.x,Q.sy+.5-P.y)<1.5){P.lv^=1;say(P.lv?'위층으로 올라갔다':'아래층으로 내려왔다');return}

 const h=T%24;('clock').innerHTML=`{Math.floor(T/24)+1}일째<br>String(Math.floor(h)).padStart(2,'0'):{String(Math.floor(h%1*60)).padStart(2,'0')}`}
function darkA(){const h=T%24;return h>=7&&h<18?0:h>=18&&h<21?(h-18)/3*.85:(h>=21||h<4)?.85:.85*(1-(h-4)/3)}
function draw(){
 const px=(P.x-P.y)*32,py=(P.x+P.y)*16-14-(P.lv?46:0);cx=px-W/2;cy=py-H/2;const ph=HM[(P.y|0)*N+(P.x|0)]-1;
 ctx.fillStyle='#14160f';ctx.fillRect(0,0,W,H);ground();if(P.lv&&ph>=0)slab(HS[ph],ph);
 const L=[],on=(x,y)=>{const[a,b]=sp(x,y);return a>-70&&a<W+70&&b>-110&&b<H+70};
 for(const w of walls)if(on(w.x,w.y)){let h=w.h;if(w.hi!=null){if(w.part&&P.lv)continue;const f=HS[w.hi].fl*46;if(ph!=w.hi)h=f;else if(!P.lv)h=w.lo?12:46;else if(w.lo)h=46;else continue}
  if(w.door){L.push([w.x+w.y+1,()=>{if(w.open){const A=w.part?sp(w.x,w.y+.06):sp(w.x+.06,w.y),B=w.part?sp(w.x+.9,w.y+.06):sp(w.x+.06,w.y+.9),hh=Math.min(h,40);ctx.fillStyle='#7a5a36';ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.lineTo(B[0],B[1]-hh);ctx.lineTo(A[0],A[1]-hh);ctx.fill()}else box(w.x,w.y,Math.min(h,40),'#8a6a44','#6b4f30','#503a24');if(h>40)box(w.x,w.y,h,w.c[0],w.c[1],w.c[2],40,0)}]);continue}
  L.push([w.x+w.y+1,()=>box(w.x,w.y,w.broken?10:h,w.c[0],w.c[1],w.c[2],0,w.hi==null?-1:w.broken?0:(w.win?(w.board?2:1):0))])}
 if(P.lv&&ph>=0)for(const w of w1)if(w.hi==ph&&on(w.x,w.y))L.push([w.x+w.y+1,()=>box(w.x,w.y,w.lo?58:92,w.c[0],w.c[1],w.c[2],46,w.win?1:0)]);
 for(const c of crates)if(c.hi==ph&&(c.lv|0)==P.lv&&on(c.x,c.y)){const z=c.lv?46:0;L.push([c.x+c.y+1,()=>box(c.x,c.y,z+14,c.full?'#8a6a3c':'#5e5038',c.full?'#6e5230':'#4a4030',c.full?'#54402a':'#3a3226',z)])}
 for(const f of furn)if(f.hi==ph&&f.lv==P.lv&&on(f.x,f.y)){const z=f.lv?46:0;L.push([f.x+f.y+1,()=>box(f.x,f.y,z+f.h,f.c[0],f.c[1],f.c[2],z)])}
 if(ph>=0&&!P.lv&&HS[ph].fl==2){const Q=HS[ph];L.push([Q.sx+Q.sy+1,()=>box(Q.sx,Q.sy,14,'#b59a6c','#8a734d','#6b583c')])}
 for(let i=0;i<HS.length;i++){if(i==ph)continue;const Q=HS[i],[a,b]=sp(Q.x+Q.w/2,Q.y+Q.h/2);if(a<-300||a>W+300||b<-250||b>H+250)continue;for(const R of Q.parts)L.push([R.x+R.w+R.y+R.h,()=>roof(R)])}
 for(const u of bush)if(on(u.x,u.y))L.push([u.x+u.y,()=>{const[a,b]=sp(u.x,u.y),s=u.s;ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(a,b,11*s,5*s,0,0,7);ctx.fill();ctx.fillStyle='#2c4222';ctx.beginPath();ctx.arc(a-3*s,b-6*s,7*s,0,7);ctx.arc(a+4*s,b-5*s,6*s,0,7);ctx.fill();ctx.fillStyle='#3d5a2c';ctx.beginPath();ctx.arc(a,b-9*s,6*s,0,7);ctx.fill();if(u.f){ctx.fillStyle=u.f;ctx.fillRect(a-4,b-10,2,2);ctx.fillRect(a+2,b-7,2,2)}}]);
 for(const t of trees)if(on(t.x,t.y))L.push([t.x+t.y+1,()=>{const[a,b]=sp(t.x+.5,t.y+.5);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(a,b,16,7,0,0,7);ctx.fill();ctx.fillStyle='#3d2f20';ctx.fillRect(a-3,b-30*t.s,6,30*t.s);
  ctx.fillStyle='#2f4224';ctx.beginPath();ctx.arc(a,b-44*t.s,18*t.s,0,7);ctx.fill();ctx.fillStyle='#3a5229';ctx.beginPath();ctx.arc(a-6,b-50*t.s,12*t.s,0,7);ctx.fill()}]);
 for(const z of Z)if(on(z.x,z.y)&&!(HM[(z.y|0)*N+(z.x|0)]==ph+1&&ph>=0&&(z.lv|0)!=P.lv))L.push([z.x+z.y,()=>person(z,z.c,'#7f8f6a',false)]);
 for(const c of cars)if(on(c.x,c.y))L.push([c.x+c.y,()=>car(c)]);
 if(!drv)L.push([P.x+P.y,()=>person(P,'#3f5a78','#c9a07a',true)]);
 L.sort((a,b)=>a[0]-b[0]);for(const l of L)l[1]();
 if(build&&!drv){const tx=Math.floor(P.x+Math.cos(P.a)*1.8),ty=Math.floor(P.y+Math.sin(P.a)*1.8);ctx.globalAlpha=.45;box(tx,ty,30,'#9a7a4a','#7a5c36','#5e4529');ctx.globalAlpha=1}
 ctx.fillStyle='#a01c1c';for(const p of parts){const[a,b]=sp(p.x,p.y);ctx.fillRect(a,b-p.z,2,2)}
 const d=darkA();
 if(d>.02){dc.globalCompositeOperation='source-over';dc.fillStyle=`rgba(4,6,16,${d})`;dc.fillRect(0,0,W,H);dc.globalCompositeOperation='destination-out';
  const r=dc.createRadialGradient(W/2,H/2,10,W/2,H/2,drv?320:200);r.addColorStop(0,'rgba(0,0,0,1)');r.addColorStop(1,'rgba(0,0,0,0)');dc.fillStyle=r;dc.fillRect(0,0,W,H);ctx.drawImage(DK,0,0)}
 if(hurt>0){const r=ctx.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.9);r.addColorStop(0,'rgba(160,0,0,0)');r.addColorStop(1,`rgba(160,0,0,${hurt*.55})`);ctx.fillStyle=r;ctx.fillRect(0,0,W,H)}}
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(running&&!invOpen&&!mapOpen)update(dt);draw();drawMM();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code=='Space'||e.code=='Tab')e.preventDefault();act(e.code)});
$('panel').onclick=e=>{const d=e.target.dataset;if(d.u)use(d.u);if(d.c!=null){const r=RC[d.c],I=P.i;for(const k in r[1])I[k]-=r[1][k];r[2](I);say(r[0]+' 제작');renderInv()}if('x' in d)act('KeyI')};
const stick=('stick'),knob=('knob');let sid=null,so=[0,0];
function mv(t){let x=(t.clientX-so[0])/45,y=(t.clientY-so[1])/45;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}knob.style.transform=`translate(x*35px,{y*35}px)`;jv=l<.2?{x:0,y:0}:{x,y}}
stick.addEventListener('touchstart',e=>{const t=e.changedTouches[0],r=stick.getBoundingClientRect();sid=t.identifier;so=[r.left+r.width/2,r.top+r.height/2];mv(t);e.preventDefault()},{passive:false});
stick.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier==sid)mv(t);e.preventDefault()},{passive:false});
stick.addEventListener('touchend',()=>{sid=null;jv={x:0,y:0};knob.style.transform=''});
$('btns').addEventListener('pointerdown',e=>{const k=e.target.dataset.k;if(!k)return;if(k=='atk')attack();else if(k=='run'){tRun^=1;e.target.style.outline=tRun?'2px solid var(--warn)':''}else act(k)});
addEventListener('keyup',e=>keys[e.code]=false);
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});
cv.addEventListener('mousedown',attack);
$('go').onclick=()=>{init();$('screen').style.display='none';running=true;keys={}};
rs();init();requestAnimationFrame(loop);
</script></body></html>
