<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘 노래 추천</title>
<style>
:root{--bg:#faf7ff;--card:#fff;--tx:#241b3a;--sub:#6b6285;--ac:#7c4dff;--bd:#e3dcf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17122a;--card:#221b3d;--tx:#f1ecff;--sub:#a99fc8;--ac:#a98bff;--bd:#3a3060}}
:root[data-theme="dark"]{--bg:#17122a;--card:#221b3d;--tx:#f1ecff;--sub:#a99fc8;--ac:#a98bff;--bd:#3a3060}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans KR",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:8px 0 4px}p.s{color:var(--sub);margin:0 0 18px}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:1rem;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:transparent;color:var(--tx);padding:8px 14px;border-radius:999px;font-size:.95rem;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.go{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;margin:6px 0 16px}
.song{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.song b{font-size:1.1rem}.tag{color:var(--sub);font-size:.85rem;margin:4px 0 10px}
.song a{display:inline-block;margin-right:8px;padding:8px 12px;border-radius:10px;text-decoration:none;font-size:.9rem;border:1px solid var(--ac);color:var(--ac)}
.song a.yt{background:var(--ac);color:#fff}
input.ar-in{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:var(--tx);font-size:1rem;font-family:inherit}input.ar-in:focus{outline:2px solid var(--ac);border-color:transparent}.hint{color:var(--sub);font-size:.82rem;margin:8px 0 0}.msg{border:1px dashed var(--ac);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:.92rem}.msg a{color:var(--ac)}
.note{color:var(--sub);font-size:.8rem;margin-top:14px}
</style>
</head>
<body>
<main>
<h1>🎧 오늘 노래 추천</h1>
<p class="s">기분과 분위기, 장르를 골라 보세요. 딱 맞는 노래를 추천해 드려요.</p>
<div id="opts"></div>
<section><h2>듣고 싶은 가수 <span style="color:var(--sub);font-weight:400">(선택)</span></h2><input class="ar-in" id="artist" type="text" placeholder="예: 아이유, Coldplay (비워 둬도 돼요)" autocomplete="off"><p class="hint">비워 두면 위에서 고른 조건만으로 추천해요.</p></section>
<button class="go" id="go">노래 추천받기</button>
<div id="out"></div>
<p class="note">※ 가사는 저작권 때문에 화면에 직접 싣지 않고, '가사 보기' 버튼으로 검색 결과를 연결해 드려요. 노래 듣기는 유튜브 검색 결과로 연결됩니다. 추천 목록은 대표 곡을 모은 샘플 데이터이며 모든 곡을 담고 있지는 않습니다.</p>
</main>
<script>

["Heat Waves","Glass Animals","팝송",["외로움","평온"],["몽환적인"]],
["Yellow","Coldplay","록",["평온","설렘"],["잔잔한","감성적인"]],
["Boulevard of Broken Dreams","Green Day","록",["우울","외로움"],["어두운"]],
["Mr. Brightside","The Killers","록",["화남","설렘"],["힘이 나는","신나는"]],

["Good So Bad","제로베이스원 (ZEROBASEONE)","케이팝",["설렘","기쁨"],["신나는"]],
["Feel the POP","제로베이스원 (ZEROBASEONE)","케이팝",["기쁨"],["신나는","힘이 나는"]],
["SWEAT","제로베이스원 (ZEROBASEONE)","케이팝",["화남","기쁨"],["힘이 나는"]],
["Doctor! Doctor!","제로베이스원 (ZEROBASEONE)","케이팝",["설렘","기쁨"],["신나는"]],
["Melting Point","제로베이스원 (ZEROBASEONE)","케이팝",["설렘","외로움"],["몽환적인","감성적인"]]
];
const sel={mood:"",vibe:"",genre:""};
const opts=document.getElementById("opts");
for(const k in G){
  const s=document.createElement("section");
  s.innerHTML=`<h2>${L[k]}</h2><div class="chips"></div>`;
  const box=s.querySelector(".chips");
  ["상관없음",...G[k]].forEach((v,i)=>{
    const b=document.createElement("button");
    b.className="chip"+(i==0?" on":"");b.textContent=v;
    b.onclick=()=>{sel[k]=i==0?"":v;box.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));b.classList.add("on")};
    box.appendChild(b);
  });
  opts.appendChild(s);
}
const q=t=>encodeURIComponent(t);
const nz=t=>t.toLowerCase().replace(/\s+/g,"");
function recommend(){
  const aq=nz(document.getElementById("artist").value.trim());
  const aRaw=document.getElementById("artist").value.trim();
  const hit=aq&&S.some(s=>nz(s[1]).includes(aq));
  const r=S.map(s=>{
    let p=0;
    if(aq&&nz(s[1]).includes(aq))p+=6;
    if(sel.mood&&s[3].includes(sel.mood))p+=3;
    if(sel.vibe&&s[4].includes(sel.vibe))p+=2;
    if(sel.genre&&s[2]==sel.genre)p+=2;
    return{s,p:p+Math.random()};
  }).sort((a,b)=>b.p-a.p).slice(0,3);
  const out=document.getElementById("out");
  const miss=aq&&!hit?`<div class="msg">'
aRaw.replace(/</g,"&lt;")'의곡은아직목록에없어요.대신선택한조건에맞는노래를추천했어요.<atarget="blank"rel="noopener"href="https://www.youtube.com/results?searchquery={q(aRaw)}">유튜브에서 ${aRaw.replace(/</g,"&lt;")} 노래 찾기</a></div>`:"";
  out.innerHTML=miss+r.map(({s})=>`<div class="song"><b>${s[0]}</b> · s[1]<divclass="tag">{s[2]} · ${s[3].join(", ")} · ${s[4].join(", ")}</div>
  <a class="yt" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${q(s[1]+" "+s[0])}">▶ 노래 듣기</a>
  <a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q(s[0]+" "+s[1]+" 가사")}">가사 보기</a></div>`).join("");
}
document.getElementById("go").onclick=recommend;
</script>

</html>
