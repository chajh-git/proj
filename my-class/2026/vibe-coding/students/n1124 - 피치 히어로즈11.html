 for(let t=0;t<2;t++)ch[t]=P.filter(p=>p.t==t&&!p.gk).sort((a,b)=>Math.hypot(a.x-ball.x,a.y-ball.y)-Math.hypot(b.x-ball.x,b.y-ball.y)).slice(0,2);
 P.forEach(p=>{
  p.cool--;const dir=p.t?-1:1,gx=p.t?0:W;
  if(p===h){
   let kx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),ky=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
   if(pt&&!kx&&!ky){const dx=pt.x-p.x,dy=pt.y-p.y,d=Math.hypot(dx,dy);if(d>12){kx=dx/d;ky=dy/d}}
   if(kx||ky)mv(p,p.x+kx*10,p.y+ky*10,(keys.ShiftLeft||keys.ShiftRight?3.3:2.6)*(owner===p?.92:1));
   return}
  if(p.gk){
   if(owner===p){if(--p.hold<=0)passTo(p,dir,(Math.random()-.5));return}
   const near=!owner&&Math.hypot(p.x-ball.x,p.y-ball.y)<110&&Math.abs(ball.x-p.hx)<150;
   if(near)mv(p,ball.x,ball.y,2.4);else mv(p,p.hx,Math.max(G0,Math.min(G1,ball.y)),2.3);return}
  if(owner===p){
   mv(p,gx,H/2+(p.y>H/2?-30:30),2.0);
   const dg=Math.abs(p.x-gx);
   if(dg<250&&Math.random()<.035)kick(p,gx,H/2+(Math.random()-.5)*95,10.5);
   else if(Math.random()<.012&&P.some(q=>q.t!=p.t&&Math.hypot(q.x-p.x,q.y-p.y)<55))passTo(p,dir,(Math.random()-.5));
   return}
  if(ch[p.t].includes(p)){const o=owner&&owner.t!=p.t?owner:ball;mv(p,o.x,o.y,2.1);return}
  const push=owner&&owner.t==p.t?dir*90:0;
  mv(p,p.hx+(ball.x-W/2)*.3+push,p.hy+(ball.y-H/2)*.15,1.7);
 });
 // ball
 if(owner){ball.x=owner.x+owner.fx*13;ball.y=owner.y+owner.fy*13;ball.vx=ball.vy=0;
  for(const q of P){if(q.t!=owner.t&&!q.gk&&q.cool<=0&&Math.hypot(q.x-owner.x,q.y-owner.y)<17&&Math.random()<.04){owner.cool=30;owner=q;break}}}
 else{ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.985;ball.vy*=.985;
  let best=null,bd=17;P.forEach(p=>{const d=Math.hypot(p.x-ball.x,p.y-ball.y);if(p.cool<=0&&d<bd){bd=d;best=p}});
  if(best){owner=best;if(best.gk)best.hold=40}}
 const inG=ball.y>G0&&ball.y<G1;
 if(ball.x<0&&inG||ball.x>W&&inG){const s=ball.x>W?0:1;sc[s]++;('s'+s).textContent=sc[s];('msg').innerHTML=s?'실점…':'골! ⚽';msgT=90;kickoff();return}
 if(ball.x<4){ball.x=4;ball.vx=Math.abs(ball.vx)*.6}
 if(ball.x>W-4){ball.x=W-4;ball.vx=-Math.abs(ball.vx)*.6}
 if(ball.y<4){ball.y=4;ball.vy=Math.abs(ball.vy)*.6}
 if(ball.y>H-4){ball.y=H-4;ball.vy=-Math.abs(ball.vy)*.6}
}
function draw(){
 for(let i=0;i<10;i++){g.fillStyle=i%2?'#2e8b3d':'#33963f';g.fillRect(i*W/10,0,W/10,H)}
 g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;g.strokeRect(2,2,W-4,H-4);
 g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,H);g.stroke();
 g.beginPath();g.arc(W/2,H/2,60,0,7);g.stroke();
 g.strokeRect(2,H/2-110,130,220);g.strokeRect(W-132,H/2-110,130,220);
 g.strokeRect(2,G0,40,120);g.strokeRect(W-42,G0,40,120);
 g.fillStyle='rgba(255,255,255,.35)';g.fillRect(0,G0,6,120);g.fillRect(W-6,G0,6,120);
 const h=human();
 P.forEach(p=>{g.fillStyle=p.t?(p.gk?'#f5c518':'#d93a3a'):(p.gk?'#ff9f1c':'#2f6fe0');
  g.beginPath();g.arc(p.x,p.y,9,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke();
  if(p===h){g.strokeStyle='#fff';g.lineWidth=2.5;g.beginPath();g.arc(p.x,p.y,15,0,7);g.stroke()}});
 g.fillStyle='#fff';g.beginPath();g.arc(ball.x,ball.y,5.5,0,7);g.fill();g.strokeStyle='#222';g.lineWidth=1;g.stroke();
}
function loop(){step();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code=='Space')shoot();if(e.code=='KeyX')pass()});
addEventListener('keyup',e=>keys[e.code]=0);
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{pt=pos(e)});cv.addEventListener('pointermove',e=>{if(pt)pt=pos(e)});
addEventListener('pointerup',()=>pt=null);
('bs').onclick=shoot;('bp').onclick=pass;
$('cp').onclick=async()=>{const src='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
 try{await navigator.clipboard.writeText(src)}catch(_){const a=document.createElement('textarea');a.value=src;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
 ('cp').textContent='복사됨!';setTimeout(()=>('cp').textContent='코드 복사',1500)};
reset();loop();
</script>
