<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>차 시뮬레이터</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f16;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#fff}
canvas{display:block}
#hud{position:fixed;right:24px;bottom:max(24px,env(safe-area-inset-bottom));text-align:right;text-shadow:0 2px 8px #000a}
#spd{font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#spd small{font-size:18px;opacity:.7;margin-left:6px}
#gear{font-size:22px;margin-top:4px}
#bar{width:220px;height:6px;background:#fff3;border-radius:3px;margin:8px 0 0 auto;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ade80,#facc15,#ef4444)}
#help{position:fixed;left:20px;top:max(16px,env(safe-area-inset-top));font-size:13px;line-height:1.8;background:#0008;padding:10px 14px;border-radius:10px}
kbd{background:#fff2;border-radius:4px;padding:1px 6px;font-family:inherit}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000b;font-size:20px;gap:10px;cursor:pointer}
#start b{font-size:44px;letter-spacing:2px}
</style></head><body>
<div id="help"><b>조작법</b><br><kbd>W</kbd> 전진 · <kbd>S</kbd> 브레이크/후진<br><kbd>W</kbd>+<kbd>A</kbd> 좌회전 · <kbd>W</kbd>+<kbd>D</kbd> 우회전<br><kbd>Space</kbd> 핸드브레이크(드리프트) · <kbd>C</kbd> 색상 · <kbd>1</kbd>~<kbd>6</kbd> 차종 · <kbd>R</kbd> 리셋</div>
<div id="hud"><div id="cn" style="font-size:16px;opacity:.9;margin-bottom:6px"></div><div id="spd">0<small>km/h</small></div><div id="gear">N</div><div id="ds" style="font-size:22px;font-weight:700;color:#facc15;opacity:0;margin-top:6px;transition:opacity .3s"></div><div id="bar"><i></i></div></div>
<div id="start"><b>차 시뮬레이터</b><span>아무 키나 눌러 시작 · 1~6 키로 차종 선택</span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=THREE;
const renderer=new R.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=R.PCFSoftShadowMap;
renderer.toneMapping=R.ACESFilmicToneMapping;renderer.outputEncoding=R.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene=new R.Scene();scene.fog=new R.Fog(0xd7c4b0,120,700);
const camera=new R.PerspectiveCamera(60,innerWidth/innerHeight,.1,1500);
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const tex=(c,rep)=>{const t=new R.CanvasTexture(c);t.encoding=R.sRGBEncoding;if(rep){t.wrapS=t.wrapT=R.RepeatWrapping;t.anisotropy=renderer.capabilities.getMaxAnisotropy();}return t;};

// 하늘 + 환경 반사
const sc0=cv(16,256),sg=sc0.getContext('2d'),gr=sg.createLinearGradient(0,0,0,256);
[[0,'#2a5a9c'],[.5,'#8fb8e0'],[.58,'#ffd9a8'],[.68,'#c9a58a'],[1,'#4a4a50']].forEach(s=>gr.addColorStop(s[0],s[1]));
sg.fillStyle=gr;sg.fillRect(0,0,16,256);const skyT=tex(sc0);
const skyG=new R.SphereGeometry(1000,32,16);
const sky=new R.Mesh(skyG,new R.MeshBasicMaterial({map:skyT,side:R.BackSide,fog:false}));scene.add(sky);
const envS=new R.Scene();
envS.add(new R.Mesh(new R.SphereGeometry(500,32,16),new R.MeshBasicMaterial({map:skyT,side:R.BackSide})));
const mkSoft=(w,h,d,x,y,z,k)=>{const m=new R.MeshBasicMaterial({color:0xffffff});m.color.multiplyScalar(k);const o=new R.Mesh(new R.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.lookAt(0,0,0);envS.add(o);};
mkSoft(120,40,2,-200,200,150,8);mkSoft(250,4,80,0,300,0,4);
scene.environment=new R.PMREMGenerator(renderer).fromScene(envS,0,.1,1000).texture;

const sunL=new R.DirectionalLight(0xffe2c0,2.2);sunL.castShadow=true;sunL.shadow.mapSize.set(2048,2048);
Object.assign(sunL.shadow.camera,{left:-30,right:30,top:30,bottom:-30,near:1,far:400});sunL.shadow.bias=-.0004;
scene.add(sunL,sunL.target,new R.HemisphereLight(0xaac8ff,0x555555,.3));

// 도로 텍스처
const ac=cv(1024,1024),g=ac.getContext('2d');
g.fillStyle='#2b2c2f';g.fillRect(0,0,1024,1024);
for(let i=0;i<30000;i++){const v=30+Math.random()*40|0;g.fillStyle=`rgba(
v,{v},${v+3},.5)`;g.fillRect(Math.random()*1024,Math.random()*1024,2,2);}
[[0,0],[640,0],[0,640],[640,640]].forEach(p=>{g.fillStyle='#85857f';g.fillRect(p[0],p[1],384,384);g.strokeStyle='#b4b4ac';g.lineWidth=10;g.strokeRect(p[0]+(p[0]?5:-5),p[1]+(p[1]?5:-5),384,384);});
g.fillStyle='#ececec';
for(let i=0;i<384;i+=64){g.fillRect(508,i,8,32);g.fillRect(508,i+640,8,32);g.fillRect(i,508,32,8);g.fillRect(i+640,508,32,8);}
for(let r=0;r<4;r++){g.save();g.translate(512,512);g.rotate(r*Math.PI/2);for(let i=0;i<8;i++)g.fillRect(-110+i*28,-190,16,54);g.restore();}
const gt=tex(ac,true);gt.repeat.set(20,20);
const ground=new R.Mesh(new R.PlaneGeometry(1600,1600),new R.MeshStandardMaterial({map:gt,roughness:.9}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// 빌딩
const wc=cv(128,128),wg=wc.getContext('2d');wg.fillStyle='#5b6470';wg.fillRect(0,0,128,128);
for(let y=0;y<8;y++)for(let x=0;x<8;x++){const l=Math.random();wg.fillStyle=l>.82?'#f3d89a':`hsl(210,20+l*20%,{18+l*30}%)`;wg.fillRect(x*16+3,y*16+4,10,9);}
const wT=tex(wc,true),wM=new R.MeshStandardMaterial({map:wT,roughness:.35,metalness:.4});
const boxes=[];
for(let k=-4;k<=4;k++)for(let j=-4;j<=4;j++){
  const w=25+Math.random()*20,d=25+Math.random()*20,h=18+Math.random()*70,x=k*80+(Math.random()-.5)*8,z=j*80+(Math.random()-.5)*8;
  const geo=new R.BoxGeometry(w,h,d),uv=geo.attributes.uv;
  for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*w/24,uv.getY(i)*h/32);
  const m=new R.Mesh(geo,wM);m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);
  boxes.push({x,z,w:w/2,d:d/2});
}

// GT-R
const colors=[0x1c3d8f,0xe6e8ec,0x9a0f12,0x111216,0x9aa0a8];let ci=0;
const paint=new R.MeshPhysicalMaterial({color:colors[0],metalness:.65,roughness:.3,clearcoat:1,clearcoatRoughness:.04});
const black=new R.MeshStandardMaterial({color:0x08090b,roughness:.6,metalness:.3});
const glass=new R.MeshPhysicalMaterial({color:0x06090f,metalness:.9,roughness:.04,clearcoat:1});
const chrome=new R.MeshStandardMaterial({color:0xdddddd,metalness:1,roughness:.15});
const tireM=new R.MeshStandardMaterial({color:0x0c0c0d,roughness:.9});
const alloy=new R.MeshStandardMaterial({color:0xb9bdc4,metalness:1,roughness:.25});
const headM=new R.MeshStandardMaterial({color:0xffffff,emissive:0xfff4d0,emissiveIntensity:1.5});
const tailM=new R.MeshStandardMaterial({color:0x550000,emissive:0xff1111,emissiveIntensity:1.2});
const redM=new R.MeshStandardMaterial({color:0xcc1111,roughness:.4});
const carG=new R.Group(),body=new R.Group();carG.add(body);
const M=(geo,m,x=0,y=0,z=0)=>{const o=new R.Mesh(geo,m);o.position.set(x,y,z);body.add(o);return o;};
const B=(w,h,d)=>new R.BoxGeometry(w,h,d);
function extr(pts,w,bev){const s=new R.Shape();pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1]));
  const e=new R.ExtrudeGeometry(s,{depth:w,bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:4,curveSegments:8});
  e.translate(0,0,-w/2);e.rotateY(-Math.PI/2);return e;}
const pts=[[-2.3,.42],[-2.32,.98],[-1.5,1.06],[1.2,1],[1.9,.92],[2.3,.72],[2.3,.42]];
[1.4,-1.4].forEach(cx=>{for(let i=0;i<=12;i++){const a=i/12*Math.PI;pts.push([cx+.47*Math.cos(a),.4+.47*Math.sin(a)]);}});
M(extr(pts,1.7,.1),paint);
M(extr([[-1.45,1.05],[-.78,1.43],[.35,1.43],[1.05,1.05]],1.4,.06),glass);
M(B(1.4,.05,1),paint,0,1.5,-.22);
[-1,1].forEach(s=>{
  M(B(.42,.09,.1),headM,s*.66,.7,2.34);
  M(B(.12,.1,.2),paint,s*1.02,1.1,.75);
  M(B(.05,.2,.12),black,s*.55,1.12,-2.1);
  M(B(.03,.14,.38),black,s*.86,1.28,-2.15);
  [.46,.74].forEach(x=>{const t=new R.CylinderGeometry(.095,.095,.06,20).rotateX(Math.PI/2);M(t,tailM,s*x,.86,-2.44);});
  [.28,.5].forEach(x=>M(new R.CylinderGeometry(.055,.055,.2,16).rotateX(Math.PI/2),chrome,s*x,.52,-2.45));
});
M(B(.95,.2,.12),black,0,.55,2.36);M(B(1.9,.05,.35),black,0,.4,2.3);
M(B(1.2,.12,.25),black,0,.46,-2.35);M(B(1.7,.04,.38),black,0,1.22,-2.15);
const wheels=[];
function mkWheel(x,z,front){
  const pv=new R.Group();pv.position.set(x,.36,z);const sp=new R.Group();pv.add(sp);const s=Math.sign(x);
  sp.add(new R.Mesh(new R.CylinderGeometry(.36,.36,.27,32).rotateZ(Math.PI/2),tireM),
    new R.Mesh(new R.CylinderGeometry(.25,.25,.28,24).rotateZ(Math.PI/2),black));
  const lip=new R.Mesh(new R.TorusGeometry(.25,.022,8,32).rotateY(Math.PI/2),chrome);lip.position.x=s*.135;sp.add(lip);
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2,sk=new R.Mesh(B(.03,.22,.045),alloy);sk.position.set(s*.13,Math.cos(a)*.12,Math.sin(a)*.12);sk.rotation.x=a;sp.add(sk);}
  const cal=new R.Mesh(B(.05,.16,.12),redM);cal.position.set(s*.09,.02,.14);pv.add(cal);
  body.add(pv);wheels.push({pv,sp,front});
}
mkWheel(-.93,1.4,1);mkWheel(.93,1.4,1);mkWheel(-.93,-1.4,0);mkWheel(.93,-1.4,0);
let cur=0;
const cars=[{n:'닛산 GT-R',eye:1.15,bd:body,w:wheels,paint,wr:.36,acc:11,top:88,grip:16,wb:2.78}];
function mkCar(s){
  const bd=new R.Group(),wl=[];carG.add(bd);
  const pm=new R.MeshPhysicalMaterial({color:s.col,metalness:.6,roughness:.3,clearcoat:1,clearcoatRoughness:.05});
  const L=s.L,w=s.w,r=s.r,wz=s.wz,ar=r+.1,cy=r+.04,bt=s.bt,c=s.cab;
  const A=(geo,m,x,y,z)=>{const o=new R.Mesh(geo,m);o.position.set(x,y,z);bd.add(o);return o;};
  const p=[[-L,cy],[-L,s.dk],[-L*.6,bt],[L*.35,bt],[L*.85,s.hd],[L,s.nose],[L,cy]];
  [wz,-wz].forEach(cx=>{for(let i=0;i<=12;i++){const a=i/12*Math.PI;p.push([cx+ar*Math.cos(a),cy+ar*Math.sin(a)]);}});
  A(extr(p,w,.1),pm,0,0,0);
  A(extr([[-c[0],bt],[-c[1],s.ch],[c[2],s.ch],[c[3],bt]],w*.82,.06),glass,0,0,0);
  A(B(w*.82+.1,.05,c[1]+c[2]+.1),pm,0,s.ch+.06,(c[2]-c[1])/2);
  [-1,1].forEach(sx=>{
    A(B(w*.22,.09,.1),headM,sx*w*.32,s.nose-.02,L+.04);
    A(B(.12,.1,.2),pm,sx*(w/2+.12),bt+.1,c[3]-.1);
    [.27,.4].forEach(k=>A(new R.CylinderGeometry(.08,.08,.06,20).rotateX(Math.PI/2),tailM,sx*w*k,s.dk-.12,-L-.14));
    if(s.wing){A(B(.05,.2,.12),black,sx*w*.32,s.dk+.14,-L+.2);A(B(.03,.14,.38),black,sx*w*.48,s.dk+.26,-L+.2);}
    if(s.bed)A(B(.06,.3,L-c[0]),pm,sx*w/2,bt+.25,-(L+c[0])/2);
    [[sx,wz],[sx,-wz]].forEach(([q,z])=>{
      const pv=new R.Group();pv.position.set(q*(w/2+.08),r,z);const sp=new R.Group();pv.add(sp);
      sp.add(new R.Mesh(new R.CylinderGeometry(r,r,.27,32).rotateZ(Math.PI/2),tireM),new R.Mesh(new R.CylinderGeometry(r*.7,r*.7,.28,24).rotateZ(Math.PI/2),black));
      const lip=new R.Mesh(new R.TorusGeometry(r*.7,.022,8,32).rotateY(Math.PI/2),chrome);lip.position.x=q*.135;sp.add(lip);
      for(let i=0;i<8;i++){const a=i/8*Math.PI*2,k=new R.Mesh(B(.03,r*.6,.045),alloy);k.position.set(q*.13,Math.cos(a)*r*.33,Math.sin(a)*r*.33);k.rotation.x=a;sp.add(k);}
      bd.add(pv);wl.push({pv,sp,front:z>0});
    });
  });
  A(B(w*.5,.18,.12),black,0,s.nose-.15,L+.06);A(B(w,.1,.2),black,0,cy-.05,L+.1);A(B(w*.9,.1,.2),black,0,cy-.02,-L);
  if(s.wing)A(B(w*.95,.04,.38),black,0,s.dk+.3,-L+.2);
  if(s.bed){A(B(w,.3,.06),pm,0,bt+.25,-L+.03);A(B(w,.3,.06),pm,0,bt+.25,-c[0]-.03);}
  cars.push({n:s.n,eye:s.ch*.8,bd,w:wl,paint:pm,wr:r,acc:s.acc,top:s.top,grip:s.grip,wb:wz*2});
}
[
 {n:'슈퍼카',col:0xd01010,L:2.25,w:1.8,r:.35,wz:1.35,dk:.92,bt:.92,hd:.9,nose:.66,cab:[1.1,.55,.4,.95],ch:1.22,wing:1,acc:12.5,top:95,grip:18},
 {n:'세단',col:0x7a8088,L:2.4,w:1.75,r:.34,wz:1.45,dk:1.05,bt:1,hd:.98,nose:.75,cab:[1.5,.95,.5,1.1],ch:1.42,acc:6,top:62,grip:12},
 {n:'SUV',col:0x1e4d2b,L:2.35,w:1.9,r:.42,wz:1.45,dk:1.2,bt:1.2,hd:1.15,nose:.85,cab:[2,1.7,.9,1.2],ch:1.78,acc:5.5,top:52,grip:11},
 {n:'픽업트럭',col:0xc2461b,L:2.7,w:1.9,r:.42,wz:1.6,dk:1.2,bt:1.2,hd:1.12,nose:.85,cab:[.2,0,.7,1.15],ch:1.8,bed:1,acc:5,top:50,grip:10.5},
 {n:'경차',col:0xf2c200,L:1.7,w:1.5,r:.3,wz:1.05,dk:.95,bt:.9,hd:.86,nose:.62,cab:[1.15,.95,.55,.75],ch:1.5,acc:4.5,top:40,grip:9}
].forEach(mkCar);
cars.forEach(c=>c.k=(c.acc-.8)/(c.top*c.top));
cars.forEach((c,j)=>c.bd.visible=j===0);document.getElementById('cn').textContent='1. 닛산 GT-R';
let fp=false,skI=0,skF=0;const hds=document.getElementById('ds');
const skG=new R.PlaneGeometry(.22,1.8).rotateX(-Math.PI/2),skM=new R.MeshBasicMaterial({color:0x050505,transparent:true,opacity:.55,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}),skids=[];
for(let i=0;i<600;i++){const m=new R.Mesh(skG,skM);m.visible=false;scene.add(m);skids.push(m);}
const cockpit=new R.Group();cockpit.visible=false;carG.add(cockpit);
{const dm=new R.MeshStandardMaterial({color:0x111214,roughness:.7}),dash=new R.Mesh(new R.BoxGeometry(1.6,.2,.5),dm);dash.position.set(0,-.4,.85);cockpit.add(dash);
const sw=new R.Group();sw.position.set(.35,-.32,.45);sw.rotation.x=-.35;cockpit.add(sw);
const tor=new R.Mesh(new R.TorusGeometry(.15,.02,10,32),dm);tor.add(new R.Mesh(new R.BoxGeometry(.3,.02,.02),dm));sw.add(tor);cockpit.userData.t=tor;}
function setCar(i){if(!cars[i])return;cur=i;cars.forEach((c,j)=>c.bd.visible=j===i);document.getElementById('cn').textContent=(i+1)+'. '+cars[i].n;car.v=car.u=0;}
const spot=new R.SpotLight(0xfff0d0,60,70,.45,.6);spot.position.set(0,.8,2.4);spot.target.position.set(0,0,25);carG.add(spot,spot.target);
carG.traverse(o=>{if(o.isMesh)o.castShadow=true;});scene.add(carG);

// 입력
const keys={};let started=false,AC,o1,o2,fl,gn,o3,g3;
function begin(){if(started)return;started=true;document.getElementById('start').style.display='none';
  try{AC=new(window.AudioContext||window.webkitAudioContext)();o1=AC.createOscillator();o2=AC.createOscillator();o1.type='sawtooth';o2.type='square';
  fl=AC.createBiquadFilter();fl.type='lowpass';gn=AC.createGain();gn.gain.value=0;o1.connect(fl);o2.connect(fl);fl.connect(gn);gn.connect(AC.destination);o1.start();o2.start();o3=AC.createOscillator();o3.type='sawtooth';o3.frequency.value=900;g3=AC.createGain();g3.gain.value=0;o3.connect(g3);g3.connect(AC.destination);o3.start();}catch(e){}}
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();if(e.code==='KeyC'){ci=(ci+1)%colors.length;cars[cur].paint.color.setHex(colors[ci]);}if(/^(Digit|Numpad)[1-6]$/.test(e.code))setCar(+e.code.slice(-1)-1);if(e.code==='KeyR')reset();begin();});
addEventListener('keyup',e=>keys[e.code]=false);
document.getElementById('start').onclick=begin;
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

// 물리
const car={x:35,z:-30,h:0,v:0,u:0,ds:0,dts:0,si:0,pitch:0,roll:0,wa:0,rpm:.2};let camH=0;
function reset(){Object.assign(car,{x:35,z:-30,h:0,v:0,u:0,si:0});camH=0;}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function collide(){let hit=false;
  for(const o of[1.4,-1.4]){let px=car.x+Math.sin(car.h)*o,pz=car.z+Math.cos(car.h)*o;
    for(const b of boxes){const cx=clamp(px,b.x-b.w,b.x+b.w),cz=clamp(pz,b.z-b.d,b.z+b.d),dx=px-cx,dz=pz-cz,d=Math.hypot(dx,dz);
      if(d<1&&d>1e-4){const p=1-d;car.x+=dx/d*p;car.z+=dz/d*p;px+=dx/d*p;pz+=dz/d*p;hit=true;}}}
  return hit;}
const GEARS=[0,55,95,140,190,250],hspd=document.getElementById('spd'),hg=document.getElementById('gear'),hb=document.querySelector('#bar i');
function step(dt){
  const up=keys.KeyW||keys.ArrowUp,dn=keys.KeyS||keys.ArrowDown,lf=keys.KeyA||keys.ArrowLeft,rt=keys.KeyD||keys.ArrowRight,hbk=keys.Space;
  let a=0,brake=false;
  if(up){if(car.v<-.5){a=30;brake=true;}else a=cars[cur].acc;}
  else if(dn){if(car.v>.5){a=-30;brake=true;}else if(car.v>-14)a=-6;}
  if(hbk){a-=Math.sign(car.v)*4;brake=true;}
  a-=cars[cur].k*car.v*Math.abs(car.v)+Math.sign(car.v)*.8;
  const old=car.v;car.v+=a*dt;
  if((old>0&&car.v<0&&!dn)||(old<0&&car.v>0&&!up))car.v=0;
  if(!up&&!dn&&Math.abs(car.v)<.4)car.v=0;
  car.v=clamp(car.v,-14,cars[cur].top*1.05);
  const tgt=(lf?1:0)-(rt?1:0);car.si+=(tgt-car.si)*Math.min(1,dt*(tgt?6:9));
  const av=Math.abs(car.v),ms=.6/(1+av*.06),sp=Math.hypot(car.v,car.u),dr=!!hbk||(up&&sp>22&&Math.abs(car.si)>.55),lim=cars[cur].grip*(dr?2.2:1)/Math.max(sp,1);
  const yaw=clamp((car.v<-1?-sp:sp)*Math.tan(car.si*ms*(dr?1.5:1))/cars[cur].wb,-lim,lim);
