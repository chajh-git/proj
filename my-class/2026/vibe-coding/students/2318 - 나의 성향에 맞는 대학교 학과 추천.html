<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Malgun Gothic", Arial, sans-serif;
    background: linear-gradient(135deg, #eaf2ff, #f7f0ff);
    color: #222;
    min-height: 100vh;
}

.container {
    width: 92%;
    max-width: 900px;
    margin: 35px auto;
}

.card {
    background: white;
    border-radius: 25px;
    padding: 40px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);
}

/* 시작 화면 */

.start-screen {
    text-align: center;
}

.logo {
    font-size: 70px;
    margin-bottom: 10px;
}

h1 {
    color: #3157c7;
    line-height: 1.4;
}

.start-title {
    font-size: 34px;
}

.start-description {
    color: #666;
    line-height: 1.9;
    margin: 25px 0;
}

.start-button {
    border: none;
    background: #5575e8;
    color: white;
    padding: 17px 50px;
    border-radius: 15px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.start-button:hover {
    background: #405fc9;
}


/* 진행률 */

.progress-area {
    margin-bottom: 30px;
}

.progress-text {
    display: flex;
    justify-content: space-between;
    color: #666;
    font-size: 14px;
    margin-bottom: 8px;
}

.progress {
    width: 100%;
    height: 10px;
    background: #e5e5e5;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #5575e8;
    transition: width 0.3s;
}


/* 질문 */

.question-number {
    color: #5575e8;
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 10px;
}

.question {
    font-size: 28px;
    font-weight: bold;
    line-height: 1.5;
    margin-bottom: 12px;
}

.description {
    color: #777;
    margin-bottom: 18px;
    line-height: 1.6;
}

.guide {
    background: #eef2ff;
    color: #405fc9;
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 22px;
    font-size: 14px;
}


/* 선택지 */

.options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.option {
    border: 2px solid #ddd;
    background: white;
    border-radius: 14px;
    padding: 17px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    border-color: #5575e8;
    background: #f5f7ff;
}

.option.selected {
    background: #5575e8;
    color: white;
    border-color: #5575e8;
}


/* 버튼 */

.buttons {
    display: flex;
    gap: 15px;
    margin-top: 30px;
}

.main-button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.previous {
    background: #eee;
    color: #444;
}

.next {
    background: #5575e8;
    color: white;
}

.next:hover {
    background: #405fc9;
}

.error {
    text-align: center;
    color: #d33;
    font-weight: bold;
    margin-top: 15px;
}


/* 결과 */

.result-header {
    text-align: center;
    margin-bottom: 35px;
}

.result-header h1 {
    margin-bottom: 5px;
}

.result-header p {
    color: #777;
}


/* 성향 요약 */

.summary {
    background: #f5f7ff;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 30px;
}

.summary h2 {
    margin-top: 0;
    color: #405fc9;
}

.summary-item {
    margin: 8px 0;
    line-height: 1.6;
}


/* 추천 카드 */

.result-card {
    background: #fff;
    border: 2px solid #e1e6ff;
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 22px;
}

.rank {
    color: #5575e8;
    font-weight: bold;
    font-size: 14px;
}

.result-card h2 {
    margin: 8px 0 15px;
    font-size: 25px;
}

.result-card p {
    line-height: 1.75;
    color: #555;
}

.tags {
    margin: 10px 0 20px;
}

.tag {
    display: inline-block;
    background: #e9edff;
    color: #405fc9;
    border-radius: 20px;
    padding: 7px 12px;
    margin: 4px;
    font-size: 13px;
    font-weight: bold;
}

.ai-low {
    background: #e5f7e9;
    color: #28783a;
}

.ai-medium {
    background: #fff4d8;
    color: #967000;
}

.ai-high {
    background: #ffe7e7;
    color: #a93636;
}

.section {
    margin-top: 22px;
}

.section-title {
    font-size: 18px;
    font-weight: bold;
    color: #333;
    margin-bottom: 8px;
}

.job-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.job {
    background: #f1f1f1;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
}


/* 다시 시작 */

.restart {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 17px;
    background: #5575e8;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.restart:hover {
    background: #405fc9;
}

.hidden {
    display: none;
}


/* 모바일 */

@media (max-width: 650px) {

    .card {
        padding: 25px;
    }

    .start-title {
        font-size: 27px;
    }

    .question {
        font-size: 22px;
    }

    .options {
        grid-template-columns: 1fr;
    }

    .buttons {
        flex-direction: column;
    }
}

</style>
</head>

let currentQuestion = 0;

    favorite: [],

    good: [],

/* =====================================
   시작
===================================== */

function startQuiz() {

    document
        .getElementById("startScreen")
        .classList.add("hidden");

    document
        .getElementById("quizScreen")
        .classList.remove("hidden");

    currentQuestion = 0;

    showQuestion();
}



/* =====================================
   질문 표시
===================================== */

function showQuestion() {

    const q = questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        `질문 ${currentQuestion + 1} / ${questions.length}`;


    document
        .getElementById("question")
        .textContent =
        q.question;


    document
        .getElementById("description")
        .textContent =
        q.description;


    /* 안내 */

    const guide =
        document.getElementById("guide");


    if (q.multiple) {

        guide.textContent =
            "☑ 여러 개 선택할 수 있습니다. 선택한 항목을 다시 누르면 취소됩니다.";

    } else {

        guide.textContent =
            "☑ 하나만 선택해주세요.";

    }


    /* 진행률 */

    const percent =
        Math.round(
            ((currentQuestion + 1) / questions.length) * 100
        );


    document
        .getElementById("progressBar")
        .style.width =
        percent + "%";


    document
        .getElementById("progressText")
        .textContent =
        `질문 ${currentQuestion + 1} / ${questions.length}`;


    document
        .getElementById("progressPercent")
        .textContent =
        percent + "%";


    /* 선택지 */

    const options =
        document.getElementById("options");

    options.innerHTML = "";


    document
        .getElementById("error")
        .textContent = "";


    q.options.forEach(option => {

        const button =
            document.createElement("button");


        button.className =
            "option";


        button.textContent =
            option;


        /* 선택 여부 */

        if (q.multiple) {

            if (
                answers[q.type].includes(option)
            ) {

                button.classList.add("selected");

            }

        } else {

            if (
                answers[q.type] === option
            ) {

                button.classList.add("selected");

            }

        }


        /* 클릭 */

        button.onclick = function() {

            /* 여러 개 */

            if (q.multiple) {

                if (
                    answers[q.type].includes(option)
                ) {

                    const index =
                        answers[q.type].indexOf(option);

                    answers[q.type].splice(index, 1);

                    button.classList.remove("selected");

                } else {

                    answers[q.type].push(option);

                    button.classList.add("selected");

                }

            }


            /* 하나 */

            else {

                answers[q.type] =
                    option;


                document
                    .querySelectorAll(".option")
                    .forEach(btn => {

                        btn.classList.remove("selected");

                    });


                button.classList.add("selected");

            }


            document
                .getElementById("error")
                .textContent = "";

        };


        options.appendChild(button);

    });


    /* 이전 버튼 */

    const previous =
        document.getElementById("previousButton");


    if (currentQuestion === 0) {

        previous.style.visibility =
            "hidden";

    } else {

        previous.style.visibility =
            "visible";

    }


    /* 다음 버튼 */

    const next =
        document.getElementById("nextButton");


    if (
        currentQuestion ===
        questions.length - 1
    ) {

        next.textContent =
            "🎉 결과 보기";

    } else {

        next.textContent =
            "다음 →";

    }

}



/* =====================================
   다음
===================================== */

function nextQuestion() {

    const q =
        questions[currentQuestion];


    /* 여러 개 질문 */

    if (q.multiple) {

        if (
            answers[q.type].length === 0
        ) {

            document
                .getElementById("error")
                .textContent =
                "최소 1개 이상의 답변을 선택해주세요.";

            return;

        }

    }


    /* 하나 질문 */

    else {

        if (!answers[q.type]) {

            document
                .getElementById("error")
                .textContent =
                "답변을 선택해주세요.";

            return;

        }

    }


    /* 마지막 */

    if (
        currentQuestion ===
        questions.length - 1
    ) {

        showResults();

        return;

    }


    currentQuestion++;

    showQuestion();

}



/* =====================================
   이전
===================================== */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        showQuestion();

    }

}

            if (
                department.keywords
                    .includes(subject)
            ) {

                score += 5;

            }

        });


        /* 싫어하는 과목 */

        answers.dislike.forEach(subject => {

            if (
                department.keywords
                    .includes(subject)
            ) {

                score -= 2;

            }

        });


        /* 어려운 과목 */

        answers.bad.forEach(subject => {

            if (
                department.keywords
                    .includes(subject)
            ) {

                score -= 2;

            }

        });


        /* 희망 직업 */

        if (
            department.keywords
                .includes(answers.job)
        ) {

            score += 7;

        }


        /* MBTI */

        if (
            department.mbti
                .includes(answers.mbti)
        ) {

            score += 3;

        }


        /* 협업 방식 */

        if (
            department.work === answers.work
        ) {

            score += 2;

        }


        if (score < 0) {

            score = 0;

        }


        scores.push({

            department: department,

            score: score

        });

    });


    /* 점수 높은 순 */

    scores.sort(
        (a, b) =>
        b.score - a.score
    );


    return scores.slice(0, 3);

}



/* =====================================
   결과
===================================== */

function showResults() {

    document
        .getElementById("quizScreen")
        .classList.add("hidden");


    document
        .getElementById("resultScreen")
        .classList.remove("hidden");


    /* 성향 요약 */

    const summary =
        document.getElementById("summaryContent");


    summary.innerHTML = `

        <div class="summary-item">
            <strong>❤️ 좋아하는 과목:</strong>
            ${answers.favorite.join(", ")}
        </div>

        <div class="summary-item">
            <strong>❌ 싫어하는 과목:</strong>
            ${answers.dislike.join(", ")}
        </div>

        <div class="summary-item">
            <strong>⭐ 잘하는 과목:</strong>
            ${answers.good.join(", ")}
        </div>

        <div class="summary-item">
            <strong>📚 어려워하는 과목:</strong>
            ${answers.bad.join(", ")}
        </div>

        <div class="summary-item">
            <strong>👥 일하는 방식:</strong>
            ${answers.work}
        </div>

        <div class="summary-item">
            <strong>🧠 MBTI:</strong>
            ${answers.mbti}
        </div>

        <div class="summary-item">
            <strong>🎯 희망 직업:</strong>
            ${answers.job}
        </div>

    `;


    /* 추천 */

    const topDepartments =
        calculateScores();


    const results =
        document.getElementById("results");


    results.innerHTML = "";


    topDepartments.forEach(
        (item, index) => {

            const department =
                item.department;


            let aiClass =
                "";


            if (
                department.ai === "낮음"
            ) {

                aiClass =
                    "ai-low";

            } else if (
                department.ai === "중간"
            ) {

                aiClass =
                    "ai-medium";

            } else {

                aiClass =
                    "ai-high";

            }


            const card =
                document.createElement("div");


            card.className =
                "result-card";


            /* 직업 목록 */

            let jobsHTML = "";


            department.jobs.forEach(job => {

                jobsHTML +=
                    `<span class="job">${job}</span>`;

            });


            card.innerHTML = `

                <div class="rank">
                    ${index + 1}위 추천 학과
                </div>


                <h2>
                    ${department.name}
                </h2>


                <div class="tags">

                    <span class="tag">
                        추천 점수 ${item.score}점
                    </span>

                    <span class="tag ${aiClass}">
                        🤖 AI 영향: ${department.ai}
                    </span>

                </div>


                <div class="section">

                    <div class="section-title">
                        📚 학과 설명
                    </div>

                    <p>
                        ${department.description}
                    </p>

                </div>


                <div class="section">

                    <div class="section-title">
                        💡 추천 이유
                    </div>

                    <p>
                        ${department.reason}
                    </p>

                </div>


                <div class="section">

                    <div class="section-title">
                        💼 이 학과를 졸업하면?
                    </div>

                    <div class="job-list">

                        ${jobsHTML}

                    </div>

                </div>


                <div class="section">

                    <div class="section-title">
                        🤖 AI가 영향을 줄 수 있는 분야
                    </div>

                    <p>
                        ${department.aiWork}
                    </p>

                </div>


                <div class="section">

                    <div class="section-title">
                        👤 사람이 중요한 분야
                    </div>

                    <p>
                        ${department.humanWork}
                    </p>

                </div>

            `;


            results.appendChild(card);

        }
    );


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}



/* =====================================
   다시 검사
===================================== */

function restartQuiz() {

    currentQuestion = 0;


    answers = {

        favorite: [],

        dislike: [],

        good: [],

        bad: [],

        work: null,

        mbti: null,

        job: null

    };


    document
        .getElementById("resultScreen")
        .classList.add("hidden");


    document
        .getElementById("quizScreen")
        .classList.remove("hidden");


    showQuestion();


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}
