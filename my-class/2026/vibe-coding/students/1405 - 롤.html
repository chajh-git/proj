.xp i{background:linear-gradient(#e6c35a,#b8902a)}

#timer{font-size:16px;opacity:.9}

#roundlbl{font-size:12px;opacity:.7;letter-spacing:2px}
#bottom{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}

.skill .n{font-size:11px;margin-top:10px;text-align:center;line-height:1.2;padding:0 2px}

.skill .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;text-shadow:0 0 4px #000}
.skill.nomana{border-color:#3b6bd6}

function particleUpd(f, k, dt) {
  const p = f.mesh.position;
  p.x += f.vx * dt; p.y += f.vy * dt; p.z += f.vz * dt; f.vy -= 9 * dt;
  f.mesh.scale.setScalar(Math.max(0.001, f.size * (1 - k)));
}
function burst(x, y, z, color, n = 8, spd = 4, life = 0.5, size = 0.18) {
  if (G.fx.length > 500) return;
  const m = bas(color);
  for (let i = 0; i < n; i++) {
    const mesh = new THREE.Mesh(gBox, m); mesh.position.set(x, y, z); mesh.scale.setScalar(size); scene.add(mesh);
    const a = rand(0, 6.283), e = rand(-0.2, 1), sp = rand(0.4, 1) * spd;
    G.fx.push({ mesh, life: life * rand(0.6, 1), max: life, vx: Math.cos(a) * sp, vy: Math.abs(e) * sp + 1, vz: Math.sin(a) * sp, size, upd: particleUpd });
  }
}
function ringFx(u, v, r0, r1, color, life, y = 0.06) {
  const mat = ownMat(color, 0.9);
  const mesh = new THREE.Mesh(gRing, mat); mesh.position.set(u - CX, y, v); mesh.scale.set(r0, 1, r0); scene.add(mesh);
  G.fx.push({ mesh, life, max: life, upd: (f, k) => { const r = r0 + (r1 - r0) * k; f.mesh.scale.set(r, 1, r); mat.opacity = 0.9 * (1 - k); } });
}
function bolt(a, b, color, life) {
  const g = new THREE.Group(), m = ownMat(color, 1);
  const pts = [a.clone()], dir = b.clone().sub(a), n = 6;
  for (let i = 1; i < n; i++) {
    const p = a.clone().addScaledVector(dir, i / n);
    p.x += rand(-0.35, 0.35); p.y += rand(-0.35, 0.35); p.z += rand(-0.35, 0.35); pts.push(p);
  }
  pts.push(b.clone());
  for (let i = 0; i < pts.length - 1; i++) {
    const s = pts[i], e = pts[i + 1], d = e.clone().sub(s), len = d.length();
    const seg = new THREE.Mesh(gCyl, m);
    seg.position.copy(s).addScaledVector(d, 0.5);
    seg.quaternion.setFromUnitVectors(UP, d.normalize());
    seg.scale.set(0.09, len, 0.09); g.add(seg);
  }

}
function updateFx(dt) {
  for (const f of G.fx) {
    f.life -= dt;
    f.upd(f, clamp(1 - f.life / f.max, 0, 1), dt);
    if (f.life <= 0) { scene.remove(f.mesh); disposeOwn(f.mesh); f.done = true; }
  }
  G.fx = G.fx.filter(f => !f.done);
}

}

function baseUnit(kind, team, u, v, radius, maxHp) {
  return {
    id: G.nextId++, kind, team, u, v, pu: u, pv: v, vu: 0, vv: 0, face: team === 0 ? 0 : Math.PI,
    radius, hp: maxHp, maxHp, dead: false, slow: null, haste: null, shield: null, stunUntil: 0, flash: 0,
    mesh: null, attackTarget: null, moveTarget: null, soft: false, nextAtk: 0, baseMs: 3.4,

}
function computeStats(c, init) {
  const l = c.level, old = c.maxHp || 0, st = c.def.stats;
  c.maxHp = st.hp + st.hpLv * (l - 1); c.maxMana = st.mana + 35 * (l - 1);
  c.power = 1 + 0.14 * (l - 1); c.ad = st.ad + 5 * (l - 1); c.as = st.as + 0.03 * (l - 1);
  if (!init) { c.hp += c.maxHp - old; c.mana = Math.min(c.maxMana, c.mana + 35); }
}
function makeChamp(key, team) {

    nextThink: 0.5, dodgeUntil: 0, retreating: false, strafeUntil: 0, nextStrafe: 1, strafeDir: 1, laneV: 0, nextLane: 0,

/* =====================================================================
   전투 공통
   ===================================================================== */
function dealDamage(t, amt, src, silent) {
  if (t.dead || amt <= 0) return;
  const raw = amt;
  if (t.shield && t.shield.amt > 0) { const a = Math.min(t.shield.amt, amt); t.shield.amt -= a; amt -= a; }
  t.hp -= amt;
  t.flash = 0.12;
  if (src && src.kind === 'champ' && t.kind === 'champ') src.aggroUntil = G.t + 2.5;
  if (!silent && raw >= 4) {
    const isP = t.kind === 'champ' && t.team === 0;
    addText(t.u + rand(-0.3, 0.3), t.v + rand(-0.3, 0.3), String(Math.round(raw)),
      amt <= 0 ? '#9fd8ff' : isP ? '#ff6b6b' : t.kind === 'champ' ? '#ffe45c' : '#ffffff', t.kind === 'champ' ? 20 : 13,
      t.kind === 'champ' ? 3.2 : t.kind === 'tower' ? 5.5 : 2.2);
  }
  if (t.hp <= 0) kill(t, src);
}
function kill(t) {
  t.dead = true; t.hp = 0;
  if (t.kind === 'champ') {
    burst(t.u - CX, 1.2, t.v, TEAM_COL[t.team], 28, 7, 0.9, 0.25);
    endRound(1 - t.team);
  } else if (t.kind === 'minion') {
    giveXp(t);
    burst(t.u - CX, 0.8, t.v, TEAM_COL[t.team], 10, 3.5, 0.5, 0.16);
  } else {
    burst(t.u - CX, 3, t.v, TEAM_COL[t.team], 40, 8, 1.0, 0.35);
    ringFx(t.u, t.v, 1, 7, 0xffffff, 0.6); G.shake = 0.5;
  }
}
function giveXp(m) {
  for (const c of G.units) {
    if (c.kind !== 'champ' || c.dead || c.team === m.team) continue;
    if (dist(c, m) < 14) addXp(c, m.xp);
  }
}
function addXp(c, n) {
  c.xp += n;
  while (c.level < MAX_LVL && c.xp >= XP_NEXT[c.level - 1]) {
    c.level++; computeStats(c);
    addText(c.u, c.v, 'LEVEL UP!', '#ffd96a', 20, 4);
    ringFx(c.u, c.v, 0.5, 3, 0xffd96a, 0.6);
  }
}
function applySlow(t, pct, dur) {
  const e = G.t + dur;
  if (!t.slow || G.t >= t.slow.until || pct > t.slow.pct) t.slow = { pct, until: e };
  else if (pct === t.slow.pct) t.slow.until = Math.max(t.slow.until, e);
}
function getSpeed(u) {
  let s = u.baseMs;
  if (u.haste && G.t < u.haste.until) s *= 1 + u.haste.pct;
  if (u.slow && G.t < u.slow.until) s *= 1 - u.slow.pct;
  return s;
}
function moveToward(u, tx, tz, dt, stop = 0.05) {
  const dx = tx - u.u, dz = tz - u.v, d = Math.hypot(dx, dz);
  if (d <= stop || d < 1e-4) return true;
  const step = Math.min(getSpeed(u) * dt, d - stop > 0 ? d - stop : d);
  u.u += dx / d * step; u.v += dz / d * step;
  u.face = Math.atan2(dz, dx);
  u.u = clamp(u.u, -1.5, L + 1.5); u.v = clamp(u.v, -HALF, HALF);
  return d - step <= stop + 1e-3;
}

/* ---------- 투사체 ---------- */
function spawnHoming(src, target, dmg, speed, color, size, big) {
  const mesh = new THREE.Mesh(gSphere, bas(color)); mesh.scale.setScalar(size); scene.add(mesh);
  G.projs.push({ kind: 'homing', team: src.team, src, target, dmg, speed, color, u: src.u + Math.cos(src.face) * 0.6, v: src.v + Math.sin(src.face) * 0.6, y: 1.7, mesh, born: G.t, big });
}
function doAttack(u, tg) {
  const t = G.t;
  const as = u.as * (u.asBuff && t < u.asBuff.until ? u.asBuff.mul : 1);
  u.nextAtk = t + 1 / as;
  u.face = Math.atan2(tg.v - u.v, tg.u - u.u);
  u.stealthUntil = 0;                                   // 공격하면 은신 해제
  let dmg = u.ad, color = u.def.orb, size = 0.28, big = false;
  if (u.empowerUntil > t) { dmg += 55 * u.power; u.empowerUntil = 0; color = 0xffffff; size = 0.45; big = true; }
  const melee = u.def.stats.range < 4;
  spawnHoming(u, tg, dmg, melee ? 34 : 17, color, melee ? size * 0.8 : size, big);
}
function fireShot(u, s, aim) {
  let dx = aim.u - u.u, dz = aim.v - u.v, d = Math.hypot(dx, dz);
  if (d < 0.01) { dx = Math.cos(u.face); dz = Math.sin(u.face); d = 1; }
  dx /= d; dz /= d; u.face = Math.atan2(dz, dx);
  let mesh;
  if (s.type === 'lance' || s.type === 'arrow' || s.type === 'bigarrow') {
    const big = s.type === 'bigarrow';
    mesh = new THREE.Mesh(new THREE.ConeGeometry(big ? 0.5 : s.type === 'arrow' ? 0.18 : 0.35, big ? 2.6 : 1.8, 6), bas(s.color));
    mesh.quaternion.setFromUnitVectors(UP, new THREE.Vector3(dx, 0, dz));
  } else {
    mesh = new THREE.Mesh(gSphere, bas(s.color)); mesh.scale.setScalar(0.5);
  }
  scene.add(mesh);
  G.projs.push({
    kind: 'shot', team: u.team, src: u, s, u: u.u + dx * 0.8, v: u.v + dz * 0.8, y: 1.4, dx, dz,
    speed: s.speed, left: s.range, r: s.radius, dmg: s.dmg * u.power, pierce: !!s.pierce, hit: new Set(), mesh, born: G.t,
  });
}
function chainBounce(src, s, first, dmg) {
  const hit = new Set([first.id]); let from = first;
  for (let i = 0; i < s.bounces; i++) {
    let best = null, bd = s.bounceR;
    for (const e of G.units) {
      if (e.dead || e.team === src.team || e.kind === 'tower' || hit.has(e.id)) continue;
      const d = dist(from, e); if (d < bd) { bd = d; best = e; }
    }
    if (!best) break;
    hit.add(best.id);
    bolt(w(from, 1.3), w(best, 1.3), s.color, 0.28);
    dealDamage(best, dmg * s.bounceMul, src);
    burst(best.u - CX, 1.3, best.v, s.color, 6, 3, 0.4);
    from = best;
  }
}
function shotHit(p, e) {
  const s = p.s;
  dealDamage(e, p.dmg, p.src);
  burst(e.u - CX, 1.3, e.v, s.color, 8, 3.5, 0.4);
  if (s.type === 'chain') chainBounce(p.src, s, e, p.dmg);
  else if (s.type === 'lance') applySlow(e, s.slow, s.slowDur);
  else if (s.type === 'bigarrow') { e.stunUntil = Math.max(e.stunUntil, G.t + (s.stun || 0)); G.shake = Math.max(G.shake, 0.25); }
  else if (s.type === 'hook') {                       // 갈고리: 시전자 앞으로 끌어당긴다
    const src = p.src, dx = e.u - src.u, dz = e.v - src.v, d = Math.hypot(dx, dz) || 1, keep = src.radius + e.radius + 1.2;
    if (d > keep) { e.u = clamp(src.u + dx / d * keep, -1.5, L + 1.5); e.v = clamp(src.v + dz / d * keep, -HALF, HALF); e.pu = e.u; e.pv = e.v; }
    e.stunUntil = Math.max(e.stunUntil, G.t + (s.stun || 0));
    bolt(w(src, 1.3), w(e, 1.3), s.color, 0.3);
  }
}
function updateProjs(dt) {
  for (const p of G.projs) {
    if (p.dead) continue;
    if (p.kind === 'homing') {
      const tg = p.target;
      if (tg.dead) { p.dead = true; continue; }
      const dx = tg.u - p.u, dz = tg.v - p.v, d = Math.hypot(dx, dz), st = p.speed * dt;
      if (d <= st + tg.radius * 0.6) {
        dealDamage(tg, p.dmg, p.src);
        burst(tg.u - CX, 1.5, tg.v, p.color, p.big ? 14 : 5, 3, 0.35);
        p.dead = true;
      } else { p.u += dx / d * st; p.v += dz / d * st; }
    } else {
      const mv = p.speed * dt, n = Math.max(1, Math.ceil(mv / 0.4)), sd = mv / n;
      for (let i = 0; i < n && !p.dead; i++) {
        p.u += p.dx * sd; p.v += p.dz * sd; p.left -= sd;
        for (const e of G.units) {
          if (e.dead || e.team === p.team || e.kind === 'tower' || p.hit.has(e.id)) continue;
          if (Math.hypot(e.u - p.u, e.v - p.v) < p.r + e.radius) {
            p.hit.add(e.id); shotHit(p, e);
            if (!p.pierce) { p.dead = true; break; }
          }
        }
        if (p.left <= 0) p.dead = true;
      }
      if (Math.random() < 0.7) burst(p.u - CX, p.y, p.v, p.s.color, 1, 0.8, 0.25, 0.14);
    }
    p.mesh.position.set(p.u - CX, p.y, p.v);
  }
  for (const p of G.projs) if (p.dead) { scene.remove(p.mesh); }
  G.projs = G.projs.filter(p => !p.dead);
}

/* ---------- 범위기 / 장판 ---------- */
function addAoe(o) {
  const g = new THREE.Group();
  const ring = new THREE.Mesh(gRing, ownMat(o.color, 0.9)); ring.scale.set(o.radius, 1, o.radius); g.add(ring);

    } else if (ty === 'nova') { if (!retreat || dP < 3) { if (dP < s.radius - 0.4) { cast(b, i, b); return; } } }
    else if (ty === 'strike') { if (dP < s.range - 1) { cast(b, i, leadAim(b, p, 99)); return; } }
    else if (ty === 'zone') { if (dP < s.range - 0.5 && dP > 2.5) { cast(b, i, leadAim(b, p, 99)); return; } }
    else if (ty === 'dash') { if (!retreat && dP > 2.2 && dP < s.range - 0.3) { cast(b, i, { u: p.u, v: p.v }); return; } }
    else if (ty === 'summon') { if (!retreat && dP < 14) { cast(b, i, b); return; } }
    else if (ty === 'shield' || ty === 'buff') { if (dP < 9 && (retreat || hpR < 0.85 || melee)) { cast(b, i, b); return; } }
    else if (ty === 'stealth') { if (retreat ? dP < 8 : (dP > 6 && dP < 13)) { cast(b, i, b); return; } }
    else if (ty === 'blink') {
      if (retreat) { if (dP < 6) { cast(b, i, { u: b.u + 6, v: b.v + rand(-2, 2) }); return; } }
      else if (melee) { if (dP > 7.5 && dP < 14 && !inEnemyTowerRange(b, p)) { cast(b, i, { u: p.u, v: p.v }); return; } }

function botThink(b) {
  const t = G.t, p = G.player;
  if (b.dead || !p || p.dead || G.state !== 'play') return;
  b.soft = true;
  const dP = Math.max(0.01, dist(b, p)), hpR = b.hp / b.maxHp;
  const seen = visible(p) || dP < 3.5;                               // 은신한 플레이어는 가까이 오기 전엔 보지 못한다
  const dirx = (b.u - p.u) / dP, dirz = (b.v - p.v) / dP;     // 플레이어 → 봇 방향

  // 1) 스킬 회피 (반응 지연 0.22초 + 55% 확률)
  if (t >= b.dodgeUntil) {
    for (const pr of G.projs) {
      if (pr.kind !== 'shot' || pr.team === b.team || t - pr.born < 0.22) continue;
      const rx = b.u - pr.u, rz = b.v - pr.v, along = rx * pr.dx + rz * pr.dz;
      if (along < 0 || along > pr.left) continue;
      const cross = rx * pr.dz - rz * pr.dx, need = pr.r + b.radius + 0.35;
      if (Math.abs(cross) < need && along / pr.speed < 0.9) {
        if (pr.roll === undefined) pr.roll = Math.random() < 0.55;
        if (pr.roll) {
          const sg = Math.abs(cross) < 0.05 ? (Math.random() < 0.5 ? 1 : -1) : Math.sign(cross);
          const amt = need - Math.abs(cross) + 1.0;
          setDodge(b, b.u + pr.dz * sg * amt, b.v - pr.dx * sg * amt, 0.5); break;
        }
      }
    }
  }
  if (t >= b.dodgeUntil) {
    for (const a of G.aoes) {
      if (a.team === b.team || t - a.born < 0.25) continue;
      const d = Math.hypot(b.u - a.u, b.v - a.v);
      if (d < a.radius + 0.2) {
        if (a.roll === undefined) a.roll = Math.random() < 0.7;
        if (a.roll) {
          let dx = b.u - a.u, dz = b.v - a.v; const dd = Math.hypot(dx, dz);
          if (dd < 0.01) { dx = 1; dz = 0; } else { dx /= dd; dz /= dd; }
          const out = { u: a.u + dx * (a.radius + 1.4), v: a.v + dz * (a.radius + 1.4) };
          const bi = b.def.skills.findIndex(s => s.type === 'blink');
          if (a.at - t < 0.4 && bi >= 0 && canCast(b, bi)) cast(b, bi, out);
          setDodge(b, out.u, out.v, 0.7); break;
        }
      }
    }
  }
  if (t < b.dodgeUntil) return;

  // 2) 후퇴 (체력 32% 미만 → 80% 이상이 될 때까지 기지에서 회복)

    return;
  }

  // 3) 타워 사거리 안이면 벗어난다
  const tw = inEnemyTowerRange(b, b);
  if (tw) {
    const dx = b.u - tw.u, dz = b.v - tw.v, d = Math.hypot(dx, dz) || 1;
    b.attackTarget = null;
    b.moveTarget = { u: tw.u + dx / d * (TOWER_RANGE + 2), v: tw.v + dz / d * (TOWER_RANGE + 2) };
    return;
  }

  // 4) 교전 (카이팅 + 스킬)
  if (dP < 15 && seen) {
    botCasts(b, p, dP, hpR, dirx, dirz, false);
    if (b.def.ai === 'melee') {                                  // 근접: 타워 밖이면 끝까지 추격
      if (inEnemyTowerRange(b, p)) { b.attackTarget = null; b.moveTarget = null; return; }
      b.soft = false; b.moveTarget = null; b.attackTarget = p; return;
    }
    if (t >= b.nextStrafe) { b.strafeUntil = t + rand(0.4, 0.8); b.nextStrafe = t + rand(1.4, 2.4); b.strafeDir = Math.random() < 0.5 ? 1 : -1; }
    const ready = canCast(b, 0) || canCast(b, 1);
    let qr = 0; for (const s of b.def.skills) if (s.speed) qr = Math.max(qr, s.range);
    const want = ready ? Math.max(b.range + 1.7, qr * 0.6) : Math.max(4, b.range - 0.5);
    let mt = null, at = null;
    if (dP < want - 1.3) mt = { u: b.u + dirx * 3, v: b.v + dirz * 3 };
    else if (dP > want + 1.2) mt = { u: p.u + dirx * want, v: p.v + dirz * want };
    else if (t < b.strafeUntil) mt = { u: b.u - dirz * b.strafeDir * 2.2, v: b.v + dirx * b.strafeDir * 2.2 };
    else if (dP <= b.range + p.radius + 0.2) at = p;
    if (mt && inEnemyTowerRange(b, mt)) mt = null;
    if (mt) { b.moveTarget = mt; b.attackTarget = null; }
    else { b.moveTarget = null; b.attackTarget = at; }
    return;
  }

  // 5) 파밍 / 대기
  let tgt = null, bd = b.range + 1.0;
  for (const e of G.units) {
    if (e.dead || e.team === b.team || e.kind !== 'minion') continue;
    const d = dist(b, e); if (d < bd) { bd = d; tgt = e; }
  }
  if (tgt) { b.attackTarget = tgt; b.moveTarget = null; return; }
  if (t > b.nextLane) { b.laneV = rand(-2.5, 2.5); b.nextLane = t + 4; }
  let standU = L - 18, fm = null;
  for (const m of G.units) if (m.kind === 'minion' && !m.dead && m.team === b.team && (!fm || m.u < fm.u)) fm = m;
  if (fm) standU = fm.u + 3.0;
  for (const e of G.units) if (e.kind === 'tower' && !e.dead && e.team !== b.team) standU = Math.max(standU, e.u + TOWER_RANGE + 1.2);
  standU = Math.min(standU, L - 8);
  const stand = { u: standU, v: b.laneV };

  b.moveTarget = dist(b, stand) > 1.5 ? stand : null;
}

/* =====================================================================
   라운드 / 매치 흐름
   ===================================================================== */
let msgToken = 0;
function showMsg(html, ms) {
  const el = $('msg');
  if (el.innerHTML !== html) el.innerHTML = html;
  el.style.display = 'block';
  if (ms) { const tk = ++msgToken; setTimeout(() => { if (tk === msgToken) el.style.display = 'none'; }, ms); }
  else msgToken++;
}
function hideMsg() { msgToken++; $('msg').style.display = 'none'; }

function clearWorldObjects() {
  for (const u of G.units) { scene.remove(u.mesh); disposeOwn(u.mesh); }
  for (const p of G.projs) scene.remove(p.mesh);
  for (const a of G.aoes) { scene.remove(a.mesh); disposeOwn(a.mesh); }
  for (const z of G.zones) { scene.remove(z.mesh); disposeOwn(z.mesh); }
  for (const f of G.fx) { scene.remove(f.mesh); disposeOwn(f.mesh); }
  G.units = []; G.projs = []; G.aoes = []; G.zones = []; G.fx = []; G.texts = []; G.spawnQ = [];
}
function resetRound() {
  clearWorldObjects();
  G.player = makeChamp(G.picks.me, 0);
  G.bot = makeChamp(G.foeKey, 1);
  makeTower(0, 9); makeTower(0, 18); makeTower(1, L - 9); makeTower(1, L - 18);
  G.t = 0; G.roundT = 0; G.nextWaveT = 6; G.stateT = 0; G.timeScale = 1;
  G.state = 'countdown';
}
function resolveFoe() {
  G.foeKey = G.picks.foe === 'random' ? ROSTER[Math.floor(Math.random() * ROSTER.length)] : G.picks.foe;
}
function startMatch() {
  G.score = [0, 0]; G.round = 1; G.lastWinner = -1;
  $('overlay').style.display = 'none';
  resolveFoe();
  hideMsg(); resetRound();
  buildSkillHud(G.player.def);
  $('pn').textContent = G.player.def.name + ' (나)'; $('bn').textContent = G.bot.def.name + ' (봇)';
  camCenter.x = clamp(G.player.u - CX, -CX + 8, CX - 8); camCenter.z = 0;
}
function endRound(winner) {
  if (G.state !== 'play') return;
  G.state = 'roundEnd'; G.stateT = 0; G.timeScale = 0.25; G.lastWinner = winner;
  if (winner >= 0) G.score[winner]++;
  const done = G.score[0] >= 2 || G.score[1] >= 2;
  if (winner === 0) showMsg('라운드 승리!' + (done ? '' : '<small>다음 라운드 준비 중…</small>'));
  else if (winner === 1) showMsg('라운드 패배' + (done ? '' : '<small>다음 라운드 준비 중…</small>'));
  else showMsg('무승부<small>라운드를 다시 시작합니다</small>');
}
function timeUp() {
  const p = G.player, b = G.bot, a = p.hp / p.maxHp, c = b.hp / b.maxHp;
  endRound(Math.abs(a - c) < 0.001 ? -1 : a > c ? 0 : 1);
}
function finishMatch() {
  G.state = 'matchEnd'; hideMsg();
  const win = G.score[0] > G.score[1];
  $('card').innerHTML = `<h1>${win ? '🏆 매치 승리!' : '💀 매치 패배'}</h1><p>최종 스코어 ${G.score[0]} : ${G.score[1]}</p>
    <button id="again">챔피언 다시 선택</button>`;
  $('card').className = 'card';
  $('overlay').style.display = 'flex';
  $('again').onclick = showSelect;
}
function processWaves() {
  if (G.roundT >= G.nextWaveT) {
    G.nextWaveT += WAVE_INT;
    for (let i = 0; i < 4; i++) for (const team of [0, 1]) G.spawnQ.push({ at: G.roundT + i * 0.8, type: i < 3 ? 'melee' : 'ranged', team });
  }
  while (G.spawnQ.length && G.spawnQ[0].at <= G.roundT) { const s = G.spawnQ.shift(); spawnMinion(s.type, s.team); }
}

function simulate(dt) {
  G.t += dt;
  if (G.state === 'play') {
    G.roundT += dt; processWaves();
    if (G.bot && G.t >= G.bot.nextThink) { G.bot.nextThink = G.t + 0.2; botThink(G.bot); }
  }
  for (const u of G.units.slice()) {
    if (u.dead && u.kind !== 'champ') continue;
    if (u.kind === 'champ') updateChamp(u, dt);
    else if (u.kind === 'minion') updateMinion(u, dt);
    else updateTower(u, dt);
  }
  separateMinions();
  // 속도 추적 (예측 사격용)
  for (const u of G.units) {
    if (u.kind !== 'champ' || dt <= 0) continue;
    u.vu += ((u.u - u.pu) / dt - u.vu) * 0.5; u.vv += ((u.v - u.pv) / dt - u.vv) * 0.5; u.pu = u.u; u.pv = u.v;
  }
  updateProjs(dt); updateAoes(); updateZones(dt);
  for (const tx of G.texts) tx.life -= dt;
  G.texts = G.texts.filter(tx => tx.life > 0);
  G.units = G.units.filter(u => {
    if (u.dead && u.kind !== 'champ') { scene.remove(u.mesh); disposeOwn(u.mesh); return false; }
    return true;
  });
  if (G.state === 'play' && G.roundT >= ROUND_TIME) timeUp();
}

const mouse = { ndc: new THREE.Vector2(), ground: { u: CX, v: 0 }, rightHeld: false };
const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitV = new THREE.Vector3();
function updateMouse(e) {
  mouse.last = { clientX: e.clientX, clientY: e.clientY }; mouse.has = true;
  mouse.ndc.set((e.clientX / W) * 2 - 1, -(e.clientY / H) * 2 + 1);

}

  let best = null, bd = 1e9;

    if (e.dead || e.team === 0 || !visible(e)) continue;
    const d = Math.hypot(e.u - p.u, e.v - p.v);
    if (d < e.radius + 0.9 && d < bd) { bd = d; best = e; }
  }

}
function rightClick(p) {
  const pl = G.player; if (!pl || pl.dead || G.state !== 'play') return;
  const e = pickEnemy(p);

window.addEventListener('contextmenu', e => e.preventDefault());

const _v = new THREE.Vector3();
function syncMeshes(dt) {
  const tm = performance.now() / 1000;
  for (const u of G.units) {
    const m = u.mesh; if (!m) continue;
    u.flash = Math.max(0, u.flash - dt);
    const f = 1 + u.flash * 1.2;
    m.position.set(u.u - CX, 0, u.v);
    m.rotation.y = -u.face;
    m.scale.setScalar(f);
    if (u.kind === 'champ') {
      const d = m.userData;
      if (u.dead) { m.rotation.z = Math.min(1.5, u.deadT * 3); m.position.y = -0.1; }
      else m.position.y = Math.sin(tm * 3 + u.id) * 0.08;
      const stl = !!(u.stealthUntil && G.t < u.stealthUntil);
      m.visible = !(stl && u.team === 1);                                  // 은신한 적은 보이지 않음
      d.shield.visible = stl || !!(u.shield && u.shield.amt > 0);
      d.shield.material.color.setHex(stl ? 0x8a5cff : 0x9fd8ff);
      d.stun.visible = !u.dead && G.t < u.stunUntil;
      d.stun.rotation.z = tm * 8;
      d.orb.scale.setScalar(1 + Math.sin(tm * 6) * 0.15);
    } else if (u.kind === 'tower') {
      u.mesh.userData.crystal.rotation.y = tm * 1.5;
      u.mesh.userData.crystal.position.y = 5.4 + Math.sin(tm * 2) * 0.12;
    } else if (u.swing > 0) { u.swing -= dt; m.position.x += Math.cos(u.face) * 0.25; m.position.z += Math.sin(u.face) * 0.25; }
  }
  if (G.rocks) for (const r of G.rocks) { r.rotation.y += dt * 0.1; r.rotation.x += dt * 0.05; }
}
function drawUI() {
  const c = uiCtx; c.clearRect(0, 0, W, H);
  for (const u of G.units) {
    if (u.dead) continue;
    if (u.team === 1 && u.stealthUntil && G.t < u.stealthUntil) continue;
    const y = u.kind === 'tower' ? 6.5 : u.kind === 'champ' ? 3.4 : 2.0;
    _v.set(u.u - CX, y, u.v).project(camera);
    const sx = (_v.x * 0.5 + 0.5) * W, sy = (-_v.y * 0.5 + 0.5) * H;
    const bw = u.kind === 'champ' ? 76 : u.kind === 'tower' ? 92 : 34, bh = u.kind === 'minion' ? 5 : 9;
    c.fillStyle = 'rgba(0,0,0,.7)'; c.fillRect(sx - bw / 2 - 1, sy - bh - 1, bw + 2, bh + 2);
    c.fillStyle = u.team === 0 ? '#3fd16a' : '#e04848';
    c.fillRect(sx - bw / 2, sy - bh, bw * clamp(u.hp / u.maxHp, 0, 1), bh);
    if (u.shield && u.shield.amt > 0) {

    }

    }

    c.font = `800 ${tx.size}px sans-serif`; c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,.85)';
    c.strokeText(tx.str, sx, sy); c.fillStyle = tx.color; c.fillText(tx.str, sx, sy);

/* ---------- 미니맵 (카메라와 같은 사선 투영으로 다리를 그린다) ---------- */
const MM = { w: 236, h: 176, pad: 12 };
const mmProj = (u, v) => [0.7071 * ((u - CX) + v), 0.7071 * Math.sin(PITCH) * ((u - CX) - v)];
const MM_SCALE = Math.min((MM.w - 24) / 47, (MM.h - 24) / 33.5);
function drawMinimap(c) {
  if (G.state === 'menu' || G.state === 'matchEnd') return;
  const x0 = MM.pad, y0 = H - MM.pad - MM.h, cx = x0 + MM.w / 2, cy = y0 + MM.h / 2;
  const P = (u, v) => { const q = mmProj(u, v); return [cx + q[0] * MM_SCALE, cy - q[1] * MM_SCALE]; };
  c.save();
  c.fillStyle = 'rgba(8,12,30,.82)'; c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 2;
  c.beginPath(); c.roundRect(x0, y0, MM.w, MM.h, 10); c.fill(); c.stroke(); c.clip();
  // 다리
  const a = P(0, -HALF), b = P(L, -HALF), d = P(L, HALF), e = P(0, HALF);
  c.fillStyle = '#4b5878'; c.beginPath(); c.moveTo(...a); c.lineTo(...b); c.lineTo(...d); c.lineTo(...e); c.closePath(); c.fill();
  c.strokeStyle = '#8d9bc2'; c.lineWidth = 1.5; c.stroke();
  for (const team of [0, 1]) {          // 기지
    const p = P(team === 0 ? 3 : L - 3, 0);
    c.fillStyle = team === 0 ? 'rgba(74,163,255,.35)' : 'rgba(255,90,90,.35)';
    c.beginPath(); c.arc(p[0], p[1], 13, 0, 6.283); c.fill();
  }
  // 현재 카메라 화면 영역
  const cc = mmProj(camCenter.x + CX, camCenter.z), vx = cx + cc[0] * MM_SCALE, vy = cy - cc[1] * MM_SCALE;
  c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.5;
  c.strokeRect(vx - camHalf.w * MM_SCALE, vy - camHalf.h * MM_SCALE, camHalf.w * 2 * MM_SCALE, camHalf.h * 2 * MM_SCALE);
  // 유닛
  for (const u of G.units) {
    if (u.dead) continue;
    if (u.stealthUntil && G.t < u.stealthUntil && u.team === 1) continue;     // 은신한 적은 표시하지 않는다
    const p = P(u.u, u.v), col = u.team === 0 ? '#4aa3ff' : '#ff5a5a';
    c.fillStyle = col;
    if (u.kind === 'tower') { c.fillRect(p[0] - 5, p[1] - 5, 10, 10); c.strokeStyle = '#fff'; c.lineWidth = 1; c.strokeRect(p[0] - 5, p[1] - 5, 10, 10); }
    else if (u.kind === 'champ') {
      c.beginPath(); c.arc(p[0], p[1], 6.5, 0, 6.283); c.fill();
      c.strokeStyle = u === G.player ? '#ffd96a' : '#fff'; c.lineWidth = u === G.player ? 3 : 1.5; c.stroke();
    } else { c.beginPath(); c.arc(p[0], p[1], 2.4, 0, 6.283); c.fill(); }
  }
  c.restore();
}

// HUD 초기 구성 (스킬 슬롯)
const skillEls = [];
function buildSkillHud(def) {
  const box = $('skills'); box.innerHTML = ''; skillEls.length = 0;
  def.skills.forEach(s => {
    const d = document.createElement('div'); d.className = 'skill';
    d.innerHTML = `<span class="k">${s.key}</span><span class="n">${s.name}</span><div class="cdov"></div><div class="cdt"></div>`;
    box.appendChild(d); skillEls.push({ d, ov: d.querySelector('.cdov'), tx: d.querySelector('.cdt') });
  });
}
function setBar(i, t, ratio, text) { $(i).style.width = (clamp(ratio, 0, 1) * 100) + '%'; if (t) $(t).textContent = text; }
function updateHud() {
  const p = G.player, b = G.bot; if (!p || !b) return;
  setBar('phb', 'pht', p.hp / p.maxHp, `${Math.ceil(p.hp)} / ${p.maxHp}`);
  setBar('bhb', 'bht', b.hp / b.maxHp, `${Math.ceil(b.hp)} / ${b.maxHp}`);
  $('pl').textContent = 'Lv' + p.level; $('bl').textContent = 'Lv' + b.level;
  setBar('hb', 'ht', p.hp / p.maxHp, `${Math.ceil(p.hp)} / ${p.maxHp}`);
  setBar('mb', 'mt', p.mana / p.maxMana, `${Math.floor(p.mana)} / ${p.maxMana}`);
  const lo = p.level <= 1 ? 0 : XP_NEXT[p.level - 2], hi = p.level >= MAX_LVL ? 1 : XP_NEXT[p.level - 1];
  setBar('xb', null, p.level >= MAX_LVL ? 1 : (p.xp - lo) / (hi - lo));
  p.def.skills.forEach((s, i) => {
    const e = skillEls[i], locked = p.level < (s.lvl || 1);
    e.d.classList.toggle('locked', locked);
    e.d.classList.toggle('nomana', !locked && p.mana < s.mana);
    if (locked) { e.ov.style.height = '100%'; e.tx.textContent = 'Lv' + s.lvl; e.tx.style.fontSize = '14px'; }
    else {
      e.tx.style.fontSize = '22px';
      e.ov.style.height = (p.cd[i] > 0 ? p.cd[i] / s.cd * 100 : 0) + '%';
      e.tx.textContent = p.cd[i] > 0 ? (p.cd[i] >= 1 ? Math.ceil(p.cd[i]) : p.cd[i].toFixed(1)) : '';
    }
  });
  $('score').textContent = `${G.score[0]} : ${G.score[1]}`;
  $('roundlbl').textContent = `ROUND ${G.round} · 3판 2선승`;
  const rem = Math.max(0, Math.ceil(ROUND_TIME - G.roundT)), tm = $('timer');
  tm.textContent = `${Math.floor(rem / 60)}:${String(rem % 60).padStart(2, '0')}`;
  tm.classList.toggle('warn', rem <= 30);
}

/* =====================================================================
   메인 루프
   ===================================================================== */
function step(rdt) {
  G.stateT += rdt;
  if (G.state === 'countdown') {
    if (G.stateT >= 3) { G.state = 'play'; G.stateT = 0; showMsg('시작!', 700); }
    else showMsg(String(Math.ceil(3 - G.stateT)));
  }
  if (G.state === 'play' && mouse.rightHeld && G.player && !G.player.dead && G.player.clickMode === 'move') {
    G.player.moveTarget = { u: clamp(mouse.ground.u, -1, L + 1), v: clamp(mouse.ground.v, -HALF, HALF) };
  }
  if (G.state === 'play' || G.state === 'roundEnd') simulate(rdt * G.timeScale);
  if (G.state === 'roundEnd') {
    if (G.stateT > 1.3) G.timeScale = 1;
    if (G.stateT > 3.8) {
      if (G.score[0] >= 2 || G.score[1] >= 2) finishMatch();
      else { if (G.lastWinner >= 0) G.round++; hideMsg(); resetRound(); }
    }
  }
  updateFx(rdt * G.timeScale);
  syncMeshes(rdt);
  G.shake = Math.max(0, G.shake - rdt * 1.5);
  updateCamera(rdt);
}
function updateCamera(dt) {
  const p = G.player, b = G.bot;
  let tu = CX + 8, tv = 0;
  if (p) {
    tu = p.u; tv = p.v;
    if (b && !b.dead && !p.dead) {                     // 내 캐릭터 위주 + 가까운 적 쪽으로 약간 치우침
      const d = dist(p, b);
      if (d < 20) { const k = 0.28 * (1 - d / 20) + 0.08; tu += (b.u - p.u) * k; tv += (b.v - p.v) * k; }
    }
  }
  const tx = clamp(tu - CX, -CX + 8, CX - 8), tz = clamp(tv, -3, 3);
  const f = 1 - Math.exp(-dt * 7);
  camCenter.x += (tx - camCenter.x) * f; camCenter.z += (tz - camCenter.z) * f;
  camera.position.set(camCenter.x + camBase.x + rand(-1, 1) * G.shake, camBase.y + rand(-1, 1) * G.shake, camCenter.z + camBase.z + rand(-1, 1) * G.shake);
  camera.updateMatrixWorld();
  if (mouse.has) updateMouse(mouse.last);          // 카메라가 움직여도 마우스 지면 좌표 유지
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  step(rdt);
  renderer.render(scene, camera);
  drawUI(); updateHud();
}

/* ---------- 시작 ---------- */
buildWorld();
resize();
G.picks = { me: 'lightning', foe: 'random' };
resolveFoe(); resetRound(); G.state = 'menu';

/* ---------- 캐릭터 선택 화면 ---------- */
const hex = c => '#' + c.toString(16).padStart(6, '0');
function champCard(key, group, on) {
  const d = DEFS[key];
  return `<button class="ch${on ? ' on' : ''}" data-g="${group}" data-k="${key}">
    <b><span class="sw" style="background:${hex(d.body)}"></span>${d.name}</b>
    <div class="rl">${d.role} · 난이도 <span class="df">${'★'.repeat(d.diff)}${'☆'.repeat(3 - d.diff)}</span></div>
    <div class="ds">${d.desc}</div>
    <div class="sk">${d.skills.map(s => s.key + ' ' + s.name).join(' · ')}</div></button>`;
}
function showSelect() {
  G.state = 'menu'; hideMsg();
  const card = $('card'); card.className = 'card wide';
  const nm = k => k === 'random' ? '랜덤' : DEFS[k].name;
  card.innerHTML = `<h1>ARAM 듀얼 · 챔피언 선택</h1>
    <p>카드를 클릭해서 <b>내 챔피언</b>과 <b>상대 챔피언</b>을 고르세요. 먼저 상대를 처치하면 라운드 승리 · 3판 2선승</p>
    <div class="sel-title">① 내 챔피언 <em id="meLbl">${nm(G.picks.me)}</em></div>
    <div class="grid" id="gMe">${ROSTER.map(k => champCard(k, 'me', k === G.picks.me)).join('')}</div>
    <div class="sel-title">② 상대 챔피언 (AI) <em id="foeLbl">${nm(G.picks.foe)}</em></div>
    <div class="grid" id="gFoe">${ROSTER.map(k => champCard(k, 'foe', k === G.picks.foe)).join('')}
      <button class="ch${G.picks.foe === 'random' ? ' on' : ''}" data-g="foe" data-k="random"><b>🎲 랜덤</b>
        <div class="rl">매 매치 무작위</div><div class="ds">상대 챔피언을 매치 시작 때 무작위로 정합니다.</div></button></div>
    <p style="margin-top:12px;font-size:12px;opacity:.7">🖱 우클릭: 이동 / 적 우클릭: 공격 · ⌨ Q W E R: 스킬(마우스 방향) · S: 정지 · R은 Lv3 해금</p>
    <button id="startBtn">게임 시작</button>`;
  card.querySelectorAll('button.ch').forEach(btn => btn.onclick = () => {
    const g = btn.dataset.g, k = btn.dataset.k;
    G.picks[g] = k;
    card.querySelectorAll(`button.ch[data-g="${g}"]`).forEach(x => x.classList.toggle('on', x.dataset.k === k));
    $(g === 'me' ? 'meLbl' : 'foeLbl').textContent = nm(k);
  });
  $('startBtn').onclick = startMatch;
  $('overlay').style.display = 'flex';
}
showSelect();
window.__game = { G, mouse, cast, rightClick, step, botThink, startMatch, DEFS, ROSTER };
requestAnimationFrame(frame);
</script>
