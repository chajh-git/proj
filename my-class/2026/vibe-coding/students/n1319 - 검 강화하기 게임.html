<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전설의 검 강화 게임</title>
<style>
body {
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
.game {
  max-width: 550px;
  margin: auto;
  background: #1f2937;
  padding: 25px;
  border-radius: 20px;
}
h1 { color: gold; }
.money { color: #ffd700; font-size: 23px; }
.level {
  color: orange;
  font-size: 55px;
  font-weight: bold;
}
.sword {
  font-size: 110px;
  margin: 20px;
  display: inline-block;
}
button {
  padding: 15px 25px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 17px;
  font-weight: bold;
  margin: 5px;
}
.upgrade {
  background: orange;
  color: black;
  width: 90%;
}
.sell { background: #2563eb; color: white; }
.reset { background: #4b5563; color: white; }
.success {
  animation: success .7s;
}
.failure {
  animation: failure .5s;
}
@keyframes success {
  0% { transform: scale(.6); filter:brightness(1); }
  50% { transform: scale(1.4); filter:brightness(2); }
  100% { transform: scale(1); }
}
@keyframes failure {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-15px); }
  50% { transform: translateX(15px); }
  75% { transform: translateX(-10px); }
}
.log {
  background: #111827;
  border-radius: 10px;
  padding: 12px;
  height: 120px;
  overflow-y: auto;
  text-align: left;
  font-size: 14px;
}
.info {
  background: #374151;
  padding: 12px;
  border-radius: 10px;
  margin: 12px 0;
}
</style>
</head>
<body>

<div class="game">
<h1>⚔️ 전설의 검 강화 ⚔️</h1>
<p>최대 15강에 도전하라!</p>

<div class="info">
  <p>보유 자금</p>
  <div class="money" id="money">100,000,000원</div>
</div>

<div class="level" id="level">+0</div>

<div class="sword" id="sword">🗡️</div>

<div class="info">
  <p>성공 확률: <b id="chance">95%</b></p>
  <p>강화 비용: <b id="cost">500,000원</b></p>
  <p>검의 가치: <b id="value">100,000원</b></p>
  <p>성공 횟수: <b id="wins">0</b></p>
  <p>실패 횟수: <b id="fails">0</b></p>
</div>

<button class="upgrade" onclick="upgrade()">
  ⚒️ 검 강화하기
</button>
<br>
<button class="sell" onclick="sell()">💰 검 판매</button>
<button class="reset" onclick="resetGame()">초기화</button>

<h3 id="message">강화를 시작하세요!</h3>

<h3>📜 강화 기록</h3>
<div class="log" id="log"></div>

<h3>강화 확률표</h3>
<div class="info">
  +1 ~ +5 : 95%<br>
  +6 ~ +9 : 70%<br>
  +10 ~ +13 : 50%<br>
  +14 ~ +15 : 15%
</div>
</div>

<script>
let money = 100000000;
let level = 0;
let wins = 0;
let fails = 0;
let busy = false;

function chance() {
  if(level < 5) return 95;
  if(level < 9) return 70;
  if(level < 13) return 50;
  return 15;
}

function cost() {
  return Math.round(500000 * Math.pow(1.65, level));
}

function value() {
  return Math.round(100000 * Math.pow(2.15, level));
}

function moneyText(n) {
  return n.toLocaleString("ko-KR") + "원";
}

function update() {
  document.getElementById("money").innerText = moneyText(money);
  document.getElementById("level").innerText = "+" + level;
  document.getElementById("chance").innerText = chance() + "%";
  document.getElementById("cost").innerText = moneyText(cost());
  document.getElementById("value").innerText = moneyText(value());
  document.getElementById("wins").innerText = wins;
  document.getElementById("fails").innerText = fails;
}

function record(text) {
  let log = document.getElementById("log");
  log.innerHTML = "<div>" + text + "</div>" + log.innerHTML;
}

function animate(type) {
  let sword = document.getElementById("sword");
  sword.classList.remove("success", "failure");
  void sword.offsetWidth;
  sword.classList.add(type);
}

function upgrade() {
  if(busy || level >= 15) return;

  if(money < cost()) {
    document.getElementById("message").innerText =
      "돈이 부족합니다!";
    return;
  }

  busy = true;
  money -= cost();

  if(Math.random() * 100 < chance()) {
    level++;
    wins++;

    animate("success");
    document.getElementById("sword").innerText =
      level >= 10 ? "⚔️" : "🗡️";

    document.getElementById("message").innerText =
      "🔥 강화 성공! +" + level;

    record("🔥 +" + level + " 강화 성공!");

    if(level === 15) {
      document.getElementById("message").innerText =
        "🏆 전설의 15강 검 완성!";
      record("🏆 15강 달성!");
    }

  } else {
    level = 0;
    fails++;

    animate("failure");
    document.getElementById("sword").innerText = "💥";

    document.getElementById("message").innerText =
      "💥 강화 실패! +0으로 초기화!";

    record("💥 강화 실패! 검이 +0이 되었습니다.");
  }

  update();

  setTimeout(() => {
    document.getElementById("sword").innerText = "🗡️";
    busy = false;
  }, 700);
}

function sell() {
  if(busy || level === 0) return;

  let price = value();
  money += price;

  record("💰 검 판매! +" + moneyText(price));
  level = 0;

  document.getElementById("sword").innerText = "🗡️";
  document.getElementById("message").innerText =
    "검을 판매했습니다!";

  update();
}

function resetGame() {
  if(busy) return;
  if(!confirm("게임을 초기화할까요?")) return;

  money = 100000000;
  level = 0;
  wins = 0;
  fails = 0;

  document.getElementById("sword").innerText = "🗡️";
  document.getElementById("message").innerText =
    "새로운 게임 시작!";

  document.getElementById("log").innerHTML = "";

  update();
}

update();
</script>

</body>
</html>
