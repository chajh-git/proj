`<h1>🎮 조작법</h1><p><b>W A S D</b> : 앞 / 왼쪽 / 뒤 / 오른쪽 이동<br><b>마우스</b> : 시선 이동 (잠기지 않으면 드래그)<br><b>← →</b> : 시선 좌우 회전<br><b>R</b> : 0번 출구부터 다시 시작</p>`,
`<h1>🔍 판정 방법</h1><p><b>이상 현상이 없으면</b> → 통로 끝(계단)까지 앞으로 걸어가세요.<br><b>이상 현상이 있으면</b> → 뒤로 돌아 표찰구까지 돌아가세요.<br>(시작점에서 6m 넘게 걸어간 뒤에 돌아오면 인정됩니다)<br><br>맞히면 출구 번호 +1, 틀리면 0번으로 돌아갑니다.<br>8번 출구에 도착하면 탈출! 0번 출구는 항상 정상 통로입니다.</p>`,
`<h1>👀 이런 것을 살펴보세요</h1><p>조명 색이나 깜빡임 · 표지판 숫자와 기울기<br>포스터가 사라지거나 뒤집히거나 얼굴이 이상함<br>없던 문 · 문틈 · 천장이나 모퉁이의 사람<br>바닥의 얼룩 · 지나가는 직장인의 행동<br>벽의 손자국 · 꺼지는 조명 · 뒤에 나타나거나 다가오는 그림자<br><br><b>처음 통로의 모습을 잘 기억하고, 헷갈리면 돌아가세요.</b><br>걷는 소리가 중요하니 소리를 켜 두세요 🔊</p>`];
let ti=0;const tr=()=>{("tp").innerHTML=TP[ti]+`<pstyle="color:#777">{ti+1} / TP.length</p>`;("pv").disabled=!ti;$("nx").textContent=ti<3?"다음 ▶":"게임 시작 🔊"};
$("pv").onclick=()=>{ti--;tr()};
$("nx").onclick=()=>{if(ti<3){ti++;tr();return}$("s").style.display="none";init();play=1;try{cv.requestPointerLock()}catch(e){}};
tr();build();loop();
</script>
</body></html>
