<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>저녁 메뉴 추천</title>

<style>
body { margin:0; font-family:Arial; text-align:center; }

.page {
  display:none;
  height:100vh;
  padding-top:80px;
  position:relative;
}
.active { display:block; }

/* 연한 색 */
.p1 { background:#ffcccc; }
.p2 { background:#ffe0b3; }
.p3 { background:#ffffcc; }
.p4 { background:#cce5ff; }
.p5 { background:#e6ccff; }

button {
  padding:10px 15px;
  margin:6px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

/* 하단 버튼 */
.bottom {
  position:absolute;
  bottom:20px;
  width:100%;
}

/* 결과 카드 */
.card {
  background:white;
  padding:20px;
  border-radius:15px;
  display:inline-block;
}

img {
  width:200px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- 1페이지 -->
<div class="page p1 active" id="p1">
  <h1>🍽️ 저녁 메뉴 추천</h1>
  <button onclick="go(2)">시작</button>
</div>

<!-- 2페이지 -->
<div class="page p2" id="p2">
  <h2>무엇이 먹고 싶나요?</h2>
  <button onclick="select('korean')">한식</button>
  <button onclick="select('western')">양식</button>
  <button onclick="select('japanese')">일식</button>
  <button onclick="select('chinese')">중식</button>
  <button onclick="select('etc')">딴거</button>

  <div class="bottom">
    <button onclick="go(1)">← 돌아가기</button>
  </div>
</div>

<!-- 3페이지 -->
<div class="page p3" id="p3">
  <h2>음식 선택 (10개)</h2>
  <div id="menuList"></div>

  <div class="bottom">
    <button onclick="go(2)">← 돌아가기</button>
  </div>
</div>

<!-- 4페이지 -->
<div class="page p4" id="p4">
  <h2>결과 보기</h2>
  <button onclick="showResult()">추천 결과</button>

  <div class="bottom">
    <button onclick="go(3)">← 돌아가기</button>
  </div>
</div>

<!-- 5페이지 -->
<div class="page p5" id="p5">
  <h2>추천 메뉴 🍴</h2>
  <div id="result"></div>

  <div class="bottom">
    <button onclick="go(4)">← 돌아가기</button>
    <button onclick="location.reload()">처음으로</button>
  </div>
</div>

<script>
let category = "";
let selectedMenu = "";

// 페이지 이동
function go(n){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById("p"+n).classList.add('active');
}

// 데이터 (각 10개)

    {name:"라자냐", kcal:"700kcal", img:"https://source.unsplash.com/200x200/?lasagna"},

  ],
  japanese: [
    {name:"초밥", kcal:"500kcal", img:"https://source.unsplash.com/200x200/?sushi"},

  ],
  chinese: [

    {name:"도넛", kcal:"350kcal", img:"https://source.unsplash.com/200x200/?donut"},

  ]

// 선택
function select(cat){
  category = cat;
  let html = "";

  data[cat].forEach(m=>{
    html += `<button onclick="chooseMenu('${m.name}')">${m.name}</button>`;
  });

  document.getElementById("menuList").innerHTML = html;
  go(3);
}

// 메뉴 선택
function chooseMenu(name){
  selectedMenu = name;
  go(4);
}

// 결과
function showResult(){
  const food = data[category].find(m=>m.name === selectedMenu);

  document.getElementById("result").innerHTML = `
    <div class="card">
      <h3>${food.name}</h3>
      <img src="${food.img}">
      <p>🔥 ${food.kcal}</p>
    </div>
  `;

  go(5);
}
</script>

</body>
</html>
