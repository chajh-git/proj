 for(const k of S.k)if(!k.got&&Math.hypot(k.x-p.x,k.y-p.y)<.9){k.got=1;world.remove(k.s);S.keys++;beep(880,.12,'triangle',.08,400);setTimeout(()=>beep(1320,.2,'triangle',.08),90);say('🔑 열쇠 획득! ('+S.keys+'/'+NEED+')',1.8)}

 if(Math.hypot(39.5-p.x,19.5-p.y)<1.2){
  if(S.keys>=NEED){S.state='clear';beep(660,.4,'triangle',.08,500);{let b=S.time;try{const k='se3d_'+DF;b=Math.min(+localStorage.getItem(k)||1e9,S.time);localStorage.setItem(k,b)}catch(e){}show('탈출 성공!','열쇠 3개를 모아 정문을 통과했다!<br>기록 <b>'+fmt(S.time)+'</b> · 이 난이도 최고 기록 <b>'+fmt(b)+'</b>','다시 하기',startGame)}}

 p.hid=l;$('slit').style.display='block';beep(200,.12,'square',.05,-60);say('사물함 안이다. 선생님이 가까이 오면 위험해! (E로 나가기)',2)}
function useItem(i){const it=S.inv[i];if(!it||S.state!='play'||S.p.hid)return;const p=S.p,fx=S.fx;let ok=true;
 if(it=='xray'){fx.xray=15;say('🕶️ 벽 너머 선생님이 보인다! (15초)')}

 else if(it=='master'){S.keys=Math.min(NEED,S.keys+1);beep(1000,.3,'triangle',.08,500);say('🗝️ 마스터키! 열쇠 +1 ('+S.keys+'/'+NEED+')',2.5)}
 else if(it=='tele'){const c=FL.filter(([x,y])=>Math.hypot(x-p.x,y-p.y)>15&&S.t.every(t=>Math.hypot(t.x-x,t.y-y)>14)),[x,y]=c.length?c[ri(c.length)]:FL[ri(FL.length)];p.x=x+.5;p.y=y+.5;beep(300,.4,'sine',.08,900);say('🌀 순간이동!')}
 else if(it=='flash'){let n=0;for(const t of S.t)if(Math.hypot(t.x-p.x,t.y-p.y)<10){t.frz=4;t.mode='search';t.sus=0;t.path=[];t.m.jk.color.setHex(0xffffff);n++}('fl').style.transition='none';('fl').style.opacity=.9;setTimeout(()=>{('fl').style.transition='opacity.8s';('fl').style.opacity=0},40);beep(1500,.2,'square',.06,-800);say('📸 번쩍! 근처 선생님 '+n+'명이 눈을 못 뜬다')}

  for(const t of S.t)if(t.mode!='chase'&&t.frz<=0&&Math.hypot(t.x-x,t.y-y)<16){t.mode='search';t.sus=0;t.path=bfs(t.x,t.y,x|0,y|0);t.pause=0;t.look=[x,y]}say('📢 미끼를 던졌다! 선생님들이 몰려간다')}
 else if(it=='freeze'){let b=null,bd=9;for(const t of S.t){const d=Math.hypot(t.x-p.x,t.y-p.y);if(d<bd&&Math.abs(angd(p.yaw,Math.atan2(t.y-p.y,t.x-p.x)))<.5&&los(p.x,p.y,t.x,t.y)){bd=d;b=t}}
  if(b){b.frz=6;b.mode='search';b.sus=0;b.path=[];b.m.jk.color.setHex(0x88ccff);beep(900,.3,'sine',.07,-500);say('💤 선생님이 얼어붙었다! (6초)')}else{ok=false;say('앞에 선생님이 없다',1.2)}}
 if(ok){S.inv[i]=null;renderInv()}}
function renderInv(){$('inv').innerHTML=[0,1,2].map(i=>{const t=S.inv[i];return`<div class="slot${t?' on':''}" onclick="useItem(i)"><b>{i+1}</b>${t?IT[t].i+'<small>'+IT[t].n+'</small>':''}</div>`}).join('')}
function update(dt){S.tick+=dt;S.time+=dt;S.dark=Math.max(0,S.dark-dt);const fx=S.fx;for(const k in fx)fx[k]=Math.max(0,fx[k]-dt);

function render(){const p=S.p,fx=S.fx,tk=S.tick,dk=S.dark>0;
 if(p.hid)cam.position.set(p.hid[0]*U+1,1.5,p.hid[1]*U+1);else cam.position.set(p.x*U,1.55+Math.sin(p.walk*5)*.05,p.y*U);

 let ms=0;S.t.forEach(t=>{const m=t.m,v=Math.hypot(t.x-m.px,t.y-m.py),ch=t.mode=='chase';m.ph+=v*3.2;m.px=t.x;m.py=t.y;

  m.lg[0].rotation.z=sn*sw*.9;m.lg[1].rotation.z=-sn*sw*.9;m.kn[0].rotation.z=-Math.max(0,Math.sin(m.ph+1.6))*sw*.9;m.kn[1].rotation.z=-Math.max(0,-Math.sin(m.ph+1.6))*sw*.9;

  const ta=(ch||t.sus>.05)?Math.atan2(p.y-t.y,p.x-t.x):t.ang+Math.sin(tk*.8+t.gk)*.6;m.head.rotation.y+=(-Math.max(-1.1,Math.min(1.1,angd(t.ang,ta)))-m.head.rotation.y)*.15;
  updCone(t);m.gh.visible=fx.xray>0;ms=Math.max(ms,t.sus);m.ind.visible=ch||t.sus>.15;m.ind.material.map=ch?TE:TQ;m.ind.position.y=3.15+Math.sin(tk*10)*.08});
 S.items.forEach(i=>{if(!i.got)i.s.position.y=.9+Math.sin(tk*3+i.x)*.12});S.k.forEach(k=>{if(!k.got)k.s.position.y=1+Math.sin(tk*3+k.x)*.12});

 const l=[],E=[['xray','🕶️ 투시'],['energy','⚡ 에너지'],['cloak','🧥 투명'],['radar','🧭 레이더'],['silent','🥿 무음']];E.forEach(([k,n])=>{if(fx[k])l.push(n+' '+fx[k].toFixed(0)+'초')});if(dk)l.push('⚡ 정전 '+S.dark.toFixed(0)+'초');
