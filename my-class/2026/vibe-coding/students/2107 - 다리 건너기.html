<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다리 건너기 게임</title>

<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: linear-gradient(to bottom, #87ceeb, #1e90ff);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .game {
    background: white;
    padding: 30px;
    border-radius: 20px;
    width: 350px;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }

  h1 {
    margin-top: 0;
  }

  .row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 10px 0;
  }

  button {
    width: 120px;
    height: 50px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
  }

  .active {
    background: gold;
  }

  .active:hover {
    transform: scale(1.05);
  }

  .done {
    background: lightgreen;
  }

  .inactive {
    background: lightgray;
  }

  .restart {
    background: dodgerblue;
    color: white;
    margin-top: 20px;
  }

  #message {
    height: 40px;
  }
</style>
</head>

<body>

<div class="game">

  <h1>🌉 다리 건너기</h1>

  <h2 id="levelText">LEVEL 1</h2>

  <div id="bridge"></div>

  <h2 id="message"></h2>

  <button class="restart" onclick="restartGame()">
    처음부터
  </button>

</div>

<script>

let level = 1;
let step = 0;
let safePath = [];
let gameOver = false;

function makeBridge() {

  safePath = [];

  // 단계별 점점 어려워짐
  const length = 2 + level;

  for (let i = 0; i < length; i++) {

    if (Math.random() > 0.5) {
      safePath.push("left");
    } else {
      safePath.push("right");
    }

  }
}

function playSuccessSound() {

  const audio = new Audio(
    "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
  );

  audio.play();
}

function playFailSound() {

  const audio = new Audio(
    "https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg"
  );

  audio.play();
}

function startGame() {

  step = 0;
  gameOver = false;

  document.getElementById("message").innerText = "";

  document.getElementById("levelText").innerText =
    "LEVEL " + level;

  makeBridge();

  drawBridge();
}

function choose(side) {

  if (gameOver) return;

  if (safePath[step] === side) {

    playSuccessSound();

    step++;

    if (step === safePath.length) {

      document.getElementById("message").innerText =
        "🎉 성공!";

      gameOver = true;

      setTimeout(() => {

        level++;

        startGame();

      }, 1500);
    }

  } else {

    playFailSound();

    document.getElementById("message").innerText =
      "💥 실패!";

    gameOver = true;
  }

  drawBridge();
}

function drawBridge() {

  const bridge = document.getElementById("bridge");

  bridge.innerHTML = "";

  for (let i = 0; i < safePath.length; i++) {

    const row = document.createElement("div");

    row.className = "row";

    const leftBtn = document.createElement("button");
    const rightBtn = document.createElement("button");

    leftBtn.innerText = "왼쪽";
    rightBtn.innerText = "오른쪽";

    if (i < step) {

      leftBtn.className = "done";
      rightBtn.className = "done";

    }
    else if (i === step && !gameOver) {

      leftBtn.className = "active";
      rightBtn.className = "active";

      leftBtn.onclick = () => choose("left");
      rightBtn.onclick = () => choose("right");

    }
    else {

      leftBtn.className = "inactive";
      rightBtn.className = "inactive";
    }

    row.appendChild(leftBtn);
    row.appendChild(rightBtn);

    bridge.appendChild(row);
  }
}

function restartGame() {

  level = 1;

  startGame();
}

startGame();

</script>

</body>
</html>
