<style>

#c{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(6,8,18,.75);padding:12px}
.ov.h{display:none}
.card{background:var(--panel);border:3px solid var(--accent);border-radius:8px;padding:20px 24px;max-width:480px;width:100%;box-sizing:border-box;text-align:center;line-height:1.55;max-height:92vh;overflow:auto;box-shadow:0 0 30px rgba(255,207,51,.25)}

.ct{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;font-size:13px;margin:10px 0;background:rgba(255,255,255,.05);padding:10px;border-radius:6px}

<script>
const $=id=>document.getElementById(id);
const W=800,H=450,FL=380,SC=5,STAGES=5,FN="'Noto Sans KR','Malgun Gothic',sans-serif";
const cv=$('c'),cx=cv.getContext('2d');
let S=1,OX=0,OY=0,D=1;

function rs(){D=Math.min(devicePixelRatio||1,2);const w=innerWidth,h=innerHeight;cv.width=w*D;cv.height=h*D;S=Math.min(w/W,h/H);OX=(w-W*S)/2;OY=(h-H*S)/2;}
addEventListener('resize',rs);rs();
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- Web Audio Sound Synthesizer ---------- */
let ac=null;
function snd(type){
 if(type==='slam'||type==='final'){
  if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  if(ac.state==='suspended')ac.resume();
  const now=ac.currentTime;
  const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
  o.type='sawtooth';o.frequency.setValueAtTime(type==='final'?65:95,now);
  o.frequency.exponentialRampToValueAtTime(24,now+.32);
  f.type='lowpass';f.frequency.setValueAtTime(500,now);f.frequency.exponentialRampToValueAtTime(90,now+.3);
  o.connect(f);f.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(type==='final'?.55:.38,now);g.gain.exponentialRampToValueAtTime(.001,now+.34);
  o.start(now);o.stop(now+.35);return;
 }
 if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 if(ac.state==='suspended')ac.resume();
 const now=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
 o.connect(g);g.connect(ac.destination);
 if(type==='hit'){
  o.type='triangle';o.frequency.setValueAtTime(140,now);o.frequency.exponentialRampToValueAtTime(30,now+.12);
  g.gain.setValueAtTime(.3,now);g.gain.exponentialRampToValueAtTime(.01,now+.12);
  o.start(now);o.stop(now+.12);
 }else if(type==='ult'){
  o.type='sawtooth';o.frequency.setValueAtTime(180,now);o.frequency.exponentialRampToValueAtTime(700,now+.4);
  g.gain.setValueAtTime(.4,now);g.gain.exponentialRampToValueAtTime(.01,now+.45);
  o.start(now);o.stop(now+.45);
 }else if(type==='bossUlt'){
  o.type='square';o.frequency.setValueAtTime(100,now);o.frequency.linearRampToValueAtTime(40,now+.6);
  g.gain.setValueAtTime(.5,now);g.gain.exponentialRampToValueAtTime(.01,now+.6);
  o.start(now);o.stop(now+.6);
 }
}

/* ---------- Pixel Art Sprites ---------- */
function mk(rows,pal){const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const g=c.getContext('2d');
 rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const k=r[x];if(k!=='.'){g.fillStyle=pal[k];g.fillRect(x,y,1,1);}}});return c;}
const R_PL=["...kkkkkk...","..kkkkkkkk..","..kssssssk..","..kssssesk..","..kssssssk..","...ssssss...","..bbbwwbbb..",".sbbbtbbbs..",".sbbbtbbbs..","..bbbtbbb...","..bbbbbbbb..","..bbbbbbbb.."];
const R_OLD=["...gggggg...","..gggggggg..","..gssssssg..","..gssssesg..","..gwwwwwwg..","...wwwwww...","..bbbccbbb..",".sbbbccbbbs.",".sbbbccbbbs.","..bbbccbbb..","..bbbbbbbb..","..bbbbbbbb.."];
const R_NIN=["...kkkkkk...","..kkkkkkkk..","..rrrrrrrr..","..kssssesk..","..kkkkkkkk..","...kkkkkk...","..aaakkaaa..",".kaaakkaaak.",".kaaakkaaak.","..aaaaaaaa..","..aaarraaa..","..aaaaaaaa.."];
const R_MOM=["..pppppppp..",".pppppppppp.",".ppssssssp..",".ppssssesp..",".ppssssssp..","..pssssssp..","..yyywwyyy..",".syyywwyyyoo",".syyywwyyyoo","..yyywwyyyoo","..yyyyyyyyoo","..yyyyyyyyoo"];
const R_SPK=["...rrrrrr...","..rrrrrrrrr.","..ssssssss..","..skkkkks...","..ssssssss..","...ssssss...","..bbbbbbbb..",".sbbbbbbbbs.",".sbbbwwbbbs.","..bbbwwbbb..","..bbbbbbbb..","..bbbbbbbb.."];
const R_CAT=["o.o.....","oooo..o.","ooooooo.",".ooooooo",".o.o.o.o"];
const IMG={pl:mk(R_PL,{k:'#1b1b2a',s:'#f1c9a0',b:'#2d5db3',t:'#e24a4a',w:'#fff',e:'#111'}),cat:mk(R_CAT,{o:'#e8923a'})};
const BS=[
 [R_OLD,{g:'#c9ccd2',s:'#ecc39a',w:'#fff',b:'#7a5230',c:'#e9dcc0',e:'#111'},{b:'#9b2d2d'},'#4a3a2a'],
 [R_NIN,{k:'#15151f',r:'#d33',s:'#f1c9a0',e:'#111',a:'#34384a'},{a:'#5a1f6e'},'#202030'],
 [R_MOM,{p:'#8e5bb5',s:'#f1c9a0',e:'#111',y:'#f2c94c',w:'#fff',o:'#e07b39'},{y:'#3ea66b'},'#6a4a8a'],
 [R_SPK,{r:'#d33a3a',s:'#e9bd94',k:'#111',b:'#2b2d3a',w:'#eee'},{b:'#7a1fa0'},'#1a1a24']
].map(([r,p,a,pc])=>({im:[mk(r,p),mk(r,{...p,...a})],pc}));

function chr(im,x,y,dir,pc,a,rot){
 const w=im.width*SC,h=im.height*SC,lh=4*SC,l=Math.sin(a)>0?SC:0;
 cx.save();cx.translate(Math.round(x),Math.round(y));if(rot)cx.rotate(rot);cx.scale(dir,1);
 cx.fillStyle=pc;cx.fillRect(-4*SC,-lh,3*SC,lh-l);cx.fillRect(SC,-lh,3*SC,lh-(SC-l));
 cx.fillStyle='#111';cx.fillRect(-4*SC,-SC-l,3*SC,SC);cx.fillRect(SC,-SC-(SC-l),3*SC,SC);
 cx.drawImage(im,-w/2,-lh-h,w,h);cx.restore();
}

/* ---------- Background Pre-render ---------- */
const BGT=[['#cdd6e2','#e8edf3','#aab2bc','#a2aab5'],['#e3c9b0','#f0e2d4','#b8a48f','#b09b86'],['#56628a','#8591b8','#6a7288','#626a80'],['#3a2f55','#605080','#4a4560','#433e58']],BGC=[];
function bgOf(th){
 if(BGC[th])return BGC[th];
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),P=BGT[th];
 g.fillStyle=P[0];g.fillRect(0,0,W,300);g.fillStyle=P[1];g.fillRect(0,100,W,200);g.fillStyle='#2f6fdb';g.fillRect(0,236,W,14);
 for(let i=0;i<4;i++){const x=30+i*200;g.fillStyle='#7fa9d8';g.fillRect(x,120,54,112);g.fillRect(x+60,120,54,112);
  g.fillStyle='#a9c9ee';g.fillRect(x+4,124,8,104);g.fillRect(x+64,124,8,104);g.fillStyle=P[2];g.fillRect(x+130,140,40,60);g.fillStyle='#2f6fdb';g.fillRect(x+136,146,28,8);}
 g.fillStyle='#1f5fbf';g.fillRect(0,0,W,46);g.fillStyle='#fff';g.font='800 22px monospace';g.textAlign='center';g.fillText('서울역  SEOUL STATION',W/2,31);
 g.fillStyle='#6e7783';g.fillRect(0,296,W,6);
 for(let y=302,j=0;y<434;y+=22,j++)for(let x=0,i=0;x<W;x+=22,i++){g.fillStyle=(i+j)%2?P[2]:P[3];g.fillRect(x,y,22,22);}
 g.fillStyle='#f2c200';g.fillRect(0,418,W,12);g.fillStyle='#b88f00';for(let x=0;x<W;x+=12)g.fillRect(x+2,422,5,5);
 g.fillStyle='#1a1a22';g.fillRect(0,434,W,16);
 return BGC[th]=c;
}

/* ---------- Weapons & Upgrades ---------- */
const WP=[
 {nm:'서류가방',dmg:12,cd:.28,rng:70,len:12,hc:'#6b4423',tc:'#8a5a2c',p:0},
 {nm:'우산',dmg:18,cd:.28,rng:95,len:30,hc:'#555',tc:'#d33a3a',p:80},
 {nm:'텀블러',dmg:26,cd:.38,rng:80,len:16,hc:'#888',tc:'#bfc7d1',p:200},
 {nm:'야구방망이',dmg:38,cd:.45,rng:110,len:42,hc:'#a9773c',tc:'#c99654',p:420}];
const ITEMS=[
 {id:'hp',nm:'💪 체력 단련',d:'최대 HP +30 (중복 구매)',p:90},
 {id:'cf',nm:'☕ 편의점 커피',d:'HP 60 회복',p:40},
 {id:'cd',nm:'💳 카드 강화',d:'교통카드 데미지 +4 (중복 구매)',p:70}];

let gold=0,own=[1,0,0,0],cardB=0;
const pl={x:120,y:FL,vy:0,hp:120,max:120,dir:1,atk:0,did:0,inv:0,cd:0,cc:0,a:0,w:0,ultG:0,ultActive:0};
let phase='menu',lv=0,pt=0,T=0,shake=0,boss=null,shots=[],cards=[],fx=[],ps=[],cutin=null,teleLines=[];
let hitStop=0,screenFlash=0,impacts=[],combo=0,comboTimer=0;

/* ---------- Villain Ultra AI & Ult Freq (2.5s~3.5s Cool) ---------- */
function triggerUlt(b,title,kanji){
 b.st='ult';b.t=0;snd('bossUlt');
 cutin={title,kanji,t:1.55,sub:b.nm+' 필살기 발동!'};shake=Math.max(shake,.22);screenFlash=Math.max(screenFlash,.08);
}

function ai1(b,dt){ // 자르반 72세 (꼰대 지각변동)
 b.dir=Math.sign(pl.x-b.x)||1;b.t+=dt;b.ultCd=(b.ultCd||3.2)-dt;
 if(b.st==='walk'){
  b.x+=b.dir*(b.hp<b.max/2?110:75)*b.sp*dt;
  if(b.ultCd<=0){b.ultCd=3.0;triggerUlt(b,'꼰대지각변동','老長覇道天下');
   teleLines=[{x:0,w:W,y:FL-10,t:1.1,type:'groundGrid'}];
  }
 }else if(b.st==='ult'){
  if(b.t>1.1&&!b.didUlt){
   b.didUlt=true;shake=.9;hitStop=.09;
   for(let x=60;x<W;x+=110){
    shots.push({x,y:FL,vx:0,vy:-400,k:'rock',dm:Math.round(22*b.dm),r:35,t:1.2});
    burst(x,FL-20,'#e9c46a',22);impacts.push({x,y:FL-20,t:.42,max:.42,color:'#e9c46a',r:72});
   }
  }
  if(b.t>1.8){b.st='walk';b.t=0;b.didUlt=false;teleLines=[];}
 }
 b.dmg=b.st==='walk'?6:0;
}

function ai2(b,dt){ // 단소 살인마 (광란의 단소 난사)
 const dx=pl.x-b.x,d=Math.abs(dx);b.dir=Math.sign(dx)||1;b.t+=dt;b.ultCd=(b.ultCd||2.8)-dt;
 if(b.st==='walk'){
  if(d<220)b.x-=b.dir*120*dt;else if(d>320)b.x+=b.dir*90*dt;
  if(b.ultCd<=0){b.ultCd=2.8;triggerUlt(b,'광란의 단소 탄막','滿朝音波');
   teleLines=[{x:b.x,y:FL-50,r:160,t:0.9,type:'circle'}];
  }
 }else if(b.st==='ult'){
  if(b.t>.9&&!b.didUlt){
   b.didUlt=true;shake=.65;hitStop=.07;
   for(let a=0;a<14;a++){
    const ang=(a/14)*Math.PI*2;
    shots.push({x:b.x,y:FL-50,vx:Math.cos(ang)*340*b.sp,vy:Math.sin(ang)*340*b.sp,k:'danso',dm:Math.round(15*b.dm),r:12,rot:ang});
   }
  }
  if(b.t>1.5){b.st='walk';b.t=0;b.didUlt=false;teleLines=[];}
 }
 b.dmg=b.st==='walk'?5:0;
}

function ai3(b,dt){ // 캣맘 빌런 (전체 화면 거대 고양이 강림)
 b.dir=Math.sign(pl.x-b.x)||1;b.t+=dt;b.ultCd=(b.ultCd||3.5)-dt;
 if(b.st==='walk'){
  b.x+=b.dir*60*b.sp*dt;
  if(b.ultCd<=0){b.ultCd=3.5;triggerUlt(b,'초거대 냥이 화면 강림','巨猫 降臨');
   teleLines=[{x:0,w:W,y:0,h:H,t:1.3,type:'fullScreen'}];
  }
 }else if(b.st==='ult'){
  if(b.t>1.3&&!b.didUlt){
   b.didUlt=true;shake=1.15;hitStop=.12;
   // 화면 전체 뒤덮는 공격 판정 생성
   shots.push({x:W/2,y:H/2,vx:0,vy:0,k:'giantCatFull',dm:Math.round(28*b.dm),r:380,t:1.4,hit:0});
   burst(W/2,H/2,'#fff0bd',42);burst(W/4,H/2,'#e9b85b',26);burst(W*3/4,H/2,'#e9b85b',26);impacts.push({x:W/2,y:H/2,t:.7,max:.7,color:'#fff0bd',r:390});
  }
  if(b.t>2.5){b.st='walk';b.t=0;b.didUlt=false;teleLines=[];}
 }
 b.dmg=b.st==='walk'?5:0;
}

function ai4(b,dt){ // 스피커 빌런 (데시벨 멸망 폭풍)
 b.dir=Math.sign(pl.x-b.x)||1;b.t+=dt;b.ultCd=(b.ultCd||2.6)-dt;
 if(b.st==='walk'){
  if(Math.abs(pl.x-b.x)>240)b.x+=b.dir*50*dt;
  if(b.ultCd<=0){b.ultCd=2.6;triggerUlt(b,'데시벨 멸망곡','DECIBEL DOOM');
   teleLines=[{x:b.x,y:FL,r:220,t:0.8,type:'floorRing'}];
  }
 }else if(b.st==='ult'){
  if(b.t>.8&&!b.didUlt){
   b.didUlt=true;shake=.8;hitStop=.08;
   shots.push({x:b.x,y:FL,vx:0,vy:0,k:'soundRing',dm:Math.round(20*b.dm),r:220,t:1.2,expand:1});
  }
  if(b.t>1.6){b.st='walk';b.t=0;b.didUlt=false;teleLines=[];}
 }
 b.dmg=b.st==='walk'?5:0;
}


function ai5(b,dt){
 b.dir=Math.sign(pl.x-b.x)||1;b.t+=dt;b.ultCd=(b.ultCd||2.2)-dt;
 if(b.st==='walk'){
  if(Math.abs(pl.x-b.x)>175)b.x+=b.dir*48*dt;
  if(b.ultCd<=0){
   b.ultCd=2.7;b.pattern=(b.pattern||0)%3;const p=b.pattern++;
   if(p===0){triggerUlt(b,'합체 로봇 · 지하철 붕괴파','STATION BREAKER');teleLines=[{x:0,w:W,y:FL-10,t:1.0,type:'groundGrid'}];}
   else if(p===1){triggerUlt(b,'합체 로봇 · 단소 미사일','DANSO MISSILE');teleLines=[{x:b.x,y:FL-55,r:160,t:.9,type:'circle'}];}
   else{triggerUlt(b,'합체 로봇 · 거대 냥이 강습','GIANT CAT RAID');teleLines=[{x:0,w:W,y:FL-10,t:1.0,type:'groundGrid'}];}
  }
 }else if(b.st==='ult'){
  if(b.t>1.0&&!b.didUlt){
   b.didUlt=true;shake=1.25;screenFlash=.12;hitStop=.14;snd('slam');
   const p=(b.pattern+2)%3;
   if(p===0)shots.push({x:b.x,y:FL,vx:0,vy:0,k:'soundRing',dm:Math.round(25*b.dm),r:230,t:1.15});
   else if(p===1){for(let i=0;i<12;i++){const a=-.9+i*.16;shots.push({x:b.x,y:FL-58,vx:Math.cos(a)*370,vy:Math.sin(a)*370,k:'danso',dm:Math.round(18*b.dm),r:13,rot:a});}}
   else{for(let x=55;x<W;x+=115)shots.push({x,y:FL,vx:0,vy:-410,k:'rock',dm:Math.round(22*b.dm),r:30,t:1.15});}
   burst(b.x,b.y-60,'#ffcf33',32);impacts.push({x:b.x,y:b.y-45,t:.5,max:.5,color:'#ffcf33',r:210});
  }
  if(b.t>1.65){b.st='walk';b.t=0;b.didUlt=false;teleLines=[];}
 }
 b.dmg=b.st==='walk'?8:0;
}

const BOSSES=[

 boss={...d,id:i===4?4:i,lv:i,nm:d.nm,hp,max:hp,sp:1+i*.05,dm:1+i*.08,x:W-120,y:FL,t:0,st:'walk',dir:-1,vx:0,flash:0,sayT:0,txt:'',dmg:0,pst:'walk',w:50,ultCd:2.4,pattern:0};

function burst(x,y,c,n){for(let i=0;i<(n||8);i++)ps.push({x,y,vx:(Math.random()-.5)*380,vy:(Math.random()-.5)*380,t:.6,c});}

function hurtB(n,kx){
 boss.hp-=n;boss.flash=.12;boss.x=cl(boss.x+kx,32,W-32);burst(boss.x,boss.y-50,'#fff');
 fx.push({x:boss.x,y:boss.y-110,t:.8,s:'-'+n,c:'#ffe066'});
 snd('hit');
 pl.ultG=Math.min(100,pl.ultG+8);
 if(boss.hp<=0){boss.hp=0;boss.st='ko';phase='clear';pt=0;shots=[];cards=[];teleLines=[];shake=1.2;screenFlash=.4;hitStop=.16;snd('final');impacts.push({x:boss.x,y:boss.y-50,t:.9,max:.9,color:'#ffcf33',r:420});burst(boss.x,boss.y-50,'#ffcf33',55);
  const g=70+lv*40;gold+=g;pl.hp=Math.min(pl.max,pl.hp+40);burst(boss.x,boss.y-50,'#ffd23a',30);
  fx.push({x:W/2,y:140,t:2.0,s:'KO! 🪙 +'+g+' · HP +40',c:'#fff',big:1});}
}

function hurtP(n,src){
 pl.hp-=n;pl.inv=1.1;pl.vy=-260;pl.x=cl(pl.x+(Math.sign(pl.x-src)||1)*45,24,W-24);shake=.3;burst(pl.x,pl.y-40,'#f55',10);
 fx.push({x:pl.x,y:pl.y-110,t:.8,s:'-'+n,c:'#ff6b6b'});
 snd('hit');
 if(pl.hp<=0){pl.hp=0;end(false);}
}

function triggerPlayerUlt(){
 if(pl.ultG<100||phase!=='fight')return;
 pl.ultG=0;pl.inv=2.0;snd('ult');shake=1.0;screenFlash=.28;hitStop=.09;impacts.push({x:pl.x,y:pl.y-60,t:.65,max:.65,color:'#3ba7ff',r:360});

 shake=.8;

 WP.forEach((w,i)=>{h+=`<div class="r"><span>${i+1}. ${w.nm}<small>공격력 ${w.dmg} · 사거리 ${w.rng}</small></span>`+
  (own[i]?`<button data-e="i"{pl.w===i?' disabled':''}>pl.w===i?'장착중':'장착'</button>`:`<buttondata-b="w{i}"gold<w.p?'disabled':''>🪙{w.p}</button>`)+'</div>';});
 h+='<h3>능력 강화</h3>';
 ITEMS.forEach(it=>{h+=`<div class="r"><span>it.nm<small>{it.d}</small></span><button data-b="it.id"{gold<it.p?' disabled':''}>🪙${it.p}</button></div>`;});

$('shl').onclick=e=>{

function updPl(dt){
 const mv=((K.ArrowRight||K.KeyD)?1:0)-((K.ArrowLeft||K.KeyA)?1:0);
 pl.x=cl(pl.x+mv*240*dt,24,W-24);if(mv){pl.dir=mv;if(pl.y>=FL)pl.a+=dt*14;}
 if((K.ArrowUp||K.KeyW||K.Space)&&pl.y>=FL)pl.vy=-660;
 pl.vy+=1850*dt;pl.y+=pl.vy*dt;if(pl.y>=FL){pl.y=FL;pl.vy=0;}
 pl.cd-=dt;pl.cc-=dt;pl.atk-=dt;pl.inv-=dt;
 const w=WP[pl.w];
 if(K.KeyJ&&pl.cd<=0){pl.cd=w.cd;pl.atk=.16;pl.did=0;}
 if(K.KeyK&&pl.cc<=0){pl.cc=.35;cards.push({x:pl.x+pl.dir*20,y:pl.y-50,vx:pl.dir*620,vy:0});}
 if(pl.atk>0&&!pl.did&&phase==='fight'){
  const dx=boss.x-pl.x;
  if(dx*pl.dir>-12&&Math.abs(dx)<boss.w/2+w.rng&&Math.abs(boss.y-pl.y)<80){pl.did=1;hurtB(w.dmg,pl.dir*18);}
 }
}

function upd(dt){
 if(!boss)return;
 if(cutin){cutin.t-=dt;if(cutin.t<=0)cutin=null;}
 teleLines.forEach(t=>t.t-=dt);
 if(phase==='intro'){pt+=dt;if(pt>2.2){phase='fight';say(boss.say[0]);}}
 else if(phase==='clear'){pt+=dt;if(pt>2.4){if(lv+1>=STAGES)end(true);else{phase='shop';renderShop();$('sh').className='ov';}}}
 updPl(dt);
 if(phase==='fight'){
  T+=dt;boss.ai(boss,dt);boss.x=cl(boss.x,32,W-32);
  if(boss.st!==boss.pst){if(boss.st==='tele')say(pick(boss.say));boss.pst=boss.st;}
  if(boss.dmg>0&&pl.inv<=0&&Math.abs(pl.x-boss.x)<boss.w/2+14&&Math.abs(pl.y-boss.y)<60)hurtP(Math.round(boss.dmg*boss.dm),boss.x);
 }
 boss.flash-=dt;boss.sayT-=dt;

  s.x+=s.vx*dt;s.y+=(s.vy||0)*dt;if(s.rot!==undefined)s.rot+=dt*12;

    hurtP(s.dm,s.x);s.dead=1;
   }
  }
  if(s.x<-150||s.x>W+150)s.dead=1;
 }
 shots=shots.filter(s=>!s.dead);

 for(const c of cards){
  c.x+=c.vx*dt;c.y+=(c.vy||0)*dt;
  if(phase==='fight'&&Math.abs(c.x-boss.x)<boss.w/2+12&&c.y>boss.y-100&&c.y<boss.y){
   hurtB(c.ultCard?15:6+cardB,Math.sign(c.vx)*8);c.dead=1;
  }
  if(c.x<-40||c.x>W+40)c.dead=1;
 }
 cards=cards.filter(c=>!c.dead);
 fx.forEach(f=>f.t-=dt);fx=fx.filter(f=>f.t>0);
 ps.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;});ps=ps.filter(p=>p.t>0);
 shake=Math.max(0,shake-dt);
}
   }else if(s.k==='soundRing'){
    if(Math.abs(pl.x-s.x)<s.r)hurtP(s.dm,s.x);
   }else if(s.k==='rock'){
    if(Math.abs(pl.x-s.x)<s.r&&pl.y>=FL-20)hurtP(s.dm,s.x);
   }else if(Math.abs(s.x-pl.x)<s.r+12&&s.y+s.r>pl.y-80&&s.y-s.r<pl.y){
    hurtP(s.dm,s.x);s.dead=1;
   }
  }
  if(s.x<-150||s.x>W+150)s.dead=1;
 }
 shots=shots.filter(s=>!s.dead);

 for(const c of cards){
  c.x+=c.vx*dt;c.y+=(c.vy||0)*dt;
  if(phase==='fight'&&Math.abs(c.x-boss.x)<boss.w/2+12&&c.y>boss.y-100&&c.y<boss.y){
   hurtB(c.ultCard?15:6+cardB,Math.sign(c.vx)*8);c.dead=1;
  }
  if(c.x<-40||c.x>W+40)c.dead=1;
 }
 cards=cards.filter(c=>!c.dead);
 fx.forEach(f=>f.t-=dt);fx=fx.filter(f=>f.t>0);
 ps.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;});ps=ps.filter(p=>p.t>0);
 shake=Math.max(0,shake-dt);
}

}

function drawCutin(){
 if(!cutin)return;
 cx.save();
 cx.fillStyle='rgba(0,0,0,0.7)';cx.fillRect(0,H/2-55,W,110);
 cx.fillStyle='#ffcf33';cx.fillRect(0,H/2-58,W,4);cx.fillRect(0,H/2+54,W,4);
 cx.fillStyle='#fff';cx.font=`900 36px ${FN}`;cx.textAlign='center';
 cx.fillText(cutin.title,W/2,H/2-5);
 cx.fillStyle='#ff4444';cx.font=`800 20px ${FN}`;
 cx.fillText(cutin.kanji+' · '+cutin.sub,W/2,H/2+32);
 cx.restore();
}

function bar(x,y,w,r,c,t,al){
 cx.fillStyle='#000';cx.fillRect(x-3,y-3,w+6,22);cx.fillStyle='#333';cx.fillRect(x,y,w,16);cx.fillStyle=c;cx.fillRect(x,y,w*cl(r,0,1),16);
 cx.fillStyle='#fff';cx.font=`700 12px ${FN}`;cx.textAlign=al;cx.fillText(t,al==='left'?x+6:x+w-6,y+12.5);
}

function hud(){
 bar(14,12,240,pl.hp/pl.max,'#4cd16b','출근러 HP '+pl.hp,'left');
 bar(W-254,12,240,boss.hp/boss.max,'#ef4444',boss.nm+' '+boss.hp,'right');
 bar(14,36,180,pl.ultG/100,pl.ultG>=100?'#ffd700':'#3ba7ff',pl.ultG>=100?'⚡ K-PASS READY (L)':'필살기 게이지 '+Math.floor(pl.ultG)+'%','left');

 cx.fillStyle='#fff';cx.font=`700 12px ${FN}`;cx.textAlign='center';cx.fillText(`STAGE lv+1/{STAGES} · ${T.toFixed(1)}초`,W/2,26);
 cx.textAlign='left';cx.fillText(`🪙 ${gold}  무기: ${WP[pl.w].nm} (1~4)`,14,68);

 if(boss.sayT>0&&boss.txt){
  cx.font=`700 14px ${FN}`;const w=cx.measureText(boss.txt).width+20,x=cl(boss.x,w/2+6,W-w/2-6),y=boss.y-130;
  cx.fillStyle='#111';cx.fillRect(x-w/2-3,y-25,w+6,32);cx.fillStyle='#fff';cx.fillRect(x-w/2,y-22,w,26);cx.fillStyle='#111';cx.textAlign='center';cx.fillText(boss.txt,x,y-4);
 }
 for(const f of fx){cx.globalAlpha=Math.min(1,f.t*2);cx.fillStyle=f.c;cx.font=`800 ${f.big?24:20}px ${FN}`;cx.textAlign='center';cx.fillText(f.s,f.x,f.y-(.8-Math.min(.8,f.t))*40);}
 cx.globalAlpha=1;

 if(phase==='intro'){
  cx.globalAlpha=Math.max(0,Math.min(1,pt*4,(2.2-pt)*4));cx.fillStyle='rgba(0,0,0,.8)';cx.fillRect(0,150,W,120);
  cx.textAlign='center';cx.fillStyle='#ffcf33';cx.font=`800 16px ${FN}`;cx.fillText(`STAGE ${lv+1} / ${STAGES}`,W/2,180);
  cx.fillStyle='#fff';cx.font=`800 40px ${FN}`;cx.fillText(boss.nm,W/2,225);cx.font=`500 15px ${FN}`;cx.fillText(boss.sub,W/2,252);cx.globalAlpha=1;
 }
}

function draw(){
 if(!boss)return;
 cx.setTransform(1,0,0,1,0,0);cx.fillStyle='#060a16';cx.fillRect(0,0,cv.width,cv.height);
 cx.setTransform(S*D,0,0,S*D,OX*D,OY*D);cx.imageSmoothingEnabled=false;
 cx.save();cx.beginPath();cx.rect(0,0,W,H);cx.clip();
 if(shake>0)cx.translate((Math.random()-.5)*26*shake,(Math.random()-.5)*26*shake);
 cx.drawImage(bgOf(Math.min(3,lv>>1)),0,0);
 drawTele();drawImpacts();drawBoss();drawPl();drawShots();drawCutin();hud();cx.restore();
}

spawn(0);phase='menu';('ov').classList.remove('h');('sh').classList.add('h');
let last=performance.now();
function loop(n){
 requestAnimationFrame(loop);
 const dt=Math.min(.033,(n-last)/1000);last=n;
 if(phase==='intro'||phase==='fight'||phase==='clear')upd(dt);
 draw();
}
requestAnimationFrame(loop);
</script>
</body>
