<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>친구 보스전 - 탄막</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f0e4;--ink:#1d2a3a;--mute:#5c6b7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1620;--ink:#e8f1e6;--mute:#93a4b4}}
:root[data-theme="dark"]{--bg:#0d1620;--ink:#e8f1e6;--mute:#93a4b4}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:14px 12px 24px}
.wrap{position:relative;width:100%;max-width:480px;border:3px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;background:#101c2b}
canvas{display:block;width:100%;aspect-ratio:3/4;touch-action:none;cursor:crosshair}
#c3{display:none;position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;cursor:default}
#fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#mg{position:absolute;inset:0;pointer-events:none;display:none}
#mgt{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:20px;color:#fff;text-shadow:0 2px 0 #1d2a3a,0 0 8px #000}
.rg{position:absolute;border:4px solid #fff;border-radius:50%;transform:translate(-50%,-50%);aspect-ratio:1;box-sizing:border-box;display:none}
#rg2{width:14%;border-color:#f2b632}
#tbc{position:absolute;left:5%;bottom:6%;font-family:"Black Han Sans",sans-serif;font-size:clamp(26px,7vw,38px);color:#f0b020;letter-spacing:.04em;text-shadow:-2px -2px 0 #1d1100,2px -2px 0 #1d1100,-2px 2px 0 #1d1100,2px 2px 0 #1d1100;opacity:0;pointer-events:none;transform:translateX(-30px);transition:opacity .8s,transform .8s}
#tbc.on{opacity:1;transform:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 20px 22px;text-align:center;color:#e8f1e6;background:rgba(10,16,26,.78)}
.ov.ready{background:linear-gradient(rgba(10,16,26,.25) 0%,rgba(10,16,26,0) 30%,rgba(10,16,26,0) 55%,rgba(10,16,26,.8) 100%)}
.ov[hidden]{display:none}
#ttl{font-family:"Black Han Sans","Apple SD Gothic Neo",sans-serif;font-weight:400;font-size:clamp(40px,12vw,58px);line-height:1.1;margin:0;color:#f2b632;text-shadow:3px 3px 0 #6b1d2c}
#sub{margin:4px 0 0;font-size:18px;color:#c9d6c6}
.bot{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.seg{display:flex;gap:8px}
button{font:inherit;color:#e8f1e6;background:#1b2836;border:3px solid #e8f1e6;border-radius:6px;padding:8px 16px;cursor:pointer;box-shadow:3px 3px 0 #e8f1e6}
button[aria-pressed="true"]{background:#e8f1e6;color:#1d2a3a}
button:active{transform:translate(3px,3px);box-shadow:none}
button:focus-visible{outline:3px solid #f2b632;outline-offset:2px}
#go{background:#f2b632;color:#1d2a3a;border-color:#1d2a3a;box-shadow:4px 4px 0 #e8f1e6;font-size:24px;padding:10px 40px}
.help{margin:0;font-size:15px;color:#a9b9c8}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div class="wrap">
<canvas id="c" width="480" height="640" tabindex="0" aria-label="친구 보스전 게임 화면"></canvas>
<canvas id="c3" width="480" height="640" aria-hidden="true"></canvas>
<div id="fl"></div>
<div id="mg"><div id="mgt"></div><div class="rg" id="rg1"></div><div class="rg" id="rg2"></div></div>
<div id="tbc">▶ TO BE CONTINUED</div>
<div class="ov ready" id="ov">
  <div><h1 id="ttl">친구</h1><p id="sub" style="color:#ff8a78">속보: 친구가 지구를 침략했다!</p></div>
  <div class="bot">
    <div class="seg" id="seg" role="group" aria-label="난이도">
      <button data-d="0" aria-pressed="false">쉬움</button>
      <button data-d="1" aria-pressed="true">보통</button>
      <button data-d="2" aria-pressed="false">어려움</button>
    </div>
    <button id="go">게임 시작</button>
    <p class="help">WASD 이동, 공격은 자동<br>터치는 화면 드래그</p>
  </div>
</div>
</div>
<script>
(function(){
var cv=document.getElementById("c"),g=cv.getContext("2d"),W=480,H=640;
var ov=document.getElementById("ov"),ttl=document.getElementById("ttl"),sub=document.getElementById("sub"),go=document.getElementById("go");
var keys={},st="ready",diff=1,LIVES=[7,5,3],SPD=[0.85,1,1.2];
var P={x:W/2,y:H-90,r:4,fire:0},B={x:W/2,y:150,hp:2400,max:2400,t:0},bul=[],shots=[],t=0,clk=0,cd=1,pat=-1,lives=5,maxL=5,inv=0,flash=0;
var PATS=[["ring","aim","trace","rain"],["ring","aim","trace","rain","summon","cross","spiral","wall"],["ring","aim","trace","rain","summon","cross","spiral","wall","grid","flower","wave"]],NEWP=[0,4,8],K=[1,1.35,1.6],BS=[1,1.08,1.12],PLEN=6,stars=[],phase=1,pi=0,ptm=0,banner=0,lasers=[],dt0=0,parts=[],em=0,bursted=false,minions=[],smn=0,ox=-1,oy=0,use3d=false;
for(var q=0;q<45;q++)stars.push([Math.random()*W,Math.random()*H,Math.random()*1.6+0.4]);
function rnd(a,b){return a+Math.random()*(b-a)}
function start(){
  P={x:W/2,y:H-90,r:4,fire:0};B={x:W/2,y:150,hp:2400,max:2400,t:0};
  bul=[];shots=[];t=0;cd=1;phase=1;pi=0;ptm=0;banner=1.5;lasers=[];dt0=0;parts=[];em=0;bursted=false;minions=[];smn=0;ox=-1;use3d=false;document.getElementById("c3").style.display="none";document.getElementById("fl").style.opacity=0;if(T3.reset)T3.reset();maxL=lives=LIVES[diff];inv=0;flash=0;st="play";ov.hidden=true;cv.focus();
}
function showOv(win){
  st=win?"win":"lose";ov.hidden=false;ov.className="ov";
  sub.style.color="";ttl.textContent=win?"승리!":"패배...";sub.textContent=win?"친구를 쓰러뜨렸다":"친구는 아직 건재하다";go.textContent="다시 도전";
}
function laser(x,y,a,w,warn,fire,o){o=o||{};lasers.push({x:x,y:y,a:a,w:w,warn:warn,fire:fire,t:0,ray:!!o.ray,track:!!o.track,off:o.off||0})}
function spawn(x,y,a,s,c){s*=SPD[diff]*BS[phase-1];bul.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:c||0})}
function boss(dt){
  var ph=B.hp<B.max/3?3:(B.hp<B.max*2/3?2:1),k=K[ph-1],list=PATS[ph-1];
  if(ph!==phase){phase=ph;pi=NEWP[ph-1];ptm=0;cd=1.4;banner=2.2;bul=[];lasers=[]}
  B.t+=dt;B.x=W/2+Math.sin(B.t*0.6*(1+(ph-1)*0.25))*(110+ph*25);
  if(minions.length)return;
  ptm+=dt;if(ptm>=PLEN){ptm=0;pi=(pi+1)%list.length;cd=0.8}
  cd-=dt;if(cd>0)return;
  var pn=list[pi],n,a,i;
  if(pn==="ring"){
    cd=1.1/k;n=14+ph*4;a=rnd(0,6.28);
    for(i=0;i<n;i++)spawn(B.x,B.y,a+i*6.283/n,100+ph*10,0);
  }else if(pn==="aim"){
    cd=0.85/k;a=Math.atan2(P.y-B.y,P.x-B.x);n=1+ph;
    for(i=-n;i<=n;i++)spawn(B.x,B.y,a+i*0.17,165+ph*8,1);
  }else if(pn==="spiral"){
    cd=0.07/k;B.sa=(B.sa||0)+0.33;
    spawn(B.x,B.y,B.sa,125,2);spawn(B.x,B.y,B.sa+3.14,125,2);
    if(ph>=3)spawn(B.x,B.y,B.sa+1.57,125,2);
  }else if(pn==="wall"){
    cd=1.5/k;var gx=rnd(60,W-60),gw=ph>=3?78:85;
    for(i=0;i<W;i+=14){if(Math.abs(i-gx)>gw/2)spawn(i,-6,1.57,120,1)}
  }else if(pn==="flower"){
    cd=1.3/k;a=rnd(0,6.28);
    for(i=0;i<20;i++){spawn(B.x,B.y,a+i*0.314,95,2);spawn(B.x,B.y,a+i*0.314+0.157,150,0)}
  }else if(pn==="wave"){
    cd=0.09/k;B.wa=(B.wa||0)+0.12;
    spawn(B.x,B.y,1.57+Math.sin(B.wa)*0.9,170,3);
  }else if(pn==="summon"){
    bul=[];lasers=[];ptm=PLEN;cd=1;smn=1.6;
    for(i=0;i<3;i++)minions.push({x:B.x+(i-1)*70,y:B.y+70,hp:12,mx:12,fl:0,s:0,t:-i*0.45,a:1.57,vx:0,vy:0});
  }else if(pn==="trace"){
    cd=2.3/k;a=Math.atan2(P.y-B.y,P.x-B.x);
    laser(B.x,B.y,a,34,1.4,0.45,{ray:1,track:1});
    if(ph>=3)laser(B.x,B.y,a+0.5,34,1.4,0.45,{ray:1,track:1,off:0.5});
  }else if(pn==="cross"){
    cd=2.4/k;laser(P.x,P.y,0,40,1.2,0.5);laser(P.x,P.y,1.5708,40,1.2,0.5);
    if(ph>=3){var rx=rnd(80,W-80),ry=rnd(200,H-100);laser(rx,ry,0.7854,36,1.4,0.5);laser(rx,ry,-0.7854,36,1.4,0.5)}
  }else if(pn==="grid"){
    cd=3.2/k;var gx0=rnd(40,100),gy0=rnd(190,240),j;
    for(j=0;j<4;j++)laser(gx0+j*125,0,1.5708,34,1.6,0.5);
    for(j=0;j<3;j++)laser(0,gy0+j*140,0,34,1.6,0.5);
  }else{
    cd=0.11/k;spawn(rnd(10,W-10),-6,1.57,rnd(140,220),3);
  }
}
function update(dt){
  t+=dt;
  var sp=250*dt,dx=0,dy=0,i;
  if(keys.a||keys.arrowleft)dx--;
  if(keys.d||keys.arrowright)dx++;
  if(keys.w||keys.arrowup)dy--;
  if(keys.s||keys.arrowdown)dy++;
  if(dx&&dy)sp*=0.7071;
  P.x=Math.max(10,Math.min(W-10,P.x+dx*sp));
  P.y=Math.max(14,Math.min(H-14,P.y+dy*sp));
  P.fire-=dt;
  if(P.fire<=0){P.fire=0.11;shots.push({x:P.x-6,y:P.y-12},{x:P.x+6,y:P.y-12})}
  for(i=shots.length-1;i>=0;i--){
    var s=shots[i];s.y-=620*dt;
    var hitM=false;for(var mi=0;mi<minions.length;mi++){var mn=minions[mi];if(Math.abs(s.x-mn.x)<18&&Math.abs(s.y-mn.y)<18){mn.hp--;mn.fl=0.1;hitM=true;break}}
    if(hitM){shots.splice(i,1);continue}
    if(Math.abs(s.x-B.x)<48&&s.y<B.y+40&&s.y>B.y-44){if(!minions.length){B.hp-=4;flash=0.06}shots.splice(i,1);continue}
    if(s.y<-10)shots.splice(i,1);
  }
  boss(dt);
  mins(dt);if(st!=="play")return;
  inv-=dt;flash-=dt;banner-=dt;smn-=dt;
  for(i=bul.length-1;i>=0;i--){
    var b=bul[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){bul.splice(i,1);continue}
    var ddx=b.x-P.x,ddy=b.y-P.y;
    if(inv<=0&&ddx*ddx+ddy*ddy<(5+P.r)*(5+P.r)){lives--;inv=1.4;bul.splice(i,1);if(lives<=0){showOv(false);return}}
  }
  for(i=lasers.length-1;i>=0;i--){
    var L=lasers[i];L.t+=dt;
    if(L.track&&L.t<L.warn-0.4){L.x=B.x;L.y=B.y;var d=Math.atan2(P.y-B.y,P.x-B.x)+L.off-L.a;d=Math.atan2(Math.sin(d),Math.cos(d));var m=3.2*dt;L.a+=Math.max(-m,Math.min(m,d))}
    if(L.t>=L.warn+L.fire){lasers.splice(i,1);continue}
    if(L.t>=L.warn&&inv<=0){
      var lx=P.x-L.x,ly=P.y-L.y,al=lx*Math.cos(L.a)+ly*Math.sin(L.a),pp=-lx*Math.sin(L.a)+ly*Math.cos(L.a);
      if(Math.abs(pp)<L.w/2+P.r&&(!L.ray||al>0)){lives--;inv=1.4;if(lives<=0){showOv(false);return}}
    }
  }
  if(B.hp<=0)startFinale();
}
var PC=["#ffd23f","#ff7a59","#ffffff","#8a2f86"];
function part(x,y,sp){var a=rnd(0,6.283),s=rnd(30,sp*70);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(0.6,1.2),max:1.2,r:rnd(2,6),c:PC[Math.floor(rnd(0,4))]})}
function stepParts(dt){for(var i=parts.length-1;i>=0;i--){var q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=140*dt;q.life-=dt;if(q.life<=0)parts.splice(i,1)}}
function mins(dt){
  var i,m,a,dx,dy;
  for(i=minions.length-1;i>=0;i--){
    m=minions[i];m.t+=dt;m.fl-=dt;
    if(m.hp<=0){for(a=0;a<14;a++)part(m.x,m.y,3);minions.splice(i,1);continue}
    if(m.s===0){
      m.y+=Math.sin(clk*8+i)*0.4;
      if(m.t<0.65)m.a=Math.atan2(P.y-m.y,P.x-m.x);
      if(m.t>=0.9){m.s=1;m.t=0;m.vx=Math.cos(m.a)*360;m.vy=Math.sin(m.a)*360}
    }else{
      m.x+=m.vx*dt;m.y+=m.vy*dt;
      if(m.t>1.2||m.x<-30||m.x>W+30||m.y<-30||m.y>H+30){m.s=0;m.t=-0.2;m.x=Math.max(20,Math.min(W-20,m.x));m.y=Math.max(30,Math.min(H-30,m.y))}
    }
    dx=m.x-P.x;dy=m.y-P.y;
    if(dx*dx+dy*dy<(14+P.r)*(14+P.r)){lives--;inv=0.6;for(a=0;a<10;a++)part(m.x,m.y,3);minions.splice(i,1);if(lives<=0){showOv(false);return}}
  }
  stepParts(dt);
}
function dying(dt){
  dt0+=dt;banner=0;shots=[];bul=[];
  var sp=dt0<1.8?250*dt:0,i;
  P.x=Math.max(10,Math.min(W-10,P.x+((keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0))*sp));
  P.y=Math.max(14,Math.min(H-14,P.y+((keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0))*sp));
  if(dt0<2.6){em-=dt;if(em<=0){em=0.09;for(i=0;i<2;i++)part(B.x+rnd(-50,50),B.y+rnd(-50,50),3)}}
  else if(!bursted){bursted=true;for(i=0;i<240;i++)part(B.x,B.y,9);ox=Math.max(130,Math.min(W-130,P.x));oy=Math.max(200,P.y-175)}
  stepParts(dt);
  if(dt0>=(use3d?19.5:6)){parts=[];showOv(true);document.getElementById("tbc").className="";sub.textContent=use3d?"지킨 건물 "+saved+"/5 · TO BE CONTINUED":"그런데... 더 큰 무언가가 나타났다"}
}
var COL=["#ff7a59","#ffd23f","#7be0c3","#ffffff"];
function drawBoss(x,y,s,ph,tt,fl,lx,ly,nm){
  var i,k,r,a,rage=ph>=2,body=fl?"#ffffff":["#5b3f8c","#8a2f86","#9c1f33"][ph-1];
  g.save();g.translate(x,y);g.scale(s,s);g.lineJoin="round";g.lineCap="round";
  g.strokeStyle=rage?"#6d1424":"#3f2a68";g.lineWidth=7;
  for(i=-2;i<=2;i++){ // 촉수
    if(i===0)continue;
    g.beginPath();g.moveTo(i*22,28);
    g.quadraticCurveTo(i*40+Math.sin(tt*3+i)*10,62,i*34+Math.sin(tt*2.4+i*2)*16,84);g.stroke();
  }
  g.fillStyle="#e8dcc0";g.strokeStyle="#1d2a3a";g.lineWidth=4; // 뿔
  [-1,1].forEach(function(d){g.beginPath();g.moveTo(d*22,-40);g.quadraticCurveTo(d*50,-56,d*48,-92);g.quadraticCurveTo(d*32,-62,d*10,-46);g.closePath();g.fill();g.stroke()});
  g.beginPath(); // 가시 몸통
  for(k=0;k<28;k++){r=k%2?42:56+Math.sin(tt*4+k)*2.5;a=k/28*6.283;
    var px=Math.cos(a)*r*1.05,py=Math.sin(a)*r*0.95;if(k)g.lineTo(px,py);else g.moveTo(px,py)}
  g.closePath();g.fillStyle=body;g.fill();g.stroke();
  g.fillStyle=rage?"#ff5a4a":"#f2b632";g.font="18px 'Black Han Sans',sans-serif";g.textAlign="center";g.fillText("찬",0,-30);
  var eyes=rage?[[-26,-10,9],[26,-10,9],[0,-14,14],[-12,6,6],[12,6,6]]:[[-24,-8,8],[24,-8,8],[0,-12,13]];
  for(i=0;i<eyes.length;i++){var e=eyes[i];
    g.fillStyle=rage?"#ffe27a":"#f7f3d8";g.beginPath();g.arc(e[0],e[1],e[2],0,6.283);g.fill();g.stroke();
    var dx=lx-x,dy=ly-y,d=Math.sqrt(dx*dx+dy*dy)||1,m=e[2]*0.4;
    g.fillStyle="#1d2a3a";g.beginPath();g.arc(e[0]+dx/d*m,e[1]+dy/d*m,e[2]*0.45,0,6.283);g.fill()}
  g.strokeStyle="#1d2a3a";g.lineWidth=5; // 성난 눈썹
  g.beginPath();g.moveTo(-38,-26);g.lineTo(-12,-18);g.moveTo(38,-26);g.lineTo(12,-18);g.stroke();
  var open=rage?18:12+Math.sin(tt*5)*3; // 입과 이빨
  g.beginPath();g.moveTo(-32,16);g.quadraticCurveTo(0,16+open*2,32,16);g.quadraticCurveTo(0,10,-32,16);g.closePath();
  g.fillStyle="#1a0d18";g.fill();g.lineWidth=3;g.stroke();
  g.fillStyle="#f7f3d8";
  for(i=-3;i<=3;i++){g.beginPath();g.moveTo(i*9-4,15);g.lineTo(i*9+4,15);g.lineTo(i*9,15+8);g.fill()}
  for(i=-2;i<=2;i++){g.beginPath();g.moveTo(i*11-4,16+open*1.5);g.lineTo(i*11+4,16+open*1.5);g.lineTo(i*11,16+open*1.5-8);g.fill()}
  if(nm){g.textAlign="center";g.font="28px 'Black Han Sans','Apple SD Gothic Neo',sans-serif";g.lineWidth=7;g.strokeStyle="#1d2a3a";g.strokeText("친구",0,-100);g.fillStyle=ph>=3?"#ff6b52":"#f2b632";g.fillText("친구",0,-100)}
  g.restore();
}
var T3={ok:false},saved=0;
function init3(){
  if(T3.ok)return true;
  if(typeof THREE==='undefined')return false;
  try{
    var i,k,j,c3=document.getElementById('c3'),fl=document.getElementById('fl'),mg=document.getElementById('mg'),mgt=document.getElementById('mgt'),rg1=document.getElementById('rg1'),rg2=document.getElementById('rg2'),tbc=document.getElementById('tbc');
    var RN=new THREE.WebGLRenderer({canvas:c3,antialias:true});
    RN.setSize(480,640,false);RN.setClearColor(0x070b16,1);
    var S=new THREE.Scene();S.fog=new THREE.Fog(0x070b16,40,170);
    var C=new THREE.PerspectiveCamera(58,480/640,0.1,300);
    S.add(new THREE.AmbientLight(0x7080b0,0.75));
    var dl=new THREE.DirectionalLight(0xaabbff,0.8);dl.position.set(-10,30,20);S.add(dl);
    var rl=new THREE.PointLight(0xff2030,0,70),kl=new THREE.PointLight(0x70c8c0,0,90);S.add(rl);S.add(kl);

  if(st==="dying"){if(dt0<2.6){var sh=2+dt0*4,sc=1+Math.min(dt0,2.2)*0.28,ag=g.createRadialGradient(B.x,B.y,10,B.x,B.y,230);ag.addColorStop(0,"rgba(255,40,40,.6)");ag.addColorStop(1,"rgba(255,40,40,0)");g.fillStyle=ag;g.fillRect(0,0,W,H);drawBoss(B.x+rnd(-sh,sh),B.y+rnd(-sh,sh),sc,3,clk,dt0>0.5&&Math.floor(dt0*(8+dt0*6))%2===0,P.x,P.y,dt0<0.9)}}
  else if(B.hp>0)drawBoss(B.x,B.y+Math.sin(clk*2)*4,1,phase,clk,flash>0,P.x,P.y,true);
  if(minions.length&&st!=="dying"){g.strokeStyle="rgba(120,220,255,.85)";g.lineWidth=4;g.beginPath();g.arc(B.x,B.y,82+Math.sin(clk*8)*3,0,6.283);g.stroke();g.fillStyle="rgba(120,220,255,.12)";g.fill()}
  for(i=0;i<minions.length;i++){var m=minions[i];
    if(m.s===0&&m.t>=0){g.strokeStyle="rgba(255,90,70,"+(0.25+0.5*m.t)+")";g.lineWidth=2+m.t*10;g.beginPath();g.moveTo(m.x,m.y);g.lineTo(m.x+Math.cos(m.a)*420,m.y+Math.sin(m.a)*420);g.stroke()}
    drawBoss(m.x,m.y,0.32,2,clk+i,m.fl>0,P.x,P.y,false);
    g.fillStyle="#2a3b50";g.fillRect(m.x-18,m.y-28,36,6);g.fillStyle="#ffd23f";g.fillRect(m.x-18,m.y-28,36*Math.max(0,m.hp)/m.mx,6)}
  for(i=0;i<lasers.length;i++){var L=lasers[i],on=L.t>=L.warn,x0=L.ray?0:-1400,ln=1400-x0;
    g.save();g.translate(L.x,L.y);g.rotate(L.a);
    if(!on){var bl=Math.abs(Math.sin(L.t*(10+L.t*8)));g.fillStyle="rgba(228,83,61,"+(0.14+0.2*bl)+")";g.fillRect(x0,-L.w/2,ln,L.w);g.strokeStyle="rgba(255,130,110,.8)";g.lineWidth=2;g.setLineDash([12,8]);g.strokeRect(x0,-L.w/2,ln,L.w)}
    else{g.fillStyle="#e4533d";g.fillRect(x0,-L.w/2,ln,L.w);g.fillStyle="#fff2e0";g.fillRect(x0,-L.w*0.2,ln,L.w*0.4)}
    g.restore()}
  for(i=0;i<bul.length;i++){var b=bul[i];g.fillStyle=COL[b.c];g.beginPath();g.arc(b.x,b.y,5,0,6.283);g.fill()}
  g.fillStyle="#7be0c3";
  for(i=0;i<shots.length;i++)g.fillRect(shots[i].x-2,shots[i].y-8,4,12);
  drawHero(P.x,P.y,inv>0&&Math.floor(clk*20)%2===0);
  g.fillStyle="#2a3b50";g.fillRect(16,10,W-32,10);
  g.fillStyle="#e4533d";g.fillRect(16,10,(W-32)*Math.max(0,B.hp)/B.max,10);
  g.fillStyle="#101c2b";g.fillRect(16+(W-32)/3-1,8,3,14);g.fillRect(16+(W-32)*2/3-1,8,3,14);
  g.textAlign="left";g.font="18px Jua,sans-serif";g.fillStyle="#e8f1e6";
  var h="";for(i2=0;i2<maxL;i2++)h+=i2<lives?"♥ ":"♡ ";
  g.fillText(h,16,H-14);
  g.textAlign="right";g.fillText(phase>=3?"마지막 페이즈":"페이즈 "+phase,W-16,H-14);
  if(banner>0){g.save();g.globalAlpha=Math.min(1,banner);g.textAlign="center";g.font="46px 'Black Han Sans',sans-serif";g.lineWidth=8;g.strokeStyle="#1d2a3a";g.fillStyle=phase>=3?"#ff6b52":"#f2b632";var bt=phase>=3?"마지막 페이즈":phase+"페이즈";g.strokeText(bt,W/2,H/2);g.fillText(bt,W/2,H/2);g.restore()}
  if(minions.length&&st==="play"){g.textAlign="center";g.font="17px Jua,sans-serif";g.fillStyle="#7be0c3";g.fillText("부하를 처치하세요! 친구는 무적",W/2,H-40)}
  if(smn>0){g.save();g.globalAlpha=Math.min(1,smn);g.textAlign="center";g.font="42px 'Black Han Sans',sans-serif";g.lineWidth=8;g.strokeStyle="#1d2a3a";g.fillStyle="#7be0c3";g.strokeText("부하 소환!",W/2,H/2-60);g.fillText("부하 소환!",W/2,H/2-60);g.restore()}
  for(i=0;i<parts.length;i++){var pr=parts[i];g.globalAlpha=Math.max(0,pr.life/pr.max);g.fillStyle=pr.c;g.beginPath();g.arc(pr.x,pr.y,pr.r,0,6.283);g.fill()}
  g.globalAlpha=1;
  if(st==="dying"&&!use3d)finale();
  if(st==="win"&&ox>=0&&!use3d)drawOverlord(ox,oy,1.15,clk,1);
  if(false){var fa=1-(dt0-2.4)/0.6;if(fa>0){g.fillStyle="rgba(255,255,255,"+fa+")";g.fillRect(0,0,W,H)}
    if(dt0>2.9){g.save();g.globalAlpha=Math.min(1,(dt0-2.9)*2);g.textAlign="center";g.font="46px 'Black Han Sans',sans-serif";g.lineWidth=8;g.strokeStyle="#1d2a3a";g.fillStyle="#f2b632";g.strokeText("친구 격파!",W/2,H/2-20);g.fillText("친구 격파!",W/2,H/2-20);g.restore()}}
}
var last=0;
function loop(ts){
  var dt=Math.min(0.033,(ts-last)/1000||0);last=ts;clk+=dt;
  if(st==="play")update(dt);else if(st==="dying")dying(dt);
  draw();
  if(use3d&&(st==="dying"||st==="win")){var ct=st==="dying"?dt0-2:17.6;if(ct>=0)T3.render(ct,dt)}
  requestAnimationFrame(loop);
}
function key(e,v){
  var k=e.key.toLowerCase(),cm={KeyW:"w",KeyA:"a",KeyS:"s",KeyD:"d",KeyM:"m"};if(cm[e.code])k=cm[e.code];
  if(k.length===1&&"wasd".indexOf(k)>-1||k.indexOf("arrow")===0){keys[k]=v;e.preventDefault()}
  if(v&&k==="m"&&st==="play")startFinale();
  if(v&&k===" "&&st==="dying"){e.preventDefault();if(T3.tap)T3.tap()}
  if(v&&k==="enter"&&st!=="play"&&st!=="dying"){e.preventDefault();start()}
}
window.addEventListener("keydown",function(e){key(e,true)});
window.addEventListener("keyup",function(e){key(e,false)});
window.addEventListener("blur",function(){keys={}});
go.onclick=start;
document.querySelector(".wrap").addEventListener("pointerdown",function(){if(st==="dying"&&T3.tap)T3.tap()});
document.getElementById("seg").addEventListener("click",function(e){
  var d=e.target.getAttribute("data-d");if(d===null)return;diff=+d;
  var bs=this.children;for(var i=0;i<bs.length;i++)bs[i].setAttribute("aria-pressed",String(i===diff));
});
function pt(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function drag(e){if(st!=="play"||e.pointerType==="mouse")return;var p=pt(e);P.x=Math.max(10,Math.min(W-10,p.x));P.y=Math.max(14,Math.min(H-14,p.y-50))}
cv.addEventListener("pointerdown",drag);cv.addEventListener("pointermove",function(e){if(e.buttons)drag(e)});
requestAnimationFrame(loop);
})();
</script>
