function adv(n){let r=0,nb=[0,0,0];for(let i=2;i>=0;i--)if(bases[i]){const p=i+1+n;p>=4?r++:nb[p-1]=1}n>=4?r++:nb[n-1]=1;bases=nb;runs+=mode==='B'?r:r;newBatter()}
function walk(){const[a,b,c]=bases;if(a&&b&&c)runs++;if(a&&b)bases[2]=1;if(a)bases[1]=1;bases[0]=1;newBatter()}
function addStrike(foul){if(foul&&strikes>=2)return;strikes++;if(strikes>=3){say('삼진 아웃!');out()}}
 
// ---- pitching
function aiPitch(){const c=strikes,r=Math.random(),types=Object.keys(P),t=types[Math.random()<.5?0:1+Math.floor(Math.random()*3)];
const inZ=balls>=3||r<.55;let x,y;if(inZ){x=gs()*.13;y=.8+gs()*.16}else{const a=Math.random()*6.28;x=Math.cos(a)*(.4+Math.random()*.25);y=.8+Math.sin(a)*(.45+Math.random()*.2)}
startPitch(t,x,Math.max(.2,y))}
function startPitch(type,tx,ty){const p=P[type],pl=mode==='P';st='WINDUP';wind=performance.now();swung=false;plan=null;
const kmh=Math.round(p.v+(Math.random()-.5)*6+(pl?0:DF.spd[dif]));
cur={type,kmh,dur:17.4/(kmh/3.6)*DF.ts[dif],x:tx+(pl?gs()*p.j:0),y:ty+(pl?gs()*p.j:0),b:[p.b[0]+(Math.random()-.5)*.1,p.b[1]+(Math.random()-.5)*.1]}}
function release(now){st='PITCH';cur.t0=now;arm.rotation.x=0;shadow.scale.setScalar(1);ball.visible=shadow.visible=true;$('last').textContent=P[cur.type].n+' '+cur.kmh+'km/h';drawBoard();
if(mode==='P'){plan=aiPlan(cur);if(!plan.bunt&&outs<2&&((bases[0]&&!bases[1])||(bases[1]&&!bases[2]))&&Math.random()<(cur.kmh<130?.2:.1)){stealing=true;sub('주자 스타트!')}}}
const S0=new THREE.Vector3(.3,1.75,-17.5);
function dz(x,y){return Math.hypot(Math.max(0,Math.abs(x)-.26),Math.max(0,Math.abs(y-.8)-.34))}
function aiPlan(c){if((bases[0]||bases[1])&&outs<2&&Math.random()<.1)return{sw:true,bunt:true,res:Math.random()<.8?{bunt:true,q:Math.random()}:null,started:false};const d=dz(c.x,c.y),two=strikes>=2,cn=Math.hypot(c.x/.26,(c.y-.8)/.34);
const sp=d===0?(two?.9:.65):d<.15?(two?.55:.3):d<.3?.12:.03,sw=Math.random()<sp;
const cp=cl(.8+DF.sk[dif]-P[c.type].pen-d*1.2-Math.min(cn,1.6)*.1,.1,.85);let res=null;
if(sw&&Math.random()<cp){const cen=Math.max(0,1-cn/1.6),q=Math.random()*(.6+.4*cen);let s=(Math.random()+Math.random()+Math.random()-1.5)*50;if(q<.2)s*=1.6;res={q,spray:s}}
return{sw,res,started:false}}
function playerContact(bunt){const W=DF.win[dif]*(bunt?1.3:1),c=cur,diff=swingAt-(c.t0+c.dur*1000);
if(Math.abs(diff)>W||Math.abs(c.x)>.55||c.y<.2||c.y>1.5)return{miss:diff};
const tq=1-Math.abs(diff)/W;if(bunt)return{bunt:true,q:cl(tq*.9+Math.random()*.1,0,1),diff};const lq=1-Math.min(1,Math.hypot(c.x,c.y-.8)/.6);
return{q:cl(.6*tq+.4*lq+(Math.random()-.5)*.15,0,1),spray:diff/W*55+(Math.random()-.5)*16,diff}}
function arrive(){ball.visible=shadow.visible=false;const c=cur,d=dz(c.x,c.y),inZ=d===0,stl=stealing,o0=outs;stealing=false;
const sw=mode==='B'?swung:plan.sw;
if(sw){const r=mode==='B'?playerContact(swingBunt):plan.res;if(r&&r.bunt)return doBunt(r);
 if(r&&r.q!==undefined)return doHit(r);
 tone(200,.15);say('헛스윙!',mode==='B'&&r&&r.miss!==undefined?(r.miss<0?'너무 빨랐어요':'너무 늦었어요'):'');addStrike();
}else if(inZ){tone(300,.12);say('스트라이크!');addStrike()}
else{tone(180,.12);say('볼');balls++;if(balls>=4){say('볼넷!');walk()}}
if(stl&&balls+strikes>0&&outs>=o0)doSteal(c.kmh);after(1300)}
function pick(a){let r=Math.random()*a.reduce((s,x)=>s+x[0],0);for(const x of a){if((r-=x[0])<=0)return x[1]}return a[0][1]}
function outcome(q){if(q<.3)return pick([[8,'GROUND'],[2,'SINGLE']]);if(q<.5)return pick([[5,'FLY'],[3,'SINGLE'],[2,'GROUND']]);
if(q<.7)return pick([[2,'FLY'],[4.5,'SINGLE'],[3.5,'DOUBLE']]);if(q<.88)return pick([[2,'FLY'],[2.5,'SINGLE'],[3.3,'DOUBLE'],[.7,'TRIPLE'],[1.5,'HR']]);
return pick([[1,'FLY'],[1,'SINGLE'],[2.5,'DOUBLE'],[.5,'TRIPLE'],[5,'HR']])}
function doHit(r){let o=outcome(r.q),s=r.spray,ap=10,d=40,gr=false;
if(Math.abs(s)>45)o='FOUL';else s=cl(s,-44,44);const a=s*Math.PI/180;let e;
if(o==='HR'){d=108+Math.random()*12;ap=28+Math.random()*10}
else if(o==='TRIPLE'){d=88+Math.random()*8;ap=18}
else if(o==='DOUBLE'){d=68+Math.random()*14;ap=r.q>.6?14:6}
else if(o==='SINGLE'){d=32+Math.random()*25;gr=r.q<.5;ap=gr?1.1:4+Math.random()*3}
else if(o==='FOUL'){d=20+Math.random()*30;gr=r.q<.4;ap=gr?1.2:12}
else{const fly=o==='FLY',L=FD.filter(f=>!!f[2]===fly);let f=L[0],bd=9;L.forEach(g=>{const da=Math.abs(Math.atan2(g[0],-g[1])*180/Math.PI-s);if(da<bd){bd=da;f=g}});
 e=new THREE.Vector3(f[0],0,f[1]);d=Math.hypot(f[0],f[1]);gr=!fly;ap=fly?25:1}
e=e||new THREE.Vector3(d*Math.sin(a),0,-d*Math.cos(a));
const dur=Math.max(gr?d/20:2*Math.sqrt(2*ap/G)*.85,d/32);
hit={e,ap,dur,gr,o,t0:performance.now(),d};st='HIT';if(OUTS[o][0]>0){toss();cheerT=performance.now()+(o==='HR'?3500:1800)}tone(900,.06);tone(160,.1,'sawtooth',.15);if(o==='HR')setTimeout(()=>{tone(523,.15);tone(659,.15);tone(784,.3)},300);
say(OUTS[o][1],r.diff!==undefined?(Math.abs(r.diff)<25?'퍼펙트 타이밍!':r.diff<0?'빠른 타이밍 (당겨침)':'늦은 타이밍 (밀어침)'):'')}
function doBunt(r){const o=r.q<.25?'FOUL':pick([[8.5,'SAC'],[1.5,'BUNTHIT']]),a=(Math.random()-.5)*.9,d=5+Math.random()*7;
hit={e:new THREE.Vector3(d*Math.sin(a),0,-d*Math.cos(a)),ap:.3,dur:d/6,gr:true,o,t0:performance.now(),d,bk:true};st='HIT';tone(300,.08);
say(o==='FOUL'?'파울 번트':o==='SAC'?(bases[0]||bases[1]||bases[2]?'희생번트':'번트 아웃'):'번트 안타!')}
function finishHit(){const o=hit.o;ball.visible=shadow.visible=false;
if(o==='FOUL')addStrike(!hit.bk);else if(o==='SAC'){if(outs<2)advRun();out()}else if(o==='GROUND'&&bases[0]&&outs<2&&Math.random()<(mode==='B'?[.3,.5,.65][dif]:[.65,.5,.3][dif])){say('병살타!');bases[0]=0;out();out()}else if(o==='FLY'||o==='GROUND')out();else adv(OUTS[o][0]);
hit=null;after(1500)}
 
// ---- swing
function swing(b){if(mode!=='B'||st!=='PITCH'||swung)return;swung=true;swingBunt=!!b;swingAt=performance.now()+100;swingT=performance.now()}
 
// ---- input
renderer.domElement.addEventListener('pointermove',e=>{if(mode==='P')aimAt(e)});
renderer.domElement.addEventListener('pointerdown',e=>{if(st==='OVER')return;if(mode==='P'){aimAt(e);if(st==='READY')startPitch(sel,aim.x,aim.y)}else swing()});
const ray=new THREE.Raycaster(),pln=new THREE.Plane(new THREE.Vector3(0,0,1),0),mv=new THREE.Vector2(),hp=new THREE.Vector3();
function aimAt(e){mv.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mv,camera);
if(ray.ray.intersectPlane(pln,hp)){aim.x=cl(hp.x,-1,1);aim.y=cl(hp.y,.1,1.7);ret.position.set(aim.x,aim.y,0)}}
function pitchSel(k){sel=k;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('a',b.dataset.p===k))}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>pitchSel(b.dataset.p));
$('sw').onpointerdown=e=>{e.stopPropagation();swing()};
('stl').onclick=armSteal;('pk').onclick=pickoff;$('bt').onpointerdown=e=>{e.stopPropagation();swing(true)};
('zn').onclick=()=>zoneOn=!zoneOn;('menu').onclick=showMenu;
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();swing()}
else if('1234'.includes(e.key)&&mode==='P')pitchSel(Object.keys(P)[+e.key-1]);else if(e.key==='z'||e.key==='Z')zoneOn=!zoneOn;else if(e.key==='b'||e.key==='B')swing(true);else if(e.key==='s'||e.key==='S')armSteal();else if(e.key==='q'||e.key==='Q')pickoff()});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 
// ---- loop
const lookV=new THREE.Vector3(0,1,-18),tv=new THREE.Vector3();let last=performance.now();
function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
if(st==='WINDUP'){const p=(now-wind)/600;arm.rotation.x=Math.min(p,1)*5.9;if(p>=1)release(now)}
if(st==='PITCH'){const c=cur,t=(now-c.t0)/(c.dur*1000);
 if(mode==='P'&&plan.sw&&!plan.started&&now>=c.t0+c.dur*1000-100){plan.started=true;swingT=now}
 if(t>=1)arrive();else{const k=t*t*t;ball.position.set(S0.x+(c.x-c.b[0]-S0.x)*t+c.b[0]*k,S0.y+(c.y-c.b[1]-S0.y)*t+c.b[1]*k,S0.z*(1-t));shadow.position.set(ball.position.x,.05,ball.position.z);const sp=(c.type==='CHANGE'?14:34)*dt;ball.rotation.x+=c.type==='CURVE'?-sp:sp;if(c.type==='SLIDER')ball.rotation.z+=sp*.8}}
if(st==='HIT'){const h=hit,t=Math.min(1,(now-h.t0)/1000/h.dur);
 const y=h.gr?Math.abs(Math.sin(t*Math.PI*4))*h.ap*(1-t):.9*(1-t)+4*h.ap*t*(1-t);
 ball.position.set(h.e.x*t,y+.1,h.e.z*t);shadow.position.set(ball.position.x,.05,ball.position.z);
 shadow.scale.setScalar(3+y*.05);ball.rotation.x-=25*dt;if(!trail.visible){for(let i=0;i<TN;i++)tr.set([ball.position.x,ball.position.y,ball.position.z],i*3);trail.visible=true}tr.copyWithin(3,0,TN*3-3);tr.set([ball.position.x,ball.position.y,ball.position.z],0);trg.attributes.position.needsUpdate=true;if(t>=1)finishHit()}
// bat
if(swingT>=0){const bk=mode==='B'?swingBunt:plan&&plan.bunt,p=(now-swingT)/(bk?500:380);if(p>=1){bp.rotation.set(0,-1.5,-.5);swingT=-1}else if(bk){const u=Math.min(1,p*5);bp.rotation.set(0,-1.5+1.35*u,-.5-.9*u)}else bp.rotation.set(0,-1.5+3.5*Math.sin(p*Math.PI/2),-.5-1.07*Math.min(1,p*4))}
if(tbv){tbv.y-=9.8*dt;tb.position.x+=tbv.x*dt;tb.position.y=Math.max(.08,tb.position.y+tbv.y*dt);tb.position.z+=tbv.z*dt;if(tb.position.y<=.08){tbv.x=tbv.z=tbv.y=0}else tb.rotation.z+=8*dt}
// camera
crowd.position.y=now<cheerT?Math.abs(Math.sin(now/110))*.6:0;ball.scale.setScalar(st==='HIT'?Math.max(4,ball.position.distanceTo(camera.position)*.12):1);if(st!=='HIT')trail.visible=false;
const cp=CAM[mode],k=1-Math.exp(-dt*(st==='HIT'?3:4));
if(st==='HIT'){tv.set(ball.position.x*.6,Math.max(ball.position.y+4,5),ball.position.z+16);camera.position.lerp(tv,k);lookV.lerp(ball.position,k*1.5);camera.fov+=(55-camera.fov)*k}
else{camera.position.lerp(cp.p,k);lookV.lerp(cp.l,k);camera.fov+=(cp.f-camera.fov)*k}
camera.updateProjectionMatrix();camera.lookAt(lookV);
zone.visible=zoneOn||mode==='P';ret.visible=mode==='P'&&st==='READY';
renderer.render(scene,camera)}
setMode('B');showMenu();loop();
</script></body></html>
