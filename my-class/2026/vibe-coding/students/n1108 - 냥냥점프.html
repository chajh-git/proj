<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>냥냥 점프</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--ink:#3b2a52;--pink:#ff7eb6;--sun:#ffc94a;--mint:#5fd6b0;--card:#fffaf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#1c1733;overflow:hidden;
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink)}
#wrap{position:relative;margin:0 auto;height:100%;overflow:hidden;background:#8fd3ff}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px)}
.screen.on{display:flex}
h1{margin:6vh 0 0;font-size:clamp(40px,12vw,56px);line-height:1;letter-spacing:-1px;color:#fff;text-align:center;
  text-shadow:0 4px 0 var(--pink),0 8px 0 rgba(59,42,82,.25),0 0 22px rgba(255,255,255,.6);transform:rotate(-3deg)}
h1 small{display:block;font-size:.34em;letter-spacing:4px;margin-top:8px;color:#fff;text-shadow:0 2px 0 var(--ink)}
.spacer{flex:1}
.btn{appearance:none;border:0;border-radius:22px;padding:14px 26px;font:inherit;font-weight:900;font-size:20px;
  color:var(--ink);background:var(--sun);box-shadow:0 6px 0 #c9942a,0 10px 18px rgba(0,0,0,.25);cursor:pointer;min-width:200px;
  transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #c9942a}
.btn.big{font-size:28px;padding:18px 40px;min-width:260px;background:var(--pink);color:#fff;box-shadow:0 7px 0 #c24a82,0 12px 22px rgba(0,0,0,.28)}
.btn.big:active{box-shadow:0 2px 0 #c24a82}

.chip{background:rgba(255,255,255,.88);border-radius:999px;padding:8px 16px;font-weight:900;font-size:18px;box-shadow:0 3px 0 rgba(59,42,82,.2);display:inline-flex;gap:6px;align-items:center}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.round{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:22px;box-shadow:0 4px 0 rgba(59,42,82,.25);cursor:pointer;color:var(--ink);font-weight:900}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,82,.25)}
#hud{pointer-events:none;flex-direction:row;align-items:flex-start;justify-content:space-between;padding-bottom:0}
#hud .chip{font-size:22px}
#hud .round{pointer-events:auto}
#toast{position:absolute;left:0;right:0;top:24%;text-align:center;font-size:30px;font-weight:900;color:#fff;padding:0 16px;
  text-shadow:0 3px 0 var(--pink),0 0 14px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;transform:scale(.8)}
#toast.on{opacity:1;transform:scale(1)}
.panel{background:var(--card);border-radius:28px;padding:22px 20px;width:min(340px,100%);box-shadow:0 8px 0 rgba(59,42,82,.25),0 18px 40px rgba(0,0,0,.35);text-align:center}
.panel h2{margin:0 0 6px;font-size:30px}
.bigscore{font-size:64px;font-weight:900;line-height:1;color:var(--pink);margin:6px 0}
.panel p{margin:4px 0;font-weight:700;font-size:17px}
#oList{font-size:15px;text-align:left;white-space:pre-line;line-height:1.5;background:rgba(59,42,82,.06);border-radius:14px;padding:8px 12px;margin-top:8px}
.newbest{color:#e8590c;font-weight:900;animation:pop .6s infinite alternate}
@keyframes pop{to{transform:scale(1.15)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px;overflow-y:auto;padding:4px 2px 14px;flex:1;min-height:0}
.grid,.grid *{touch-action:pan-y}
.card{background:var(--card);border-radius:22px;padding:10px 8px 12px;text-align:center;box-shadow:0 5px 0 rgba(59,42,82,.22);border:3px solid transparent}
.card.sel{border-color:var(--mint)}
.card canvas{width:96px;height:96px}
.card b{display:block;font-size:19px}
.card span{display:block;font-size:12.5px;font-weight:700;min-height:32px;line-height:1.25;opacity:.8;margin:2px 2px 8px}
.card .btn{font-size:15px;padding:8px 10px;min-width:0;width:100%;border-radius:16px;box-shadow:0 4px 0 #c9942a}
.card .btn.mint{box-shadow:0 4px 0 #2d9c7b}
.card .btn.dis{background:#cfc8dc;box-shadow:0 4px 0 #9a92ad;color:#6b6380}
.mcard{background:var(--card);border-radius:22px;padding:14px 8px 12px;text-align:center;box-shadow:0 5px 0 rgba(59,42,82,.22);cursor:pointer;border:3px solid transparent}
.mcard:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(59,42,82,.22)}
.mcard.sel{border-color:var(--mint)}
.mcard i{display:block;font-style:normal;font-size:42px;line-height:1.1}
.mcard b{display:block;font-size:17px;margin-top:4px}
.mcard span{display:block;font-size:12.5px;font-weight:700;line-height:1.3;opacity:.8;margin:4px 4px 6px;min-height:34px}
.mcard em{display:inline-block;font-style:normal;font-weight:900;font-size:13px;background:rgba(95,214,176,.25);border-radius:999px;padding:3px 10px}
.pcard{grid-column:1/-1;display:flex;align-items:center;gap:12px;text-align:left;padding:14px}
.pcard i{font-size:40px;flex:none}
.pcard .t{flex:1}
.pcard b{margin:0}
.pcard span{min-height:0}
#shop,#modes,#pvp{background:linear-gradient(#8fd3ff,#ffd6e7)}
#pvp{background:linear-gradient(#ffb3a7,#c9b6ff)}
#shop h2,#modes h2,#pvp h2{margin:6px 0 12px;font-size:32px;color:#fff;text-shadow:0 3px 0 var(--pink)}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;text-align:center;color:#fff;font-weight:800;text-shadow:0 2px 0 rgba(59,42,82,.6);pointer-events:none;font-size:15px;padding:0 20px}
#over,#pause{background:rgba(28,23,51,.55);justify-content:center}
.modebar{display:flex;gap:10px}
.modebar .btn.tile{flex-direction:column;gap:4px;font-size:15px;padding:10px 4px}
.modebar .btn{min-width:0;flex:1;font-size:17px;padding:12px 10px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}

/* ===== 픽셀 UI ===== */
:root{--ink:#2a2238;--pink:#ff6fa8;--sun:#ffc94a;--mint:#4fd1a5;--card:#fff6e0}
canvas#game{image-rendering:pixelated}
.ic{image-rendering:pixelated;vertical-align:middle;display:inline-block}

.btn.big:active{box-shadow:inset -5px -5px 0 rgba(0,0,0,.2),inset 5px 5px 0 rgba(255,255,255,.4),0 2px 0 var(--ink)}

.chip{border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);padding:5px 12px}
.round{border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);background:#fff;width:46px;height:46px;display:flex;align-items:center;justify-content:center;padding:0}
.round .ic{height:22px;filter:invert(1) brightness(.25)}
.panel{border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink)}
.card,.mcard{border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.card.sel,.mcard.sel{border-color:var(--mint);box-shadow:0 5px 0 var(--ink),0 0 0 3px var(--ink)}
.card canvas{image-rendering:pixelated;width:96px;height:96px}
.mcard i{height:44px;display:flex;align-items:center;justify-content:center}
.pcard i{width:56px;display:flex;justify-content:center}
.mcard em{border-radius:0;border:2px solid var(--ink);background:#d7f7ea}
#hud .chip{font-size:20px}
#toast{text-shadow:-2px 0 var(--ink),2px 0 var(--ink),0 -2px var(--ink),0 2px var(--ink),0 5px 0 var(--pink)}
.hint{text-shadow:-1px 0 var(--ink),1px 0 var(--ink),0 -1px var(--ink),0 1px var(--ink)}
.newbest{color:#d9480f}
#oList{border-radius:0;border:2px dashed var(--ink)}
.bigscore{color:var(--pink);text-shadow:3px 3px 0 var(--ink)}
.row2{display:flex;gap:10px;width:100%}
.btn.ad{background:#8ad7ff;font-size:17px;padding:10px 14px;min-width:0;width:100%}
.btn.ad small{display:block;font-size:11px;opacity:.7;font-weight:700}
#adbox{position:absolute;inset:0;background:rgba(20,15,40,.92);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-weight:900;text-align:center;z-index:9;gap:10px}
#adbox.on{display:flex}

/* ===== 연핑크 퍼스널 컬러 ===== */
:root{--pink:#ff9ccb;--pinkL:#ffc9e1;--pinkD:#e0679f;--sun:#ffc9e1;--mint:#ffc9e1}
#wrap{background:#ffd9ea}
.btn,.btn.mint,.btn.sm,.btn.ad,#bPvp{background:var(--pinkL)!important;color:#5a2147!important}

.btn.ad{background:#ffe3f0!important}
#bPvp{box-shadow:inset -4px -4px 0 rgba(0,0,0,.14),inset 4px 4px 0 rgba(255,255,255,.55),0 6px 0 var(--ink)!important}
.round{background:var(--pinkL)}
.round .ic{filter:invert(1) brightness(.25)}

.mcard em{background:#ffe3f0}
#shop,#modes{background:linear-gradient(#ffd9ea,#ffeaf4)}
#pvp{background:linear-gradient(#ffc2dc,#ffe3f0)}
#shop h2,#modes h2,#pvp h2{color:#fff;text-shadow:-2px 0 var(--ink),2px 0 var(--ink),0 -2px var(--ink),0 2px var(--ink),0 5px 0 var(--pinkD)}
.bigscore{color:var(--pinkD)}
/* ===== HUD ===== */
#hMid{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);text-align:center;pointer-events:none}
#hHeight{font-size:56px;line-height:1;font-weight:900;letter-spacing:1px;
  background:linear-gradient(180deg,#fffafd 0 22%,#ffc2de 22% 58%,#ff9ccb 58% 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 1px #6b2349) drop-shadow(0 0 1px #6b2349) drop-shadow(0 4px 0 #6b2349)}
#cd{display:none;position:absolute;left:0;right:0;top:50%;transform:translateY(-60%);text-align:center;font-size:150px;line-height:1;font-weight:900;letter-spacing:2px;pointer-events:none;
  background:linear-gradient(180deg,#fffafd 0 22%,#ffc2de 22% 58%,#ff9ccb 58% 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 2px #6b2349) drop-shadow(0 0 2px #6b2349) drop-shadow(0 6px 0 #6b2349)}
#cd.pop{animation:cdpop .5s ease-out}
@keyframes cdpop{0%{transform:translateY(-60%) scale(1.8);opacity:0}60%{transform:translateY(-60%) scale(.95);opacity:1}100%{transform:translateY(-60%) scale(1)}}
#duelDiff .btn.on{background:#ff8fc0!important;outline:3px solid #fff}
#duelDiff .btn{min-width:0;padding:7px 9px;font-size:13px;white-space:nowrap}
#cd.go{font-size:84px;white-space:nowrap}
#duelDiff span{width:100%;text-align:center;color:#fff}
#hUnit{font-size:.5em;margin-left:2px}
#hBest{margin-top:8px;font-size:15px;font-weight:900;color:#ffe14d;text-shadow:-1px 0 #4a3200,1px 0 #4a3200,0 -1px #4a3200,0 1px #4a3200,0 2px 0 #4a3200}
#hNew{display:none;margin-left:4px;color:#ff2f45;font-size:15px;animation:pop .45s infinite alternate;text-shadow:-1px 0 #fff,1px 0 #fff,0 -1px #fff,0 1px #fff}
</style>

<div id="wrap">
  <canvas id="game"></canvas>

  <div id="menu" class="screen on">
    <h1>냥냥 점프<small>NYANG JUMP</small></h1>
    <div class="row" style="margin-top:18px">
      <span class="chip"><i data-ic="trophy" data-sz="20"></i> <span id="mBest">0</span><span id="mUnit">m</span></span>
      <span class="chip"><i data-ic="fish" data-sz="18"></i> <span id="mCoins">0</span></span>
    </div>
    <div class="spacer"></div>
    <div class="stack" style="width:min(340px,86vw)">
      <span class="chip" id="curMode" style="font-size:15px"></span>
      <button class="btn big" id="bPlay" style="width:100%">시작하기</button>
      <div class="modebar" style="width:100%">
        <button class="btn tile" id="bModes"><i data-ic="city" data-sz="22"></i><span>모드</span></button>

  <div id="shop" class="screen">

    <div class="row" style="margin-bottom:10px"><span class="chip"><i data-ic="fish" data-sz="18"></i> <span id="sCoins">0</span></span></div>
    <div class="grid" id="shopGrid"></div>
    <button class="btn" id="bShopBack" style="margin-top:10px">돌아가기</button>

      <div class="stack" style="margin:14px 0 0">
        <button class="btn mint" id="bResume">계속하기</button>
        <button class="btn sm" id="bSet2">설정</button>

      </div>
    </div>
  </div>

      <div style="font:900 44px/1 'DungGeunMo',monospace;margin:6px 0" id="askM">0m</div>
      <div style="color:#ffd84d;font-weight:800;font-size:14px" id="askB">최고기록 0m</div>
      <canvas id="askCat" width="96" height="96" style="width:192px;height:192px;image-rendering:pixelated;margin:8px auto"></canvas>
      <button class="btn big" id="bAskRev" style="min-width:0;width:100%;font-size:21px;white-space:nowrap">광고 보고 이어하기</button>
    </div>
  </div>

  <div id="adbox"><div id="adTxt">광고</div><div style="font-size:13px;opacity:.7">[샘플 광고 화면 — 실제 앱에서는 AdMob 보상형 광고로 교체]</div></div>

      <p id="oBestRow">최고 기록 <b id="oBest">0</b><span id="oUnit2">m</span></p>
      <div id="oList" style="display:none"></div>
      <div class="stack" style="margin:16px 0 0;gap:12px">
        <button class="btn ad" id="bRevive" style="display:none;margin-bottom:10px">광고 보고 이어하기<small>보호막과 함께 그 자리에서 다시!</small></button>
        <button class="btn big" id="bAgain" style="min-width:0;width:100%;font-size:24px">다시 하기</button>
        <div class="row">
          <button class="btn sm mint" id="bOModes"><i data-ic="city" data-sz="18"></i> 모드</button>
          <button class="btn sm" id="bOMenu">메뉴</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   냥냥 점프 (Nyang Jump) — HTML5 canvas game
   - 모든 그래픽은 코드로 그려지고, 효과음/배경음악은 WebAudio로 합성됩니다.
   - 외부 에셋 없음 → 오프라인/앱 패키징에 안전
   ============================================================ */

const Snd = (() => {
  let ac, master, sfxG, musG, timer = null, track = null, step = 0, nextT = 0;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function init(){
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.85;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
    sfxG = ac.createGain(); sfxG.connect(master);
    musG = ac.createGain(); musG.connect(master);
    applyMute();
  }
  function applyMute(){
    if (!ac) return;
    sfxG.gain.value = save.d.sfx ? 1 : 0;
    musG.gain.value = save.d.music ? 0.5 : 0;
  }
  function resume(){ init(); if (ac && ac.state !== 'running') ac.resume().catch(()=>{}); }
  function suspend(){ if (ac && ac.state === 'running') ac.suspend().catch(()=>{}); }

  function tone(o){
    if (!ac) return;
    const t0 = (o.at != null ? o.at : ac.currentTime), d = o.d || 0.15;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t0 + d);
    const v = o.v == null ? 0.25 : o.v, a = o.a || 0.006;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    let node = osc;
    if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; osc.connect(f); node = f; }
    node.connect(g); g.connect(o.dest || sfxG);
    osc.start(t0); osc.stop(t0 + d + 0.05);
  }
  let noiseBuf = null;
  function noise(o){
    if (!ac) return;
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    }
    const t0 = o.at != null ? o.at : ac.currentTime, d = o.d || 0.1;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = ac.createBiquadFilter(); f.type = o.type || 'highpass'; f.frequency.value = o.freq || 6000;
    const g = ac.createGain();
    g.gain.setValueAtTime(o.v || 0.2, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    src.connect(f); f.connect(g); g.connect(o.dest || sfxG);
    src.start(t0); src.stop(t0 + d + 0.05);

  // ----- 효과음 -----
  const fx = {
    jump(){ tone({f:330, f2:700, d:.16, type:'sine', v:.3}); tone({f:660, f2:1100, d:.1, type:'triangle', v:.08}); },

    coin(){ const t = ac && ac.currentTime; tone({f:988, d:.09, type:'square', v:.1, at:t}); tone({f:1319, d:.22, type:'square', v:.1, at:t+.07}); },
    crack(){ noise({d:.22, v:.35, type:'bandpass', freq:900}); tone({f:160, f2:60, d:.2, type:'sawtooth', v:.12}); },
    poof(){ noise({d:.12, v:.1, type:'lowpass', freq:1800}); },
    rocket(){ noise({d:.7, v:.25, type:'bandpass', freq:700}); tone({f:120, f2:520, d:.6, type:'sawtooth', v:.14, lp:1400}); },
    stomp(){ tone({f:500, f2:120, d:.18, type:'square', v:.2}); noise({d:.1, v:.15}); },
    hit(){ tone({f:300, f2:70, d:.35, type:'sawtooth', v:.25, lp:1200}); noise({d:.2, v:.2, type:'lowpass', freq:900}); },
    rescue(){ const t = ac && ac.currentTime; [523,659,784,1047].forEach((f,i)=>tone({f, d:.2, type:'triangle', v:.2, at:t+i*.07})); },
    click(){ tone({f:700, f2:900, d:.05, type:'triangle', v:.15}); },
    buy(){ const t = ac && ac.currentTime; [659,880,1175].forEach((f,i)=>tone({f, d:.2, type:'square', v:.1, at:t+i*.08})); },
    deny(){ tone({f:200, f2:140, d:.18, type:'square', v:.15}); },
    best(){ const t = ac && ac.currentTime; [523,659,784,1047,1319].forEach((f,i)=>tone({f, d:.28, type:'triangle', v:.2, at:t+i*.1})); },
    over(){ const t = ac && ac.currentTime; [494,466,440,392].forEach((f,i)=>tone({f, f2:f*.97, d:.3, type:'triangle', v:.22, at:t+i*.18})); },
    meow(pitch){
      if (!ac) return; pitch = pitch || 1;
      const t0 = ac.currentTime, d = .42;
      const osc = ac.createOscillator(), g = ac.createGain();
      const f1 = ac.createBiquadFilter(), f2 = ac.createBiquadFilter();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(420*pitch, t0);
      osc.frequency.linearRampToValueAtTime(760*pitch, t0 + .13);
      osc.frequency.linearRampToValueAtTime(380*pitch, t0 + d);
      f1.type = 'bandpass'; f1.Q.value = 5;
      f1.frequency.setValueAtTime(700, t0); f1.frequency.linearRampToValueAtTime(1500, t0 + .14); f1.frequency.linearRampToValueAtTime(800, t0 + d);
      f2.type = 'lowpass'; f2.frequency.value = 3200;
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.45, t0 + .05); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);

  // ----- 배경음악 -----
  const ROOT = [48, 45, 41, 43];          // C  Am  F  G (bass root)
  const CHORD = [[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
  const N = null;
  const MEL = [
    [76,N,79,N,81,N,79,76, N,74,76,N,72,N,N,N],
    [81,N,79,N,76,N,79,81, N,84,81,N,79,N,N,N],
    [72,N,76,N,77,N,76,72, N,74,72,N,69,N,N,N],
    [74,N,79,N,83,N,79,74, N,76,74,N,71,N,67,N],
    [79,N,76,N,79,N,84,N, 81,N,79,N,76,N,N,74],
    [72,N,76,N,81,N,79,N, 76,N,72,N,N,N,76,79],
    [77,N,77,81,84,N,81,77, 76,N,72,N,69,N,72,N],
    [74,N,79,N,83,N,86,N, 83,N,79,N,74,N,N,N],
  ];
  const TRACKS = {
    game: {bpm:136},
    menu: {bpm: 92},
  };
  function schedule(){
    if (!ac || !track) return;
    const T = TRACKS[track], sd = 60 / T.bpm / 4;
    while (nextT < ac.currentTime + 0.25) {
      const bar = Math.floor(step / 16) % 8, s = step % 16, ch = bar % 4, t = nextT;
      if (track === 'game') {
        // bass
        if ([0,3,6,8,11,14].includes(s)) tone({f:mtof(ROOT[ch] + (s===6||s===14 ? 7 : 0)), d:sd*2.2, type:'triangle', v:.32, at:t, dest:musG, lp:900});
        // 아르페지오
        if (s % 2 === 0) tone({f:mtof(CHORD[ch][(s/2) % 3] + 12), d:sd*1.6, type:'sine', v:.1, at:t, dest:musG});
        // 멜로디
        const m = MEL[bar][s];
        if (m) { tone({f:mtof(m), d:sd*2.6, type:'square', v:.075, at:t, dest:musG, lp:2600});
                 tone({f:mtof(m)*2, d:sd*1.2, type:'triangle', v:.05, at:t, dest:musG}); }
        // 드럼
        if (s % 4 === 0) tone({f:140, f2:45, d:.14, type:'sine', v:.5, at:t, dest:musG});
        if (s === 4 || s === 12) noise({d:.09, v:.16, type:'bandpass', freq:2200, at:t, dest:musG});
        if (s % 2 === 1) noise({d:.03, v:.05, freq:8000, at:t, dest:musG});
      } else {
        // 오르골 느낌의 메뉴 음악
        const ct = CHORD[ch];
        if (s % 2 === 0) { const n = ct[[0,1,2,1,2,1,0,1][(s/2)%8]] + 12;
          tone({f:mtof(n), d:sd*5, type:'sine', v:.2, at:t, dest:musG});
          tone({f:mtof(n)*3, d:sd*1.5, type:'sine', v:.03, at:t, dest:musG}); }
        if (s === 0) { tone({f:mtof(ROOT[ch]), d:sd*14, type:'triangle', v:.22, at:t, dest:musG, lp:700}); }
        const m = MEL[bar][s];
        if (m && s % 4 === 0) tone({f:mtof(m - 0), d:sd*4, type:'triangle', v:.09, at:t, dest:musG});
      }
      step++; nextT += sd;
    }
  }
  function play(name){
    init(); if (!ac) return;
    if (track === name && timer) return;
    stop();
    track = name; step = 0; nextT = ac.currentTime + 0.08;
    timer = setInterval(schedule, 40);
  }
  function stop(){ if (timer) clearInterval(timer); timer = null; track = null; }

  return { fx, play, stop, resume, suspend, applyMute, init, tone: o => tone(o), noise: o => noise(o) };
})();


/* ============================================================
   픽셀 아트 엔진 — 모든 도트 스프라이트는 코드로 만든 오리지널 디자인
   (게임 화면은 저해상도 버퍼에 그린 뒤 최근접 이웃으로 확대합니다)
   ============================================================ */
const PX = 2;                                   // 도트 1개 = 논리 좌표 2
const Q = v => Math.round(v / PX) * PX;
const PAL = {
  k:'#2a2238', w:'#ffffff', e:'#ece7ff', y:'#ffd34d', Y:'#fff3b0', o:'#f08a2b', O:'#c4601a', r:'#e8453c', R:'#a02a2a',
  p:'#ff8fa8', P:'#d9577a', g:'#5fbf5f', G:'#2e8a4a', b:'#5aa9ff', B:'#2f5fa8', c:'#7df9ff', C:'#2aa3b5',
  s:'#c9cfe0', S:'#8a90a8', d:'#4a4660', D:'#2b2f45', n:'#8a5a3a', N:'#5a3a24', t:'#e6c48a', a:'#cdeeff', A:'#5b90b8',
  v:'#b085e0', V:'#6a45a8', m:'#ff4d6d'
};
function shadeHex(h, t){
  const a = hex(h), k = t > 0 ? 255 : 0, u = Math.abs(t);
  return '#' + a.map(v => Math.round(v + (k - v) * u).toString(16).padStart(2, '0')).join('');
}

class Grid {
  constructor(w, h){ this.w = w; this.h = h; this.a = new Array(w * h).fill(null); }
  get(x, y){ return x < 0 || y < 0 || x >= this.w || y >= this.h ? null : this.a[y * this.w + x]; }
  set(x, y, c, over){
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    const i = y * this.w + x; if (over && !this.a[i]) return; this.a[i] = c;
  }
  rect(x, y, w, h, c, over){ for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c, over); }
  ell(cx_, cy_, rx, ry, c, over){
    for (let y = Math.floor(cy_ - ry); y <= Math.ceil(cy_ + ry); y++) for (let x = Math.floor(cx_ - rx); x <= Math.ceil(cx_ + rx); x++) {
      const dx = (x + .5 - cx_) / rx, dy = (y + .5 - cy_) / ry; if (dx * dx + dy * dy <= 1) this.set(x, y, c, over);
    }
  }
  poly(pts, c, over){
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const px = x + .5, py = y + .5; let ins = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const [xi, yi] = pts[i], [xj, yj] = pts[j];
        if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) ins = !ins;
      }
      if (ins) this.set(x, y, c, over);
    }
  }
  shade(){      // 윗면은 밝게, 아랫면은 어둡게 (도트 쉐이딩)
    const out = this.a.slice();
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const c = this.get(x, y); if (!c || c === PAL.k) continue;
      if (!this.get(x, y - 1)) out[y * this.w + x] = shadeHex(c, .2);
      else if (!this.get(x, y + 1)) out[y * this.w + x] = shadeHex(c, -.18);
    }
    this.a = out;
  }
  toSprite(outline = true, oc = PAL.k){
    const w = this.w, h = this.h, c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'), cells = this.a.slice();
    if (outline) for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      if (this.get(i, j)) continue;
      if (this.get(i - 1, j) || this.get(i + 1, j) || this.get(i, j - 1) || this.get(i, j + 1)) cells[j * w + i] = oc;
    }
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const col = cells[j * w + i]; if (col) { x.fillStyle = col; x.fillRect(i, j, 1, 1); } }
    return {c, w, h};
  }
}
function ascii(rows, pal, outline = true, oc){
  const P = Object.assign({}, PAL, pal || {}), w = Math.max(...rows.map(r => r.length)) + 2, h = rows.length + 2, g = new Grid(w, h);
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const ch = r[i]; if (ch !== '.' && ch !== ' ') g.set(i + 1, j + 1, P[ch] || ch); } });
  return g.toSprite(outline, oc);
}

function buildCatFront(cat, tail, blink){           // 메인/도감/시작 화면용: 정면을 보고 앉은 고양이
  const g = new Grid(24, 24), P = cat.pattern, body = cat.body, belly = cat.belly, mark = cat.mark, K = PAL.k;
  const limb = P === 'siamese' ? mark : body, tc = limb, ear = P === 'siamese' ? mark : body, paw = P === 'tuxedo' ? '#ffffff' : limb;
  const w = tail ? 1 : 0;                                          // 꼬리: 몸 오른쪽을 감싸며 끝이 살랑
  g.rect(17, 20, 5, 2, tc); g.rect(21, 17, 2, 4, tc); g.rect(20 + w, 14, 2, 4, P === 'tabby' || P === 'calico' ? mark : tc);
  g.ell(12, 17.8, 5.6, 5.2, body);                                 // 몸통
  g.ell(6.8, 19.6, 3, 2.8, body); g.ell(17.2, 19.6, 3, 2.8, body);   // 뒷다리(앉은 엉덩이)
  g.ell(12, 19, 2.8, 3.4, belly, true);
  g.rect(8, 17, 3, 6, limb); g.rect(13, 17, 3, 6, limb);           // 앞다리
  g.rect(8, 21, 3, 2, paw); g.rect(13, 21, 3, 2, paw); g.rect(8, 22, 3, 1, paw); g.rect(13, 22, 3, 1, paw);
  if (P === 'tuxedo') g.ell(12, 17, 2.8, 3.4, '#ffffff', true);
  if (P === 'tabby') { g.rect(6, 17, 2, 1, mark, true); g.rect(16, 17, 2, 1, mark, true); g.rect(6, 20, 2, 1, mark, true); g.rect(16, 20, 2, 1, mark, true); }
  if (P === 'calico') { g.ell(8, 18, 2.4, 2.4, mark, true); g.ell(16.5, 20, 2.2, 2, cat.mark2, true); }
  g.poly([[4.5, 8], [4.5, .5], [10.5, 3.6]], P === 'calico' ? cat.mark2 : ear);   // 귀
  g.poly([[19.5, 8], [19.5, .5], [13.5, 3.6]], ear);
  g.poly([[6, 6], [6, 2.6], [8.6, 4]], '#ffb3c7'); g.poly([[18, 6], [18, 2.6], [15.4, 4]], '#ffb3c7');
  g.ell(12, 10, 8, 6.2, body);                                      // 머리
  if (P === 'siamese') g.ell(12, 11.8, 4.8, 4, mark, true);
  if (P === 'tuxedo') { g.ell(12, 13, 4, 3, '#ffffff', true); g.rect(12, 4, 1, 5, '#ffffff', true); }
  if (P === 'tabby') { g.rect(9, 4, 1, 3, mark, true); g.rect(12, 4, 1, 4, mark, true); g.rect(15, 4, 1, 3, mark, true); g.rect(4, 10, 2, 1, mark, true); g.rect(18, 10, 2, 1, mark, true); }
  if (P === 'calico') { g.ell(7.5, 6.5, 3.4, 2.8, mark, true); g.ell(17, 9, 2.4, 2.4, cat.mark2, true); }
  if (P !== 'siamese') g.ell(12, 13, 3.2, 2.2, belly, true);       // 주둥이
  if (cat.id === 'blue') g.ell(12, 13, 3.4, 2, belly, true);
  g.shade();
  for (const x0 of [6, 14]) {
    if (blink) g.rect(x0, 11, 4, 1, K);
    else { g.rect(x0, 8, 4, 4, cat.eye); g.rect(x0 + 1, 8, 2, 4, '#1d1730'); g.rect(x0 + 1, 8, 2, 1, '#ffffff'); g.set(x0 + 3, 11, '#ffffff'); }
  }
  g.rect(11, 12, 2, 1, '#ff8fa8'); g.set(10, 13, K); g.set(13, 13, K); g.set(11, 14, K); g.set(12, 14, K);
  g.rect(3, 12, 2, 1, '#ff9db8'); g.rect(19, 12, 2, 1, '#ff9db8');
  return g.toSprite();

  if (p.x <= LX) { if (!p.stuck) p.hang = HANG; p.x = LX; p.stuck = 'L'; p.jumps = 0; p.vx = 0; p.vy = 0; }
  else if (p.x >= RX) { if (!p.stuck) p.hang = HANG; p.x = RX; p.stuck = 'R'; p.jumps = 0; p.vx = 0; p.vy = 0; }

function doTap(p){
  if (p.dead) return false;
  if (p.stuck || p.grounded) p.jumps = 0;
  if (p.jumps >= (p.maxJ || MAXJ)) return false;
  const d = p.stuck ? (p.stuck === 'L' ? 1 : -1) : p.dir;
  p.stuck = null; p.grounded = false;
  p.vx = d * VX * p.cat.speed; p.vy = -JUMP_VY * p.cat.jump; p.jumps++; p.dir = d; p.sq = 1;

}

    case 'spin':  return {a: o.ph + o.w * f, x: o.x0, y: o.y0, active: true};
    case 'mace':  { const ph = o.A * Math.sin(f * o.w + o.ph); return {x: o.x0 + o.L * Math.sin(ph), y: o.y0 + o.L * Math.cos(ph), r: 24, active: true}; }

    case 'wire':  { const tt = (f + o.ph) % 180; return {on: tt < 50, warn: tt >= 140, tt, active: true}; }

    case 'laser': { const tt = (f + o.ph) % o.period; return {on: tt < o.on, warn: tt >= o.period - 40, tt, active: true}; }
    case 'punch': { const tt = (f + o.ph) % o.period, e0 = o.period - 28; let ext = 0, warn = false;

function hits(px, py, f){

    if (o.type === 'wire') { if (posOf(o, f).on && Math.abs(cy - o.y) < 16) return o; continue; }
    if (o.type === 'gate') { if (!o.off && Math.abs(cy - o.y) < 16) return o; continue; }

      if (px + HX > x0 && px - HX < x1 && cy + HY > o.y && cy - HY < o.y + o.h) return o; continue;
    }
    if (o.type === 'block' || o.type === 'slide' || o.type === 'pulse') {
      if (o.type === 'pulse' && !posOf(o, f).on) continue;
      const r = blockRect(o, f);

//  장애물/아이템 생성
// ============================================================
// [종류, 등장 높이(m), 가중치(m)] — 15m까지 장애물 없음 → 톱니바퀴만 → 160m부터 가시 → 200m 레이저·전기줄 → 350m 회전 → 400m 철퇴 → 450m 대형 회전 → 700m 펀치·팽창 → 1000m 전기문
const VARS = [
  ['sawStill', 15, () => 5], ['sawSmall', 70, () => 2], ['sawBig', 90, () => 2], ['sawH', 110, () => 2], ['sawV', 130, () => 2], ['sawTwin', 150, () => 2],
  ['spike', 160, m => m < 400 ? 2 : .25],
  ['laser', 200, () => 4], ['wire', 200, () => 2],
  ['spin', 350, () => 2], ['mace', 400, () => 2], ['bigSpin', 450, () => .7],
  ['breath', 700, () => 2], ['punch', 700, () => 2], ['gate', 1000, () => 2]
];
const GAPS = [270, 245, 220, 200, 175, 160, 145, 130, 118, 105, 82];   // 난이도 단계별 장애물 사이 빈 공간
function tier(m){ if (m >= 1000) return Math.floor((m - 1000) / 100) % 2 === 0 ? 9 : 10; return m < 400 ? Math.floor(m / 100) : m < 600 ? 4 : m < 700 ? 5 : Math.floor((m - 700) / 100) + 6; }
const EXT = {bigSpin: 340, gate: 360, mace: 190, laser: 125, spin: 130, sawTwin: 40, sawV: 150, wire: 20, punch: 70, breath: 70};   // 장애물이 차지하는 세로 길이
function genChunk(){
  const m = -G.genY / MPX + (G.mShift || 0), d = clamp(m / 900, 0, 1);
  const pool = -G.genY / MPX < 15 ? [] : VARS.filter(v => m >= v[1] && !(G.diff && v[0] === 'gate')).map(v => [v[0], v[2](m)]);
  let kind = null;      // 간격을 고르게: 15m 이후엔 매 구간마다 정확히 하나씩
  if (pool.length) { let r = Math.random() * pool.reduce((a, b) => a + b[1], 0); for (const [k, w] of pool) { r -= w; if (r <= 0) { kind = k; break; } } }
  if (kind && kind === G.lastKind && pool.length > 1) { const alt = pool.filter(v => v[0] !== kind); kind = alt[(Math.random() * alt.length) | 0][0]; }
  G.lastKind = kind;
  const gap = GAPS[tier(m)];
  const ch = kind ? gap + (EXT[kind] || 70) : 320, yBot = G.genY, yTop = yBot - ch, yMid = (yTop + yBot) / 2;
  G.genY = yTop;
  const side = Math.random() < .5 ? 'L' : 'R', sgn = Math.random() < .5 ? 1 : -1, px = () => rand(100, 300), wv = () => rand(.022, .03) + d * .01, ph = () => rand(0, 6.28);
  const saw = (x0, y0, ax, ay, w, p0) => ({type: 'saw', x0, y0, ax, ay, w, ph: p0, y: y0 + ay});
  switch (kind) {
    case 'spike': G.obs.push({type: 'block', side, d: 18, h: 72, y: yMid - 36}); break;                // 가시는 항상 3개
    case 'sawStill': G.obs.push(saw(px(), yMid, 0, 0, 0, 0)); break;
    case 'sawSmall': G.obs.push(saw(px(), yMid, 38, 0, wv(), ph())); break;
    case 'sawBig': G.obs.push(saw(W / 2, yMid, 140, 0, wv(), ph())); break;
    case 'sawH': G.obs.push(saw(W / 2, yMid, 125, 0, wv() + .006, ph())); break;
    case 'sawV': G.obs.push(saw(px(), yMid, 0, 70, wv(), ph())); break;
    case 'sawTwin': { const w = wv(), p0 = ph(); G.obs.push(saw(W / 2, yMid, 120, 0, w, p0), saw(W / 2, yMid, -120, 0, w, p0)); break; }
    case 'laser': G.obs.push({type: 'laser', x0: rand(120, 280), y: yMid, hl: 58, dy: sgn * rand(42, 52), period: Math.round(230 - d * 40), on: 50, ph: (Math.random() * 230) | 0}); break;
    case 'wire': G.obs.push({type: 'wire', y: yMid, ph: (Math.random() * 180) | 0}); break;
    case 'breath': G.obs.push({type: 'breath', x0: px(), y0: yMid, y: yMid + 22, ph: (Math.random() * 180) | 0}); break;
    case 'spin': G.obs.push({type: 'spin', x0: px(), y0: yMid, R: 62, w: sgn * .035, ph: ph(), y: yMid + 62}); break;
    case 'mace': G.obs.push({type: 'mace', x0: W / 2 + rand(-40, 40), y0: yMid - 60, L: 125, A: 1.15, w: .042, ph: ph(), y: yMid + 65}); break;
    case 'bigSpin': G.obs.push({type: 'spin', x0: W / 2, y0: yMid, R: 168, w: sgn * .035, ph: ph(), y: yMid + 168}); break;
    case 'punch': G.obs.push({type: 'punch', side, y: yMid - 33, h: 66, len: W - 2 * WALL, period: Math.round(220 - d * 40), ph: (Math.random() * 200) | 0}); break;
    case 'gate': G.obs.push({type: 'gate', y: yMid - 30, off: false, bs: side, by: yMid + 140}); break;
  }
  // 코인 (많이 나오지 않게: 구간의 약 1/3에만 한 줄)
  if (Math.random() < .33) { const sx = Math.random() < .5 ? 110 : 200, up = yTop + 55; for (let i = 0; i < 4; i++) G.items.push({type: 'fish', x: sx + i * 30, y: up - Math.sin(i / 3 * Math.PI) * 28, t: rand(0, 6)}); }
  // 모드별 아이템
  const ru = G.rule, rx = () => rand(90, 310), ry = () => yMid + rand(-45, 45);
  if (ru === 'cook' && Math.random() < .6) {
    const sx = rx();
    for (let i = 0; i < 4; i++) G.items.push({type: 'food', e: (Math.random() * 5) | 0, x: clamp(sx + i * 30, 70, 330), y: ry(), t: rand(0, 6)});
  }
  if (ru === 'cold' && Math.random() < .46) G.items.push({type: 'warm', x: rx(), y: ry(), t: 0});
  if (ru === 'office' && Math.random() < .38) G.items.push({type: 'coffee', x: rx(), y: ry(), t: 0});
  if (ru === 'dungeon' && Math.random() < .2) G.items.push({type: 'chest', x: rx(), y: ry(), t: 0});
  if (ru === 'horror' && Math.random() < .22) G.items.push({type: 'candle', x: rx(), y: ry(), t: 0});
}
function spawnRock(){
  G.rockT = 300;
  if (Math.random() > .05) return;            // 낙하물은 5% 확률로만 (700m 이후)
  const p = G.p;
  G.obs.push({type: 'rock', x: clamp(p.x + rand(-90, 90), 55, W - 55), f0: G.f, y0: G.cam - 60});
}
const oy = o => o.type === 'rock' ? posOf(o, G.f).y : o.type === 'gate' ? o.by + 30 : (o.y == null ? 0 : o.y);

// ============================================================
//  PvP 봇 / IO
// ============================================================
const BOT_NAMES = ['치즈','모찌','까미','나비','샴','블루','보리','망고','두부','초코'];
function botCat(i){
  const base = CATS[i % CATS.length]; if (i < CATS.length) return base;
  const tints = ['#9fc77a','#c58f6b','#b79bd8','#f2d06b'], t = tints[(i - CATS.length) % 4];
  return {...base, body: t, mark: mix(t, '#000000', .25)};
}
function makeBots(n, fixSkill){
  G.bots = [];
  const names = BOT_NAMES.slice().sort(() => Math.random() - .5);
  for (let i = 0; i < n; i++) {
    const skill = fixSkill ? clamp(fixSkill + rand(-.02, .02), .5, .99) : n > 2 ? rand(.55, .95) : rand(.82, .95);          // AI 실력: 높을수록 빠르게 판단하고 실수가 적음
    G.bots.push({name: names[i], x: W / 2 + rand(-25, 25), y: FLOOR, vx: 0, vy: 0, jumps: 0, maxJ: MAXJ, stuck: null, grounded: true, dir: 1,
      dead: false, inv: 0, sq: 0, cat: botCat((Math.random() * 10) | 0), think: 10, delay: (Math.random() * 30) | 0,
      skill, tapGap: Math.round(13 + (1 - skill) * 22), lastTap: -999, slip: .002 + (1 - skill) * .03, gap: Math.round(12 + (1 - skill) * 50), maxH: 0, plan: -1});
  }
}
// 앞으로 70프레임을 미리 시뮬레이션: plan = [점프할 프레임들] (비어 있으면 점프 안 함)
function botSim(b, plan, f0){
  const s = {...b};
  for (let i = 0; i <= 70; i++) {
    if (plan.includes(i) && !doTap(s)) return i === 0 ? null : {dead: 0, y: s.y};
    if (i === 0) continue;
    physStep(s, s.cat); if (hits(s.x, s.y, f0 + i)) return {dead: i, y: s.y};
  }
  return {dead: 0, y: s.y};
}
function botPlans(b){            // 점프 간격(tapGap)을 지키는 계획들만 후보로 (사람처럼 연타 불가)
  const g = b.tapGap, e = Math.max(0, b.lastTap + g - G.f), out = [[]];
  for (const s of [0, 4, 8, 14, 22, 32]) { const t = e + s; out.push([t], [t, t + g], [t, t + g, t + 2 * g]); }
  return out;
}
function updateBot(b){
  if (b.delay > 0) { b.delay--; return; }
  if (--b.think <= 0) {
    b.think = 1 + ((Math.random() * 3) | 0);
    const sc = q => !q ? -1e9 : q.dead ? -5000 + q.dead * 20 : -q.y;
    // 지금 / 조금 뒤 / 연속 점프 / 안 점프 중 가장 높이 가면서 안전한 타이밍을 고름 (회전·레이저·전기줄은 기다렸다 통과)
    let best = null, bestS = -1e12;
    const stall = G.f - (b.progF || 0) > 240;                       // 오래 제자리면 위험을 감수하고 도전
    for (const pl of botPlans(b)) { const v = (stall && !pl.length ? -9000 : sc(botSim(b, pl, G.f))) - (pl[0] > 0 ? 22 * pl[0] : 0); if (v > bestS) { bestS = v; best = pl; } }
    let tap = best && best[0] === 0;
    if (Math.random() < b.slip) tap = !tap && Math.random() < .6;     // 가끔 실수
    if (tap && G.f - b.lastTap >= b.tapGap && doTap(b)) b.lastTap = G.f;
  }
  physStep(b, b.cat); b.sq *= .85;
  if (-b.y / MPX > b.maxH + .5) b.progF = G.f;
  b.maxH = Math.max(b.maxH, -b.y / MPX);
  if (hits(b.x, b.y, G.f)) { b.dead = true; b.vy = -8; b.vx = b.x < W / 2 ? 2 : -2; }
}
function newIO(){
  const names = BOT_NAMES.slice().sort(() => Math.random() - .5).slice(0, 9);
  return {t: 600, pbest: 0, runs: 0, bots: names.map(n => ({name: n, rate: rand(1.7, 3.6), haz: rand(.03, .07), h: 0, best: 0, cd: 0}))};
}
function ioTick(){
  for (const b of G.io.bots) {
    if (b.cd > 0) { b.cd--; continue; }
    b.h += b.rate * rand(.6, 1.4); b.best = Math.max(b.best, b.h);
    if (Math.random() < b.haz * (1 + b.h / 50)) { b.cd = 2; b.h = 0; }
  }
}
function ioBoard(){
  const list = G.io.bots.map(b => ({name: b.name, v: b.best, me: false}));
  list.push({name: '나', v: Math.max(G.io.pbest, G.height), me: true});
  list.sort((a, b) => b.v - a.v); return list;
}
function raceBoard(){
  const list = G.bots.map(b => ({name: b.name, v: b.maxH, me: false}));
  list.push({name: '나', v: G.height, me: true});
  list.sort((a, b) => b.v - a.v); return list;
}

function startRun(){
  const cat = curCat(), mode = modeOf(), th = THEMES[G.theme];
  G.obs = []; G.items = []; G.parts = []; G.hpx = 0; G.height = 0; G.f = 0; G.shake = 0; G.rockT = 0; G.rescue = cat.shield;
  G.p = {x: W / 2, y: FLOOR, vx: 0, vy: 0, jumps: 0, maxJ: MAXJ, stuck: null, grounded: true, dir: 1, dead: false, bubble: 0, inv: 0, dash: 0, sq: 0, cat};
  G.temp = 100; G.timeLeft = 40; G.food = 0; G.dishes = 0; G.smashed = 0; G.chests = 0; G.windOn = false; G.windT = 300; G.respawn = 0;
  G.slideMul = G.rule === 'cold' ? 1.1 : 1;
  G.diff = G.modeId === 'duel' ? DUEL_DIFF[save.d.duelDiff | 0] : null;
  G.mShift = G.diff ? G.diff.shift : 0;
  G.goal = G.modeId === 'duel' ? 10 * (10 + ((Math.random() * 21) | 0)) : (mode.goal || 0);   // 1:1 은 100~300m 랜덤 결승선
  G.ghost = G.rule === 'horror' ? {x: W / 2, y: FLOOR + 420, vx: 0, vy: 0} : null;
  G.bots = []; if (mode.pvp && !mode.io) makeBots(mode.field - 1, G.diff ? G.diff.skill : 0);
  G.cam = FLOOR - H * 0.62; G.genY = -200;
  while (G.genY > G.cam - H) genChunk();
}
function resetGame(){
  G.modeId = curModeId(); const mode = modeOf();
  G.theme = mode.theme; G.rule = mode.rule || null; G.coins = 0; G.newBest = false;
  G.io = mode.io ? newIO() : null; G.revived = false;
  startRun();
}

function tryJump(){
  if (G.mode !== 'play') return;
  const p = G.p; if (!doTap(p)) return;
  if (G.rule === 'ranger' && p.jumps === 3) {                // 3단 점프 = 레인저 돌진
    p.dash = 30; p.inv = Math.max(p.inv, 30); p.vy *= 1.12; p.vx *= 1.2; Snd.fx.rocket(); burst(p.x, p.y - 20, 16, '#ffe066', 4, .5, .02);
  } else {
    const k = Math.pow(1.26, p.jumps - 1);
    Snd.tone({f: 300 * k, f2: 640 * k, d: .15, type: 'sine', v: .3});
    Snd.tone({f: 600 * k, f2: 1000 * k, d: .09, type: 'triangle', v: .07});
    burst(p.x, p.y - 4, 5 + p.jumps * 2, p.jumps > 1 ? '#ffe066' : '#ffffffcc', 2, .35, .05);
  }
  buzz(8);
}
function burst(x, y, n, color, spd, life, grav){
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.283), s = rand(.3, 1) * spd;
    G.parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: life * rand(.6, 1), max: life, c: color, r: rand(1.5, 3.6), g: grav == null ? .15 : grav});
  }
}
const strip = s => String(s).replace(/👉/g, '▶').replace(/[\u{1F000}-\u{1FAFF}\u2600-\u27BF\u2B50\u23E9-\u23FF\uFE0F]/gu, '').replace(/\s+/g, ' ').trim();
function toast(msg){ const el = $('toast'); el.textContent = strip(msg); el.classList.add('on'); G.toastT = 1.4; }

function playerDown(why){
  const p = G.p;
  if (G.io) {          // IO: 죽으면 처음부터
    G.io.pbest = Math.max(G.io.pbest, G.height); G.io.runs++;
    p.dead = true; p.vy = -8; p.vx = p.x < W / 2 ? 2 : -2; G.respawn = 70; Snd.fx.hit(); G.shake = 12; toast('💥 처음부터 다시!'); buzz(100); return;
  }
  p.dead = true; p.vy = -8; p.vx = p.x < W / 2 ? 2 : -2; Snd.fx.hit(); Snd.fx.meow(p.cat.pitch * .7); G.shake = 14; buzz(120);
  burst(p.x, p.y - CY, 14, '#ffffff', 3.5, .5, .1);
  G.mode = 'dying'; G.dyingWhy = why; G.dyingT = 70;          // 떨어지는 모습을 보여준 뒤 결과/부활 화면
}
function hurt(why){
  const p = G.p;
  if (p.shield) { p.shield = false; p.inv = 90; Snd.fx.rescue(); burst(p.x, p.y - CY, 18, '#9ff0ff', 4, .7, .05); toast('보호막이 막아줬어요! 🛡'); buzz(30); return; }
  playerDown(why || 'hit');
}
function fall(){
  const p = G.p;
  if (G.rescue) {
    G.rescue = false; const left = p.x < W / 2; p.x = left ? LX : RX; p.y = G.cam + H * .5; p.vx = 0; p.vy = 0; p.stuck = left ? 'L' : 'R'; p.jumps = 0; p.inv = 90;
    Snd.fx.rescue(); toast('구조! 🛟'); burst(p.x, p.y - CY, 20, '#9ff0ff', 4, .8, .05); G.shake = 8;
  } else playerDown('fall');
}
function collect(it){
  const p = G.p;
  switch (it.type) {
    case 'fish': G.coins++; Snd.fx.coin(); burst(it.x, it.y, 8, '#ffe066', 2.6, .5, .05); break;
    case 'shield': p.shield = true; Snd.fx.rescue(); toast('보호막 획득! 🛡'); break;
    case 'food': G.food++; Snd.fx.coin(); burst(it.x, it.y, 8, '#ffb347', 2.6, .5, .05);
      if (G.food % 8 === 0) { G.dishes++; G.coins += 5; Snd.fx.buy(); toast(`요리 ${G.dishes}접시 완성! 🍲 +5 코인`); } break;
    case 'warm': G.temp = Math.min(100, G.temp + 35); Snd.fx.coin(); burst(it.x, it.y, 10, '#ff9a3c', 3, .5, -.02); break;
    case 'coffee': G.timeLeft += 6; Snd.fx.coin(); burst(it.x, it.y, 8, '#c58f6b', 2.6, .5, .05); toast('☕ 시간 +6초'); break;
    case 'chest': G.chests++; G.coins += 5; Snd.fx.buy(); burst(it.x, it.y, 14, '#ffd34d', 3.4, .6, .05); toast('보물상자! +5 코인'); break;
    case 'candle': if (G.ghost) { G.ghost.y += 320; G.ghost.vx = 0; G.ghost.vy = 0; } Snd.fx.rescue(); burst(it.x, it.y, 10, '#fff1a8', 3, .6, -.02); toast('🕯️ 유령이 물러났어요'); break;
  }
}
function smash(p){
  const cy = p.y - CY;
  for (const o of G.obs) {
    if (o.gone || !(o.type === 'flyer' || o.type === 'saw' || o.type === 'rock' || o.type === 'shooter' || o.type === 'breath' || o.type === 'mace')) continue;
    const q = posOf(o, G.f); if (!q.active) continue;
    if (Math.hypot(p.x - q.x, cy - q.y) < 50) { o.gone = true; G.smashed++; G.coins += 2; Snd.fx.stomp(); burst(q.x, q.y, 14, '#ffe066', 4, .5); }
  }
}
function ghostStep(p){
  const g = G.ghost, d = clamp(G.hpx / 25000, 0, 1), sp = 1.15 + d * 1.0;
  const dx = p.x - g.x, dy = (p.y - 20) - g.y, dist = Math.hypot(dx, dy) || 1;
  g.vx += (dx / dist * sp - g.vx) * .04; g.vy += (dy / dist * sp - g.vy) * .04; g.x += g.vx; g.y += g.vy;
  if (g.y > G.cam + H + 330) g.y = G.cam + H + 330;
  if (p.inv <= 0 && dist < 28 && !G.testNoRule) hurt('ghost');
}

function step(){
  G.t += 1 / 60;
  if (G.toastT > 0) { G.toastT -= 1 / 60; if (G.toastT <= 0) $('toast').classList.remove('on'); }
  if (G.mode === 'count') {                  // PvP: 3 → 2 → 1 → START 후 출발
    const lab = G.countT > 50 ? String(Math.ceil((G.countT - 50) / 60)) : 'START!';
    if (G.cdShown !== lab) { G.cdShown = lab; const el = $('cd'); el.textContent = lab; el.classList.toggle('go', lab !== String(parseInt(lab))); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); el.style.display = 'block'; Snd.fx.click(); }
    if (--G.countT <= 0) { $('cd').style.display = 'none'; G.mode = 'play'; }
    return;
  }
  if (G.mode !== 'play' && G.mode !== 'over' && G.mode !== 'dying') return;
  const p = G.p, cat = p.cat;

  if (G.mode === 'play') {
    G.f++;
    if (G.io) { G.io.t -= 1 / 60; if (G.f % 60 === 0) ioTick(); if (G.io.t <= 0) { G.io.pbest = Math.max(G.io.pbest, G.height); endGame('io'); return; } }
    if (p.dead) {                                  // IO 사망 연출 후 재시작
      p.vy += .5; p.y += p.vy; p.x += p.vx;
      if (--G.respawn <= 0) startRun();
    } else {
      // 강풍(혹한)
      if (G.rule === 'cold') {
        if (--G.windT <= 0) { G.windOn = !G.windOn; if (G.windOn) { G.windDir = Math.random() < .5 ? -1 : 1; G.windT = 80; toast('💨 강풍!'); } else G.windT = 240 + ((Math.random() * 120) | 0); }
        if (G.windOn && !p.stuck && !p.grounded) p.vx = clamp(p.vx + G.windDir * .06, -VX * 1.1, VX * 1.1);
      }
      const wasStuck = p.stuck;
      physStep(p, cat);
      if (!wasStuck && p.stuck) { Snd.tone({f: 190, f2: 95, d: .09, type: 'sine', v: .22}); burst(p.x + (p.stuck === 'L' ? -8 : 8), p.y - 20, 4, '#d9d4ea', 1.2, .3, .04); }
      if (p.stuck && G.f % 6 === 0) G.parts.push({x: p.x + (p.stuck === 'L' ? -10 : 10), y: p.y - 4, vx: 0, vy: .6, life: .3, max: .3, c: '#cfc8e6', r: 1.6, g: 0});
      p.sq *= .85; if (p.bubble > 0) p.bubble--; if (p.inv > 0) p.inv--; if (p.dash > 0) p.dash--;

      G.hpx = Math.max(G.hpx, -p.y); G.height = G.hpx / MPX;
      const tgt = p.y - H * 0.55; if (tgt < G.cam) G.cam += (tgt - G.cam) * .2;
      if (p.dash > 0) smash(p);
      for (const o of G.obs) if (o.type === 'gate' && !o.off) {          // 벽 버튼 → 전기 차단
        const bx = o.bs === 'L' ? WALL : W - WALL;
        if (Math.abs(p.x - bx) < 42 && Math.abs(p.y - CY - o.by) < 40) { o.off = true; Snd.fx.rescue(); burst(bx, o.by, 12, '#7df9ff', 3, .5); toast('전기 차단!'); }
      }
      if (p.inv <= 0) { const o = hits(p.x, p.y, G.f); if (o) hurt('hit'); }

      // 아이템
      if (G.mode === 'play' && !p.dead) for (const it of G.items) {
        if (it.taken) continue; it.t += .08;
        const dx = p.x - it.x, dy = (p.y - CY) - it.y, dist = Math.hypot(dx, dy);
        if (it.type === 'fish' && dist < cat.magnet) { it.x += dx * .14; it.y += dy * .14; }
        if (dist < 28) { it.taken = true; collect(it); }
      }
      // 모드 규칙
      if (G.mode === 'play' && !p.dead) {
        const d = clamp(G.hpx / 25000, 0, 1);
        if (G.rule === 'cold') { G.temp -= (4 + 4 * d) / 60; if (G.temp <= 0 && !G.testNoRule) { G.temp = 0; endGame('freeze'); } }
        else if (G.rule === 'office') { G.timeLeft -= 1 / 60; if (G.timeLeft <= 0) { G.timeLeft = 0; endGame('time'); } }
        else if (G.rule === 'horror' && G.ghost) ghostStep(p);
        if (G.height >= UNLOCK.rock) { G.rockT--; if (G.rockT <= 0) spawnRock(); }
        // PvP 봇
        for (const b of G.bots) { if (!b.dead) updateBot(b); else { b.vy += .5; b.y += b.vy; b.x += b.vx; } }
        const mode = modeOf();
        if (mode.pvp && !mode.io && G.mode === 'play') {
          const rival = G.bots.reduce((a, b) => Math.max(a, b.maxH), 0);
          if (G.height >= G.goal) endGame('win');
          else if (rival >= G.goal) endGame('lose');
        }
        if (G.f % 3 === 0) updateHud();
        if (G.mode === 'play' && p.y > G.cam + H - 24) fall();
      }
      // 구간 생성/정리
      while (G.genY > G.cam - H) genChunk();
      const cut = G.cam + H + 150;
      G.obs = G.obs.filter(o => oy(o) < cut);
      G.items = G.items.filter(a => a.y < cut && !a.taken);
    }
  } else if (G.mode === 'dying') {
    p.vy += .5; p.y += p.vy; p.x += p.vx;
    if (--G.dyingT <= 0) askRevive(G.dyingWhy);
  } else if (G.mode === 'over') {
    if (p.dead) { p.vy += .5; p.y += p.vy; p.x += p.vx; }
  }
  for (const q of G.parts) { q.x += q.vx; q.y += q.vy; q.vy += q.g; q.life -= 1 / 60; }
  G.parts = G.parts.filter(q => q.life > 0);
  if (G.shake > 0) G.shake *= .85;
}

function drawCatAt(cat, x, sy, st, ex){
  pixCat(cx, cat, x, sy, Object.assign({px: 2.4, stuck: st.stuck, grounded: st.grounded, vy: st.vy, t: G.t, hurt: st.dead, roll: (st.jumps >= 2 && !st.stuck && !st.grounded && !st.dead && st.vy < 4) ? (G.t * 14) : null, face: st.stuck ? (st.stuck === 'L' ? -1 : 1) : st.dir}, ex || {}));
}
function drawHitboxes(){                      // 설정 > 히트박스 보기: 충돌 판정 영역을 선으로 표시
  const f = G.f, cam = G.cam, S = 2;
  const box = (x0, y0, x1, y1, c) => { cx.strokeStyle = c; cx.lineWidth = S; cx.strokeRect(x0, y0 - cam, x1 - x0, y1 - y0); };
  const circ = (x, y, r, c) => { cx.strokeStyle = c; cx.lineWidth = S; cx.beginPath(); cx.arc(x, y - cam, r, 0, 6.2832); cx.stroke(); };
  const seg = (x1, y1, x2, y2, r, c) => { cx.strokeStyle = c; cx.lineWidth = S; const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L * r, ny = dx / L * r;
    cx.beginPath(); cx.moveTo(x1 + nx, y1 + ny - cam); cx.lineTo(x2 + nx, y2 + ny - cam); cx.moveTo(x1 - nx, y1 - ny - cam); cx.lineTo(x2 - nx, y2 - ny - cam); cx.stroke(); circ(x1, y1, r, c); circ(x2, y2, r, c); };
  const R = '#ff2d55';
  for (const o of G.obs) {
    if (o.gone) continue;
    if (o.type === 'laser') { const q = posOf(o, f); seg(o.x0 - o.hl, o.y - o.dy, o.x0 + o.hl, o.y + o.dy, 14, q.on ? R : '#ff9db8'); }
    else if (o.type === 'wire') { const q = posOf(o, f); box(WALL, o.y - 13, W - WALL, o.y + 13, q.on ? R : '#ff9db8'); }
    else if (o.type === 'gate') { if (!o.off) box(WALL, o.y - 13, W - WALL, o.y + 13, R); }
    else if (o.type === 'spin') { const a = o.ph + o.w * f, c = Math.cos(a) * o.R, s = Math.sin(a) * o.R; seg(o.x0 - c, o.y0 - s, o.x0 + c, o.y0 + s, 13, R); for (const [bx, by, r] of spinBalls(o, a)) circ(bx, by, r + 8, R); }
    else if (o.type === 'breath') { const q = posOf(o, f); box(q.x - q.s - 13, q.y - q.s - 15, q.x + q.s + 13, q.y + q.s + 15, R); }
    else if (o.type === 'punch') { const q = posOf(o, f); if (!q.active) continue; const len = o.len * q.ext, x0 = o.side === 'L' ? WALL : W - WALL - len; box(x0, o.y, x0 + len, o.y + o.h, R); }
    else if (o.type === 'block' || o.type === 'slide' || o.type === 'pulse') { const r = blockRect(o, f); box(r.x0, r.y0, r.x1, r.y1, R); }
    else { const q = posOf(o, f); if (q.active) circ(q.x, q.y, q.r + 11 - 0, R); }
  }
  const p = G.p; if (p) { box(p.x - HX, p.y - CY - HY, p.x + HX, p.y - CY + HY, '#39ff88'); circ(p.x, p.y - CY, HX, '#39ff88'); }
}
function drawPlayer(p){
  const sy = p.y - G.cam;
  if (p.dash > 0) { cx.globalAlpha = .55; cx.fillStyle = '#ffe066'; discOn(cx, p.x, sy - CY, 34 + Math.round(Math.sin(G.t * 30) * 3)); cx.globalAlpha = 1; }
  if (p.inv > 0 && p.bubble <= 0 && !p.dash && (G.f >> 2) & 1) cx.globalAlpha = .4;
  drawCatAt(p.cat, p.x, sy, p); cx.globalAlpha = 1;
  if (p.bubble > 0 && (p.bubble > 50 || (G.f >> 2) & 1)) { cx.fillStyle = 'rgba(150,240,255,.18)'; discOn(cx, p.x, sy - CY, 32); cx.fillStyle = '#9ff0ff'; ring(p.x, sy - CY, 32 + Math.round(Math.sin(G.t * 4) * 1.5)); }
  if (G.mode === 'play' && !p.dead) {
    const left = (p.stuck || p.grounded) ? MAXJ : MAXJ - p.jumps;
    for (let i = 0; i < MAXJ; i++) { cx.fillStyle = PAL.k; fr(p.x + (i - 1) * 12 - 4, sy - 62, 8, 8); cx.fillStyle = i < left ? '#ffe066' : '#6b6380'; fr(p.x + (i - 1) * 12 - 2, sy - 60, 4, 4); }
  }
}
function drawBots(){
  const lead = G.bots.reduce((a, b) => (!a || b.maxH > a.maxH ? b : a), null);
  for (const b of G.bots) {
    const sy = b.y - G.cam; if (sy < -80 || sy > H + 80) continue;
    cx.globalAlpha = b.dead ? .35 : (G.bots.length > 3 ? .65 : .9);
    drawCatAt(b.cat, b.x, sy, b); cx.globalAlpha = 1;
    if (b === lead || G.bots.length <= 3) G.labels.push({t: b.name, x: b.x, y: sy - 56, c: '#ff5f7e'});
  }
}
function drawDarkness(p){
  const th = THEMES[G.theme]; if (!th.dark) return;
  const d = dctx; d.setTransform(1 / PX, 0, 0, 1 / PX, 0, 0); d.globalCompositeOperation = 'source-over'; d.globalAlpha = 1; d.clearRect(0, 0, W + PX * 2, H + PX * 2);
  d.fillStyle = `rgba(4,2,10,${th.dark})`; d.fillRect(0, 0, W + PX * 2, H + PX * 2);
  d.globalCompositeOperation = 'destination-out'; d.fillStyle = '#000';
  const light = (x, y, r, a) => { for (let i = 0; i < 6; i++) { d.globalAlpha = a * .32; discOn(d, x, y, r * (1 - i * .16)); } d.globalAlpha = 1; };
  const fl = G.theme === 'horror' ? 1 + .12 * Math.sin(G.t * 23) * Math.sin(G.t * 7) : 1;
  if (p) light(p.x, p.y - G.cam - 24, (G.theme === 'horror' ? 150 : 175) * fl, 1);
  for (const t of G.torches) light(t.x + t.side * 10, t.y, 120 + 8 * Math.sin(G.t * 9 + t.k), .85);
  for (const o of G.obs) if (o.type === 'shooter' && !o.gone) { const q = posOf(o, G.f); if (q.active) light(q.x, q.y - G.cam, 70, .9); }
  if (G.ghost) light(G.ghost.x, G.ghost.y - G.cam, 70, .7);
  d.globalCompositeOperation = 'source-over';
  cx.drawImage(dk, 0, 0, dk.width * PX, dk.height * PX);
}
function drawTorches(){
  for (const t of G.torches) {
    putSpr(SP.torch, t.x + t.side * 9, t.y + 12);
    putSpr(SP.flame[Math.floor(G.t * 8 + t.k) % 2], t.x + t.side * 9, t.y - 8);
  }
}
function drawShotAt(th, q, flip){
  const key = th.shot === 'bolt' ? SP.shot_bolt : SP.shot_fire[Math.floor(G.f / 4) % 2];
  putSpr(key, q.x, q.y - G.cam, flip);
}

function render(){
  cx.setTransform(1 / PX, 0, 0, 1 / PX, 0, 0); cx.imageSmoothingEnabled = false; cx.globalAlpha = 1;
  cx.clearRect(0, 0, W + PX * 2, H + PX * 2);
  G.labels = [];
  cx.save();
  if (G.shake > .5) cx.translate(Q(rand(-G.shake, G.shake) * .5), Q(rand(-G.shake, G.shake) * .5));
  const menu = G.mode === 'menu' || G.mode === 'shop' || G.mode === 'modes' || G.mode === 'pvp';
  if (menu) G.theme = 'city';
  const night = drawBG(menu ? 0 : G.hpx / MPX);
  cx.fillStyle = night ? 'rgba(14,10,36,.34)' : 'rgba(255,255,255,.40)'; cx.fillRect(0, 0, W, H);   // 배경을 흐릿하게: 장애물이 더 돋보이게
  drawWalls(night);

  if (G.mode === 'menu') {                       // 메인 화면: 정면을 보고 앉은 고양이
    const bob = Math.round(Math.sin(G.t * 2) * 1.5);
    pixCat(cx, curCat(), W / 2, H * .465 + bob * PX, {px: 6, t: G.t, pose: 'sit', face: 1});
    drawParticles(); cx.restore(); present(); return;
  }
  if (menu) {
    const cyc = 1.5, ph = (G.t % (cyc * 2)) / cyc, leg = ph < 1 ? ph : ph - 1, dirR = ph < 1;
    const e = leg < .5 ? 2 * leg * leg : 1 - Math.pow(-2 * leg + 2, 2) / 2;
    const x = dirR ? lerp(LX, RX, e) : lerp(RX, LX, e), base = H * .43, y = base - Math.sin(leg * Math.PI) * 90;
    pixCat(cx, curCat(), x, y, {t: G.t, vy: leg < .5 ? -5 : 5, face: dirR ? 1 : -1, stuck: leg > .93 || leg < .05 ? (dirR ? 'L' : 'R') : null});
    drawParticles(); cx.restore(); present(); return;
  }

  drawFloor();
  const mode = modeOf();
  if (G.goal) {
    const gy = -G.goal * MPX - G.cam;
    if (gy > -30 && gy < H + 30) {
      for (let i = 0; i < 24; i++) for (let j = 0; j < 2; j++) { cx.fillStyle = (i + j) % 2 ? '#fff' : '#2a2238'; fr(WALL + i * ((W - 2 * WALL) / 24), gy + j * 8, (W - 2 * WALL) / 24, 8); }
      G.labels.push({t: 'GOAL', x: W / 2, y: gy - 6, c: '#ffffff', big: true});
    }
  }
  for (const o of G.obs) {
    if (o.gone) continue;
    if (o.type === 'block') drawBlock(o, o.y);
    else if (o.type === 'slide') {
      const y = posOf(o, G.f).y, bx = (o.side === 'L' ? WALL + 2 : W - WALL - 4);
      cx.fillStyle = 'rgba(40,30,70,.5)'; for (let yy = o.y0 - o.amp; yy < o.y0 + o.amp + o.h; yy += 10) fr(bx, yy - G.cam, PX, 5);
      drawBlock(o, y);
    } else if (o.type === 'pulse') drawPulse(o);
    else if (o.type === 'laser') drawLaser(o);
    else if (o.type === 'wire') drawWire(o);
    else if (o.type === 'gate') drawGate(o);
    else if (o.type === 'spin') drawSpin(o);
    else if (o.type === 'mace') drawMace(o);
    else if (o.type === 'breath') drawBreath(o);
    else if (o.type === 'punch') drawPunch(o);
  }
  for (const it of G.items) drawItem(it);
  const th = THEMES[G.theme];
  for (const o of G.obs) {
    if (o.gone) continue;
    if (o.type === 'flyer') { const q = posOf(o, G.f); putSpr(SP[th.flyer], q.x, q.y - G.cam, (o.dir < 0) !== (th.flyer === 'fly_pan')); }
    else if (o.type === 'saw') { const q = posOf(o, G.f); if (o.ax || o.ay) { lineSteps(o.x0 - o.ax, o.y0 - o.ay - G.cam, o.x0 + o.ax, o.y0 + o.ay - G.cam, (x, y, i) => { if (i % 8 < 5) { cx.fillStyle = '#2a1f4a'; fr(x - PX, y - PX * 2, PX * 4, PX * 4); cx.fillStyle = '#ffffff'; fr(x, y - PX, PX * 2, PX * 2); } }); } putSpr(sawFrame(th.saw, Math.floor(G.f / 2) % 6), q.x, q.y - G.cam); }
    else if (o.type === 'rock') { const q = posOf(o, G.f); if (q.active) putSpr(SP[th.faller], q.x, q.y - G.cam, (Math.floor(q.y / 40) & 1) === 1); }
    else if (o.type === 'shooter') {
      const q = posOf(o, G.f), L = o.side === 'L', bx = L ? WALL : W - WALL;
      cx.fillStyle = '#2b2f45'; fr(L ? bx : bx - 16, o.y - G.cam - 14, 16, 28); cx.fillStyle = '#5a6080'; fr(L ? bx : bx - 16, o.y - G.cam - 14, 16, 4);
      cx.fillStyle = '#10121c'; fr(L ? bx + 8 : bx - 14, o.y - G.cam - 5, 6, 10);
      if (q.warn && (G.f >> 2) & 1) { cx.fillStyle = '#ff5f3c'; fr(bx + (L ? 18 : -22), o.y - G.cam - 4, 8, 8); }
      if (q.active && !th.dark) drawShotAt(th, q, !L);
    }
  }
  drawParticles();
  drawBots();
  if (G.ghost) { const g = G.ghost; cx.globalAlpha = .6 + .3 * Math.sin(G.t * 9); putSpr(SP.ghost[Math.floor(G.t * 3) % 2], g.x, g.y - G.cam, g.vx < 0); cx.globalAlpha = 1; }
  if (G.p) drawPlayer(G.p);
  if (save.d.hitbox) drawHitboxes();
  drawDarkness(G.p);
  drawTorches();
  if (th.dark) for (const o of G.obs) if (o.type === 'shooter' && !o.gone) { const q = posOf(o, G.f); if (q.active) drawShotAt(th, q, o.side !== 'L'); }
  if (G.windOn) { cx.fillStyle = 'rgba(255,255,255,.65)'; for (let i = 0; i < 10; i++) { const y = (i * 83 + G.f * 9) % H, x = ((i * 137 + G.f * 14 * G.windDir) % W + W) % W; fr(x, y, 36, PX); } }
  // 낙석 경고
  for (const o of G.obs) if (o.type === 'rock' && !o.gone) {
    const q = posOf(o, G.f);
    if (!q.active && G.mode === 'play') {
      if (((G.f >> 3) & 1) || o.f0 + 75 - G.f < 25) { putSpr(SP.warn, o.x, 118); }
      cx.fillStyle = 'rgba(255,77,94,.55)'; for (let yy = 138; yy < H; yy += 16) fr(o.x - 1, yy, PX, 8);
    }
  }
  cx.restore();
  present();
}
function present(){
  mx.setTransform(1, 0, 0, 1, 0, 0); mx.imageSmoothingEnabled = false;
  mx.drawImage(pc, 0, 0, pc.width * PX * scale, pc.height * PX * scale);
  mx.textAlign = 'center'; mx.lineJoin = 'round';
  for (const l of G.labels) {
    mx.font = `900 ${(l.big ? 18 : 11) * scale}px sans-serif`; mx.lineWidth = 4 * scale; mx.strokeStyle = '#2a2238'; mx.fillStyle = l.c;
    mx.strokeText(l.t, l.x * scale, l.y * scale); mx.fillText(l.t, l.x * scale, l.y * scale);
  }
}
requestAnimationFrame(loop);


</script>
