<!DOCTYPE html> <html lang="ko"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <title>축구 개인기 사전</title> <style> :root{--bg:#f3f6ef;--ink:#14301f;--sub:#4d6556;--card:#fff;--line:#cfdac8;--acc:#1f7a3d;--acc2:#e8f3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c14;--ink:#e6f0e4;--sub:#9db5a3;--card:#16281c;--line:#2a4232;--acc:#5fd183;--acc2:#1d3626}} :root[data-theme="dark"]{--bg:#0f1c14;--ink:#e6f0e4;--sub:#9db5a3;--card:#16281c;--line:#2a4232;--acc:#5fd183;--acc2:#1d3626} *{box-sizing:border-box} html{scroll-padding-top:env(safe-area-inset-top,0px)} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6} header{max-width:none;margin:0;padding:34px max(20px,calc((100% - 760px)/2)) 26px;color:#fff;background:repeating-linear-gradient(90deg,#2e8b45 0 28px,#359a4d 28px 56px);border-bottom:4px solid #fff;box-shadow:inset 0 -40px 40px -30px rgba(0,40,10,.35)} h1{font-size:28px;margin:0 0 4px;letter-spacing:-.5px;text-shadow:0 2px 4px rgba(0,40,10,.4)} header p{margin:0;color:#e4f5e3;font-size:15px} .bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 20px 12px;max-width:760px;margin:0 auto;z-index:2} input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit} input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px} .chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap} .chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer} .chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff} main{max-width:760px;margin:0 auto;padding:6px 20px 40px;display:grid;gap:12px} .card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden} .head{width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:16px;cursor:pointer;display:flex;gap:12px;align-items:center} .head b{font-size:18px;display:block} .head span.s{color:var(--sub);font-size:14px} .lv{margin-left:auto;font-size:13px;color:var(--acc);white-space:nowrap;font-weight:700} .body{display:none;padding:0 16px 18px;border-top:1px dashed var(--line)} .card.open .body{display:block} .body h3{font-size:14px;margin:16px 0 6px;color:var(--acc)} .body p{margin:0} .empty{text-align:center;color:var(--sub);padding:30px} </style> </head> <body> <header> <h1>⚽ 축구 개인기 사전</h1> <p>이름도 모르던 기술, 여기서 하나씩 익혀보세요. 카드를 누르면 설명이 열려요.</p> </header> <div class="bar"> <input id="q" type="search" placeholder="기술 이름 검색 (예: 시저스, Elastico)" aria-label="검색"> <div class="chips" id="chips"></div> </div> <main id="list"></main> <script> const S=[ ["바디 페인트","Body Feint",1,"공은 그대로 두고 어깨·상체·시선만 움직여 수비수를 속이는 기본 페이크.","한쪽 어깨와 무게중심을 크게 기울였다가 수비수가 따라오면 반대로 치고 나간다."], ["스텝오버","Stepover",1,"공 위로 발을 돌려 넘기며 방향을 속이는 페이크.","한 발을 공 바깥에서 안쪽으로 돌려 넘기고, 착지하자마자 반대 발 바깥으로 공을 밀며 가속한다."], ["리버스 스텝오버","Reverse Stepover",1,"스텝오버를 반대 방향으로 하는 변형.","발을 안쪽에서 바깥으로 돌려 넘기고, 반대 발로 공을 가져간다."], ["사이드 스텝","Side Step",1,"공을 옆으로 밀며 몸도 같이 옮겨 수비 각도를 피한다.","수비수가 다가오면 발 안쪽으로 공을 옆으로 한 걸음 밀고 곧바로 전진한다."], ["드래그백","Drag Back",1,"발바닥으로 공을 뒤로 끌어 방향을 바꾼다.","공 위에 발바닥을 올려 뒤로 당긴 뒤 반대 발 안쪽으로 방향을 꺾어 나간다."], ["볼 롤","Ball Roll",1,"발바닥으로 공을 옆으로 굴려 방향을 전환한다.","발바닥으로 공을 옆으로 굴리고 반대 발로 이어받아 앞으로 나간다."], ["인사이드 컷","Inside Cut",1,"발 안쪽으로 공을 끊어 방향을 급하게 바꾼다.","공 옆에서 발 안쪽으로 공을 몸 쪽으로 당기고, 반대 발로 치고 나간다."], ["아웃사이드 컷","Outside Cut",1,"발 바깥쪽으로 공을 밀어 방향을 바꾼다.","발등 바깥쪽(새끼발가락 쪽)으로 공을 옆으로 밀고 그 방향으로 가속한다."], ["V컷","V-Cut",1,"공을 뒤로 당겼다가 V자로 앞 대각선으로 나가는 기술.","발바닥으로 공을 뒤로 끌고, 반대 발 안쪽으로 앞 대각선으로 차 나간다."], ["L턴","L-Turn",1,"공을 멈추고 L자로 90도 방향을 바꾼다.","발바닥으로 공을 멈춘 뒤 몸을 돌려 발 안쪽으로 옆 방향으로 밀어 나간다."], ["크루이프 턴","Cruyff Turn",1,"차는 척하다가 공을 뒤로 끌어 180도 돌아선다.","패스하듯 크게 휘두른 뒤 발 안쪽으로 공을 몸 뒤로 끌고 반대로 가속한다."], ["페이크 슛","Fake Shot",1,"슛을 하는 척하며 수비수를 움직이게 한다.","발을 크게 들었다가 공을 차지 않고 멈춰, 수비수가 막으러 오면 옆으로 벗어난다."], ["페이크 패스","Fake Pass",1,"패스하는 척하며 수비수를 속인다.","패스 동작과 시선을 동료 쪽으로 보내고, 수비수가 반응하면 반대로 드리블한다."], ["더블 스텝오버","Double Stepover",2,"스텝오버를 같은 발로 두 번 연속한다.","한 발로 공 위를 두 번 돌려 넘긴 뒤 반대 방향으로 나간다."], ["트리플 스텝오버","Triple Stepover",2,"스텝오버를 세 번 연속해 수비수를 더 크게 흔든다.","리듬을 끊지 않고 세 번 돌리고, 마지막에 반대 발로 공을 가져간다."], ["시저스","Scissors",2,"양발로 번갈아 공 위를 돌려 넘기는 가위 페이크.","오른발·왼발로 연속 스텝오버를 한 뒤 반대 방향으로 빠진다."], ["리버스 시저스","Reverse Scissors",2,"시저스를 반대 방향으로 하는 변형.","발을 안쪽에서 바깥으로 번갈아 돌려 넘기며 방향을 속인다."], ["마르세유 턴","Marseille / Roulette",2,"공을 밟고 몸을 360도 돌려 수비수를 벗어나는 턴.","한 발바닥으로 공을 밟아 끌며 몸을 돌리고, 반대 발 안쪽으로 이어받아 나간다."], ["맥기디 스핀","McGeady Spin",2,"공을 끌며 제자리에서 몸을 돌려 빠져나가는 회전 기술.","공 위에 발을 올려 몸을 회전시키며 공을 끌고, 회전이 끝나는 순간 반대로 나간다."], ["맥기디 턴","McGeady Turn",2,"맥기디 스핀과 같은 계열의 회전 턴.","공을 끌며 몸을 돌려 수비수에게서 몸으로 공을 보호하며 방향을 바꾼다."], ["엘라스티코","Elastico",2,"발 바깥으로 공을 밀었다가 같은 발 안쪽으로 되돌려 보내는 기술.","발 바깥쪽으로 짧게 밀고, 발목을 돌려 안쪽으로 반대쪽 방향으로 끌어 간다."], ["리버스 엘라스티코","Reverse Elastico",2,"안쪽→바깥쪽 순서로 하는 엘라스티코.","발 안쪽으로 먼저 밀고 바깥쪽으로 되돌려 반대 방향으로 나간다."], ["라 크로케타","La Croqueta",2,"공을 발 안쪽으로 한 발에서 다른 발로 옮기며 방향을 바꾼다.","오른발 안쪽으로 왼쪽으로 밀고 왼발 안쪽으로 다시 받아 끌어간다."], ["스쿱 턴","Scoop Turn",2,"발등으로 공을 퍼 올려 돌려 방향을 바꾼다.","발 안쪽/발등으로 공을 살짝 떠서 몸을 돌려 반대 방향으로 내려놓는다."], ["힐 투 힐","Heel to Heel",2,"뒤꿈치로 공을 건드려 방향을 바꾼다.","한 발 뒤꿈치로 공을 다른 발 쪽으로 보내고 이어받아 나간다."], ["힐 플릭","Heel Flick",2,"뒤꿈치로 공을 위나 뒤로 띄워 보낸다.","공 앞에서 발을 뒤로 차올리듯 뒤꿈치로 공을 살짝 띄워 몸 앞으로 넘긴다."], ["레인보우 플릭","Rainbow Flick",2,"공을 머리 위로 넘겨 수비수를 제친다.","공을 한 발 뒤꿈치로 다른 발 뒤꿈치에 끼워 머리 위로 넘기고 앞으로 달려간다."], ["플릭 플랙","Flick Flack",2,"엘라스티코 계열의 연속 터치 기술.","발 바깥으로 밀고 안쪽으로 빠르게 되돌려 방향을 속인다."], ["솔 롤","Sole Roll",2,"발바닥으로 공을 굴리며 방향을 바꾸는 기술.","발바닥으로 공을 앞뒤·옆으로 굴리며 수비수 타이밍을 흐트러뜨린다."], ["솔 스톱 & 고","Sole Stop & Go",2,"발바닥으로 공을 멈췄다가 다시 가속한다.","달리다 갑자기 발바닥으로 멈추고, 수비수가 멈추면 즉시 치고 나간다."], ["스탠딩 스핀","Standing Spin",2,"제자리에서 몸을 돌려 수비수를 벗어난다.","공을 발에 붙인 채 몸을 제자리에서 돌려 수비수를 등지고 방향을 바꾼다."], ["볼 홉","Ball Hop",2,"발로 공을 살짝 띄워 수비수 발 위로 넘긴다.","공을 발등으로 가볍게 튕겨 수비수 발을 넘겨 지나간다."], ["호커스 포커스","Hocus Pocus",3,"공 뒤에서 발을 감아 돌려 반대 방향으로 빠지는 고난도 페이크.","한 발로 공을 감싸듯 돌려 반대로 끌고 나간다. 연속 동작이라 천천히 연습해야 한다."], ["트리플 엘라스티코","Triple Elastico",3,"엘라스티코를 세 번 연속한다.","바깥→안쪽 터치를 세 번 반복하며 방향을 속이고 반대로 나간다."], ["브리지","The Bridge",3,"공을 다리 사이로 지나가게 하는 화려한 기술.","공을 한 발에서 다른 발 쪽으로 보내 다리 위/사이로 지나가게 하며 방향을 바꾼다."], ["볼 홉 엘라스티코","Ball Hop Elastico",3,"볼 홉과 엘라스티코를 결합한 기술.","공을 살짝 띄워 넘긴 뒤 곧바로 엘라스티코로 방향을 바꾼다."], ["플릭업","Flick Up",3,"발로 공을 집어 올려 띄우는 기술.","발등과 바닥 사이에 공을 끼워 위로 차올려 손 위치로 올린다."], ["네이마르 턴","Neymar Turn",3,"공을 끌며 몸을 돌려 상대를 제치는 턴.","발 안쪽으로 공을 당기며 몸을 회전시키고 반대 방향으로 가속한다."], ["네이마르 플릭","Neymar Flick",3,"발 뒤로 공을 띄워 상대를 넘기는 기술.","한 발로 공을 뒤로 감아 다른 발 뒤꿈치로 띄워 수비수 위로 넘긴다."], ["래보나 페이크","Rabona Fake",3,"래보나 킥 동작으로 속인 뒤 방향을 바꾼다.","지지발 뒤로 다리를 교차하며 킥하는 척 후 공을 안쪽으로 끌어 반대로 나간다."], ["스핀 플릭","Spin Flick",3,"몸을 돌리며 공을 띄워 넘기는 기술.","몸을 돌리며 발로 공을 띄워 수비수를 넘긴다."], ["소메브라","Sombrero",3,"공을 상대 머리 위로 띄워 넘기고 달려가 잡는 기술.","발등으로 공 아래를 퍼 올려 상대 머리 위로 넘기고 돌아서 받는다."], ["아웃사이드 힐투힐","Outside Heel to Heel",3,"발 바깥쪽 뒤꿈치를 이용한 힐투힐.","발 바깥과 뒤꿈치를 이용해 방향을 빠르게 전환한다."], ["백힐 드래그","Backheel Drag",3,"뒤꿈치로 공을 뒤로 끌어당겨 방향을 바꾼다.","뒤꿈치로 공을 뒤로 끌어 반대 발로 이어받아 방향을 바꾼다."], ["스핀 무브","Spin Move",3,"공과 함께 몸을 회전시켜 수비수를 벗어난다.","공을 끌며 몸 전체를 돌려 수비수를 등지다가 반대로 나간다."], ["체스트 플릭","Chest Flick",3,"공을 가슴으로 받아 방향을 바꾼다.","공을 띄워 가슴으로 받아 올리며 수비수를 넘어 달려간다."], ["헤드 플릭","Head Flick",3,"공을 머리로 가볍게 튕겨 방향을 바꾼다.","공을 띄워 머리로 살짝 튕겨 수비수 옆을 지나간다."] ]; const L=["","기본","중급","고급"]; let f=0,k="",open=-1; const chips=document.getElementById("chips"),list=document.getElementById("list"),q=document.getElementById("q"); ["전체","기본","중급","고급"].forEach((t,i)=>{const b=document.createElement("button");b.className="chip";b.textContent=t;b.setAttribute("aria-pressed",i==0);b.onclick=()=>{f=i;[...chips.children].forEach((c,j)=>c.setAttribute("aria-pressed",j==i));draw()};chips.appendChild(b)}); q.oninput=()=>{k=q.value.trim();draw()}; function draw(){list.innerHTML="";const r=S.map((s,i)=>({s,i})).filter(({s})=>(!f||s[2]==f)&&(!k||(s[0]+s[1]+s[3]).includes(k))); if(!r.length){list.innerHTML='<div class="empty">찾는 기술이 없어요. 다른 단어로 검색해보세요.</div>';return} r.forEach(({s,i})=>{const c=document.createElement("div");c.className="card"+(open==i?" open":""); c.innerHTML=`<button class="head" aria-expanded="${open==i}"><div><b>${s[0]} <small style="color:var(--sub);font-weight:400;font-size:13px">${s[1]}</small></b><span class="s">${s[3]}</span></div><span class="lv">${L[s[2]]}</span></button><div class="body"><h3>따라하기</h3><p>${s[4]}</p></div>`; c.querySelector(".head").onclick=()=>{open=open==i?-1:i;draw()};list.appendChild(c)})} draw(); </script> </body> </html>
