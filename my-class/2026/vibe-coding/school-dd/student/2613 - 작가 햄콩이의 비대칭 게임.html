<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>생존자 vs 살인자</title><style>
:root{--bg:#f4f1ec;--fg:#1d1b19;--card:#fff;--ac:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--fg:#ece7df;--card:#2a251d;--ac:#ff7a70}}
:root[data-theme="dark"]{--bg:#15130f;--fg:#ece7df;--card:#2a251d;--ac:#ff7a70}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;justify-content:center;padding:12px}
#wrap{position:relative;width:1000px;max-width:100%}canvas{width:100%;display:block;border-radius:10px}
.ov{position:absolute;inset:0;background:rgba(10,8,6,.88);color:#ece7df;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:16px;border-radius:10px;overflow:auto}
.ov h1{margin:0;font-size:28px}.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}.s{font-size:13px;opacity:.85;max-width:640px;line-height:1.6;margin:0}

button:hover{background:var(--ac);color:#fff}.row{display:flex;flex-wrap:wrap;justify-content:center}
</style></head><body><div id="wrap"><canvas id="c" width="1000" height="640"></canvas>
<div id="menu" class="ov"><h1>생존자 vs 살인자</h1><p class="s">이동 WASD · 스킬 Q/E/R/T · 일반공격 SPACE · 달리기 SHIFT(스태미나 소모)<br>생존자: 제한시간(120초) 동안 버티기 / 살인자: 시간 안에 모든 생존자 처치<br>방향은 마지막으로 움직인 방향입니다.</p><div id="step"></div></div>
<div id="end" class="ov" hidden><h1 id="et"></h1><p class="s" id="ed"></p><button onclick="menu()">다시 하기</button></div></div>
<script>
const 
=id=>document.getElementById(id),C=('c'),X=C.getContext('2d'),W=1000,H=640,SC=6,keys={};let G=null,lt=0;
const rnd=Math.random,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const CH={
ham:{n:'작가햄콩이',s:1,hp:100,w:10,r:20,col:'#e0a030',sk:{q:['그리기-벽',35],e:['그리기-가속기',45],r:['그리기-투명화',55]}},
dawn:{n:'새벽',s:1,hp:80,w:10,r:20,col:'#9a6cff',sk:{q:['찌르기',25],e:['웅크리기',35],r:['기도(꾹)',0],t:['의례',0]}},
noon:{n:'정오',s:1,hp:75,w:10,r:20,col:'#2fa86b',sk:{q:['회복',45],e:['아드레날린',30]}},
ouro:{n:'우로보로스',s:0,hp:44444,w:16,r:28.5,st:120,col:'#d9443a',sk:{sp:['휘두르기',1.25],q:['독뿌리기',25],e:['참수',20],r:['이판사판',30]}},
sad:{n:'사악이',s:0,hp:666666666,w:16,r:29,st:130,col:'#8e44c8',sk:{sp:['휘두르기',1.75],q:['가시생성',4],e:['저주받은 구역',3],r:['갈라진 상처',20],t:['사냥의 본능',20]}}};
const OB=[[220,100,40,160],[420,60,160,36],[700,140,40,180],[130,380,160,40],[360,300,60,200],[560,360,180,40],[820,430,40,150],[480,540,200,36],[640,220,60,60],[250,560,36,60]].map(([x,y,w,h])=>({x:x+w/2,y:y+h/2,w,h}));
const rh=(o,x,y,r)=>{const cx=Math.max(o.x-o.w/2,Math.min(x,o.x+o.w/2)),cy=Math.max(o.y-o.h/2,Math.min(y,o.y+o.h/2));return(x-cx)**2+(y-cy)**2<r*r};
const blk=(x,y,r)=>x<r||y<r||x>W-r||y>H-r||OB.some(o=>rh(o,x,y,r))||G.walls.some(o=>rh(o,x,y,r));
function mk(id,x,y,ai){const c=CH[id];return{id,c,x,y,rad:c.s?11:16,hp:c.hp,mh:c.hp,st:c.st||100,ms:c.st||100,fx:id==='ouro'||id==='sad'?-1:1,fy:0,ai,alive:1,cd:{},mods:[],dots:[],stun:0,dis:0,inv:0,cast:null,dash:null,noSt:0,gauge:0,rev:0,rit:null,crouch:0,adr:0,tired:0,spk:0}}
const S=()=>G.ents.filter(e=>e.c.s&&e.alive),say=(e,t)=>{e.mg=t;e.mt=2},mod=(e,m,t)=>e.mods.push({m,t}),dot=(e,a,t)=>e.dots.push({dps:a/t,l:t}),face=(e,a)=>{e.fx=Math.cos(a);e.fy=Math.sin(a)},fxc=(x,y,r,c)=>G.fx.push({x,y,r,c,t:.25});
function mv(e,dx,dy){const st=blk(e.x,e.y,e.rad),n=Math.ceil(Math.hypot(dx,dy)/6)||1;for(let i=0;i<n;i++){const nx=e.x+dx/n,ny=e.y+dy/n;if(st||!blk(nx,e.y,e.rad))e.x=nx;if(st||!blk(e.x,ny,e.rad))e.y=ny}}
function dmg(t,a){if(!t.alive||!t.c.s||!a)return;t.hp-=a;if(t.hp<=0){if(t.id==='dawn'&&t.gauge>=250&&t.rit&&t.rev<7){t.rev++;t.hp=80-10*t.rev;t.gauge=0;t.x=t.rit.x;t.y=t.rit.y;t.dots=[];t.stun=0;G.left+=15;say(t,'의례에서 부활! (+15초)')}else{t.alive=0;t.hp=0}}}
function stun(t,s){if(t.id==='sad'){if(t.cast){s=1.25;mod(t,1.2,4)}else{s=1.5;mod(t,1.1,3.5)}}t.cast=null;t.dash=null;t.stun=Math.max(t.stun,s)}
const can=(e,k)=>e.alive&&!e.stun&&!e.dis&&!e.cast&&!e.dash&&!(e.cd[k]>0);
function dash(e,dx,dy,d,sp,chk,end){e.dash={dx,dy,left:d,sp,chk,end}}
function arc(k,range,fn,ac=.2,nw){if(!nw){const i=G.walls.findIndex(w=>dist(k,w)<range+35&&(w.x-k.x)*k.fx+(w.y-k.y)*k.fy>0);if(i>=0){G.walls.splice(i,1);fxc(k.x+k.fx*range*.6,k.y+k.fy*range*.6,range*.5,'#fff');return}}
fxc(k.x+k.fx*range*.5,k.y+k.fy*range*.5,range*.5,k.c.col);
S().forEach(s=>{const dx=s.x-k.x,dy=s.y-k.y,d=Math.hypot(dx,dy);if(d<range+s.rad&&(d<k.rad+s.rad+4||(dx*k.fx+dy*k.fy)/d>ac))fn(s)})}
function killDash(e,f,g,d,sp,fn){const h=new Set();dash(e,f,g,d,sp,x=>S().forEach(s=>{if(!h.has(s)&&dist(x,s)<x.rad+s.rad+6){h.add(s);fn(s)}}))}
function sk(e,k){const f=e.fx,g=e.fy;
if(e.id==='dawn'&&k==='r'){if(!e.alive||e.stun)return;if(e.gauge<=0)return say(e,'제물을 가져오세요');if(!e.rit||dist(e,e.rit)>30)say(e,'의례를 찾으세요');return}
if(e.id==='dawn'&&k==='t'){if(!can(e,'t'))return;if(e.rit)return say(e,'의례는 한 번만 사용할 수 있습니다');e.rit={x:e.x,y:e.y};return say(e,'의례를 남겼습니다')}
if(!can(e,k))return;
switch(e.id){
case'ham':if(k==='q'){e.cd.q=35;const v=Math.abs(f)>Math.abs(g);G.walls.push({x:e.x+f*52,y:e.y+g*52,w:v?14:90,h:v?90:14,t:2.5})}else if(k==='e'){e.cd.e=45;mod(e,1.1,5)}else if(k==='r'){e.cd.r=55;e.inv=3}break;
case'noon':if(k==='q'){if(G.lms==='noon'){e.cd.q=2.5;const K=G.k;fxc(e.x,e.y,75,'#ffd24d');if(dist(e,K)<75+K.rad){const a=Math.atan2(K.y-e.y,K.x-e.x);K.cast=null;K.dash={dx:Math.cos(a),dy:Math.sin(a),left:150,sp:700}}}else{e.cd.q=45;fxc(e.x,e.y,60,'#2fa86b');S().forEach(s=>{if(dist(e,s)<60+s.rad)s.hp=Math.min(s.mh,s.hp+30)})}}else if(k==='e'){e.cd.e=30;mod(e,6,3);e.adr=3}break;
case'dawn':if(k==='q'){const cr=e.crouch>0;e.cd.q=G.lms==='ds'?5:25;e.inv=0;e.crouch=0;let hit=0;
dash(e,f,g,cr?240:65,cr?900:400,x=>{const K=G.k;if(!hit&&dist(x,K)<x.rad+K.rad+24){hit=1;const back=K.fx*f+K.fy*g>0,ex=Math.floor(x.gauge/5)*.5;if(back)stun(K,2.5+ex);else if(G.lms==='ds')stun(K,2+ex);else K.dis=Math.max(K.dis,1.75+ex);x.gauge=Math.min(250,x.gauge+(cr?(back?60:35):(back?50:25)));x.dash=null;say(x,back?'뒤를 찔렀다! 스턴':'앞을 찔렀다! 무력화')}},x=>{if(cr&&!hit)mod(x,.8,2.5)})}
else if(k==='e'){e.cd.e=35;e.inv=e.crouch=G.lms==='ds'?7.5:8}break;
case'ouro':if(k==='sp'){e.cd.sp=1.1;e.cast={t:.15,fn:()=>arc(e,70,s=>{dmg(s,20);dot(s,5,5)})}}
else if(k==='q'){e.cd.q=20;arc(e,130,s=>dot(s,10,5),.5,1)}
else if(k==='e'){e.cd.e=16;mod(e,.8,1.5);killDash(e,f,g,90,500,s=>{dmg(s,30);s.dis=Math.max(s.dis,3)})}
else if(k==='r'){e.cd.r=25;e.cast={t:.25,fn:()=>killDash(e,f,g,300,800,s=>{dmg(s,35);dot(s,20,10)})}}break;
case'sad':if(k==='sp'){e.cd.sp=1.75;e.cast={t:G.lms==='ds'?.25:.3,fn:()=>arc(e,66,s=>dmg(s,35))}}
else if(k==='q'){e.cd.q=4;e.cast={t:1,fn:()=>{G.spikes.length=0;for(let i=0;i<35;i++){const d=45+i*9,a=i*.025;G.spikes.push({x:e.x+f*d,y:e.y+g*d,h:0,a,t:7.5+a})}}}}
else if(k==='e'){e.cd.e=3;e.cast={t:2.5};G.zones.push({x:e.x,y:e.y,r:70,t:10});if(G.zones.length>3)G.zones.shift()}
else if(k==='r'){e.cd.r=20;e.cast={t:.275,fn:()=>arc(e,90,s=>{dmg(s,75);stun(s,.4);s.dash={dx:e.fx,dy:e.fy,left:110,sp:600}})}}else if(k==='t'){e.cd.t=20;mod(e,.6,1.25);G.tm.push({t:1.25,fn:()=>G.reveal=3})}break}}
function lms(s){const K=G.k,ds=s.id==='dawn'&&K.id==='sad';G.lms=ds?'ds':s.id==='noon'?'noon':1;G.left=ds||s.id==='noon'?90:75;if(ds)K.rr=40.25;else if(s.id==='noon')K.rr=30.5;G.ents.forEach(e=>say(e,'LMS! 마지막 생존자 vs 살인자'))}
function steer(e,tx,ty){const a=Math.atan2(ty-e.y,tx-e.x),L=e.rad+48,fr=b=>!blk(e.x+Math.cos(b)*L,e.y+Math.sin(b)*L,e.rad+3)&&!blk(e.x+Math.cos(b)*L*.5,e.y+Math.sin(b)*L*.5,e.rad+3);
if(e.so!=null&&G.clk<e.lk){const b=a+e.so;if(fr(b))return b;e.so=null}
if(fr(a)){e.so=null;return a}
const sg=e.sg||(e.sg=rnd()<.5?1:-1);
for(const o of[.5,1,1.5,2.2,3])for(const s of[sg,-sg]){const b=a+o*s;if(fr(b)){e.so=o*s;e.lk=G.clk+.5;e.sg=s;return b}}
return a+Math.PI/2*sg}
function ai(e,dt){const K=G.k;if(!e.c.s)return aiK(e,dt);
const d=dist(e,K);let tx,ty,run=0;
if(d<340){const a=Math.atan2(e.y-K.y,e.x-K.x);tx=e.x+(Math.cos(a)+(W/2-e.x)/W*1.6)*120;ty=e.y+(Math.sin(a)+(H/2-e.y)/H*1.6)*120;run=1}
else{if(!e.wp||dist(e,e.wp)<30||rnd()<.003)e.wp={x:60+rnd()*(W-120),y:60+rnd()*(H-120)};tx=e.wp.x;ty=e.wp.y}
if(d<170&&rnd()<dt*4){const aK=Math.atan2(K.y-e.y,K.x-e.x);
if(e.id==='ham'){sk(e,'e');sk(e,'r');if(d<120){face(e,aK);sk(e,'q')}}else if(e.id==='noon')sk(e,'e');else if(e.crouch>0&&d<140){face(e,aK);sk(e,'q')}else sk(e,'e')}
if(G.lms==='noon'&&d<80)sk(e,'q');if(e.id==='noon'&&G.lms!=='noon'&&rnd()<dt*2&&S().some(s=>dist(e,s)<58&&s.mh-s.hp>=25))sk(e,'q');
if(e.id==='dawn'&&!e.rit&&G.left<110)sk(e,'t');
const a=steer(e,tx,ty);return[Math.cos(a),Math.sin(a),run]}
function aiK(k,dt){const vis=S().filter(s=>(!s.inv||G.reveal>0)&&dist(k,s)<520).sort((a,b)=>dist(k,a)-dist(k,b)),t=vis[0];let tx,ty;
if(t){k.last={x:t.x,y:t.y};tx=t.x;ty=t.y}else if(k.last&&dist(k,k.last)>30){tx=k.last.x;ty=k.last.y}else{k.last=null;if(!k.wp||dist(k,k.wp)<40||rnd()<.004)k.wp={x:60+rnd()*(W-120),y:60+rnd()*(H-120)};tx=k.wp.x;ty=k.wp.y}
const r=()=>rnd()<dt*3;
if(t){const d=dist(k,t),a=Math.atan2(t.y-k.y,t.x-k.x);
if(k.id==='ouro'){if(d<65){face(k,a);sk(k,'sp');if(r())sk(k,'e')}else if(d<130&&r()){face(k,a);sk(k,'q')}else if(d>160&&d<300&&r()){face(k,a);sk(k,'r')}}
else{if(d<68){face(k,a);sk(k,r()?'r':'sp')}else if(d<220&&r()){face(k,a);sk(k,['q','e'][rnd()*2|0])}}}
else if(k.id==='sad'&&r())sk(k,'t');
const a=steer(k,tx,ty);return[Math.cos(a),Math.sin(a),1]}
function step(e,dt){
if(e.adr>0&&e.adr-dt<=0){e.cast={t:.5};e.noSt=3}
for(const k in e.cd)e.cd[k]=Math.max(0,e.cd[k]-dt);
['stun','dis','inv','crouch','noSt','adr','spk'].forEach(k=>e[k]=Math.max(0,e[k]-dt));
e.mods.forEach(m=>m.t-=dt);e.mods=e.mods.filter(m=>m.t>0);
e.dots.forEach(d=>{d.l-=dt;dmg(e,d.dps*dt)});e.dots=e.dots.filter(d=>d.l>0);if(!e.alive)return;
if(e.cast){e.cast.t-=dt;if(e.cast.t<=0){const c=e.cast;e.cast=null;c.fn&&c.fn()}}
let dx=0,dy=0,run=0,pray=0,praying=0;
if(e.hu){const k=e.kk||keys;dx=(k.d?1:0)-(k.a?1:0);dy=(k.s?1:0)-(k.w?1:0);run=k.shift;pray=k.r&&e.id==='dawn'}else[dx,dy,run]=ai(e,dt);
if(pray&&!e.stun&&!e.cast&&!e.dash){if(e.gauge<=0){if(!G.msg)say(e,'제물을 가져오세요')}else if(!e.rit||dist(e,e.rit)>30){if(!G.msg)say(e,'의례를 찾으세요')}else if(e.hp<e.mh){praying=1;const a=Math.min(40*dt,e.gauge,e.mh-e.hp);e.gauge-=a;e.hp+=a}}
if(e.dash){const d=e.dash,s=Math.min(d.sp*dt,d.left);mv(e,d.dx*s,d.dy*s);d.left-=s;d.chk&&d.chk(e);if(e.dash&&d.left<=0){const f=d.end;e.dash=null;f&&f(e)}return}
const mov=(dx||dy)&&!e.stun&&!e.cast&&!praying;let rn=0;
if(mov){const n=Math.hypot(dx,dy);dx/=n;dy/=n;e.fx=dx;e.fy=dy;rn=run&&e.st>0&&!e.tired;
let m=1;e.mods.forEach(o=>m*=o.m);G.zones.forEach(z=>{if(dist(e,z)<z.r)m*=e.c.s?.7:1.15});if(e.id==='dawn'&&e.crouch>0){const K=G.k,dd=dist(e,K)||1;m*=1+.35*Math.max(0,((K.x-e.x)*dx+(K.y-e.y)*dy)/dd)}
const sp=(rn?(e.rr||e.c.r):e.c.w)*SC*m*(e.c.s?1.35:1);mv(e,dx*sp*dt,dy*sp*dt)}
if(rn){e.st-=8*dt;if(e.st<=0){e.st=0;e.tired=1}}else if(!e.noSt){e.st=Math.min(e.ms,e.st+12*dt);if(e.tired&&e.st>=20)e.tired=0}}
function upd(dt){G.left-=dt;G.clk=(G.clk||0)+dt;G.reveal=Math.max(0,G.reveal-dt);
for(const k of['walls','zones','spikes','fx','tm']){G[k].forEach(o=>o.t-=dt);if(k==='tm')G.tm.forEach(m=>{if(m.t<=0)m.fn()});G[k]=G[k].filter(o=>o.t>0)}
G.ents.forEach(e=>{if(e.mt>0)e.mt-=dt});G.msg=G.me.mt>0?{t:G.me.mg}:null;
G.ents.forEach(e=>e.alive&&step(e,dt));if(!G.lms){const sv=S();if(sv.length===1&&G.k.alive)lms(sv[0])}
G.spikes.forEach(p=>p.a=Math.max(0,p.a-dt));S().forEach(s=>{if(s.spk>0)return;for(const p of G.spikes)if(p.h<2&&p.a<=0&&Math.hypot(s.x-p.x,s.y-p.y)<s.rad+6){p.h++;s.spk=.5;dmg(s,15);const a=Math.atan2(s.y-p.y,s.x-p.x);mv(s,Math.cos(a)*24,Math.sin(a)*24);break}});
if(!S().length)fin(0,'모든 생존자가 쓰러졌습니다.');else if(G.left<=0)fin(1,'제한시간 종료! 생존자가 버텼습니다.');else if(!G.net&&G.me.c.s&&!G.me.alive)fin(0,'당신은 쓰러졌습니다.')}
function fin(sw,t){G.over=1;G.ot=t;G.os=sw;('et').textContent=!!G.me.c.s==!!sw?'승리!':'패배...';('ed').textContent=t;$('end').hidden=0}
function draw(){X.fillStyle='#1d1b18';X.fillRect(0,0,W,H);
X.fillStyle='#4a443b';OB.forEach(o=>X.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h));
X.fillStyle='#8fd3ff';G.walls.forEach(o=>X.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h));
G.zones.forEach(z=>{X.fillStyle='rgba(150,40,210,.3)';X.beginPath();X.arc(z.x,z.y,z.r,0,7);X.fill()});
X.fillStyle='#ff5a5a';G.spikes.forEach(p=>{if(p.a>0)return;X.beginPath();X.arc(p.x,p.y,5,0,7);X.fill()});
const me=G.me;
G.ents.forEach(e=>{if(e.rit&&me.c.s){X.strokeStyle='#b58cff';X.lineWidth=2;X.beginPath();X.arc(e.rit.x,e.rit.y,18,0,7);X.stroke();X.fillStyle='#b58cff';X.font='11px sans-serif';X.textAlign='center';X.fillText('의례',e.rit.x,e.rit.y-24)}});
G.fx.forEach(f=>{X.globalAlpha=f.t*2;X.fillStyle=f.c;X.beginPath();X.arc(f.x,f.y,f.r,0,7);X.fill();X.globalAlpha=1});
G.ents.forEach(e=>{if(!e.alive)return;let al=1;if(e.c.s&&e.inv>0&&G.reveal<=0){if(me.c.s)al=.3;else return}
X.globalAlpha=al;X.fillStyle=e.c.col;X.beginPath();X.arc(e.x,e.y,e.rad,0,7);X.fill();
X.strokeStyle=e===me?'#fff':'#000';X.lineWidth=e===me?3:1.5;X.stroke();
X.beginPath();X.moveTo(e.x,e.y);X.lineTo(e.x+e.fx*e.rad*1.5,e.y+e.fy*e.rad*1.5);X.strokeStyle='#fff';X.lineWidth=2;X.stroke();
if(G.reveal>0&&e.c.s){X.strokeStyle='#ffe14d';X.lineWidth=3;X.beginPath();X.arc(e.x,e.y,e.rad+7,0,7);X.stroke()}
