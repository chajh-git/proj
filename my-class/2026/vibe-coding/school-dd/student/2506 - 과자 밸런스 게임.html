<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🍪 과자 밸런스 게임</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:linear-gradient(135deg,#fff4d6,#ffe1ec);color:#3d2b2b}
.wrap{max-width:1180px;margin:auto;padding:24px 16px} .card{background:#fff;border-radius:26px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.12);margin-bottom:18px}
h1{text-align:center;font-size:36px;margin:5px 0 10px} .sub-note{margin:-4px 0 12px;text-align:center;color:#888;font-size:13px;font-weight:500;}
.sub{text-align:center;color:#777}
.rounds{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:22px 0}
.round-btn{padding:13px 6px;border-radius:12px;border:2px solid #ffb66b;background:#fff;color:#d66b00;font-weight:bold;cursor:pointer}
.round-btn.selected{background:#ff9f43;color:#fff}
.start-row{display:flex;align-items:stretch;gap:16px;margin:18px 0}.internet-notice{display:flex;flex:1;align-items:center;gap:12px;margin:18px 0;padding:15px 18px;border:2px solid #ff9fb4;border-radius:16px;background:#fff1f5;color:#7a3948}
.internet-notice .wifi-icon{font-size:28px;flex-shrink:0}
.internet-notice strong{display:block;font-size:16px;margin-bottom:4px}
.internet-notice span{display:block;font-size:13px;color:#8d6871}
.start{width:280px;flex-shrink:0;padding:15px;border:0;border-radius:13px;background:#ff5f7e;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px} .choice{min-height:350px;border:3px solid #ffd19b;border-radius:22px;background:#fff8ed;padding:14px;cursor:pointer;transition:.15s}
.choice:hover{transform:translateY(-5px);background:#fff0d8} .choice img{width:100%;height:245px;object-fit:contain;border-radius:15px;background:#fff}
.name{font-size:24px;font-weight:bold;margin-top:10px;color:#6b3e26} .progress{height:12px;background:#eee;border-radius:20px;overflow:hidden;margin:15px 0}
.bar{height:100%;background:#ff5f7e;width:0;transition:.25s} .winner{font-size:40px;font-weight:bold;text-align:center;color:#e76f00;background:#fff5df;padding:28px;border-radius:20px}
.winner img{display:block;width:min(330px,100%);height:250px;object-fit:contain;margin:0 auto 15px;background:#fff;border-radius:18px}
.restart{margin-top:18px;width:100%;padding:14px;border:0;border-radius:12px;background:#7b61ff;color:#fff;font-weight:bold;font-size:17px;cursor:pointer}
.hidden{display:none} .note{text-align:center;color:#888;font-size:12px;margin-top:10px}
@media(max-width:800px){.start-row{flex-direction:column}.start{width:100%}.rounds{grid-template-columns:repeat(3,1fr)}.choices{grid-template-columns:1fr}h1{font-size:29px}.choice{min-height:310px}.choice img{height:205px}}
</style></head>
<body><div class="wrap">
<div id="start" class="card"><h1>🍪 과자 밸런스 게임</h1><p class="sub">두 과자 중 더 좋아하는 과자를 선택해서 최애 과자를 찾아보세요!</p><p class="sub-note">* 실제 과자 사진을 불러오기 위해 인터넷 연결이 필요합니다.</p>
<div class="rounds">
<button class="round-btn" data-round="4">4강</button><button class="round-btn" data-round="8">8강</button>
<button class="round-btn selected" data-round="16">16강</button><button class="round-btn" data-round="24">24강</button>
<button class="round-btn" data-round="32">32강</button><button class="round-btn" data-round="64">64강</button>
</div>
<div class="start-row"><div class="internet-notice"><div class="wifi-icon">📶</div><div><strong>이 게임은 인터넷 연결이 있어야 가능합니다.</strong><span>실제 과자 사진을 불러오기 위해 인터넷 연결이 필요합니다.</span></div></div><button class="start" id="startBtn">🎮 게임 시작하기</button></div>
<p class="note">실제 제품 패키지 사진을 과자 이름과 함께 표시합니다.</p></div>

<div id="game" class="card hidden"><h1 id="roundTitle"></h1><p id="matchText" class="sub"></p>
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="choices"><button id="a" class="choice"><img alt=""><div class="name"></div></button>
<button id="b" class="choice"><img alt=""><div class="name"></div></button></div></div>

<div id="result" class="card hidden"><h1>🎉 최종 우승!</h1><div class="winner"><img id="winImg" alt=""><div id="winName"></div></div>
<button class="restart" id="restart">🔄 다시 하기</button></div></div>

idth=416"}, {"name": "맛동산 땅콩", "img": "https://sitem.ssgcdn.com/28/35/74/item/1000518743528_i1_750.jpg"}, {"name": "다이제 초코", "img": "https://thumbnail.coupangcdn.com/thumbnails/remote/492x492ex/image/retail/images/2842928382188381-29ab9fc9-0011-47e0-9712-489c71625543.jpg"}, {"name": "홈런볼 초코", "img": "https://sitem.ssgcdn.com/10/44/51/item/1000381514410_i1_1200.jpg"}, {"name": "사브레 버터", "img": "https://sitem.ssgcdn.com/85/94/82/item/1000063829485_i1_750.jpg"}, {"name": "빈츠 초콜릿", "img": "https://sitem.ssgcdn.com/85/41/01/item/0000009014185_i1_750.jpg"}, {"name": "버터링 오리지널", "img": "https://mall.iopenmall.tw/website/uploads_product/website_9190/P0919000882214_4_7458134.jpg?hash=13168"}, {"name": "롯데샌드 파인애플", "img": "https://4.bp.blogspot.com/-v09iTvc9YAY/UV6o5i7tFdI/AAAAAAAACAA/wPpLNxjbjPs/s1600/lotte_sand_l_copy.jpg"}, {"name": "오징어땅콩 오리지널", "img": "https://trytheworld.com/cdn/shop/files/880111776100_1_1.webp?v=1712681419&width=533"}, {"name": "사또밥 오리지널", "img": "https://img06.weeecdn.com/item/image/228/014/B486D3B17DA8916.jpeg"}, {"name": "포카칩 황치즈맛", "img": "https://contents.lotteon.com/itemimage/20260214150707/LM/88/01/11/77/60/20/5_/00/1/LM8801117760205_001_1.jpg"},{"name": "초코송이 초코맛", "img": "https://image2.lotteimall.com/goods/15/08/06/2604060815_5.jpg/dims/resizemc/550x550/optimize"}];
let roundCount=16,current=[],next=[],idx=0,total=0;
const start=document.getElementById('start'),game=document.getElementById('game'),result=document.getElementById('result');
document.querySelectorAll('.round-btn').forEach(b=>b.addEventListener('click',()=>{
 roundCount=Number(b.dataset.round);document.querySelectorAll('.round-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');
}));
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('restart').addEventListener('click',()=>location.reload());
function startGame(){current=snacks.slice(0,roundCount);next=[];idx=0;start.classList.add('hidden');result.classList.add('hidden');game.classList.remove('hidden');round();}
function round(){next=[];idx=0;total=current.length/2;document.getElementById('roundTitle').textContent='🍪 '+current.length+'강';show();}
function put(id,item){const c=document.getElementById(id);c.querySelector('img').src=item.img;c.querySelector('img').alt=item.name+' 사진';c.querySelector('.name').textContent=item.name;}
function show(){const x=current[idx*2],y=current[idx*2+1];put('a',x);put('b',y);document.getElementById('matchText').textContent=(idx+1)+' / '+total+'번째 대결 — 더 좋아하는 과자를 선택하세요!';document.getElementById('bar').style.width=(idx/total*100)+'%';document.getElementById('a').onclick=()=>choose(x);document.getElementById('b').onclick=()=>choose(y);}
function choose(w){next.push(w);idx++;if(idx<total)show();else{current=next;if(current.length===1)finish();else setTimeout(round,180);}}
function finish(){game.classList.add('hidden');result.classList.remove('hidden');document.getElementById('winName').textContent='🏆 '+current[0].name;document.getElementById('winImg').src=current[0].img;document.getElementById('winImg').alt=current[0].name+' 사진';}
