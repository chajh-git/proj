<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바퀴벌레 생존</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:#111;
  font-family:monospace;
}

/* 게임 화면 */

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* 픽셀 방 */

#room{
  position:absolute;
  inset:0;
  background:
  linear-gradient(#5a4637 2px, transparent 2px),
  linear-gradient(90deg, #5a4637 2px, transparent 2px),
  #6d5847;
  background-size:32px 32px;
}

/* 픽셀 가구 */

.furniture{
  position:absolute;
  image-rendering:pixelated;
  border:4px solid #000;
}

/* 침대 */

#bed{
  left:60px;
  top:60px;
  width:320px;
  height:180px;
  background:
  repeating-linear-gradient(
    45deg,
    #7898c7,
    #7898c7 12px,
    #8eb2e5 12px,
    #8eb2e5 24px
  );
}

/* 책상 */

#desk{
  right:90px;
  top:70px;
  width:250px;
  height:140px;
  background:#8b5e3c;
}

/* 냉장고 */

#fridge{
  left:50%;
  bottom:90px;
  width:120px;
  height:170px;
  background:#cfcfcf;
}

/* 싱크대 */

#sink{
  right:100px;
  bottom:80px;
  width:260px;
  height:140px;
  background:#666;
}

/* 플레이어 */

#player{
  position:absolute;
  left:48%;
  top:52%;
  width:60px;
  height:90px;
  image-rendering:pixelated;
}

/* 픽셀 남자 */

.head{
  width:36px;
  height:36px;
  background:#f5c79e;
  border:4px solid #000;
  margin:auto;
}

.body{
  width:46px;
  height:40px;
  background:#2b7cff;
  border:4px solid #000;
  margin:auto;
}

.legs{
  display:flex;
  justify-content:center;
  gap:6px;
}

.leg{
  width:14px;
  height:24px;
  background:#222;
  border:3px solid #000;
}

/* 바퀴벌레 */

#roach{
  position:absolute;
  width:40px;
  height:40px;
  font-size:34px;
  cursor:pointer;
  user-select:none;
}

/* UI */

#ui{
  position:absolute;
  top:20px;
  left:20px;
  color:white;
  font-size:28px;
  z-index:100;
  text-shadow:3px 3px #000;
}

/* 시작 화면 */

#startScreen{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

#startScreen h1{
  color:white;
  font-size:64px;
  margin-bottom:30px;
  text-shadow:4px 4px #000;
}

#startBtn{
  padding:20px 40px;
  font-size:28px;
  border:none;
  background:#ff4040;
  color:white;
  cursor:pointer;
  border:5px solid #000;
}

#startBtn:hover{
  background:#ff6666;
}

/* 대사 */

#dialog{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  border:5px solid #000;
  padding:20px 30px;
  font-size:28px;
  display:none;
  z-index:1000;
}

/* 레벨 클리어 */

#levelClear{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:1000;
}

#levelClear h2{
  color:white;
  font-size:54px;
  margin-bottom:20px;
}

#nextBtn{
  padding:18px 34px;
  font-size:28px;
  border:none;
  background:#40c057;
  color:white;
  border:5px solid #000;
  cursor:pointer;
}

</style>
</head>

<body>

<div id="game">

  <div id="room">

    <!-- 가구 -->

    <div class="furniture" id="bed"></div>
    <div class="furniture" id="desk"></div>
    <div class="furniture" id="fridge"></div>
    <div class="furniture" id="sink"></div>

    <!-- 플레이어 -->

    <div id="player">
      <div class="head"></div>
      <div class="body"></div>

      <div class="legs">
        <div class="leg"></div>
        <div class="leg"></div>
      </div>
    </div>

    <!-- 바퀴벌레 -->

    <div id="roach">🪳</div>

  </div>

  <!-- UI -->

  <div id="ui">
    LEVEL : <span id="level">1</span>
  </div>

  <!-- 시작화면 -->

  <div id="startScreen">
    <h1>바퀴벌레 생존</h1>
    <button id="startBtn">게임 시작</button>
  </div>

  <!-- 대사 -->

  <div id="dialog">
    으악! 바퀴벌레다!
  </div>

  <!-- 레벨 클리어 -->

  <div id="levelClear">
    <h2 id="clearText">LEVEL 1 CLEAR</h2>
    <button id="nextBtn">다음 레벨 시작</button>
  </div>

</div>

<script>

const roach = document.getElementById("roach");
const startScreen = document.getElementById("startScreen");
const startBtn = document.getElementById("startBtn");

const dialog = document.getElementById("dialog");

const levelText = document.getElementById("level");

const levelClear = document.getElementById("levelClear");
const clearText = document.getElementById("clearText");
const nextBtn = document.getElementById("nextBtn");

let level = 1;

let gameRunning = false;

let x = 300;
let y = 300;

let dx = 3;
let dy = 3;

function getSpeed(){
  return 3 + level * 0.6;
}

/* 시작 */

startBtn.addEventListener("click", ()=>{

  startScreen.style.display = "none";

  dialog.style.display = "block";

  setTimeout(()=>{
    dialog.style.display = "none";
    startLevel();
  },1500);

});

/* 레벨 시작 */

function startLevel(){

  gameRunning = true;

  x = Math.random() * (window.innerWidth - 100);
  y = Math.random() * (window.innerHeight - 100);

  const speed = getSpeed();

  dx = (Math.random() > 0.5 ? 1 : -1) * speed;
  dy = (Math.random() > 0.5 ? 1 : -1) * speed;

}

/* 이동 */

function update(){

  if(!gameRunning) return;

  x += dx;
  y += dy;

  /* 벽 충돌 */

  if(x <= 0 || x >= window.innerWidth - 40){
    dx *= -1;
  }

  if(y <= 0 || y >= window.innerHeight - 40){
    dy *= -1;
  }

  /* 랜덤 방향 변경 */

  if(Math.random() < 0.03){

    const speed = getSpeed();

    dx = (Math.random() > 0.5 ? 1 : -1) * speed;
    dy = (Math.random() > 0.5 ? 1 : -1) * speed;

  }

  roach.style.left = x + "px";
  roach.style.top = y + "px";

}

setInterval(update,16);

/* 잡기 */

roach.addEventListener("click", ()=>{

  if(!gameRunning) return;

  gameRunning = false;

  roach.style.transform = "scale(1.7) rotate(180deg)";

  setTimeout(()=>{

    roach.style.transform = "scale(1)";

    clearText.innerText = `LEVEL ${level} CLEAR`;

    levelClear.style.display = "flex";

  },300);

});

/* 다음 레벨 */

nextBtn.addEventListener("click", ()=>{

  level++;

  levelText.innerText = level;

  levelClear.style.display = "none";

  dialog.innerText = "또 나타났다!!";

  dialog.style.display = "block";

  setTimeout(()=>{

    dialog.style.display = "none";

    startLevel();

  },1200);

});

</script>

</body>
</html>
