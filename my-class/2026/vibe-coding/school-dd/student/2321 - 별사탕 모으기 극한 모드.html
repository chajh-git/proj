<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>별사탕 모으기 - 극한 모드</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#090714;
color:#fff;
font-family:system-ui,sans-serif;
display:grid;
place-items:center;
min-height:100vh;
overflow:hidden
}

#wrap{
width:min(100vw,900px);
padding:12px
}

header{
display:flex;
justify-content:space-between;
gap:7px;
align-items:center;
margin-bottom:10px
}

h1{
font-size:clamp(18px,4vw,27px);
margin:0;
color:#ff475f
}

.stat{
background:#24172c;
border:1px solid #713044;
padding:8px 11px;
border-radius:13px;
font-weight:900;
white-space:nowrap
}

#stage{
position:relative;
border:2px solid #7d2038;
border-radius:20px;
overflow:hidden;
background:#120b1c;
box-shadow:0 0 35px #ff164433
}

canvas{
display:block;
width:100%;
height:auto;
touch-action:none
}

.overlay{
position:absolute;
inset:0;
background:#08050edc;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:20px
}

h2{
font-size:clamp(28px,7vw,52px);
margin:0 0 7px;
color:#ff425a;
text-shadow:0 0 18px #ff183f
}

p{
line-height:1.7;
color:#e7cdd4;
margin:5px 0 20px
}

button{
border:0;
border-radius:14px;
padding:13px 25px;
background:#ff425a;
color:white;
font-size:17px;
font-weight:900;
box-shadow:0 4px 0 #8c172d;
cursor:pointer
}

.warning{
color:#ff8999;
font-weight:900
}

#bottom{
font-size:12px;
color:#a88f99;
margin:9px 4px
}
</style>
</head>

<body>

<div id="wrap">

<header>
<h1>☠️ 극한 별사탕</h1>

<div class="stat">
⭐ <span id="score">0</span>/20
</div>

<div class="stat">
⏱️ <span id="time">18</span>초
</div>
</header>

<div id="stage">

<canvas id="game" width="800" height="520"></canvas>

<div class="overlay" id="start">

<h2>☠️ EXTREME</h2>

<p class="warning">
거의 클리어할 수 없도록 만들어진 모드
</p>

<p>
별사탕 20개를 18초 안에 모아라.<br>
몬스터는 계속 늘어나고 점점 빨라진다.
</p>

<button id="play">
도전하기
</button>

</div>

<div class="overlay" id="end" style="display:none">

<h2 id="title"></h2>

<p id="text"></p>

<button id="again">
다시 도전
</button>

</div>

</div>

<div id="bottom">
WASD / 방향키로 이동 · 모바일은 화면을 터치해 조작
</div>

</div>

<script>

const c=document.getElementById('game'),
x=c.getContext('2d'),
W=800,
H=520;

const scoreEl=document.getElementById('score'),
timeEl=document.getElementById('time');

let p,
stars,
monsters,
score,
time,
running,
last,
spawn,
keys={},
touch=null;

const R=(a,b)=>a+Math.random()*(b-a);


function star(){

return{
x:R(25,W-25),
y:R(25,H-25),
r:R(8,12),
q:R(0,6)
}

}


function reset(){

p={
x:W/2,
y:H/2,
r:14,
speed:265
};

score=0;
time=18;
spawn=0;

stars=Array.from(
{length:7},
star
);

monsters=[];

for(let i=0;i<7;i++){

let side=i%4;

let xx=
side===0
?25
:side===1
?W-25
:R(25,W-25);

let yy=
side===2
?H-25
:side===3
?25
:R(25,H-25);

monsters.push({
x:xx,
y:yy,
r:R(16,21),
vx:R(-100,100),
vy:R(-100,100)
});

}

scoreEl.textContent=0;
timeEl.textContent=18;

}


function drawStar(s,t){

x.save();

x.translate(s.x,s.y);

x.rotate(
Math.sin(t/80+s.q)*.3
);

x.beginPath();

for(let i=0;i<10;i++){

let a=
-Math.PI/2+i*Math.PI/5;

let r=
i%2
?s.r*.42
:s.r;

x.lineTo(
Math.cos(a)*r,
Math.sin(a)*r
);

}

x.closePath();

x.fillStyle='#ffe14d';

x.shadowColor='#fff000';

x.shadowBlur=18;

x.fill();

x.restore();

}


function render(t){

x.clearRect(0,0,W,H);

let g=
x.createRadialGradient(
W/2,H/2,30,
W/2,H/2,600
);

g.addColorStop(0,'#28132d');
g.addColorStop(1,'#0c0816');

x.fillStyle=g;

x.fillRect(0,0,W,H);


x.strokeStyle='#ff496111';

for(let i=0;i<W;i+=40){

x.beginPath();
x.moveTo(i,0);
x.lineTo(i,H);
x.stroke();

}

for(let j=0;j<H;j+=40){

x.beginPath();
x.moveTo(0,j);
x.lineTo(W,j);
x.stroke();

}


stars.forEach(
s=>drawStar(s,t)
);


monsters.forEach(m=>{

x.shadowColor='#ff1744';
x.shadowBlur=12;

x.beginPath();

x.arc(
m.x,
m.y,
m.r,
0,
7
);

x.fillStyle='#75133d';

x.fill();

x.shadowBlur=0;

x.fillStyle='#ff263f';

x.beginPath();

x.arc(
m.x-6,
m.y-3,
4,
0,
7
);

x.arc(
m.x+6,
m.y-3,
4,
0,
7
);

x.fill();

x.fillStyle='#130611';

x.beginPath();

x.arc(
m.x,
m.y+6,
8,
0,
Math.PI
);

x.fill();

});


x.fillStyle='#59efff';

x.shadowColor='#4defff';

x.shadowBlur=18;

x.beginPath();

x.arc(
p.x,
p.y,
p.r,
0,
7
);

x.fill();

x.shadowBlur=0;

x.fillStyle='#10263a';

x.beginPath();

x.arc(
p.x-5,
p.y-2,
2.5,
0,
7
);

x.arc(
p.x+5,
p.y-2,
2.5,
0,
7
);

x.fill();

}


function end(win){

running=false;

document.getElementById(
'end'
).style.display='flex';

document.getElementById(
'title'
).textContent=
win
?'☠️ 기적의 클리어'
:'💀 GAME OVER';

document.getElementById(
'text'
).textContent=
win
?'말도 안 되는 난이도를 깼어!'
:'모은 별사탕: '+score+
'개 · 이 모드는 원래 거의 못 깨게 만들어졌어.';

}


function update(dt){

if(!running)return;

time-=dt;

if(time<=0){

time=0;

timeEl.textContent=0;

end(score>=20);

return;

}

timeEl.textContent=Math.ceil(time);


let dx=0,
dy=0;

if(
keys.a||
keys.ArrowLeft||
touch==='l'
)dx--;

if(
keys.d||
keys.ArrowRight||
touch==='r'
)dx++;

if(
keys.w||
keys.ArrowUp||
touch==='u'
)dy--;

if(
keys.s||
keys.ArrowDown||
touch==='d'
)dy++;


if(dx&&dy){

dx*=.707;
dy*=.707;

}


p.x=Math.max(
p.r,
Math.min(
W-p.r,
p.x+dx*p.speed*dt
)
);

p.y=Math.max(
p.r,
Math.min(
H-p.r,
p.y+dy*p.speed*dt
)
);


let elapsed=18-time;

let target=
Math.min(
24,
7+Math.floor(elapsed/1.4)
);


while(
monsters.length<target
){

let side=
Math.floor(Math.random()*4);

let mx=
side===0
?20
:side===1
?W-20
:R(20,W-20);

let my=
side===2
?H-20
:side===3
?20
:R(20,H-20);


if(
Math.hypot(
mx-p.x,
my-p.y
)>210
){

monsters.push({
x:mx,
y:my,
r:R(16,22),
vx:R(-130,130),
vy:R(-130,130)
});

}

}


monsters.forEach((m,i)=>{

let dx=p.x-m.x,
dy=p.y-m.y,
d=Math.hypot(dx,dy)||1;

let sp=
120+
i*5+
elapsed*7;

m.vx=
m.vx*.97+
dx/d*sp*.03;

m.vy=
m.vy*.97+
dy/d*sp*.03;

let md=
Math.hypot(
m.vx,
m.vy
)||1;

m.x+=
m.vx/md*sp*dt;

m.y+=
m.vy/md*sp*dt;


if(
m.x<m.r||
m.x>W-m.r
)m.vx*=-1;

if(
m.y<m.r||
m.y>H-m.r
)m.vy*=-1;


m.x=Math.max(
m.r,
Math.min(
W-m.r,
m.x
)
);

m.y=Math.max(
m.r,
Math.min(
H-m.r,
m.y
)
);


if(
Math.hypot(
p.x-m.x,
p.y-m.y
)<p.r+m.r-2
){

end(false);

}

});


for(
let i=stars.length-1;
i>=0;
i--
){

if(
Math.hypot(
p.x-stars[i].x,
p.y-stars[i].y
)<p.r+stars[i].r
){

stars.splice(i,1);

score++;

scoreEl.textContent=score;

if(score>=20){

end(true);

return;

}

}

}


spawn+=dt;

if(
stars.length<7&&
spawn>.25
){

stars.push(star());

spawn=0;

}

}


function loop(t){

let dt=
Math.min(
(t-last)/1000||0,
.03
);

last=t;

update(dt);

render(t);

requestAnimationFrame(loop);

}


document.getElementById(
'play'
).onclick=()=>{

reset();

running=true;

document.getElementById(
'start'
).style.display='none';

last=performance.now();

};


document.getElementById(
'again'
).onclick=()=>{

reset();

running=true;

document.getElementById(
'end'
).style.display='none';

last=performance.now();

};


onkeydown=e=>{

keys[e.key]=true;

if(
e.key.startsWith('Arrow')
)e.preventDefault();

};


onkeyup=e=>{

keys[e.key]=false;

};


c.addEventListener(
'pointerdown',
e=>{

if(e.pointerType==='touch'){

c.setPointerCapture(
e.pointerId
);

touch={
x:e.clientX,
y:e.clientY
};

}

});


c.addEventListener(
'pointermove',
e=>{

if(!touch)return;

let dx=
e.clientX-touch.x;

let dy=
e.clientY-touch.y;

touch={
x:e.clientX,
y:e.clientY
};

if(
Math.abs(dx)>Math.abs(dy)
){

touch=
dx>0
?'r'
:'l';

}else{

touch=
dy>0
?'d'
:'u';

}

});


c.addEventListener(
'pointerup',
()=>touch=null
);

c.addEventListener(
'pointercancel',
()=>touch=null
);


reset();

render(0);

requestAnimationFrame(loop);

</script>

</body>
</html>
